<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d2b4f">
<title>자격증 공부</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* VOICE: 손에 쥐고 매일 여는 공부 앱, 차분하고 단단하게
   IDEA: 수험서 한 권 = 목차(홈) + 모의고사 + 요약노트 + 오답노트
   PICTURE: 홈 상단의 진도 카드(오답 수, 최근 점수), 그 아래 목록
   COLOUR and TYPE: 흰 바탕, 짙은 남색 헤더, 파랑 강조, 오답만 적색 / Noto Sans KR + JetBrains Mono
   LAYOUT: 폰 한 열(최대 560px), 하단 탭바 4개, 넓은 화면에선 가운데 정렬 */
:root{color-scheme:light dark;--bg:light-dark(#f3f4f7,#0d1118);--paper:light-dark(#fff,#161b26);--ink:light-dark(#121826,#e8ebf1);--mute:light-dark(#5e6677,#98a1b3);--line:light-dark(#dde1e8,#283041);--bar:#1d2b4f;--acc:#2f6fed;--hot:#e2462f;--ok:#1f9d55;--sel:light-dark(#e7efff,#1c2b4b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow-x:clip}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45}.opt:disabled{opacity:1}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.hd{background:var(--bar);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hd h1{font-size:18px;margin:0;flex:1;line-height:1.3}
.hd button{background:#ffffff1a;border-color:#ffffff33;color:#fff;min-height:38px;padding:0 12px;font-size:14px}
.pad{padding:16px}
.hero{background:var(--bar);color:#fff;padding:22px 16px 26px}
.hero h1{font-size:28px;line-height:1.15;margin:0 0 4px}
.hero p{margin:0;opacity:.8;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{background:#ffffff14;border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px/1.1 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
.stat span{font-size:13px;opacity:.85}
.sec{font-size:14px;color:var(--mute);margin:20px 16px 8px;font-weight:700}
.list{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;min-height:64px}
.item:last-child{border-bottom:0}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--acc);font-size:15px}
.item .t{flex:1}.item .t b{display:block;font-weight:500}.item .t small{color:var(--mute);font-size:13px}
.item .ar{color:var(--mute)}
.badge{background:var(--hot);color:#fff;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs a{display:grid;place-items:center;gap:2px;min-height:60px;color:var(--mute);text-decoration:none;font-size:12px}
.tabs a svg{width:24px;height:24px}
.tabs a.on{color:var(--acc);font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 16px}
.subj{color:var(--mute);font-size:13px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qt{font-size:calc(17px*var(--fs,1));font-weight:500;line-height:1.6;margin:0 0 12px}
.qt table,.md table{border-collapse:collapse;margin:10px 0;font-size:14px;width:100%}
.qt td,.qt th,.md td,.md th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th,.qt th{background:var(--bg)}
pre{background:light-dark(#f2f4f8,#0b0f16);border:1px solid var(--line);border-radius:10px;padding:12px;font:calc(13.5px*var(--fs,1))/1.55 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;overflow-x:auto;margin:0 0 12px}
code{font-family:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;font-size:.9em;background:light-dark(#eef1f6,#202737);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
pre code{background:none;padding:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;min-height:54px;font-size:calc(16px*var(--fs,1));line-height:1.5;width:100%}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.on{background:var(--sel);border-color:var(--acc)}.opt.on .n{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.o{border-color:var(--ok);background:light-dark(#e8f6ee,#13261c)}.opt.o .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.x{border-color:var(--hot);background:light-dark(#fdecea,#2a1513)}.opt.x .n{border-color:var(--hot);color:var(--hot)}
.ex{background:var(--sel);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:7}
.foot .in{max-width:528px;margin:0 auto;display:flex;gap:8px}.foot .in>*{flex:1}
.timer{font:600 17px ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;background:#ffffff1a;padding:4px 10px;border-radius:8px}
.timer.low{background:var(--hot)}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--acc)}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}
.overlay.show{display:flex}
.dlg{background:var(--paper);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:85vh;overflow:auto}
.dlg h2{margin:0 0 8px;font-size:19px}.btns{display:flex;gap:8px;margin-top:16px}.btns>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.grid button{min-height:44px;padding:0;font-variant-numeric:tabular-nums}
.grid .done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid .cur{outline:2px solid var(--acc);outline-offset:1px}
.big{font:700 64px/1 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
.pass{color:var(--ok)}.fail{color:var(--hot)}
.bar{display:grid;grid-template-columns:8.6em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:13.5px;margin-top:8px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i s{display:block;height:100%;background:var(--acc)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;color:#fff;background:var(--hot)}
.tag.ok{background:var(--ok)}.tag.m{background:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.chips button{flex:none;min-height:36px;padding:0 14px;border-radius:99px;font-size:14px}
.chips .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.md{font-size:15.5px}.md h2{font-size:21px;margin:4px 0 10px;line-height:1.3}.md h3{font-size:17px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.md ul,.md ol{padding-left:20px;margin:8px 0}.md li{margin:4px 0}.md p{margin:8px 0}
.md .tw{overflow-x:auto}
.md li.ck{list-style:none;margin-left:-20px}
.search{width:100%;font:inherit;font-size:16px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.note{font-size:13px;color:var(--mute)}
details summary{cursor:pointer;list-style:none;font-weight:500;color:var(--acc);margin-top:10px;min-height:32px}
mark{background:#ffe36a;color:#111;border-radius:3px}
@media(prefers-reduced-motion:no-preference){.card,.list{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
.mini{min-height:32px;padding:0 10px;font-size:13px}
textarea.code{width:100%;min-height:200px;font:14px/1.5 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical;tab-size:4}
.btns .on{background:var(--hot);border-color:var(--hot);color:#fff}
.subj .tag{margin-right:2px}
.ex pre{margin:8px 0;background:var(--paper)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="overlay" id="ov"><div class="dlg" id="dlg"></div></div>
<script>
{
const MC=(arr)=>arr.map(([s,q,o,a,e,c])=>({s,q,o,a,e,c,t:"mc"}));
const EX={
  pf:{name:"프로그래밍기능사 필기",tag:"필기",color:"#2f6fed",subj:["프로그래밍 언어","응용SW 기초기술","SQL 활용","정보시스템 기초기술"],limit:3600,info:"60문항 · 60분 · 60점 이상 합격",Q:MC([
[0,"다음 C 코드의 출력 결과는?",["10 10","10 11","11 10","11 11"],2,"a++는 값(10)을 b에 넣은 뒤 a를 11로 올린다.",'int a = 10;\nint b = a++;\nprintf("%d %d", a, b);'],
[0, "다음 중 연산자 우선순위가 가장 높은 것은?", ["&&", "==", "=", "*"], 3, "산술 > 관계 > 논리 > 대입 (단산시관비논조대순)."],
[0,"다음 Java 코드의 출력 결과는?",["A","B","AB","BA"],2,"자식 객체를 만들면 부모 생성자가 먼저 실행된다.",'class A { A() { System.out.print("A"); } }\nclass B extends A { B() { System.out.print("B"); } }\n// main에서\nnew B();'],
[0,"다음 Python 코드의 출력 결과는?",["[10, 20, 30]","[20, 30, 40]","[20, 30, 40, 50]","[10, 20, 30, 40]"],1,"인덱스 1부터 4 직전(3)까지 → 20, 30, 40.","a = [10, 20, 30, 40, 50]\nprint(a[1:4])"],
[0,"Python에서 print(-7 // 2)의 결과는?",["-3","-3.5","-4","3"],2,"//는 음의 무한대 방향으로 내림한다. -3.5 → -4."],
[0,"객체지향 프로그래밍의 특징이 아닌 것은?",["캡슐화","상속","다형성","정규화"],3,"정규화는 데이터베이스 설계 개념이다."],
[0, "다음 중 주로 인터프리터 방식으로 실행되는 언어는?", ["C", "C++", "Fortran", "JavaScript"], 3, "JavaScript는 브라우저가 실행하는 스크립트 언어. 나머지는 컴파일 언어."],
[0,"Java에서 같은 클래스 안에서만 접근할 수 있는 접근 제어자는?",["public","protected","default","private"],3,"private는 같은 클래스 안에서만 접근할 수 있다."],
[0,"다음 C 코드의 출력 결과는?",["4","5","6","7"],2,"*(p+1) = arr[1] = 2, *(p+3) = arr[3] = 4 → 6.",'int arr[] = {1, 2, 3, 4};\nint *p = arr;\nprintf("%d", *(p + 1) + *(p + 3));'],
[0,"다음 Java 코드의 출력 결과는?",["P","C","PC","컴파일 오류"],1,"오버라이딩된 메서드는 실제 객체(C) 기준으로 실행된다(동적 바인딩).",'class P { void show() { System.out.print("P"); } }\nclass C extends P { void show() { System.out.print("C"); } }\n// main에서\nP x = new C();\nx.show();'],
[0, "예외 처리에서 예외 발생 여부와 관계없이 항상 실행되는 블록은?", ["try", "catch", "throw", "finally"], 3, "finally는 예외가 있든 없든 항상 실행된다."],
[0,'JavaScript에서 "5" === 5의 결과는?',["true","false","undefined","오류"],1,"===는 타입까지 비교한다. 문자열과 숫자라서 false."],
[0,"HTML에서 다른 페이지로 이동하는 하이퍼링크를 만드는 태그는?",["<link>","<a>","<href>","<p>"],1,'<a href="주소">. <link>는 CSS 같은 외부 파일을 연결하는 태그.'],
[0,"다음 Python 코드의 출력 결과는?",["1 4 7","1 4 7 10","1 3 6 9","3 6 9"],0,"1부터 3씩 증가하고 10 미만까지 → 1, 4, 7.",'for i in range(1, 10, 3):\n    print(i, end=" ")'],
[0,"다음 C 코드의 출력 결과는?",["25","30","45","55"],0,"짝수는 건너뛰고 홀수만 더한다. 1+3+5+7+9 = 25.",'int s = 0;\nfor (int i = 1; i <= 10; i++) {\n    if (i % 2 == 0) continue;\n    s += i;\n}\nprintf("%d", s);'],
[1, "후입선출(LIFO) 방식으로 동작하며, 함수 호출 시 복귀 주소를 저장하는 데 쓰는 자료구조는?", ["큐", "트리", "데크", "스택"], 3, "스택은 나중에 넣은 것이 먼저 나온다(LIFO). 큐는 먼저 넣은 것이 먼저 나온다(FIFO)."],
[1, "빈 큐에 A, B, C를 차례로 삽입(enqueue)한 뒤 한 번 삭제(dequeue)하면 삭제되는 원소는?", ["A", "B", "C", "없음"], 0, "큐는 선입선출(FIFO)이라 가장 먼저 들어간 A가 나온다. 스택이었다면 C."],
[1, "데이터 모델링 단계 중, 특정 DBMS에 맞춰 테이블·인덱스·저장 구조를 구체적으로 정하는 단계는?", ["요구사항 분석", "개념적 데이터 모델링", "논리적 데이터 모델링", "물리적 데이터 모델링"], 3, "개념적(E-R 다이어그램) → 논리적(테이블·키·정규화, DBMS 독립) → 물리적(특정 DBMS의 저장 구조·인덱스)."],
[1, "E-R 다이어그램에서 마름모 기호가 나타내는 것은?", ["개체", "기본키 속성", "속성", "관계"], 3, "사각형 = 개체, 마름모 = 관계, 타원 = 속성, 밑줄 친 타원 = 기본키 속성."],
[1, "OSI 7계층 중 경로 설정(라우팅)을 담당하는 계층은?", ["데이터 링크 계층", "세션 계층", "전송 계층", "네트워크 계층"], 3, "라우터와 IP는 네트워크 계층(3계층)."],
[1, "‘비연결형이고 전송 속도가 빠르지만, 순서와 도착을 보장하지 않는다.’에 해당하는 프로토콜은?", ["TCP", "HTTP", "IP", "UDP"], 3, "UDP는 비연결형이다. TCP는 연결형이고 신뢰성을 보장한다."],
[1,"IP 주소를 MAC 주소로 바꾸는 프로토콜은?",["ARP","RARP","ICMP","DHCP"],0,"ARP는 IP→MAC, RARP는 MAC→IP."],
[1,"HTTP의 기본 포트 번호는?",["21","23","80","443"],2,"21 FTP, 23 Telnet, 443 HTTPS."],
[1,"네트워크 192.168.10.0/27에서 호스트에 할당할 수 있는 IP 주소는 몇 개인가?",["14","30","32","62"],1,"호스트 비트 5개 → 2⁵ = 32개, 네트워크·브로드캐스트 주소 2개를 빼면 30개."],
[1, "IPv4 C 클래스의 첫 번째 옥텟 범위는?", ["0~127", "128~191", "224~239", "192~223"], 3, "A 0~127, B 128~191, C 192~223, D 224~239."],
[1,"UNIX에서 chmod 754 file을 실행한 뒤의 파일 권한은?",["rwxr-xr--","rwxr--r-x","rw-r-xr--","rwxrw-r--"],0,"7=rwx, 5=r-x, 4=r--."],
[1, "UNIX에서 현재 작업 중인 디렉터리의 경로를 출력하는 명령어는?", ["ls", "cd", "cat", "pwd"], 3, "pwd = print working directory."],
[3, "블랙박스 테스트 기법이 아닌 것은?", ["동치 분할", "경계값 분석", "원인-효과 그래프", "기초 경로 테스트"], 3, "기초 경로 테스트는 내부 구조를 보는 화이트박스 기법이다."],
[3,"상향식 통합 테스트에서 상위 모듈 역할을 대신하는 가상 모듈은?",["스텁","드라이버","오라클","클러스터"],1,"상향식은 드라이버, 하향식은 스텁을 쓴다."],
[1, "사용자가 제품이나 서비스를 이용하면서 느끼고 생각하는 경험 전체를 뜻하는 용어는?", ["UI", "UX", "GUI", "CLI"], 1, "UX(사용자 경험)는 경험 전체, UI(사용자 인터페이스)는 그 경험을 위한 화면·조작 수단이다."],

[2,"LEFT OUTER JOIN에 대한 설명으로 옳은 것은?",["양쪽 테이블에 모두 있는 행만 출력한다","왼쪽 테이블의 행은 모두 출력하고, 오른쪽에 맞는 행이 없으면 NULL로 채운다","두 테이블의 모든 조합을 출력한다","오른쪽 테이블의 행만 모두 출력한다"],1,"①은 INNER JOIN, ③은 CROSS JOIN, ④는 RIGHT OUTER JOIN에 가깝다."],

[3, "사용자가 입력한 명령을 해석해 커널에 전달하는 명령어 해석기는?", ["커널", "셸(Shell)", "드라이버", "컴파일러"], 1, "커널은 자원을 관리하는 OS의 핵심, 셸은 사용자와 커널 사이의 명령어 해석기(bash, sh 등)."]
]),note:"# 프로그래밍기능사 필기 요약노트\n\nNov 24, 2026 · @훈\n\n## 시험 개요\n\n필기는 4과목 통합 60문항, 60분 동안 풀고 60점(36문항) 이상이면 합격이다. 과목별 과락은 없다. 2026년부터 정보처리기능사가 프로그래밍기능사로 바뀌었고, 실기는 2026년 공지에서 작업형으로 바뀐다고 했지만, 2027~2029년 출제기준표의 검정방법은 필답형이다. 공단 예시문제도 경로·명령어·실행 결과·빈칸·SQL 답을 직접 쓰는 단답형이다.\n\n| 항목 | 내용 |\n| --- | --- |\n| 필기 과목 | 프로그래밍 언어 · 응용SW기초기술 · SQL 활용 · 정보시스템 기초기술 |\n| 방식 | CBT, 객관식 4지 택일 60문항, 60분 |\n| 합격 | 100점 만점에 60점 이상 |\n| 응시자격 | 제한 없음 |\n| 실기 | 기초프로그래밍 실무, 작업형, 1시간 30분 |\n\n**첫 회차 출제 경향**: Java·Python 코드, OSI 7계층, IP 주소, 데이터베이스, SQL 명령어, UNIX 명령어가 나왔다고 알려져 있다([시나공 Q&A](https://sinagong.co.kr/community/001003001/book-qnas/279552)).\n\n**공부 전략 (컴공 기준)**\n\n1. 코드 출력 문제(C·Java·Python)는 직접 손으로 추적하는 연습을 한다. 배점이 가장 확실한 영역이다.\n2. SQL은 문법을 외우고 SELECT 결과를 예측하는 연습을 한다.\n3. 낯선 용어(테스트 기법, 형상관리, 보안 공격)는 표로 외운다.\n4. 마지막 주에는 맨 아래 체크리스트로 훑고 CBT 모의고사를 3회 이상 푼다.\n\n**공식 출제기준(필기, 적용기간 2027.01.01~2029.12.31)의 주요항목**\n\n| 주요항목 | 세부항목 | 이 노트 |\n| --- | --- | --- |\n| 1. 프로그래밍 언어 활용 및 응용 | 구조적 프로그래밍(기초문법, 순차·선택·반복, 컴파일러), 객체지향(OOP, 상속, 다형성, 추상화, 동적 바인딩) | 1과목 |\n| 2. 응용SW 기초 기술 활용 | 네트워크 기초(프로토콜, OSI, IP, TCP/UDP), 데이터베이스 기초(개념, 데이터 모델링, E-R, DB 유형, 무결성, 자료구조) | 2과목 |\n| 3. 화면구현 및 UI 테스트 | UI/UX, UI 테스트 기법, HTML, CSS, JavaScript 기초 | 1-7, 2-4 |\n| 4. SQL 작성 및 활용 | 시스템 카탈로그, SELECT, 집합 연산자, DML·DDL·DCL, 트랜잭션 | 3과목 |\n| 5. 테스트 및 배포 | 단위·통합·블랙박스·화이트박스 테스트, 디버깅, DevOps, CI/CD | 4-1, 4-2 |\n| 6. 개발자 환경 구축 | 운영체제 개념·종류·기본 명령어, 개발환경 설정, 개발도구 | 4-3, 4-4 |\n| 7. 개발 환경 운영 지원 | 백업 용량 산정, 백업 종류와 복원, 소스코드 형상관리 | 4-5, 4-6 |\n\n출제기준에 없는 보안, 진법 변환, CPU 구조, 개발 방법론, 신기술 용어는 이 노트에서 뺐다.\n\n## 1과목 프로그래밍 언어\n\n코드 출력 결과 문제가 핵심이다. 연산자 우선순위, 반복문 횟수, 배열 인덱스, 오버라이딩을 정확히 추적할 수 있어야 한다.\n\n### 1-1. 언어 분류\n\n| 분류 | 특징 | 예 |\n| --- | --- | --- |\n| 구조적(절차적) | 순차·선택·반복 3구조, goto 지양, 함수 단위 | C, Pascal |\n| 객체지향 | 클래스·객체 중심, 재사용성 | Java, C++, Python, C# |\n| 스크립트 | 인터프리터로 실행, 컴파일 불필요 | JavaScript, Python, PHP, Perl, Shell |\n| 선언형 | 무엇을 원하는지 기술 | SQL, HTML, Prolog, Haskell, LISP |\n\n- **컴파일러**: 전체를 미리 번역, 실행 빠름, 목적 프로그램 생성 (C, C++)\n- **인터프리터**: 한 줄씩 번역·실행, 디버깅 쉬움, 목적 프로그램 없음 (Python, JavaScript)\n- **Java**: 바이트코드(.class)로 컴파일 후 JVM이 실행 → 플랫폼 독립성\n- 번역 순서: 원시 프로그램 → 컴파일러 → 목적 프로그램 → 링커 → 로드 모듈 → 로더 → 실행\n\n### 1-2. 공통 문법\n\n**데이터 타입 크기 (C/Java)**\n\n| 타입 | C | Java |\n| --- | --- | --- |\n| char | 1바이트 | 2바이트(유니코드) |\n| short | 2 | 2 |\n| int | 4 | 4 |\n| long | 4 또는 8(환경별) | 8 |\n| float | 4 | 4 |\n| double | 8 | 8 |\n| boolean | 없음(0/1) | 1 |\n\n**연산자 우선순위** (높음 → 낮음)\n\n1. 단항: `++` `--` `!` `~` `sizeof` (오른쪽→왼쪽 결합)\n2. 산술: `*` `/` `%` → `+` `-`\n3. 시프트: `\u003c\u003c` `>>`\n4. 관계: `\u003c` `\u003c=` `>` `>=` → `==` `!=`\n5. 비트: `&` → `^` → `|`\n6. 논리: `&&` → `||`\n7. 조건(삼항): `? :`\n8. 대입: `=` `+=` `-=` 등 (오른쪽→왼쪽)\n9. 순서: `,`\n\n암기법: **단산시관비논조대순**\n\n**자주 틀리는 포인트**\n\n- `a++`는 값을 쓰고 나서 증가, `++a`는 증가 후 사용\n- 정수 나눗셈 `7/2 = 3`, `-7/2 = -3`(C/Java는 0 방향 버림), Python은 `7//2 = 3`, `-7//2 = -4`\n- `%`: Java·C는 부호가 왼쪽 피연산자를 따름(`-7%3 = -1`), Python은 오른쪽을 따름(`-7%3 = 2`)\n- `&&`, `||`는 단축 평가: 앞에서 결과가 정해지면 뒤는 실행 안 함\n- 비트: `5 & 3 = 1`, `5 | 3 = 7`, `5 ^ 3 = 6`, `~5 = -6`, `1 \u003c\u003c 3 = 8`, `16 >> 2 = 4`\n- `switch`에 `break`가 없으면 아래 case까지 계속 실행(fall-through)\n- `do-while`은 조건과 상관없이 최소 1번 실행\n- `continue`는 다음 반복으로, `break`는 반복 탈출\n\n### 1-3. C언어\n\n- 서식 문자: `%d` 정수, `%f` 실수, `%c` 문자, `%s` 문자열, `%x` 16진수, `%o` 8진수, `%p` 주소, `%5d` 5칸 오른쪽 정렬, `%.2f` 소수점 2자리\n- 입출력: `printf`, `scanf(\"%d\", &a)`(주소 전달), `getchar`, `putchar`, `gets`, `puts`\n- 기억 클래스: `auto`(지역, 기본), `register`(CPU 레지스터), `static`(함수 끝나도 값 유지), `extern`(다른 파일의 전역 변수)\n- 문자열 끝에는 `'\\0'`(널 문자)이 붙는다. `char s[] = \"abc\";`는 4바이트\n- 문자열 함수(`string.h`): `strlen`(길이, `\\0` 제외), `strcpy`, `strcat`, `strcmp`(같으면 0)\n- 포인터: `&a` = a의 주소, `*p` = p가 가리키는 값. `arr[i]` = `*(arr + i)`\n- 포인터 연산: `p + 1`은 자료형 크기만큼 이동(int면 4바이트)\n- 구조체: `struct`로 서로 다른 타입 묶음. 일반 변수는 `s.name`, 포인터는 `p->name`\n- 동적 할당: `malloc`(할당), `free`(해제), `calloc`(0으로 초기화)\n- 전처리기: `#include`, `#define`(매크로), `#ifdef`\n\n```c\nint a[5] = {1, 2, 3, 4, 5};\nint *p = a;\nprintf(\"%d\", *(p + 2) + p[4]); // 3 + 5 = 8\n```\n\n### 1-4. Java\n\n- 클래스 = 설계도, 객체(인스턴스) = `new`로 만든 실체\n- 생성자: 클래스 이름과 같고 반환형 없음. `this`는 자기 객체, `super`는 부모\n- 상속: `extends`(단일 상속만), 인터페이스는 `implements`(다중 구현 가능)\n- 자식 객체 생성 시 **부모 생성자가 먼저** 실행된다\n- 오버로딩: 같은 이름, 매개변수 개수·타입이 다름 (한 클래스 안)\n- 오버라이딩: 부모 메서드를 자식이 같은 시그니처로 재정의\n- `Parent p = new Child(); p.show();` → **자식의 show()** 실행(동적 바인딩). 단, static 메서드와 필드는 참조 타입(부모) 기준\n- 접근 제어자: `public`(전체) > `protected`(같은 패키지 + 자식) > `default`(같은 패키지) > `private`(같은 클래스)\n- `static`: 객체 없이 클래스명으로 접근, 모든 객체가 공유\n- `final`: 변수는 상수, 메서드는 오버라이딩 금지, 클래스는 상속 금지\n- 추상 클래스(`abstract`): 추상 메서드 포함 가능, 객체 생성 불가\n- 인터페이스: 모든 메서드가 기본적으로 추상, 변수는 `public static final`\n- 문자열: `==`는 주소 비교, `equals()`는 내용 비교. `String`은 불변 객체\n- 배열: `int[] a = new int[3];` 길이는 `a.length`, 문자열 길이는 `s.length()`\n- 배열·객체는 참조를 넘기므로 메서드 안에서 바꾸면 원본도 바뀜다\n\n```java\nclass A { void f() { System.out.print(\"A\"); } }\nclass B extends A { void f() { System.out.print(\"B\"); } }\nA x = new B(); x.f(); // B\n```\n\n### 1-5. Python\n\n- 동적 타이핑, 들여쓰기로 블록 구분, 세미콜론 불필요\n- 자료형: `list [ ]`(변경 가능), `tuple ( )`(변경 불가), `dict {k: v}`, `set { }`(중복 제거, 순서 없음)\n- 슬라이싱 `s[시작:끝:간격]`: 끝은 포함 안 함. `s[::-1]`은 뒤집기, `s[-1]`은 마지막\n- `range(1, 10, 2)` → 1, 3, 5, 7, 9 (10은 포함 안 함)\n- 리스트 메서드: `append`(끝에 추가), `insert(i, x)`, `extend`(리스트 이어 붙임), `remove(x)`(값 삭제), `pop()`(마지막 꺼냄), `sort`, `reverse`, `index`, `count`\n- 문자열: `split`, `join`, `upper`, `lower`, `replace`, `strip`, `find`\n- 연산자: `**` 거듭제곱, `//` 몫, `in` 포함 여부, `is` 같은 객체 여부, 논리는 `and` `or` `not`\n- 함수: `def`, 기본 매개변수, `lambda x: x * 2`, 여러 값 반환(튜플)\n- 클래스: `class`, 생성자 `__init__(self)`, 메서드 첫 매개변수는 `self`\n- `print(a, b, sep=\",\", end=\"\")`: sep은 구분자, end는 끝 문자(기본 줄바꿈)\n\n```python\na = [1, 2, 3, 4, 5]\nprint(a[1:4], a[::2], sum(a[-2:])) # [2, 3, 4] [1, 3, 5] 9\n```\n\n### 1-6. 객체지향 특징\n\n| 개념 | 의미 |\n| --- | --- |\n| 캡슐화 | 데이터와 함수를 묶고 외부에 숨김(정보 은닉) |\n| 상속 | 부모의 속성·메서드를 물려받음 |\n| 다형성 | 같은 메시지에 객체마다 다르게 반응(오버로딩·오버라이딩) |\n| 추상화 | 필요한 특징만 간추림 |\n| 메시지 | 객체에게 동작을 요청하는 것 |\n\n구성 요소: 클래스, 객체, 속성(attribute), 메서드, 메시지, 인스턴스.\n\n### 1-7. 웹 프로그래밍 (HTML·JavaScript)\n\n- HTML은 구조를 표시하는 마크업 언어. 주요 태그: `\u003chtml>` `\u003chead>` `\u003ctitle>` `\u003cbody>` `\u003ch1>~\u003ch6>` `\u003cp>` `\u003ca href>` `\u003cimg src alt>` `\u003ctable>\u003ctr>\u003ctd>` `\u003cul>\u003col>\u003cli>` `\u003cform>` `\u003cinput>` `\u003cdiv>` `\u003cspan>` `\u003cbr>`\n- `\u003cinput type>`: text, password, radio, checkbox, submit, button, file, hidden\n- `\u003cform method>`: GET(URL에 데이터 노출, 길이 제한) / POST(본문에 담음)\n- CSS는 스타일(색, 크기, 배치). 선택자: 태그 `p`, 클래스 `.name`, 아이디 `#name`\n- JavaScript는 브라우저에서 실행되는 스크립트 언어. 변수 `var`(함수 스코프), `let`(블록, 재할당 가능), `const`(재할당 불가)\n- JS `==`는 타입 변환 후 비교, `===`는 타입까지 비교 (`\"1\" == 1` true, `\"1\" === 1` false)\n- DOM: `document.getElementById()`, 이벤트 `onclick`, `onload`, `onchange`\n- 출력: `alert()`, `console.log()`, `document.write()`\n\n### 1-8. 예외 처리\n\n- 예외(Exception)는 실행 중 발생하는 오류. 프로그램이 멈추지 않게 처리한다\n- Java: `try { } catch (Exception e) { } finally { }` — finally는 예외 여부와 상관없이 항상 실행. 직접 발생 `throw`, 떠넘기기 `throws`\n- Python: `try / except / else / finally`, 직접 발생 `raise`. else는 예외가 없을 때만 실행\n- Java 주요 예외: `ArithmeticException`(0으로 나눔), `ArrayIndexOutOfBoundsException`, `NullPointerException`, `NumberFormatException`, `ClassCastException`\n- Python 주요 예외: `ZeroDivisionError`, `IndexError`, `KeyError`, `ValueError`, `TypeError`, `NameError`\n- Checked 예외(컴파일 시 처리 강제, IOException 등) vs Unchecked(RuntimeException 계열)\n\n### 1-9. 라이브러리\n\n- 라이브러리는 자주 쓰는 함수·클래스를 모아둔 것. 표준 라이브러리(기본 탑재) vs 외부 라이브러리(별도 설치)\n- C 헤더: `stdio.h`(입출력), `stdlib.h`(malloc, rand, atoi), `string.h`(문자열), `math.h`(수학), `time.h`(시간)\n- Java 패키지: `java.lang`(기본, 자동 import: String, Math, System), `java.util`(컨렉션: ArrayList, HashMap, Scanner), `java.io`(입출력), `java.net`(네트워크)\n- Python 모듈: `math`, `random`, `datetime`, `os`, `sys`, `re`(정규식), 가져오기는 `import`, `from ... import`\n- 프레임워크와 차이: 라이브러리는 개발자가 호출, 프레임워크는 틀이 개발자 코드를 호출(제어의 역전, IoC)\n\n## 2과목 응용SW 기초기술\n\n네트워크(OSI·IP·TCP/UDP), 데이터베이스 기초(모델링·E-R·무결성), 자료구조, UI/UX·CSS가 나온다. 서브넷 계산과 계층별 장비·프로토콜은 확실히 외우자.\n\n### 2-1. 네트워크\n\n**OSI 7계층** (아래부터: 물데네전세표응)\n\n| 계층 | 역할 | 단위 | 장비·프로토콜 |\n| --- | --- | --- | --- |\n| 7 응용 | 사용자 서비스 | 데이터 | HTTP, FTP, SMTP, DNS, Telnet |\n| 6 표현 | 코드 변환, 암호화, 압축 | 데이터 | JPEG, MPEG, ASCII |\n| 5 세션 | 연결 설정·유지·동기화(체크포인트) | 데이터 | NetBIOS, RPC |\n| 4 전송 | 종단 간 신뢰성, 흐름·오류 제어 | 세그먼트 | TCP, UDP |\n| 3 네트워크 | 경로 설정(라우팅), 논리 주소(IP) | 패킷 | 라우터, IP, ICMP, ARP |\n| 2 데이터 링크 | 인접 노드 간 전송, MAC 주소, 오류 검출 | 프레임 | 스위치, 브리지, Ethernet, HDLC |\n| 1 물리 | 비트를 전기 신호로 | 비트 | 리피터, 허브, 케이블 |\n\n**TCP/IP 4계층**: 응용(OSI 5\\~7) → 전송(4) → 인터넷(3) → 네트워크 액세스(1\\~2).\n\n- TCP: 연결형, 신뢰성(순서·재전송 보장), 3-way handshake(SYN → SYN+ACK → ACK)\n- UDP: 비연결형, 빠름, 신뢰성 낮음(스트리밍, DNS 조회)\n- ARP: IP → MAC 변환 / RARP: MAC → IP / ICMP: 오류 메시지(ping)\n- DHCP: IP 자동 할당 / DNS: 도메인 → IP / NAT: 사설 IP ↔ 공인 IP 변환\n- 포트 번호: FTP 20·21, SSH 22, Telnet 23, SMTP 25, DNS 53, HTTP 80, POP3 110, IMAP 143, HTTPS 443\n\n**IP 주소 (IPv4)**: 32비트, 8비트씩 4개를 점(.)으로 구분.\n\n| 클래스 | 첫 옥텋 범위 | 기본 서브넷 마스크 | 용도 |\n| --- | --- | --- | --- |\n| A | 0\\~127 | 255.0.0.0 (/8) | 대규모 |\n| B | 128\\~191 | 255.255.0.0 (/16) | 중규모 |\n| C | 192\\~223 | 255.255.255.0 (/24) | 소규모 |\n| D | 224\\~239 | 없음 | 멀티캐스트 |\n| E | 240\\~255 | 없음 | 연구용 |\n\n- 127.0.0.1 = 루프백(자기 자신)\n- 사설 IP: 10.0.0.0/8, 172.16.0.0\\~172.31.255.255, 192.168.0.0/16\n- 서브넷팅: /26 = 255.255.255.192 → 호스트 비트 6개 → 2⁶ = 64개 중 네트워크·브로드캐스트 주소 2개 빼고 **사용 가능 62개**\n- 예) 192.168.1.70/26 → 네트워크 192.168.1.64, 브로드캐스트 192.168.1.127\n- IPv6: 128비트, 16비트씩 8개를 콜론(:)으로 구분, 16진수 표기. 유니캐스트·멀티캐스트·애니캐스트 (브로드캐스트 없음), 보안(IPsec) 기본\n\n**네트워크 기타**\n\n- 토폴로지: 성형(중앙 허브), 버스형(한 케이블), 링형(원형), 트리형, 망형(모두 연결, n(n-1)/2개 회선)\n- 범위: LAN(근거리) \u003c MAN(도시) \u003c WAN(광역)\n- 전송 방식: 단방향(TV), 반이중(무전기), 전이중(전화)\n- 교환 방식: 회선 교환(전용 경로), 패킷 교환(가상 회선 / 데이터그램)\n- 오류 검출: 패리티, CRC, 해밍 코드(오류 정정까지 가능)\n\n### 2-2. 데이터베이스 기초\n\n- 데이터베이스: 통합·저장·운영·공용 데이터. DBMS 필수 기능은 정의·조작·제어\n- 데이터 모델링 3단계: 개념적(E-R 다이어그램, DBMS와 무관) → 논리적(테이블·키·정규화, 특정 데이터 모델에 맞춤) → 물리적(특정 DBMS의 저장 구조·인덱스·데이터 타입)\n- E-R 다이어그램 기호: 사각형 = 개체, 마름모 = 관계, 타원 = 속성, 밑줄 타원 = 기본키 속성, 이중 타원 = 다중값 속성\n- 관계 유형: 1:1, 1:N, N:M\n- DB 유형: 계층형(트리), 망형(그래프), 관계형(테이블, SQL), 객체지향형, NoSQL(키-값, 문서, 컬럼, 그래프)\n- 무결성: 개체(기본키 NULL·중복 불가), 참조(외래키는 참조 대상에 있거나 NULL), 도메인(허용 범위 안의 값) → 자세한 내용은 3-4\n\n### 2-3. 자료구조 기본\n\n| 구분 | 자료구조 | 특징 |\n| --- | --- | --- |\n| 선형 | 배열 | 같은 타입을 연속 저장, 인덱스로 바로 접근 |\n| 선형 | 연결 리스트 | 노드가 다음 노드 주소(포인터)를 가짐, 삽입·삭제 쉬움 |\n| 선형 | 스택 | 후입선출(LIFO), push·pop. 함수 호출, 되돌리기 |\n| 선형 | 큐 | 선입선출(FIFO), enqueue·dequeue. 작업 대기열 |\n| 선형 | 데크 | 양쪽 끝에서 삽입·삭제 |\n| 비선형 | 트리 | 계층 구조. 루트, 단말(리프), 차수, 깊이 |\n| 비선형 | 그래프 | 정점과 간선. 방향·무방향 |\n\n- 이진 트리 순회: 전위(루트-왼-오), 중위(왼-루트-오), 후위(왼-오-루트)\n- 스택 예) push A, B, C 후 pop → C / 큐 예) A, B, C 넣은 뒤 삭제 → A\n\n### 2-4. UI/UX와 화면 구현\n\n\n- UI 유형: CLI(명령어), GUI(그래픽), NUI(터치·음성 등 자연스러운 동작), OUI(사물 자체가 인터페이스)\n- UI 설계 원칙: 직관성(바로 알 수 있음), 유효성(목적 달성), 학습성(쉽게 배움), 유연성(실수 최소화)\n- 설계 도구: 와이어프레임(레이아웃 뼈대), 목업(실제와 비슷한 정적 화면), 스토리보드(화면 + 설명 + 흐름, 최종 산출물), 프로토타입(동적 견본), 유스케이스\n- UX: 사용자가 느끼는 경험. UI는 수단, UX는 경험 전체\n- UI 테스트: 사용성 테스트, 크로스 브라우징(여러 브라우저에서 동일하게 보이는지), 반응형 확인, 웹 접근성(장애인·고령자)\n- 표준: ISO/IEC 9126 → 25010 (품질 특성: 기능성, 신뢰성, 사용성, 효율성, 유지보수성, 이식성)\n- CSS 적용 방법: 인라인(`style=\"\"`), 내부(`\u003cstyle>`), 외부(`\u003clink rel=\"stylesheet\">`)\n- CSS 우선순위: 인라인 > 아이디(`#id`) > 클래스(`.class`) > 태그\n- 박스 모델: content → padding → border → margin\n\n## 3과목 SQL 활용\n\nSQL 문법 분류(DDL·DML·DCL)와 SELECT 결과 예측이 핵심이다. 정규화, 키, 무결성, 트랜잭션 성질은 용어 그대로 나온다.\n\n### 3-1. 데이터베이스 기초\n\n- 데이터베이스 정의: 통합된(중복 최소화), 저장된(보조기억장치), 운영(업무에 필수), 공용(여러 사용자 공유) 데이터\n- 특징: 실시간 접근, 계속적 변화, 동시 공유, 내용에 의한 참조\n- DBMS 필수 기능: 정의(Definition), 조작(Manipulation), 제어(Control)\n- 장점: 중복 최소화, 일관성·무결성·보안 유지, 데이터 독립성 / 단점: 비용, 백업·회복 복잡\n- 스키마 3단계: 외부(사용자별 관점, 서브 스키마) → 개념(전체 논리 구조, 기관 하나에 하나) → 내부(물리적 저장 구조)\n- 데이터 독립성: 논리적 독립성(개념 변경이 외부에 영향 없음), 물리적 독립성(내부 변경이 개념에 영향 없음)\n- 데이터 사전(시스템 카탈로그): DB 객체 정보를 담은 메타데이터. 사용자는 조회만 가능, 갱신은 DBMS가 자동으로\n- DBA(데이터베이스 관리자): 스키마 정의, 보안·권한, 백업·회복, 성능 관리\n\n### 3-2. 데이터베이스 설계\n\n- 순서: 요구 분석 → 개념적 설계(E-R 다이어그램, DBMS 독립) → 논리적 설계(테이블·정규화, 특정 데이터 모델 종속) → 물리적 설계(저장 구조·인덱스, 특정 DBMS 종속) → 구현\n- E-R 다이어그램 기호: 사각형=개체, 마름모=관계, 타원=속성, 밑줄 타원=기본키 속성, 이중 타원=다중값 속성, 선=연결\n- 관계 유형: 1:1, 1:N, N:M\n- 데이터 모델 종류: 계층형(트리), 망형(그래프), 관계형(테이블), 객체지향형\n- 데이터 모델 구성 3요소: 구조, 연산, 제약조건\n\n### 3-3. 관계형 모델 용어\n\n| 용어 | 뜻 | 테이블 용어 |\n| --- | --- | --- |\n| 릴레이션 | 표 전체 | 테이블 |\n| 튜플 | 한 행 | 행(레코드) |\n| 속성(attribute) | 한 열 | 열(컬럼) |\n| 도메인 | 속성이 가질 수 있는 값의 범위 | 데이터 타입·제약 |\n| 차수(Degree) | 속성의 개수 | 열 개수 |\n| 카디널리티(Cardinality) | 튜플의 개수 | 행 개수 |\n\n- 릴레이션 특징: 튜플 중복 없음, 튜플·속성 순서 없음, 속성값은 원자값(더 나눌 수 없음)\n- 예: 5열 10행 테이블 → 차수 5, 카디널리티 10\n\n### 3-4. 키와 무결성\n\n| 키 | 설명 |\n| --- | --- |\n| 후보키 | 튜플을 유일하게 식별. 유일성 + 최소성 |\n| 기본키(PK) | 후보키 중 선택한 하나. NULL·중복 불가 |\n| 대체키 | 기본키로 선택되지 않은 후보키 |\n| 슈퍼키 | 유일성만 만족(최소성 X) |\n| 외래키(FK) | 다른 테이블의 기본키를 참조하는 속성 |\n\n- 개체 무결성: 기본키는 NULL·중복 불가\n- 참조 무결성: 외래키 값은 참조 테이블의 기본키에 있거나 NULL\n- 도메인 무결성: 속성값은 정의된 도메인 범위 안에서\n- 참조 무결성 옵션: `CASCADE`(함께 삭제·변경), `SET NULL`, `RESTRICT`(참조 중이면 거부)\n\n### 3-5. 정규화와 이상\n\n- 이상(Anomaly): 중복 때문에 생기는 문제. 삽입 이상(불필요한 값도 함께 넣어야 함), 삭제 이상(필요한 값도 같이 지워짐), 갱신 이상(일부만 바뀌어 불일치)\n- 함수적 종속 X → Y: X 값이 정해지면 Y 값이 하나로 정해짐 (학번 → 이름)\n\n| 단계 | 조건 (암기: 도부이결다조) |\n| --- | --- |\n| 1NF | 모든 속성값이 원자값(반복·다중값 제거) |\n| 2NF | 부분 함수적 종속 제거(복합키 일부에만 종속된 속성 분리) |\n| 3NF | 이행적 종속 제거(A→B, B→C일 때 A→C 제거) |\n| BCNF | 모든 결정자가 후보키 |\n| 4NF | 다치 종속 제거 |\n| 5NF | 조인 종속 제거 |\n\n- 반정규화: 성능을 위해 일부러 중복을 허용하는 것(테이블 통합·분할, 중복 속성 추가)\n\n### 3-6. SQL 분류\n\n| 분류 | 명령어 | 용도 |\n| --- | --- | --- |\n| DDL(정의어) | CREATE, ALTER, DROP, TRUNCATE, RENAME | 테이블·뷰·인덱스 구조 정의 |\n| DML(조작어) | SELECT, INSERT, UPDATE, DELETE | 데이터 조회·변경 |\n| DCL(제어어) | GRANT, REVOKE | 권한 부여·회수 |\n| TCL(트랜잭션 제어) | COMMIT, ROLLBACK, SAVEPOINT | 트랜잭션 확정·취소 (DCL에 포함하기도 함) |\n\n**DDL**\n\n```sql\nCREATE TABLE 학생 (\n  학번 CHAR(8) PRIMARY KEY,\n  이름 VARCHAR(20) NOT NULL,\n  학과코드 CHAR(3) REFERENCES 학과(코드),\n  학년 INT CHECK (학년 BETWEEN 1 AND 4)\n);\nALTER TABLE 학생 ADD 전화 VARCHAR(15);\nDROP TABLE 학생 CASCADE;\n```\n\n- 제약조건: `PRIMARY KEY`, `FOREIGN KEY ... REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`\n- `DROP`(구조까지 삭제) vs `TRUNCATE`(구조는 남기고 데이터만 전부 삭제) vs `DELETE`(DML, 조건별 삭제, 롤백 가능)\n- `CASCADE`는 참조하는 것까지 함께, `RESTRICT`는 참조 중이면 거부\n- 뷰(VIEW): 가상 테이블. `CREATE VIEW`로 만들고 ALTER로는 수정 불가(DROP 후 재생성). 보안·논리적 독립성 제공, 삽입·수정에 제약\n- 인덱스: 검색 속도 향상, `CREATE [UNIQUE] INDEX 이름 ON 테이블(열)`. 삽입·수정이 잦으면 오히려 느려짐\n\n**DML**\n\n```sql\nINSERT INTO 학생 (학번, 이름) VALUES ('20260001', '김철수');\nUPDATE 학생 SET 학년 = 2 WHERE 학번 = '20260001';\nDELETE FROM 학생 WHERE 학년 = 4;\n```\n\n- `UPDATE`·`DELETE`에 WHERE가 없으면 **전체 행**에 적용\n- 키워드 짝: INSERT **INTO** \\~ **VALUES** / UPDATE \\~ **SET** / DELETE **FROM**\n\n**SELECT 구조와 실행 순서**\n\n```sql\nSELECT 학과, COUNT(*) AS 인원, AVG(점수)\nFROM 학생\nWHERE 학년 >= 2\nGROUP BY 학과\nHAVING COUNT(*) >= 3\nORDER BY 인원 DESC;\n```\n\n실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.\n\n- `DISTINCT`: 중복 제거 / `*`: 모든 열 / `AS`: 별칭\n- 비교: `=`, `\u003c>`(같지 않음), `BETWEEN a AND b`(양끝 포함), `IN (…)`, `IS NULL`(`= NULL`은 틀린 문법)\n- `LIKE`: `%`는 0글자 이상, `_`는 정확히 1글자. `'김%'`=김으로 시작, `'_민%'`=둘째 글자가 민\n- 집계 함수: `COUNT`, `SUM`, `AVG`, `MAX`, `MIN`. NULL은 계산에서 제외(단 `COUNT(*)`는 NULL 행도 셈)\n- WHERE는 행 조건(집계 함수 못 씀), HAVING은 그룹 조건(집계 함수 사용)\n- `ORDER BY`: 기본 ASC(오름차순), DESC는 내림차순\n- 하위 질의: `WHERE 점수 > (SELECT AVG(점수) FROM 학생)`, `IN`, `EXISTS`, `ANY`, `ALL`\n- 집합 연산: `UNION`(합집합, 중복 제거), `UNION ALL`(중복 포함), `INTERSECT`(교집합), `EXCEPT`/`MINUS`(차집합)\n\n**조인**\n\n```sql\nSELECT s.이름, d.학과명\nFROM 학생 s INNER JOIN 학과 d ON s.학과코드 = d.코드;\n```\n\n- INNER JOIN: 양쪽에 모두 있는 행만\n- LEFT OUTER JOIN: 왼쪽은 전부, 오른쪽은 없으면 NULL (RIGHT는 반대, FULL은 양쪽 전부)\n- CROSS JOIN: 카티션 곱(행 수 = m × n)\n- SELF JOIN: 같은 테이블끼리(직원-관리자)\n- 자연 조인(NATURAL JOIN): 같은 이름의 열로 자동 조인, 중복 열 제거\n\n**DCL**\n\n```sql\nGRANT SELECT, UPDATE ON 학생 TO user1 WITH GRANT OPTION;\nREVOKE UPDATE ON 학생 FROM user1 CASCADE;\n```\n\n- `WITH GRANT OPTION`: 받은 권한을 다른 사용자에게도 나눠줄 수 있음\n- 짝: GRANT \\~ **TO** / REVOKE \\~ **FROM**\n\n### 3-7. 시스템 카탈로그와 집합 연산자\n\n- 시스템 카탈로그(데이터 사전): 테이블·컬럼·인덱스·뷰·사용자·권한 같은 DB 객체 정보를 담은 메타데이터. DBMS가 자동으로 갱신하고 사용자는 조회(SELECT)만 한다\n- 조회 예: Oracle `USER_TABLES`(내 테이블), `USER_TAB_COLUMNS`(컬럼), `USER_INDEXES`, `USER_VIEWS` / MySQL `information_schema.TABLES`, `DESC 테이블명`(구조)\n\n| 집합 연산자 | 결과 |\n| --- | --- |\n| UNION | 합집합, 중복 행은 한 번만 |\n| UNION ALL | 합집합, 중복 포함 |\n| INTERSECT | 교집합 |\n| EXCEPT (Oracle은 MINUS) | 차집합 |\n\n- 두 SELECT의 컬럼 개수와 데이터 타입이 맞아야 한다. ORDER BY는 맨 마지막에 한 번만\n\n### 3-8. 트랜잭션과 회복\n\n- 트랜잭션: 하나의 논리적 작업 단위(계좌 이체 = 출금 + 입금)\n\n| ACID | 의미 |\n| --- | --- |\n| 원자성(Atomicity) | 전부 실행되거나 전혀 안 되거나 (Commit/Rollback) |\n| 일관성(Consistency) | 실행 후에도 DB가 일관된 상태 유지 |\n| 독립성(Isolation) | 실행 중인 트랜잭션에 다른 트랜잭션이 끼어들 수 없음 |\n| 영속성(Durability) | 커밋된 결과는 영구 반영 |\n\n- 상태: 활동 → 부분 완료 → 완료(커밋) / 실패 → 철회(롤백)\n- 회복 기법: 즉시 갱신(Undo + Redo), 지연 갱신(Redo만), 체크포인트, 그림자 페이지(Undo 불필요)\n- Redo = 로그로 다시 실행(커밋된 것), Undo = 취소(커밋 안 된 것)\n- 병행 제어: 로킹(Locking, 로킹 단위가 크면 병행성↓ 오버헤드↓), 2단계 로킹(확장 → 축소), 타임스탬프, 낸관적 기법(검증)\n- 병행 제어 실패 문제: 갱신 분실, 현황 파악 오류, 모순성, 연쇄 복귀\n\n### 3-9. 절차형 SQL\n\n- 프로시저: 일련의 SQL을 저장해 호출, 반환값 없을 수 있음 (`CALL`/`EXECUTE`)\n- 사용자 정의 함수: 반드시 값 1개 반환(`RETURN`)\n- 트리거: INSERT·UPDATE·DELETE 같은 이벤트가 발생하면 자동 실행. 트리거 안에서는 COMMIT/ROLLBACK 불가\n- 커서: 여러 행 결과를 한 행씩 처리(OPEN → FETCH → CLOSE)\n\n## 4과목 정보시스템 기초기술\n\n테스트·디버깅, DevOps·CI/CD, 운영체제와 명령어, 개발환경, 백업·복원, 형상관리가 나온다.\n\n### 4-1. 애플리케이션 테스트와 디버깅\n\n\n- 테스트 원리: 결함 존재 증명(없음은 증명 못 함), 완벽한 테스트 불가능, 결함 집중(파레토 80:20), 살충제 패러독스(같은 테스트 반복하면 결함 못 찾음), 오류-부재의 궁식, 정황 의존성, 조기 테스트\n- 검증(Verification): 제품을 올바르게 만들었나(개발자 관점) / 확인(Validation): 올바른 제품을 만들었나(사용자 관점)\n- 정적 테스트(실행 안 함: 동료 검토, 워크스루, 인스펙션) / 동적 테스트(실행함: 화이트박스, 블랙박스)\n\n| 구분 | 화이트박스 | 블랙박스 |\n| --- | --- | --- |\n| 관점 | 내부 구조·로직 | 기능·명세(입출력) |\n| 기법 | 기초 경로, 제어 구조(조건·루프·데이터 흐름), 커버리지(구문·결정·조건·MC/DC) | 동치 분할, 경계값 분석, 원인-효과 그래프, 오류 예측, 비교 |\n\n- 순환 복잡도(McCabe) V(G) = 간선 수 − 노드 수 + 2 (또는 영역 수 + 1 또는 조건 수 + 1)\n- 테스트 레벨(V-모델): 단위(모듈) → 통합(인터페이스) → 시스템(전체 기능·성능) → 인수(사용자 요구사항)\n- 인수 테스트: 알파(개발자 장소에서 사용자가) / 베타(사용자 환경에서 여러 사용자가)\n- 통합 테스트: 하향식(상위부터, **스텁** 필요) / 상향식(하위부터, **드라이버** 필요) / 빅뱅(한꺼번에)\n- 회귀 테스트: 수정 후 다른 부분에 새 오류가 없는지 다시 확인\n- 테스트 오라클: 기대 결과를 판단하는 기준(참, 샘플링, 휴리스틱, 일관성 검사)\n- 테스트 케이스 구성: 식별자, 테스트 항목, 입력 데이터, 예상 결과, 테스트 환경, 전제 조건\n- 경계값 예: 입력 1\\~100이 유효하면 0, 1, 100, 101을 테스트한다\n- 디버깅: 오류의 원인을 찾아 고치는 과정. 중단점(Breakpoint)으로 실행을 멈추고, 한 줄씩 실행(Step Over/Into)하며 변수 값을 확인(Watch)한다\n- 로그 출력(`print`, `console.log`)으로 실행 흐름과 값을 확인하는 것도 디버깅 방법이다\n\n### 4-2. 애플리케이션 배포 (DevOps·CI/CD)\n\n- DevOps: 개발(Development)과 운영(Operations)을 통합해 협업과 자동화로 빠르고 안정적으로 배포하는 문화·방법\n- CI(지속적 통합): 코드를 공유 저장소에 자주 합치고 그때마다 자동 빌드·테스트\n- CD(지속적 전달·배포): 테스트를 통과한 결과물을 배포 가능한 상태로 유지하거나(전달) 운영 환경까지 자동 배포(배포)\n- 파이프라인: 코드 커밋 → 빌드 → 테스트 → 배포\n- 도구: Jenkins(CI 서버), GitHub Actions, GitLab CI, Docker(컨테이너), Kubernetes(컨테이너 운영)\n\n### 4-3. 운영체제 기초 활용\n\n\n- 운영체제(OS)는 하드웨어와 사용자 사이의 인터페이스. 자원(CPU, 메모리, 입출력, 파일) 관리\n- 성능 평가 기준: 처리 능력(Throughput) ↑, 반환 시간(Turnaround Time) ↓, 사용 가능도(Availability) ↑, 신뢰도(Reliability) ↑\n- 구성: 제어 프로그램(감시, 작업 관리, 데이터 관리) + 처리 프로그램(언어 번역, 서비스, 문제)\n- 커널: OS의 핵심, 항상 메모리에 상주. 셸(Shell): 사용자 명령을 해석하는 명령어 해석기\n\n**운영 방식**\n\n| 방식 | 특징 |\n| --- | --- |\n| 일괄 처리 | 일정량·기간 모아서 한 번에 처리(급여 계산) |\n| 실시간 | 요청 즉시 처리(예약, 은행) |\n| 시분할 | CPU 시간을 쪼개 여러 사용자가 번갈아 사용 |\n| 다중 프로그래밍 | 여러 프로그램을 메모리에 올려 CPU 1개로 번갈아 실행 |\n| 다중 처리 | CPU 여러 개로 동시에 처리 |\n| 분산 처리 | 네트워크로 연결된 여러 컴퓨터가 나눠 처리 |\n\n발달 순서: 일괄 → 실시간 → 다중 프로그래밍·시분할·다중 처리 → 분산 처리.\n\n**프로세스·메모리 기본 개념** (출제기준 '운영체제 개념'에 해당, 계산 문제보다 용어 위주로)\n\n- 프로세스 = 실행 중인 프로그램, 스레드 = 프로세스 안의 실행 단위\n- 프로세스 상태: 생성 → 준비 → 실행 → 대기 → 종료\n- 교착 상태 4조건: 상호 배제, 점유와 대기, 비선점, 환형 대기\n- 가상 기억장치: 페이징(같은 크기), 세그먼테이션(논리 단위). 스래싱은 페이지 교체가 지나치게 잦은 현상\n\n**운영체제 종류**\n\n| 종류 | 특징 |\n| --- | --- |\n| Windows | 마이크로소프트, GUI 중심, PC에서 가장 많이 씀 |\n| Linux | 오픈소스 커널, 서버에서 많이 씀(Ubuntu, CentOS 등) |\n| UNIX | 다중 사용자·다중 작업, 대부분 C로 작성 |\n| macOS / iOS | 애플 운영체제 |\n| Android | 리눅스 커널 기반 모바일 OS |\n\n\n- 구성: 커널(프로세스·메모리·파일 관리), 셸(명령어 해석: sh, bash, csh, ksh), 유틸리티\n- 특징: 다중 사용자·다중 작업, 대부분 C로 작성(이식성 높음), 트리 구조 파일 시스템, 대소문자 구분\n- 디렉터리: `/`(루트), `/bin`(기본 명령어), `/etc`(설정 파일), `/home`(사용자), `/dev`(장치), `/tmp`(임시), `/var`(로그)\n- inode: 파일의 소유자, 크기, 권한, 위치 등 정보를 담은 구조체 (파일 이름은 없음)\n\n| 명령어 | 기능 |\n| --- | --- |\n| `ls` | 목록 보기 (`-l` 자세히, `-a` 숨김 파일) |\n| `cd` / `pwd` | 디렉터리 이동 / 현재 경로 |\n| `mkdir` / `rmdir` | 디렉터리 생성 / 빈 디렉터리 삭제 |\n| `cp` / `mv` / `rm` | 복사 / 이동·이름 변경 / 삭제 (`rm -r` 하위 포함) |\n| `cat` | 파일 내용 출력 |\n| `more` / `less` / `head` / `tail` | 화면 단위 출력 / 앞부분 / 끝부분 |\n| `chmod` | 권한 변경 |\n| `chown` / `chgrp` | 소유자 / 그룹 변경 |\n| `ps` / `kill` | 프로세스 보기 / 종료 |\n| `grep` | 파일에서 문자열 찾기 |\n| `find` | 파일 찾기 |\n| `fork` / `exec` | 자식 프로세스 복제 / 새 프로그램 실행 |\n| `mount` / `umount` | 파일 시스템 연결 / 해제 |\n| `tar` / `gzip` | 묶기 / 압축 |\n| `man` | 도움말 |\n| `who` / `whoami` | 접속자 / 현재 사용자 |\n| `ifconfig` / `ping` | 네트워크 설정 / 연결 확인 |\n\n**권한 (chmod)**: `-rwxr-xr--` = 소유자(rwx=7) 그룹(r-x=5) 기타(r--=4) → `chmod 754 file`. r=4, w=2, x=1. 예) `chmod 644` = rw-r--r--.\n\n**리다이렉션·파이프**: `>` 덮어쓰기, `>>` 이어쓰기, `\u003c` 입력, `|` 앞 명령 결과를 다음 명령 입력으로 (`ls | grep txt`).\n\n**Windows 대응 명령어**: `dir`(=ls), `copy`(=cp), `del`(=rm), `type`(=cat), `cls`(화면 지움), `ipconfig`(=ifconfig), `attrib`(속성 변경).\n\n### 4-4. 개발환경 구축\n\n- 하드웨어 환경: 클라이언트(PC, 모바일) + 서버(웹 서버, WAS, DB 서버, 파일 서버)\n- 웹 서버: 정적 콘텐츠(HTML, 이미지) 처리 — Apache, Nginx, IIS\n- WAS: 동적 콘텐츠·비즈니스 로직 처리 — Tomcat, JBoss, WebLogic, JEUS\n- DB 서버: Oracle, MySQL, MariaDB, MS-SQL, PostgreSQL\n- 소프트웨어 환경: 시스템 SW(OS, DBMS, JVM) + 개발 SW(요구사항 관리, 설계·모델링, 구현, 테스트, 형상관리, 빌드 도구)\n- IDE(통합 개발 환경): 편집·컴파일·디버깅을 한 곳에서 — Eclipse, IntelliJ, Visual Studio, VS Code\n- 빌드 도구: Ant(XML, 규칙 없음), Maven(pom.xml, 의존성 관리), Gradle(Groovy/Kotlin 스크립트, 안드로이드 기본), Jenkins(CI 서버)\n- 미들웨어: OS와 응용 프로그램 사이에서 통신·연결을 담당 — RPC, MOM(메시지 지향), TP-Monitor(트랜잭션 처리), ORB(객체), WAS\n- 가상화·컨테이너: VM(하이퍼바이저 위에 OS 통째로), Docker(OS 커널 공유, 가벼움), Kubernetes(컨테이너 오케스트레이션)\n\n### 4-5. 개발 환경 백업 및 복원\n\n| 백업 종류 | 저장 대상 | 복원에 필요한 것 |\n| --- | --- | --- |\n| 전체 백업 | 모든 데이터 | 전체 백업 1개 |\n| 차등 백업 | 마지막 전체 백업 이후 바뀐 것 전부(누적) | 전체 + 가장 최근 차등 1개 |\n| 증분 백업 | 직전 백업(전체·증분) 이후 바뀐 것만 | 전체 + 그 뒤 모든 증분 |\n\n- 백업 속도·용량: 증분이 가장 빠르고 작다. 복원 속도: 전체 > 차등 > 증분\n- 백업 용량 산정 예: 전체 100GB, 하루 변경 10GB, 일요일 전체 + 6일 증분 → 100 + 10 × 6 = 160GB. 6일 차등이면 10 + 20 + … + 60 = 210GB를 더해 310GB\n- 백업 시스템: 테이프, 디스크(NAS·SAN), 클라우드. 원본과 다른 장소에 보관(원격지 백업)\n- 복원 목표: RTO(복구까지 걸리는 시간), RPO(복구 시점, 데이터 손실 허용 범위)\n\n### 4-6. 소스코드 형상관리\n\n\n- 형상관리(SCM): 개발 과정의 변경 사항을 관리·통제. 절차: 식별 → 통제 → 감사 → 기록(보고)\n- 버전 관리 방식: 공유 폴더(RCS, SCCS), 클라이언트/서버(CVS, SVN), 분산 저장소(Git, Mercurial, Bitkeeper)\n- 용어: 저장소(Repository), 체크아웃(받기), 커밋(올리기), 임포트(최초 등록), 동기화(Update), 브랜치, 병합(Merge), 충돌(Conflict), 베이스라인(기준선)\n- Git 명령어: `init`(생성), `clone`(복제), `add`(스테이징), `commit`(로컬 저장), `push`(원격 업로드), `pull`(원격 가져와 병합), `fetch`(가져오기만), `branch`, `checkout`/`switch`, `merge`, `status`, `log`\n- Git 영역: 작업 디렉터리 → (add) → 스테이징 영역 → (commit) → 로컬 저장소 → (push) → 원격 저장소\n- CI/CD: 지속적 통합(코드를 자주 합치고 자동 빌드·테스트), 지속적 배포(자동으로 운영 환경에 배포)\n- 패키징: 사용자 중심, 모듈화, 다양한 환경 고려. 작업 순서: 기능 식별 → 모듈화 → 빌드 진행 → 사용자 환경 분석 → 패키징 및 변경 개선 → 배포\n- 릴리즈 노트: 버전, 추가·수정 기능, 버그 수정 내용을 사용자에게 알리는 문서 (헤더, 개요, 목적, 이슈 요약, 재현 항목, 수정/개선, 면책 조항)\n- 배포 도구: 빌드 도구(Maven, Gradle), 형상관리(Git), 패키징 도구, CI 도구(Jenkins)\n\n## 시험 직전 암기 체크리스트\n\n시험 전날 이 목록만 다시 보고, 설명 못 하는 항목은 위 본문으로 돌아가자.\n\n- [ ] 연산자 우선순위: 단산시관비논조대순\n- [ ] `a++` vs `++a`, 정수 나눗셈·`%` 부호 (C/Java vs Python)\n- [ ] C 포인터 `*(p+i)` = `p[i]`, 문자열 끝 `\\0`\n- [ ] Java 오버라이딩 → 자식 메서드 실행(동적 바인딩), 부모 생성자 먼저\n- [ ] 접근 제어자 4종 범위, 추상 클래스 vs 인터페이스\n- [ ] Python 슬라이싱·`range` 끝값 미포함\n- [ ] 컴파일러 vs 인터프리터\n- [ ] HTML 태그, CSS 선택자·우선순위, JS `==` vs `===`\n- [ ] OSI 7계층: 물데네전세표응 + 계층별 장비·프로토콜\n- [ ] TCP vs UDP, ARP/ICMP/DHCP/DNS, 주요 포트 번호\n- [ ] IP 클래스 범위, 서브넷 호스트 수 = 2ⁿ − 2\n- [ ] 데이터 모델링 3단계, E-R 기호\n- [ ] 스택(LIFO) vs 큐(FIFO), 트리 용어와 순회\n- [ ] 키 5종, 무결성 3종, 정규화: 도부이결다조\n- [ ] SQL 분류(DDL·DML·DCL·TCL), SELECT 실행 순서, WHERE vs HAVING\n- [ ] UNION vs UNION ALL vs INTERSECT vs EXCEPT, 조인 종류\n- [ ] DROP vs TRUNCATE vs DELETE, ACID\n- [ ] 단위→통합→시스템→인수, 블랙박스 vs 화이트박스, 스텁 vs 드라이버\n- [ ] 구문·결정·조건 커버리지, 디버깅 중단점\n- [ ] DevOps, CI vs CD, Jenkins\n- [ ] 커널 vs 셸, OS 종류, Linux 명령어와 `chmod` 숫자\n- [ ] 웹 서버 vs WAS, 빌드 도구(Maven·Gradle)\n- [ ] 전체·차등·증분 백업과 복원에 필요한 것, 백업 용량 계산\n- [ ] Git 흐름(add → commit → push), 형상관리 절차\n",pass:(sc)=>sc>=60,rule:"60점 이상"},

{s:0,t:"sa",q:"다음 Python 코드의 출력 결과를 쓰시오. (end=\" \"이므로 값 사이에 공백 하나)",c:'class Node:\n    def __init__(self, key):\n        self.key = key\n        self.left = None\n        self.right = None\n\ndef visit(n):\n    if n:\n        print(n.key, end=" ")\n        visit(n.left)\n        visit(n.right)\n\nroot = Node(1)\nroot.left = Node(2)\nroot.right = Node(3)\nroot.left.left = Node(4)\nroot.left.right = Node(5)\nvisit(root)',a:["1 2 4 5 3"],e:"자기 자신을 먼저 출력하고 왼쪽, 오른쪽 순으로 방문하는 전위 순회. 1 → 2 → 4 → 5 → 3. 출력을 왼쪽 방문과 오른쪽 방문 사이에 두면 중위 순회(4 2 5 1 3), 맨 뒤에 두면 후위 순회(4 5 2 3 1)."},
{s:0,t:"sa",q:"딕셔너리 d의 key만 모아 리스트로 만들려고 한다. 빈칸 ①에 들어갈 메서드 이름을 쓰시오.",c:'d = {"a": 1, "b": 2}\nprint(list(d.( ① )()))',a:["keys","keys()"],e:"keys()는 키, values()는 값, items()는 (키, 값) 쌍을 돌려준다."},
{s:0,t:"sa",q:"다음 Python 프로그램을 실행하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.",c:"1  def total(nums):\n2      s = 0\n3      for n in nums:\n4          s += n\n5  return s\n6\n7  print(total([1, 2, 3]))",a:["5"],e:"5번 줄 return이 함수 안으로 들여쓰기되지 않아 함수 밖 return이 되어 SyntaxError가 난다."},
{s:0,t:"sa",q:"다음은 return 줄의 들여쓰기 오류를 고친 프로그램이다. 실행 결과를 쓰시오.",c:"def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s\n\nprint(total([1, 2, 3]))",a:["6"],e:"1 + 2 + 3 = 6."},
{s:1,t:"sa",q:"다음 Java 코드의 출력 결과를 쓰시오.",c:'String s = "Hello";\nSystem.out.print(s.length() + s.charAt(0));',a:["77"],e:"int + char는 숫자 덧셈이다. 5 + 'H'(72) = 77. 문자열 연결이 아니다."},
{s:1,t:"sa",q:"다음 Java 코드의 출력 결과를 쓰시오.",c:'class C {\n    static int cnt = 0;\n    C() { cnt++; }\n}\n// main\nnew C(); new C(); new C();\nSystem.out.print(C.cnt);',a:["3"],e:"static 변수는 모든 객체가 공유한다. 생성자가 3번 실행돼 3."},
{s:1,t:"sa",q:"다음 Java 코드의 출력 결과를 쓰시오.",c:'int x = 5;\nx += x++ + ++x;\nSystem.out.print(x);',a:["17"],e:"x += 식 은 x = 5 + (x++ + ++x). x++는 5(이후 x=6), ++x는 7. 5 + 12 = 17."},
{s:1,t:"sa",q:"다음 Java 코드의 출력 결과를 쓰시오.",c:'try {\n    int a = 10 / 0;\n    System.out.print("A");\n} catch (ArithmeticException e) {\n    System.out.print("B");\n} finally {\n    System.out.print("C");\n}',a:["BC"],e:"0으로 나눠 예외가 나서 A는 건너뛰고 B, 이어서 finally의 C."},
{s:1,t:"sa",q:"다음 Java 코드의 출력 결과를 쓰시오.",c:'String a = "Hi";\nString b = new String("Hi");\nSystem.out.print((a == b) + " " + a.equals(b));',a:["false true"],e:"new로 만든 문자열은 다른 객체라 ==(참조 비교)는 false, equals(내용 비교)는 true."},
{s:1,t:"sa",q:"다음 Java 코드의 출력 결과를 쓰시오.",c:'class A {\n    A() { System.out.print("1"); }\n    A(int x) { this(); System.out.print("2"); }\n}\nclass B extends A {\n    B() { super(5); System.out.print("3"); }\n}\n// main\nnew B();',a:["123"],e:"B() → super(5)로 A(int) 호출 → this()로 A() 호출해 1 → A(int) 나머지 2 → B() 나머지 3."},
{s:1,t:"sa",q:"인터페이스 Shape을 Circle 클래스가 구현하려고 한다. 빈칸 ①에 들어갈 키워드를 한 단어로 쓰시오.",c:"interface Shape {\n    double area();\n}\n\nclass Circle ( ① ) Shape {\n    double r = 2;\n    public double area() { return 3.14 * r * r; }\n}",a:["implements"],e:"인터페이스 구현은 implements, 클래스 상속은 extends."},
{s:2,t:"sa",q:"다음 C 코드의 출력 결과를 쓰시오.",c:'int x = 7, y = 3;\nprintf("%d %d", x / y, x % y);',a:["2 1"],e:"정수 나눗셈 7/3 = 2, 나머지 7%3 = 1."},
{s:2,t:"sa",q:"다음 C 코드의 출력 결과를 쓰시오.",c:'int a[5] = {5, 3, 8, 1, 4};\nint max = a[0];\nfor (int i = 1; i < 5; i++)\n    if (a[i] > max) max = a[i];\nprintf("%d", max);',a:["8"],e:"배열을 돌며 더 큰 값으로 바꾼다. 최댓값은 8."},
{s:2,t:"sa",q:"다음 C 코드의 출력 결과를 쓰시오. (string.h 포함)",c:'char s[] = "HELLO";\nprintf("%d %c", (int)strlen(s), s[1]);',a:["5 E"],e:"strlen은 널 문자를 빼고 5. s[1]은 두 번째 글자 E."},
{s:2,t:"sa",q:"다음 C 코드의 출력 결과를 쓰시오.",c:'int a = 10, *p = &a;\n*p += 5;\nprintf("%d", a);',a:["15"],e:"p가 a를 가리키므로 *p += 5는 a를 15로 바꾼다."},
{s:3,t:"sa",q:"[학생] 테이블을 점수가 높은 순으로 정렬하려고 한다. 빈칸에 알맞은 키워드를 쓰시오.",c:"SELECT * FROM 학생 ORDER BY 점수 (    );",a:["DESC"],e:"내림차순은 DESC, 오름차순은 ASC(기본값)."},
{s:3,t:"sa",q:"학과별 평균 점수가 80 이상인 학과만 조회하려고 한다. 빈칸에 알맞은 키워드를 쓰시오.",c:"SELECT 학과, AVG(점수) FROM 학생\nGROUP BY 학과\n(    ) AVG(점수) >= 80;",a:["HAVING"],e:"그룹에 거는 조건은 HAVING."},
{s:3,t:"sa",q:"user1에게 준 [학생] 테이블의 UPDATE 권한을 회수하려고 한다. 빈칸에 알맞은 명령어를 쓰시오.",c:"(    ) UPDATE ON 학생 FROM user1;",a:["REVOKE"],e:"권한 회수는 REVOKE ~ FROM, 부여는 GRANT ~ TO."},
{s:3,t:"sa",q:"[member] 테이블에서 성이 '김'이고 이름 전체가 정확히 세 글자인 사람을 찾으려고 한다. 빈칸 ①에 들어갈 패턴을 쓰시오.",c:"SELECT * FROM member WHERE name LIKE '( ① )';",a:["김__"],e:"_는 정확히 한 글자, %는 0글자 이상. 김 + 두 글자 = '김__'."},
{s:3,t:"sa",q:"[score] 테이블의 구조는 남기고 데이터만 모두 삭제하는 SQL을, 키워드 2개와 테이블 이름(score)만 사용해 쓰시오.",a:["TRUNCATE TABLE score","TRUNCATE TABLE score;"],e:"TRUNCATE TABLE은 구조를 남기고 모든 행을 지운다. DROP TABLE은 구조까지 삭제하고, CASCADE를 붙이면 참조하는 제약 조건까지 함께 삭제한다."},
{s:3,t:"sa",q:"다음 SQL을 실행한 결과 ans의 값을 쓰시오.<table><tr><th colspan=\"2\">t1</th><th></th><th colspan=\"2\">t2</th></tr><tr><th>c1</th><th>c2</th><th></th><th>c1</th><th>c2</th></tr><tr><td>A</td><td>1</td><td></td><td>A</td><td>4</td></tr><tr><td>B</td><td>2</td><td></td><td>B</td><td>1</td></tr><tr><td>C</td><td>3</td><td></td><td>E</td><td>6</td></tr><tr><td></td><td></td><td></td><td>F</td><td>2</td></tr></table>",c:"SELECT SUM(c2) AS ans\nFROM t2\nWHERE c1 IN (SELECT c1 FROM t1);",a:["5"],e:"t1의 c1은 A, B, C. t2에서 c1이 그 안에 있는 행은 A(4), B(1) → 4 + 1 = 5. NOT IN이었다면 E(6), F(2) → 8."},
{s:4,t:"sa",q:"현재 작업 디렉터리의 절대 경로가 /home/kim/project일 때, 상대 경로 \"../docs/a.txt\"의 절대 경로를 쓰시오.",a:["/home/kim/docs/a.txt"],e:"..은 상위 디렉터리(/home/kim)로 올라간다. 거기서 docs/a.txt → /home/kim/docs/a.txt."},
{s:4,t:"sa",q:"현재 작업 디렉터리의 절대 경로가 /var/log일 때, 상대 경로 \"./app/../sys\"의 절대 경로를 쓰시오.",a:["/var/log/sys","/var/log/sys/"],e:".은 현재 디렉터리, app으로 들어갔다가 ..으로 다시 나온 뒤 sys → /var/log/sys."},
{s:4,t:"sa",q:"Linux에서 파일 file.txt의 권한을 rw-r--r--로 바꾸려고 한다. 빈칸에 알맞은 숫자를 쓰시오.",c:"chmod (    ) file.txt",a:["644"],e:"rw- = 6, r-- = 4, r-- = 4."},
{s:4,t:"sa",q:"Linux에서 파일 안에서 특정 문자열이 들어 있는 줄만 찾아 출력하는 명령어를 쓰시오.",a:["grep"],e:"grep 문자열 파일명. 예) grep error log.txt"},
{s:4,t:"sa",q:"Linux 터미널에서 환경 변수를 설정해 하위 프로세스에서도 쓸 수 있게 하는 명령어를 쓰시오. (예: ( ) PATH=$PATH:/opt/bin)",a:["export"],e:"export. 설정된 값을 확인할 때는 echo $PATH."},
{s:3,t:"sa",q:"Oracle에서 현재 사용자가 소유한 테이블 목록을 조회하려고 한다. 빈칸 ①에 들어갈 데이터 사전 뷰 이름을 쓰시오.",c:"SELECT table_name FROM ( ① );",a:["USER_TABLES"],e:"USER_TABLES는 내 테이블, ALL_TABLES는 접근 가능한 테이블, DBA_TABLES는 전체 테이블. 컬럼은 USER_TAB_COLUMNS, 인덱스는 USER_INDEXES, 뷰는 USER_VIEWS."},
{s:3,t:"sa",q:"조회 속도를 높이려고 student 테이블의 name 컬럼에 idx_name을 만들려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.",c:"CREATE ( ① ) idx_name ON student(name);",a:["INDEX"],e:"CREATE INDEX 인덱스명 ON 테이블(컬럼). 중복을 막으려면 CREATE UNIQUE INDEX."},
{s:3,t:"sa",q:"student 테이블에서 dept가 'CS'인 행만 보여 주는 가상 테이블 v_cs를 만들려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.",c:"CREATE ( ① ) v_cs AS\nSELECT * FROM student WHERE dept = 'CS';",a:["VIEW"],e:"CREATE VIEW 뷰이름 AS SELECT …. 기존 테이블로 새 테이블을 만들 때는 CREATE TABLE 새테이블 AS SELECT …."},
{s:3,t:"sa",q:"다음 SQL을 실행했을 때 결과 행의 개수를 쓰시오.<table><tr><th>t1.c1</th><th></th><th>t2.c1</th></tr><tr><td>A</td><td></td><td>B</td></tr><tr><td>B</td><td></td><td>C</td></tr><tr><td>C</td><td></td><td>D</td></tr></table>",c:"SELECT c1 FROM t1\nUNION\nSELECT c1 FROM t2;",a:["4"],e:"UNION은 중복을 없앤 합집합: A, B, C, D → 4행. UNION ALL이면 6행, INTERSECT면 B, C → 2행."},
{s:3,t:"sa",q:"부서가 없는 사원까지 모든 사원을 출력하려고 한다. 빈칸 ①에 들어갈 키워드를 한 단어로 쓰시오.",c:"SELECT e.name, d.dname\nFROM emp e ( ① ) JOIN dept d\nON e.dept_id = d.id;",a:["LEFT","LEFT OUTER"],e:"LEFT (OUTER) JOIN은 왼쪽 테이블(emp)의 행을 모두 남기고, 짝이 없으면 오른쪽 컬럼을 NULL로 채운다."},
{s:3,t:"sa",q:"트랜잭션 도중 실행한 변경을 모두 취소하고 마지막으로 확정한 상태로 되돌리는 명령어를 쓰시오.",a:["ROLLBACK","ROLLBACK;"],e:"COMMIT은 변경 확정, ROLLBACK은 취소, SAVEPOINT는 중간 저장점(ROLLBACK TO 저장점)."}
]
,note:"## 실기 개요\n\n실기 과제명은 '프로그래밍 기초', 1시간 30분, 100점 만점에 60점 이상 합격이다. 2026년 큐넷 공지는 '작업형'이라고 했지만, 2027~2029년 출제기준표의 검정방법은 '필답형'이다. 공단 예시문제도 코드를 처음부터 짜는 문제가 아니라 답을 직접 써 넣는 단답형 11문항이었다.\n\n출제기준 실기 범위는 프로그래밍 언어 활용(구조적·객체지향·스크립트 언어, 오류 식별과 수정), 프로그래밍 언어 응용(언어 특성, 라이브러리), SQL 활용(데이터 사전, 조인·서브쿼리·집합 연산자, DDL, 트랜잭션, 인덱스, 뷰), SQL 작성(조회, 삽입·변경·삭제)이다. 4개 주요항목 중 2개가 SQL이라 SQL 비중이 크다. 구조적 언어(C 계열)도 범위에 들어 있으니 C를 완전히 빼지는 말자.\n\n| 예시문제 유형 | 묻는 것 |\n| --- | --- |\n| 경로 | 작업 폴더 기준 상대 경로 → 절대 경로 |\n| Linux 명령어 | 기능 설명 보고 명령어 고르기(pwd, chmod 등) |\n| Python 실행 결과 | 클래스·재귀(트리 순회) 출력 |\n| Python 빈칸 | 딕셔너리 메서드(items 등) |\n| Python 오류 찾기 | 오류 줄 번호 + 고친 뒤 실행 결과 |\n| Java 빈칸 | 인터페이스 구현 키워드 |\n| Java 실행 결과 | 문자열 ==, 생성자 this()·super() 호출 순서 |\n| SQL | LIKE 와일드카드, 테이블 삭제 쿼리, 서브쿼리 결과 |\n\n## 경로와 Linux\n\n- 절대 경로: `/`부터 시작하는 전체 경로. 상대 경로: 현재 위치 기준\n- `.`은 현재 디렉터리, `..`은 상위 디렉터리, `~`는 홈 디렉터리\n- 풀이: 작업 폴더에서 출발해 `..`마다 한 단계씩 올라가고, 나머지 이름을 차례로 붙인다\n- 예) 작업 폴더 `/a/b/c`, 상대 경로 `../../d` → `/a/d`\n- 자주 나오는 명령어: `pwd`(현재 경로), `cd`(이동), `ls`(목록), `cat`(내용 출력), `cp`(복사), `rm`(삭제), `chmod`(권한 변경), `vi`(편집기), `top`(실시간 프로세스·자원), `echo`(문자열·변수 출력), `export`(환경 변수 설정), `ifconfig`(네트워크 설정)\n\n## 코드 추적 요령\n\n1. 변수마다 칸을 만들고 줄이 바뀔 때마다 값을 적는다.\n2. 반복문은 i 값과 조건 결과를 한 줄씩 표로 적는다. 마지막 1회와 종료 조건을 특히 조심한다.\n3. 출력 형식을 그대로 쓴다. 공백, 줄바꿈, 소수점(`5.0`), 따옴표 유무까지 답이다.\n4. 함수 호출은 호출 스택을 적는다. 재귀는 가장 안쪽부터 값을 채워 올라온다.\n\n**자주 나오는 함정**\n\n- C·Java 정수 나눗셈은 몫만 남는다: `7 / 2 = 3`. Python `/`는 실수(`3.5`), `//`는 내림.\n- `x++`는 쓰고 나서 증가, `++x`는 증가하고 나서 사용.\n- Java `int + char`는 숫자 덧셈(`5 + 'H' = 77`). `\"\" + 5 + 'H'`처럼 문자열이 먼저 오면 연결(`5H`).\n- Java `==`는 참조 비교, `equals()`는 내용 비교.\n- 오버라이딩된 메서드는 실제 객체 기준으로 실행. static 변수는 모든 객체가 공유.\n- 예외가 나면 try의 나머지 줄은 건너뛰고 catch → finally 순서로 실행.\n- Python `b = a`는 같은 리스트를 가리킨다. 복사는 `a[:]`나 `a.copy()`.\n- Python 슬라이싱 끝 인덱스는 포함하지 않는다. `s[::-1]`은 뒤집기.\n- C 포인터 `*p`를 바꾸면 가리키는 변수도 바뀐다.\n- `switch`에 `break`가 없으면 아래 case까지 실행된다.\n\n## C 핵심\n\n- 출력: `printf(\"%d %c %s %f\\n\", 정수, 문자, 문자열, 실수)`, `%.2f` 소수 둘째 자리, `%5d` 5칸\n- 입력: `scanf(\"%d\", &a)` (변수 앞에 &)\n- 배열: `int a[5] = {1, 2, 3};` 나머지는 0. 인덱스 0부터\n- 문자열: `char s[] = \"abc\";` 끝에 `'\\0'`. `strlen`, `strcpy`, `strcmp`, `strcat`\n- 포인터: `int *p = &a;` `*p`는 값, `p + 1`은 다음 원소\n- 구조체: `s.x`, 포인터는 `p->x`\n- 함수: 값에 의한 호출이 기본. 원본을 바꾸려면 포인터 전달\n\n## Java 핵심\n\n- 출력: `System.out.print()`, `println()`은 줄바꿈 포함, `printf()`\n- 배열: `int[] a = new int[5];` 길이는 `a.length`, 문자열 길이는 `s.length()`\n- 향상된 for: `for (int v : arr)`\n- 클래스: 생성자, `this`, `super`, 상속 `extends`, 인터페이스 `implements`\n- 생성 순서: 부모 생성자 → 자식 생성자\n- 오버로딩(같은 이름, 다른 매개변수) / 오버라이딩(부모 메서드 재정의)\n- 문자열: `charAt(i)`, `substring(a, b)`(b 미포함), `indexOf`, `toUpperCase`, `split`\n- 예외: `try / catch / finally`, `throw`, `throws`\n\n## Python 핵심\n\n- 입출력: `input()`은 문자열. 숫자는 `int(input())`, 여러 개는 `map(int, input().split())`\n- 출력: `print(a, b, sep=\",\", end=\"\")`, f-string `f\"{a} + {b}\"`\n- 리스트: `append`, `insert`, `pop`, `remove`, `sort`, `len`, 슬라이싱\n- 딕셔너리: `d[k] = v`, `d.get(k)`, `keys()`, `values()`, `items()`\n- 집합: `|` 합집합, `&` 교집합, `-` 차집합\n- 컴프리헨션: `[x * 2 for x in range(5) if x > 1]`\n- 함수: `def`, 기본값, `return`, `lambda`\n- 클래스: `__init__(self)`, 상속 `class B(A):`\n\n## SQL 핵심\n\n| 분류 | 명령어 | 짝 키워드 |\n| --- | --- | --- |\n| DDL | CREATE, ALTER, DROP, TRUNCATE | ALTER TABLE ~ ADD |\n| DML | SELECT, INSERT, UPDATE, DELETE | INSERT INTO ~ VALUES, UPDATE ~ SET, DELETE FROM |\n| DCL | GRANT, REVOKE | GRANT ~ TO, REVOKE ~ FROM |\n| TCL | COMMIT, ROLLBACK, SAVEPOINT | |\n\n- SELECT 실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY\n- 정렬: `ORDER BY 열 ASC`(기본) / `DESC`\n- 그룹 조건은 HAVING, 행 조건은 WHERE\n- `LIKE '김%'` 김으로 시작, `'_a%'` 둘째 글자 a\n- `BETWEEN 1 AND 10`은 양 끝 포함, `IN (1, 2)`, `IS NULL`\n- 집계: `COUNT`, `SUM`, `AVG`, `MAX`, `MIN` (NULL 제외, `COUNT(*)`만 포함)\n- 조인: `A JOIN B ON A.키 = B.키`, LEFT/RIGHT/FULL OUTER JOIN\n- 집합 연산: `UNION`(중복 제거), `UNION ALL`(중복 포함), `INTERSECT`, `EXCEPT`/`MINUS`\n- 서브쿼리: `WHERE c1 IN (SELECT …)`, `NOT IN`, `EXISTS`. 안쪽 결과를 먼저 적고 대조\n- 데이터 사전(Oracle): `USER_TABLES`, `USER_TAB_COLUMNS`, `USER_CONSTRAINTS`, `USER_INDEXES`, `USER_VIEWS`\n- 인덱스: `CREATE [UNIQUE] INDEX 이름 ON 테이블(컬럼);`, 삭제 `DROP INDEX 이름;`\n- 뷰: `CREATE VIEW 이름 AS SELECT …;`, 기존 테이블로 새 테이블 `CREATE TABLE 새이름 AS SELECT …;`\n- 제약조건: `PRIMARY KEY`, `FOREIGN KEY … REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`\n- 수정: `ALTER TABLE 테이블 ADD 컬럼 타입;`, `MODIFY`, `DROP COLUMN`\n- 트랜잭션: `COMMIT`(확정), `ROLLBACK`(취소), `SAVEPOINT 이름` / `ROLLBACK TO 이름`\n\n## Linux 명령어 정리\n\n| 명령어 | 기능 |\n| --- | --- |\n| `ls -l` | 목록 자세히 |\n| `cd` / `pwd` | 이동 / 현재 위치 |\n| `mkdir` / `rmdir` / `rm -r` | 디렉터리 생성 / 빈 디렉터리 삭제 / 하위 포함 삭제 |\n| `cp` / `mv` | 복사 / 이동·이름 변경 |\n| `cat` / `head` / `tail` | 내용 출력 / 앞부분 / 뒷부분 |\n| `chmod` / `chown` | 권한 변경 / 소유자 변경 |\n| `ps` / `kill` | 프로세스 보기 / 종료 |\n| `grep` / `find` | 문자열 찾기 / 파일 찾기 |\n| `wc -l` | 줄 수 세기 |\n\n- 권한 숫자: r = 4, w = 2, x = 1. `rwxr-x---` = 750, `rw-r--r--` = 644\n- `>` 덮어쓰기, `>>` 이어쓰기, `|` 파이프 (`ps | grep java`)\n\n## 오류 찾기·빈칸 문제 요령\n\n1. 오류 찾기는 문법부터 본다: 들여쓰기, 콜론(`:`), 괄호 짝, 따옴표, `return`·`break`가 함수나 반복문 밖에 있는지.\n2. 오류 줄 번호를 물으면 원인이 되는 줄을 쓴다. 고친 뒤 실행 결과를 물으면 고친 코드로 끝까지 추적한다.\n3. 빈칸 키워드는 짝으로 외운다: `implements`(인터페이스 구현), `extends`(상속), `super`/`this`(생성자 호출), `items()`·`keys()`·`values()`(딕셔너리).\n4. SQL 서브쿼리는 안쪽 결과를 먼저 목록으로 적고, 바깥 조건(IN, NOT IN)을 하나씩 대조한다.\n5. 테이블 삭제: 구조까지 `DROP TABLE 이름`, 참조 제약까지 함께 `DROP TABLE 이름 CASCADE`, 데이터만 `TRUNCATE TABLE 이름`.\n6. 답은 출력 그대로 쓴다. 구분자(`/`, 공백), 따옴표, 대소문자까지 확인한다.\n\n## 트리 순회 (Python 예시 유형)\n\n| 순회 | 순서 | 출력 위치 |\n| --- | --- | --- |\n| 전위 | 루트 → 왼쪽 → 오른쪽 | 재귀 호출 전 |\n| 중위 | 왼쪽 → 루트 → 오른쪽 | 왼쪽 호출과 오른쪽 호출 사이 |\n| 후위 | 왼쪽 → 오른쪽 → 루트 | 재귀 호출 후 |\n\n- 출력문이 어디에 있는지 보고 순회 종류를 먼저 정한 뒤, 트리를 그림으로 그려 순서대로 적는다.\n",pass:(sc)=>sc>=60,rule:"60점 이상"},

{s:0,q:"다음 중 정성적 데이터에 해당하는 것은?",o:["월별 매출액","측정한 기온","설문조사의 주관식 응답","학생의 키"],a:2,e:"정성적 데이터는 언어·문자처럼 형태와 형식이 정해지지 않은 데이터다. 나머지는 수치로 표현되는 정량적 데이터."},
{s:0,q:"암묵지와 형식지의 상호작용에서, 개인의 암묵지를 언어나 문서 같은 형식지로 바꾸는 과정은?",o:["공통화","표출화","연결화","내면화"],a:1,e:"공통화(암묵지 공유) → 표출화(암묵지 → 형식지) → 연결화(형식지 결합) → 내면화(형식지 → 암묵지)."},
{s:0,q:"‘A마트 연필 100원, B마트 연필 200원’이라는 사실에서 ‘상대적으로 저렴한 A마트에서 연필을 사야겠다’고 판단했다. DIKW 피라미드에서 이 판단은?",o:["데이터","정보","지식","지혜"],a:2,e:"가격 자체는 데이터, ‘A마트가 더 싸다’는 정보, 이를 바탕으로 한 행동 판단은 지식. ‘A마트의 다른 상품도 쌀 것’처럼 창의적으로 넓히면 지혜."},
{s:0,q:"데이터베이스의 일반적인 특징이 아닌 것은?",o:["통합된 데이터","저장된 데이터","공용 데이터","독점 데이터"],a:3,e:"데이터베이스는 통합된·저장된·공용·변화되는 데이터의 특징을 가진다."},
{s:0,q:"빅데이터의 특징인 3V에 해당하지 않는 것은?",o:["Volume","Variety","Velocity","Visualization"],a:3,e:"3V는 규모(Volume), 다양성(Variety), 속도(Velocity). 4V일 때는 가치(Value)를 더한다."},
{s:0,q:"빅데이터가 만들어 낸 본질적인 변화로 옳지 않은 것은?",o:["사전 처리에서 사후 처리로","표본 조사에서 전수 조사로","양보다 질을 중시","인과관계에서 상관관계로"],a:2,e:"빅데이터 시대에는 질보다 양을 중시하는 방향으로 바뀌었다."},
{s:0,q:"빅데이터의 위기 요인 중 ‘데이터 오용’에 대한 통제 방안은?",o:["동의에서 책임으로","결과 기반 책임 원칙 고수","알고리즈미스트","개인정보 비식별화"],a:2,e:"데이터 오용 → 알고리즘 접근 허용과 알고리즈미스트. 사생활 침해 → 동의에서 책임으로. 책임 원칙 훼손 → 결과 기반 책임 원칙."},
{s:0,q:"데이터 사이언티스트의 역량 중 소프트 스킬이 아닌 것은?",o:["통찰력 있는 분석","설득력 있는 전달","다분야 간 협력","분석 기술의 숙련도"],a:3,e:"분석 기술 숙련도와 빅데이터 이론 지식은 하드 스킬이다."},
{s:0,q:"주민등록번호 뒷자리를 ‘*******’로 바꿔 보이지 않게 하는 비식별화 기법은?",o:["가명처리","총계처리","데이터 범주화","데이터 마스킹"],a:3,e:"데이터 마스킹은 개인 식별 정보 일부를 공백·별표 등으로 가린다. 범주화는 값을 구간으로 묶는 것(35세 → 30대)."},
{s:0,q:"원재료 조달부터 생산, 고객 배송까지 공급망 전체의 흐름을 관리하는 기업 정보 시스템은?",o:["ERP","CRM","SCM","BI"],a:2,e:"SCM(공급망 관리). ERP는 전사적 자원 관리, CRM은 고객 관계 관리, BI는 비즈니스 인텔리전스."},
{s:1,q:"분석 대상(What)은 알지만 분석 방법(How)을 모를 때의 분석 주제 유형은?",o:["최적화","솔루션","통찰","발견"],a:1,e:"대상·방법 모두 앎 = 최적화, 대상만 앎 = 솔루션, 방법만 앎 = 통찰, 둘 다 모름 = 발견."},
{s:1,q:"하향식 접근 방식의 분석 과제 발굴 순서로 옳은 것은?",o:["문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토","문제 정의 → 문제 탐색 → 타당성 검토 → 해결 방안 탐색","문제 탐색 → 해결 방안 탐색 → 문제 정의 → 타당성 검토","타당성 검토 → 문제 탐색 → 문제 정의 → 해결 방안 탐색"],a:0,e:"하향식: 문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토."},
{s:1,q:"상향식 접근 방식에 대한 설명으로 옳지 않은 것은?",o:["데이터 자체를 들여다보며 인사이트를 찾는다","비지도 학습 방법을 주로 활용한다","문제가 명확하게 정의되어 있을 때 사용한다","프로토타이핑 방식을 활용할 수 있다"],a:2,e:"문제가 명확할 때는 하향식 접근을 쓴다. 상향식은 문제 정의가 어려울 때 데이터에서 출발한다."},
{s:1,q:"KDD 분석 방법론의 절차로 옳은 것은?",o:["데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 해석·평가","전처리 → 데이터셋 선택 → 변환 → 데이터 마이닝 → 해석·평가","데이터셋 선택 → 변환 → 전처리 → 데이터 마이닝 → 해석·평가","업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가"],a:0,e:"KDD: 선택 → 전처리 → 변환 → 마이닝 → 해석·평가. ④는 CRISP-DM."},
{s:1,q:"CRISP-DM 방법론의 단계가 아닌 것은?",o:["업무 이해","데이터 준비","평가","데이터 변환"],a:3,e:"CRISP-DM: 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개. ‘데이터 변환’은 KDD 단계."},
{s:1,q:"빅데이터 분석 방법론 5단계 중 가장 먼저 수행하는 단계는?",o:["데이터 준비","분석 기획","데이터 분석","시스템 구현"],a:1,e:"분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개."},
{s:1,q:"분석 과제 우선순위를 정하는 사분면(시급성 × 난이도)에서 ‘현재 시급하고 난이도가 쉬운’ 과제가 속하는 사분면은?",o:["1사분면","2사분면","3사분면","4사분면"],a:2,e:"3사분면이 가장 먼저 수행할 과제다. 시급성 기준이면 3 → 4 → 2, 난이도 기준이면 3 → 1 → 2 순서."},
{s:1,q:"분석 마스터 플랜에서 ‘우선순위’를 정할 때 고려하는 요소가 아닌 것은?",o:["전략적 중요도","비즈니스 성과·ROI","실행 용이성","기술 적용 수준"],a:3,e:"기술 적용 수준은 우선순위가 아니라 ‘적용 범위·방식’을 정할 때 고려한다(업무 내재화, 분석 데이터, 기술 적용 수준)."},
{s:1,q:"분석 성숙도 모델의 단계를 순서대로 나열한 것은?",o:["도입 → 활용 → 확산 → 최적화","활용 → 도입 → 확산 → 최적화","도입 → 확산 → 활용 → 최적화","도입 → 활용 → 최적화 → 확산"],a:0,e:"도입 → 활용 → 확산 → 최적화."},
{s:1,q:"데이터 거버넌스의 구성 요소가 아닌 것은?",o:["원칙","조직","프로세스","알고리즘"],a:3,e:"데이터 거버넌스 구성 요소는 원칙(Principle), 조직(Organization), 프로세스(Process)."},
{s:2,q:"결측값이 하나라도 있는 레코드를 삭제하고, 값이 모두 있는 자료만으로 분석하는 결측값 처리 방법은?",o:["평균 대치법","단순 확률 대치법","다중 대치법","완전 분석법"],a:3,e:"완전 분석법은 간단하지만 자료가 줄어 효율성이 떨어진다. 평균 대치법은 평균으로 채우고, 다중 대치법은 대치 → 분석 → 결합의 3단계를 거친다."},
{s:2,q:"R의 reshape 패키지에서 데이터를 식별자(id), variable, value 형태의 긴 형식으로 바꾸는 함수는?",o:["cast","melt","merge","apply"],a:1,e:"melt로 녹인 뒤 cast로 원하는 모양(요약 테이블)으로 다시 만든다. 데이터 마트 구성에 쓰는 대표 함수."},
{s:2,q:"R에서 결측값(missing value)을 나타내는 것은?",o:["NULL","NaN","NA","Inf"],a:2,e:"결측값은 NA. NaN은 0/0 같은 계산 불가, NULL은 값이 없는 객체, Inf는 무한대."},
{s:2,q:"R에서 데이터프레임의 행 개수와 열 개수를 함께 알려 주는 함수는?",o:["length()","dim()","str()","nrow()"],a:1,e:"dim()은 (행, 열)을 반환한다. nrow()는 행 수만, str()은 구조를 보여 준다."},
{s:2,q:"섭씨온도처럼 간격은 의미가 있지만 절대 0점이 없는 척도는?",o:["명목척도","서열척도","등간척도","비율척도"],a:2,e:"등간척도는 더하기·빼기는 되지만 비율 비교(2배 덥다)는 안 된다. 키·무게처럼 절대 0이 있으면 비율척도."},
{s:2,q:"모집단을 서로 겹치지 않는 여러 계층으로 나누고, 각 계층에서 무작위로 표본을 뽑는 방법은?",o:["단순 무작위 추출","계통 추출","집락 추출","층화 추출"],a:3,e:"층화 추출. 집락 추출은 집단(집락)을 뽑아 그 안을 전부 조사한다."},
{s:2,q:"이상치(극단값)의 영향을 가장 적게 받는 대푯값은?",o:["산술평균","중앙값","범위","표준편차"],a:1,e:"중앙값은 순서상 가운데 값이라 극단값에 덜 민감하다."},
{s:2,q:"제1종 오류에 대한 설명으로 옳은 것은?",o:["귀무가설이 참인데 귀무가설을 기각하는 오류","귀무가설이 거짓인데 귀무가설을 채택하는 오류","대립가설이 참인데 대립가설을 채택하는 오류","표본 크기가 작아서 생기는 오류"],a:0,e:"제1종 오류(α): 참인 귀무가설을 기각. 제2종 오류(β): 거짓인 귀무가설을 채택."},
{s:2,q:"유의수준 0.05에서 검정한 결과 p-value가 0.01이었다. 올바른 판단은?",o:["귀무가설을 채택한다","귀무가설을 기각한다","대립가설을 기각한다","판단할 수 없다"],a:1,e:"p-value < 유의수준이면 귀무가설을 기각한다."},
{s:2,q:"두 변수가 모두 서열척도일 때 사용하는 상관계수는?",o:["피어슨 상관계수","스피어만 상관계수","결정계수","공분산"],a:1,e:"스피어만은 순위 기반(서열척도, 비선형 단조 관계). 피어슨은 등간·비율척도의 선형 관계."},
{s:2,q:"회귀모형의 결정계수(R²)가 0.8이라는 의미로 옳은 것은?",o:["독립변수와 종속변수의 상관계수가 0.8이다","종속변수 변동의 80%를 회귀모형이 설명한다","예측 정확도가 80%이다","회귀계수가 0.8이다"],a:1,e:"결정계수는 전체 변동 중 모형이 설명하는 비율(0~1). 단순회귀에서 상관계수의 제곱과 같다."},
{s:2,q:"회귀분석에서 독립변수 간 다중공선성을 진단하는 지표는?",o:["VIF","AIC","p-value","MSE"],a:0,e:"VIF(분산팽창요인)가 보통 10을 넘으면 다중공선성이 심하다고 본다."},
{s:2,q:"모든 독립변수를 넣은 모형에서 시작해 중요도가 낮은 변수를 하나씩 제거하는 변수 선택 방법은?",o:["전진 선택법","후진 제거법","단계적 선택법","라쏘 회귀"],a:1,e:"후진 제거법. 전진 선택법은 빈 모형에서 하나씩 추가, 단계적은 추가와 제거를 함께."},
{s:2,q:"평균이 일정하지 않은 비정상 시계열을 정상 시계열로 바꾸는 방법은?",o:["차분","로그 변환","이동 평균","정규화"],a:0,e:"평균이 일정하지 않으면 차분, 분산이 일정하지 않으면 변환(로그 등)을 한다."},
{s:2,q:"ARIMA(p, d, q) 모형에서 d가 의미하는 것은?",o:["자기회귀 차수","차분 횟수","이동평균 차수","계절 주기"],a:1,e:"p는 AR 차수, d는 차분 횟수, q는 MA 차수."},
{s:2,q:"주성분분석(PCA)에 대한 설명으로 옳지 않은 것은?",o:["변수의 차원을 줄이는 데 쓴다","주성분끼리는 서로 상관관계가 없다","첫 번째 주성분이 분산을 가장 많이 설명한다","종속변수를 예측하는 지도학습 기법이다"],a:3,e:"PCA는 종속변수 없이 변수들의 구조를 요약하는 비지도 기법이다."},
{s:2,q:"세 개 이상 집단의 평균 차이를 검정하는 방법은?",o:["독립표본 t-검정","대응표본 t-검정","분산분석(ANOVA)","카이제곱 검정"],a:2,e:"두 집단은 t-검정, 세 집단 이상은 분산분석(F-검정)."},
{s:2,q:"두 범주형 변수가 서로 독립인지 검정하는 방법은?",o:["카이제곱 검정","t-검정","회귀분석","Shapiro-Wilk 검정"],a:0,e:"교차표로 정리한 뒤 카이제곱 독립성 검정을 한다. Shapiro-Wilk는 정규성 검정."},
{s:2,q:"다음 중 지도학습 기법이 아닌 것은?",o:["의사결정나무","로지스틱 회귀","인공신경망","K-평균 군집"],a:3,e:"K-평균 군집은 정답(레이블) 없이 묶는 비지도학습이다."},
{s:2,q:"로지스틱 회귀분석에 대한 설명으로 옳은 것은?",o:["종속변수가 연속형일 때 사용한다","종속변수가 범주형(예: 0/1)일 때 사용한다","독립변수는 반드시 범주형이어야 한다","출력값이 -∞~∞ 범위이다"],a:1,e:"로지스틱 회귀는 시그모이드 함수로 0~1 확률을 출력해 범주를 분류한다."},
{s:2,q:"분류나무(목표변수가 범주형)의 분리 기준이 아닌 것은?",o:["지니 지수","엔트로피 지수","카이제곱 통계량의 p-value","분산 감소량"],a:3,e:"분산 감소량과 F 통계량은 회귀나무(목표변수가 연속형)의 분리 기준이다."},
{s:2,q:"약한 학습기를 순차적으로 학습시키면서 이전에 잘못 분류한 데이터에 더 큰 가중치를 주는 앙상블 기법은?",o:["배깅","부스팅","랜덤 포레스트","보팅"],a:1,e:"부스팅(AdaBoost, GBM 등). 배깅과 랜덤 포레스트는 부트스트랩 표본으로 병렬 학습한다."},
{s:2,q:"혼동행렬에서 TP = 40, FP = 10, FN = 20, TN = 30일 때 정밀도(Precision)는?",o:["0.67","0.7","0.75","0.8"],a:3,e:"정밀도 = TP / (TP + FP) = 40 / 50 = 0.8. 재현율은 40/60 ≈ 0.67, 정확도는 70/100 = 0.7."},
{s:2,q:"ROC 곡선에 대한 설명으로 옳은 것은?",o:["x축은 민감도, y축은 특이도이다","AUC가 1에 가까울수록 좋은 모형이다","AUC가 0.5이면 완벽한 모형이다","회귀모형 평가에 주로 쓴다"],a:1,e:"x축은 1 − 특이도(FPR), y축은 민감도(TPR). AUC 0.5는 무작위 수준이다."},
{s:2,q:"과대적합(Overfitting)을 줄이는 방법이 아닌 것은?",o:["가지치기","교차 검증","정규화(규제)","모델의 복잡도를 높이기"],a:3,e:"복잡도를 높이면 과대적합이 더 심해진다. 학습 데이터를 늘리거나 드롭아웃을 쓰는 것도 방법이다."},
{s:2,q:"계층적 군집에서 군집을 합칠 때 군집 내 오차제곱합의 증가량이 최소가 되도록 하는 연결법은?",o:["최단 연결법","최장 연결법","평균 연결법","와드 연결법"],a:3,e:"와드 연결법. 최단은 가장 가까운 점 사이 거리, 최장은 가장 먼 점 사이 거리를 기준으로 한다."},
{s:2,q:"K-평균 군집에 대한 설명으로 옳지 않은 것은?",o:["군집 수 K를 미리 정해야 한다","초기 중심값에 따라 결과가 달라질 수 있다","이상치에 강건하다","거리 기반으로 군집을 나눈다"],a:2,e:"K-평균은 평균을 중심으로 쓰기 때문에 이상치에 민감하다. 이를 보완한 것이 K-medoids."},
{s:2,q:"전체 거래 100건 중 A 포함 40건, B 포함 50건, A와 B 동시 포함 20건이다. 연관규칙 A → B의 향상도(Lift)는?",o:["0.5","1","1.25","2"],a:1,e:"신뢰도 = 20/40 = 0.5, P(B) = 50/100 = 0.5, 향상도 = 0.5 / 0.5 = 1. 향상도 1이면 A와 B는 서로 독립."},
{s:2,q:"인공신경망에서 여러 범주 중 하나로 분류하는 출력층에 주로 쓰는 활성화 함수는?",o:["계단 함수","ReLU","소프트맥스","부호 함수"],a:2,e:"소프트맥스는 출력값을 합이 1인 확률로 바꿔 다중 분류에 쓴다."},
{s:2,q:"변수 간의 상관관계(공분산)를 고려해 계산하는 거리는?",o:["유클리드 거리","맨해튼 거리","마할라노비스 거리","민코프스키 거리"],a:2,e:"마할라노비스 거리는 공분산 행렬을 반영해 변수의 척도와 상관을 보정한다."}
]
.map(q=>({...q,t:"mc"})),note:"## 시험 개요\n\nADsP(데이터분석 준전문가)는 한국데이터산업진흥원이 시행하는 국가공인 민간자격이다. 실기 없이 필기만 있고, 객관식 50문항을 90분 동안 푼다. 총점 60점 이상이면서 과목별로 40% 이상 맞혀야 한다(과락). 이 앱의 모의고사는 문항당 2점으로 계산한다.\n\n| 과목 | 문항 | 과락 기준 |\n| --- | --- | --- |\n| 1. 데이터 이해 | 10 | 4문항 미만 |\n| 2. 데이터 분석 기획 | 10 | 4문항 미만 |\n| 3. 데이터 분석 | 30 | 12문항 미만 |\n\n배점과 과락 기준은 회차별 공고(dataq.or.kr)로 꼭 확인하자.\n\n## 1과목 데이터 이해\n\n### 데이터와 정보\n\n- 정량적 데이터: 수치·기호(정형). 정성적 데이터: 언어·문자(비정형)\n- 암묵지(체화된 지식) ↔ 형식지(문서화된 지식)\n- 지식 창조(SECI): 공통화(암묵→암묵) → 표출화(암묵→형식) → 연결화(형식→형식) → 내면화(형식→암묵)\n- DIKW: 데이터(사실) → 정보(의미·관계) → 지식(정보를 구조화해 판단) → 지혜(창의적 아이디어)\n\n### 데이터베이스\n\n- 특징: 통합된, 저장된, 공용, 변화되는 데이터\n- 일반적 특징: 정보 축적·전달, 이용, 기술 발전, 경제·산업적 측면\n- 기업 시스템: ERP(전사적 자원), CRM(고객 관계), SCM(공급망), KMS(지식 관리), BI(의사결정 지원), OLTP(실시간 거래 처리), OLAP(다차원 분석)\n- 데이터 웨어하우스 특징: 주제 지향, 통합, 시계열, 비휘발\n\n### 빅데이터\n\n- 3V: Volume(규모), Variety(다양성), Velocity(속도). 4V에 Value(가치) 추가\n- 본질적 변화: 사전 처리 → 사후 처리, 표본 조사 → 전수 조사, 질 → 양, 인과관계 → 상관관계\n- 빅데이터 가치 산정이 어려운 이유: 데이터 활용 방식 다양, 새로운 가치 창출, 분석 기술 발전\n- 활용 기본 테크닉: 연관 규칙, 유형 분석(분류), 유전 알고리즘, 기계 학습, 회귀 분석, 감정 분석, 소셜 네트워크 분석\n\n| 위기 요인 | 통제 방안 |\n| --- | --- |\n| 사생활 침해 | 동의에서 책임으로 |\n| 책임 원칙 훼손 | 결과 기반 책임 원칙 고수 |\n| 데이터 오용 | 알고리즘 접근 허용, 알고리즈미스트 |\n\n- 빅데이터 비즈니스 모델: 데이터 활용으로 투명성 제고, 고객 세분화, 의사결정 지원·대체, 새로운 비즈니스 모델·제품·서비스 창출\n- 미래의 빅데이터: 모든 것의 데이터화(사물인터넷, 웨어러블), 분석 기술의 진화(인공지능, 딥러닝), 인력(데이터 사이언티스트, 알고리즈미스트)\n\n### 데이터 사이언스\n\n- 데이터 사이언티스트 하드 스킬: 빅데이터 이론 지식, 분석 기술 숙련\n- 소프트 스킬: 통찰력 있는 분석(창의적 사고, 호기심), 설득력 있는 전달(스토리텔링, 시각화), 다분야 간 협력\n- 비식별화 기법: 가명처리(이름 → 임의값), 총계처리(합계·평균만), 데이터 삭제, 데이터 범주화(35세 → 30대), 데이터 마스킹(일부 가림)\n\n## 2과목 데이터 분석 기획\n\n### 분석 기획\n\n| 분석 주제 유형 | 분석 대상(What) | 분석 방법(How) |\n| --- | --- | --- |\n| 최적화 | 앎 | 앎 |\n| 솔루션 | 앎 | 모름 |\n| 통찰 | 모름 | 앎 |\n| 발견 | 모름 | 모름 |\n\n- 분석 기획 시 고려사항: 가용 데이터, 적절한 유스케이스, 장애 요소\n- 하향식 접근: 문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토(경제적·데이터·기술적)\n- 상향식 접근: 데이터에서 출발, 비지도 학습, 디자인 사고(발산), 프로토타이핑\n- 문제 탐색 도구: 비즈니스 모델 캔버스(업무·제품·고객·규제와 감사·지원 인프라), 분석 기회 발굴 범위 확장(거시·경쟁자·시장 니즈·역량)\n\n### 분석 방법론\n\n- KDD: 데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 해석·평가\n- CRISP-DM: 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개 (단계 사이 피드백 가능)\n- 빅데이터 분석 방법론: 분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개 (단계-태스크-스텝 3계층)\n- 방법론 모델: 폭포수(순차), 프로토타입(빠른 시제품), 나선형(반복 + 위험 분석)\n\n### 분석 과제 관리와 마스터 플랜\n\n- 분석 과제 관리 5영역: 데이터 크기, 데이터 복잡도, 속도, 분석 복잡도, 정확도·정밀도\n- ROI 관점 4V: 투자 비용(Volume, Variety, Velocity) + 비즈니스 효과(Value)\n- 우선순위 사분면(시급성 × 난이도): 3사분면(현재 시급, 쉬움)이 최우선. 시급성 기준 3 → 4 → 2, 난이도 기준 3 → 1 → 2\n- 마스터 플랜 우선순위 고려: 전략적 중요도, 비즈니스 성과·ROI, 실행 용이성\n- 적용 범위·방식 고려: 업무 내재화 적용 수준, 분석 데이터 적용 수준, 기술 적용 수준\n\n### 분석 거버넌스\n\n- 구성 요소: 조직, 프로세스, 시스템, 데이터, 분석 관련 교육·마인드 육성\n- 분석 성숙도: 도입 → 활용 → 확산 → 최적화\n- 분석 준비도 6영역: 분석 업무, 분석 인력·조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라\n- 분석 조직 구조: 집중형(전담 조직), 기능 중심형(각 부서), 분산형(전담 인력을 부서에 배치)\n- 데이터 거버넌스 구성 요소: 원칙, 조직, 프로세스. 체계: 데이터 표준화 → 데이터 관리 체계 → 데이터 저장소 관리 → 표준화 활동\n\n## 3과목 데이터 분석\n\n### R 기초\n\n- 대입 `\u003c-`, 벡터 `c(1, 2, 3)`, 인덱스는 1부터, 음수 인덱스는 제외(`x[-1]`)\n- 결측값 `NA`, 계산 불가 `NaN`, 빈 객체 `NULL`. `is.na()`, `na.rm = TRUE`\n- 자료 구조: 벡터, 행렬(`matrix`), 배열, 리스트, 데이터프레임(`data.frame`)\n- 함수: `dim()`, `nrow()`, `ncol()`, `str()`, `summary()`, `head()`, `seq()`, `rep()`, `apply()`\n\n### 데이터 마트, 결측값, 이상값\n\n- 데이터 마트: 데이터 웨어하우스에서 특정 부서·목적에 맞게 뽑아낸 작은 저장소. 분석용 요약 변수(기간별 구매 금액 등)와 파생 변수(근무 시간대 구매 여부 등)를 만든다\n- R 패키지: `reshape`(`melt`로 녹이고 `cast`로 재구성), `sqldf`(R에서 SQL 사용), `plyr`(`ddply` 등 split-apply-combine), `data.table`(빠른 데이터프레임)\n- 결측값 처리: 완전 분석법(결측 행 삭제), 평균 대치법, 단순 확률 대치법(Hot-deck, 비슷한 다른 관측값으로), 다중 대치법(대치 → 분석 → 결합)\n- R 함수: `is.na()`, `complete.cases()`, `na.omit()`, `mean(x, na.rm = TRUE)`\n- 이상값 판단: ESD(평균 ± 3 표준편차 밖), 상자 그림(Q1 − 1.5×IQR, Q3 + 1.5×IQR 밖). 이상값이라고 무조건 지우지 않고 원인과 분석 목적을 보고 판단한다\n\n### 통계 기초\n\n- 척도: 명목(성별), 서열(학점), 등간(섭씨온도, 0이 절대값 아님), 비율(키, 무게)\n- 표본 추출: 단순 무작위, 계통(일정 간격), 집락(집단 단위 선택), 층화(계층별 무작위)\n- 대푯값: 평균(이상치에 민감), 중앙값(덜 민감), 최빈값\n- 산포도: 분산, 표준편차, 범위, 사분위수 범위(IQR = Q3 − Q1)\n- 이상치 기준(상자 그림): Q1 − 1.5×IQR 미만 또는 Q3 + 1.5×IQR 초과\n\n### 가설 검정\n\n- 귀무가설(H0, 차이 없음) vs 대립가설(H1, 차이 있음)\n- 제1종 오류(α): 참인 H0를 기각 / 제2종 오류(β): 거짓인 H0를 채택. 검정력 = 1 − β\n- p-value \u003c 유의수준(보통 0.05) → H0 기각\n- 모수 검정: t-검정(두 집단 평균), 분산분석(세 집단 이상), 카이제곱(범주형 독립성)\n- 비모수 검정: 부호 검정, 윌콕슨 순위합, 만-위트니, 크루스칼-왈리스\n- 정규성 검정: Shapiro-Wilk, Q-Q plot\n\n### 상관과 회귀\n\n- 상관계수 범위 −1 ~ 1. 피어슨(선형, 등간·비율), 스피어만(순위, 서열)\n- 회귀 가정: 선형성, 독립성, 등분산성, 정규성\n- 결정계수 R²: 종속변수 변동 중 모형이 설명하는 비율(0~1)\n- 수정 결정계수: 변수 수가 늘어나는 것을 보정\n- 다중공선성: 독립변수끼리 강한 상관. VIF > 10이면 의심\n- 변수 선택: 전진 선택, 후진 제거, 단계적 선택. 평가 지표 AIC, BIC(작을수록 좋음)\n- 규제: 릿지(L2, 계수 축소), 라쏘(L1, 일부 계수를 0으로 → 변수 선택)\n\n### 시계열과 차원 축소\n\n- 정상성: 평균·분산이 일정하고 공분산이 시차에만 의존\n- 평균이 변하면 차분, 분산이 변하면 변환(로그)\n- AR(자기회귀), MA(이동평균), ARIMA(p, d, q): d는 차분 횟수\n- 분해 요인: 추세, 계절, 순환, 불규칙\n- 주성분분석(PCA): 상관 없는 주성분으로 차원 축소. 스크리 플롯·누적 기여율 80% 이상으로 개수 결정\n- 다차원 척도법(MDS): 개체 사이 거리(유사성)를 저차원 공간에 점으로 나타낸다. 적합도는 스트레스 값(0에 가까울수록 좋음)\n- 다변량 분석 정리: 다중회귀, 주성분분석, 다차원 척도법, 요인분석, 판별분석\n\n### 정형 데이터 마이닝\n\n- 지도학습: 의사결정나무, 회귀, 로지스틱 회귀, 인공신경망, SVM, KNN, 앙상블\n- 비지도학습: 군집(K-평균, 계층적, SOM), 연관 분석, PCA\n- 데이터 분할: 훈련 / 검증 / 테스트. 홀드아웃, K-fold 교차 검증, 부트스트랩\n- 로지스틱 회귀: 시그모이드로 0~1 확률 출력, 오즈비 해석\n- 의사결정나무: 분류나무(지니 지수, 엔트로피, 카이제곱 p-value), 회귀나무(분산 감소량, F 통계량). 과대적합은 가지치기로\n- 앙상블: 배깅(부트스트랩 병렬), 부스팅(오분류 가중, 순차), 랜덤 포레스트(배깅 + 변수 무작위 선택)\n- 인공신경망 활성화 함수: 시그모이드, tanh, ReLU, 소프트맥스(다중 분류 출력)\n\n### 모형 평가\n\n| 지표 | 식 |\n| --- | --- |\n| 정확도 | (TP + TN) / 전체 |\n| 정밀도 | TP / (TP + FP) |\n| 재현율(민감도) | TP / (TP + FN) |\n| 특이도 | TN / (TN + FP) |\n| F1 점수 | 2 × 정밀도 × 재현율 / (정밀도 + 재현율) |\n\n- ROC 곡선: x축 FPR(1 − 특이도), y축 TPR(민감도). AUC가 1에 가까울수록 좋고 0.5는 무작위 수준\n- 이익 도표(Gain chart), 향상도 곡선(Lift chart)도 분류 모형 평가에 쓴다\n\n### 군집 분석\n\n- 거리: 유클리드, 맨해튼, 민코프스키, 마할라노비스(공분산 반영), 범주형은 자카드\n- 계층적 군집 연결법: 최단(single), 최장(complete), 평균, 중심, 와드(오차제곱합 증가 최소)\n- K-평균: K를 미리 지정, 초기 중심에 민감, 이상치에 민감. 보완: K-medoids\n- 군집 평가: 실루엣 계수(1에 가까울수록 좋음)\n- 혼합 분포 군집: EM 알고리즘. SOM: 고차원 → 2차원 지도\n\n### 연관 분석\n\n- 지지도 = A와 B 동시 포함 / 전체\n- 신뢰도 = A와 B 동시 포함 / A 포함 = P(B | A)\n- 향상도 = 신뢰도 / P(B). 1이면 독립, 1보다 크면 양의 관계, 1보다 작으면 음의 관계\n- Apriori 알고리즘: 최소 지지도 이상인 빈발 항목만 확장. FP-Growth는 트리로 더 빠르게\n",pass:(sc,per)=>sc>=60&&per.every(([r,t])=>r/t>=0.4),rule:"60점 이상, 과목별 40% 이상"}
};

function inline(s){
  return s.split(/(`[^`]+`)/).map(p=>p.length>1&&p.startsWith("`")&&p.endsWith("`")?`<code>${esc(p.slice(1,-1))}</code>`:
    esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')).join("");
}
function md(src){
  const L=src.split("\n"),out=[];let i=0;
  const cells=r=>{const s=r.trim().replace(/^\|/,"").replace(/\|$/,"");const o=[];let c="",bt=false;for(const ch of s){if(ch==="`")bt=!bt;if(ch==="|"&&!bt){o.push(c.trim());c=""}else c+=ch}o.push(c.trim());return o};
  while(i<L.length){
    const l=L[i];
    if(l.startsWith("```")){const b=[];i++;while(i<L.length&&!L[i].startsWith("```"))b.push(L[i++]);i++;out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`);continue}
    if(/^### /.test(l)){out.push(`<h3>${inline(l.slice(4))}</h3>`);i++;continue}
    if(/^## /.test(l)){out.push(`<h2>${inline(l.slice(3))}</h2>`);i++;continue}
    if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].startsWith("|"))rows.push(L[i++]);const h=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push(`<div class="tw"><table><tr>${h.map(c=>`<th>${inline(c)}</th>`).join("")}</tr>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);continue}
    if(/^- /.test(l)){const it=[];while(i<L.length&&/^- /.test(L[i]))it.push(L[i++].slice(2));out.push(`<ul>${it.map(t=>t.startsWith("[ ] ")?`<li class="ck">☐ ${inline(t.slice(4))}</li>`:`<li>${inline(t)}</li>`).join("")}</ul>`);continue}
    if(/^\d+\. /.test(l)){const it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push(L[i++].replace(/^\d+\. /,""));out.push(`<ol>${it.map(t=>`<li>${inline(t)}</li>`).join("")}</ol>`);continue}
    if(l.trim()){const p=[];while(i<L.length&&L[i].trim()&&!/^(#|\||- |\d+\. |```)/.test(L[i]))p.push(L[i++]);out.push(`<p>${inline(p.join(" "))}</p>`);continue}
    i++;
  }
  return out.join("");
}

/* ---------- 문항 입력 ---------- */
function answerBox(q,v,locked,cls=""){
  if(q.t==="mc")return `<div class="opts">${q.o.map((o,i)=>`<button class="opt ${cls?cls(i):v===i?"on":""}" data-o="${i}"${locked?" disabled":""}><span class="n">${locked?N[i]:i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  if(q.t==="sa")return `<label class="note" for="ans">답 입력</label><input class="search" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(typeof v==="string"?v:"")}"${locked?" disabled":""} placeholder="정답을 입력하세요">`;
  return `<label class="note" for="ans">내 코드 (실행되지 않아요. 모범 답안과 비교해 직접 채점)</label><textarea class="code" id="ans" spellcheck="false" autocapitalize="off"${locked?" disabled":""} placeholder="여기에 코드를 작성하세요">${esc(typeof v==="string"?v:"")}</textarea>`;
}
const model=q=>q.t==="mc"?`정답 ${N[q.a]}`:q.t==="sa"?`정답: <code>${esc(q.a[0])}</code>`:`모범 답안`;
const explain=q=>`<div class="ex"><b>${model(q)}</b>${q.t==="cd"?`<pre>${esc(q.a)}</pre>`:"<br>"}${esc(q.e)}</div>`;

  <p class="note">틀린 문제는 오답노트에 자동으로 모여요.</p></div>${foot('<button class="pri" id="st">시험 시작</button>')}`;
    bindBack("");$("st").onclick=()=>{const qs=e.mockN?e.subj.flatMap((_,s)=>shuffle(e.Q.filter(q=>q.s===s)).slice(0,e.mockN[s])):e.Q;exams[k]={qs,ans:qs.map(q=>q.t==="mc"?-1:""),cur:0,left:e.limit,done:false,self:{},wo:false};examView(k)};return}

  const keep=()=>{const a=$("ans");if(a)x.ans[x.cur]=a.value};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o;x.ans[x.cur]=x.ans[x.cur]===i?-1:i;examView(k)});

    dlg.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{x.cur=+b.dataset.j;close();examView(k);scrollTo(0,0)});$("cx").onclick=close};
  $("sb").onclick=()=>{keep();const u=T-x.qs.filter((qq,i)=>answered(qq,x.ans[i])).length;modal(`<h2>답안을 제출할까요?</h2><p>${u?`답하지 않은 문제가 <b>${u}개</b> 있어요. `:""}제출하면 고칠 수 없어요.</p><div class="btns"><button id="cx">계속 풀기</button><button class="pri" id="ok">제출</button></div>`);
    $("cx").onclick=close;$("ok").onclick=()=>{close();finish(k,false)}};
}
function grade(k){
  const e=EX[k],x=exams[k];
  const ok=x.qs.map((q,i)=>q.t==="cd"?x.self[i]===true:isRight(q,x.ans[i]));
  const per=e.subj.map((_,s)=>{const idx=x.qs.map((q,i)=>q.s===s?i:-1).filter(i=>i>=0);return [idx.filter(i=>ok[i]).length,idx.length]});
  const right=ok.filter(Boolean).length,score=Math.round(right/x.qs.length*100);
  return {ok,per,right,score,pass:e.pass(score,per)};
}
function finish(k,auto){
  const e=EX[k],x=exams[k];if(!x||x.done)return;
  if(location.hash==="#exam-"+k){const a=$("ans");if(a)x.ans[x.cur]=a.value}
  x.done=true;x.auto=auto;x.used=e.limit-Math.max(x.left,0);
  const g=grade(k);
  addWrong(x.qs.filter((q,i)=>q.t!=="cd"&&!g.ok[i]).map(q=>q.id));
  x.h={t:Date.now(),ex:k,mode:"exam",label:"실전 모의고사",score:g.score,right:g.right,total:x.qs.length,pass:g.pass};pushHist(x.h);save();
  if(location.hash==="#exam-"+k)result(k);
}
function result(k){
  const e=EX[k],x=exams[k],g=grade(k),hasCd=x.qs.some(q=>q.t==="cd");

  ${g.per.map(([r,t],s)=>`<div class="bar"><span>${esc(e.subj[s])}</span><i><s style="width:${r/t*100}%;${k==="ad"&&r/t<0.4?"background:var(--hot)":""}"></s></i><span>${r}/${t}</span></div>`).join("")}
  <p class="note" style="margin:12px 0 0">합격 기준: ${esc(e.rule)}.${hasCd?" 코딩 문제는 아래에서 직접 채점하면 점수에 반영돼요.":""} 틀린 문제는 오답노트에 추가됐어요.</p></div>
  <div class="chips"><button class="${x.wo?"":"on"}" data-w="0">전체</button><button class="${x.wo?"on":""}" data-w="1">틀린 문제만</button></div>
  ${list.map(({q,i})=>reviewCard(q,x.ans[i],g.ok[i],i,x.self[i])).join("")||'<p class="empty">틀린 문제가 없어요.</p>'}`;

  app.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.self.split(":");x.self[+i]=v==="1";
    const q=x.qs[+i];if(v==="1")delete data.wrong[q.id];else addWrong([q.id]);
    const ng=grade(k);Object.assign(x.h,{score:ng.score,right:ng.right,pass:ng.pass});save();result(k)});
  $("nw").onclick=()=>{delete exams[k];examView(k)};

function reviewCard(q,v,ok,i,self){
  const st=q.t==="cd"?(self===undefined?"m":ok?"ok":""):(ok?"ok":answered(q,v)?"":"m");
  const lab=q.t==="cd"?(self===undefined?"채점 필요":ok?"맞음":"틀림"):ok?"정답":answered(q,v)?"오답":"미응답";
  let body="";
  if(q.t==="mc")body=answerBox(q,v,true,k=>k===q.a?"o":k===v?"x":"");
  else body=`<div class="ex" style="background:var(--bg)"><b>내 답</b>${q.t==="cd"?`<pre>${esc(v||"(작성 안 함)")}</pre>`:` <code>${esc(v||"(빈칸)")}</code>`}</div>`;
  return `<article class="card"><div class="subj"><span class="tag ${st}">${lab}</span>${tagEx(q.ex)} ${esc(EX[q.ex].subj[q.s])} · ${q.n}번</div>
  <div class="qt">${qhtml(q)}</div>${body}${explain(q)}
  ${q.t==="cd"?`<div class="btns"><button data-self="${i}:0" class="${self===false?"on":""}">틀렸어요</button><button data-self="${i}:1" class="${self===true?"pri":""}">맞았어요</button></div>`:""}</article>`;
}

/* ---------- 연습·오답 재풀이 ---------- */
let pr=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function practice(key){
  const m=key.match(/^(prac|retry)-(pf|ps|ad)(?:-(\d|all))?$/);if(!m)return home();
  const [,mode,k,sub]=m,e=EX[k];
  if(!pr||pr.key!==key){
    const ids=mode==="retry"?wrongIds(k):sub==="all"?shuffle(e.Q.map(q=>q.id)):e.Q.filter(q=>q.s===+sub-1).map(q=>q.id);
    pr={key,ids,i:0,pick:{},right:0,saved:false};
  }
  const title=mode==="retry"?`${e.tag} 오답 다시 풀기`:sub==="all"?`${e.tag} 전체 연습`:`${e.subj[+sub-1]}`;
  setTabs("home",false);
  if(!pr.ids.length){setTabs("home");app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)}</h1></div><p class="empty">오답이 없어요. 모의고사나 연습을 먼저 풀어 보세요.</p>`;bindBack();return}
  if(pr.i>=pr.ids.length){
    const sc=Math.round(pr.right/pr.ids.length*100);
    if(!pr.saved){pr.saved=true;pushHist({t:Date.now(),ex:k,mode:"prac",label:title,score:sc,right:pr.right,total:pr.ids.length,pass:sc>=60});save()}
    setTabs("home");
    app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)}</h1></div><div class="card" style="text-align:center"><div class="big ${sc>=60?"pass":"fail"}">${sc}</div><p>${pr.ids.length}문항 중 ${pr.right}문항 정답</p>
    <p class="note">${mode==="retry"?`맞힌 문제는 오답노트에서 뺐어요. 남은 오답 ${wrongIds(k).length}개.`:"틀린 문제는 오답노트에 추가됐어요."}</p></div>
    ${foot(`<button data-h="">홈으로</button><button class="pri" id="ag">다시 풀기</button>`)}`;
    bindBack();bindGo();$("ag").onclick=()=>{pr=null;practice(key)};return;
  }
  const q=QID[pr.ids[pr.i]],m2=pr.pick[pr.i],done=m2!==undefined,w=data.wrong[q.id];
  const ok=done&&(q.t==="cd"?m2.self===true:isRight(q,m2.v));
  app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)} · ${pr.i+1}/${pr.ids.length}</h1></div><div class="prog"><i style="width:${pr.i/pr.ids.length*100}%"></i></div>
  <div class="card"><div class="subj">${tagEx(k)} ${esc(e.subj[q.s])} · ${q.n}번${w?` · <span class="fail">${w.n}회 틀림</span>`:""}</div><div class="qt">${qhtml(q)}</div>
  ${q.t==="mc"?answerBox(q,done?m2.v:-1,done,done?(i=>i===q.a?"o":i===m2.v?"x":""):""):answerBox(q,done?m2.v:"",done)}
  ${done?(q.t==="cd"?explain(q)+(m2.self===undefined?`<p class="note" style="margin-top:12px">모범 답안과 비교해 직접 채점하세요.</p><div class="btns"><button id="sf0">틀렸어요</button><button class="pri" id="sf1">맞았어요</button></div>`:`<p class="${ok?"pass":"fail"}" style="font-weight:700;margin:12px 0 0">${ok?"맞았어요":"틀렸어요 · 오답노트에 추가"}</p>`)
    :`<div class="ex"><b class="${ok?"pass":"fail"}">${ok?"정답이에요":"오답이에요"}</b>${q.t==="sa"?` · 내 답 <code>${esc(m2.v||"(빈칸)")}</code>`:""}<br><b>${model(q)}</b><br>${esc(q.e)}</div>`):""}</div>
  ${foot(done?(q.t==="cd"&&m2.self===undefined?`<button id="sk">건너뛰기</button>`:`<button class="pri" id="nx">${pr.i+1<pr.ids.length?"다음 문제 ›":"결과 보기"}</button>`)
    :(q.t==="mc"?`<button id="sk">건너뛰기</button>`:`<button id="sk">건너뛰기</button><button class="pri" id="ck">${q.t==="cd"?"모범 답안 보기":"채점하기"}</button>`))}`;
  bindBack();
  const mark=(right)=>{if(right){pr.right++;if(mode==="retry")delete data.wrong[q.id]}else addWrong([q.id]);save()};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const v=+b.dataset.o;pr.pick[pr.i]={v};mark(v===q.a);practice(key)});
  if($("ck"))$("ck").onclick=()=>{const v=$("ans").value;pr.pick[pr.i]={v};if(q.t==="sa")mark(isRight(q,v));practice(key)};
  const a=$("ans");if(a&&!done&&q.t==="sa")a.onkeydown=ev=>{if(ev.key==="Enter")$("ck").click()};
  if($("sf0"))$("sf0").onclick=()=>{m2.self=false;mark(false);practice(key)};
  if($("sf1"))$("sf1").onclick=()=>{m2.self=true;mark(true);practice(key)};
  if($("nx"))$("nx").onclick=()=>{pr.i++;practice(key);scrollTo(0,0)};
  if($("sk"))$("sk").onclick=()=>{if(!done||q.t!=="cd"){pr.pick[pr.i]={v:q.t==="mc"?-1:""};addWrong([q.id]);save()}else{m2.self=false;addWrong([q.id]);save()}pr.i++;practice(key);scrollTo(0,0)};
}

const hl=t=>{const s=esc(t),kq=esc(qn.trim());if(!kq)return s;const i=s.toLowerCase().indexOf(kq.toLowerCase());return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+kq.length)+"</mark>"+s.slice(i+kq.length)};
function notes(only){
  setTabs("notes");
