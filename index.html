<style>
/* VOICE: 손에 쥐고 매일 여는 공부 앱, 차분하고 단단하게

:root{color-scheme:light dark;--bg:light-dark(#f3f4f7,#0d1118);--paper:light-dark(#fff,#161b26);--ink:light-dark(#121826,#e8ebf1);--mute:light-dark(#5e6677,#98a1b3);--line:light-dark(#dde1e8,#283041);--bar:#1d2b4f;--acc:#2f6fed;--hot:#e2462f;--ok:#1f9d55;--sel:light-dark(#e7efff,#1c2b4b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow-x:clip}

.stat{background:#ffffff14;border-radius:12px;padding:12px}

.md{font-size:15.5px}.md h2{font-size:21px;margin:4px 0 10px;line-height:1.3}.md h3{font-size:17px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.md ul,.md ol{padding-left:20px;margin:8px 0}.md li{margin:4px 0}.md p{margin:8px 0}

.search{width:100%;font:inherit;font-size:16px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.note{font-size:13px;color:var(--mute)}
details summary{cursor:pointer;list-style:none;font-weight:500;color:var(--acc);margin-top:10px;min-height:32px}

textarea.code{width:100%;min-height:200px;font:14px/1.5 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical;tab-size:4}

.seg{display:grid;grid-template-columns:1fr 1fr;background:#ffffff1a;border-radius:12px;padding:4px;gap:4px}

.lv{display:flex;gap:6px;margin-top:10px}.lv button{min-height:34px;border-radius:99px;padding:0 16px;font-size:14px;background:none;border-color:#ffffff40;color:#fff}

.hero{padding:6px 16px 18px}.stat b small{font-size:14px;opacity:.7;margin-left:2px}

.item[disabled]{opacity:.45}
label.item{cursor:pointer}

.sw:checked{background:var(--acc)}.sw:checked::after{left:23px}
.md{font-size:calc(15.5px*var(--fs,1))}
.tabs{grid-template-columns:repeat(5,1fr)}.tabs a{font-size:11.5px}
.sp{flex:1}.icon{min-height:38px;min-width:38px;padding:0;border:0;background:none;font-size:22px;line-height:1}
.hd .icon{background:none;border:0;color:#fff;font-size:28px}
.star{color:var(--mute)}.star.on{color:#e0a800}
.hero .dday{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dday small{display:block;opacity:.8;font-size:13px}.dday b{font:700 30px/1.1 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
.light{background:#ffffff1a!important;border-color:#ffffff40!important;color:#fff!important}
.tight{padding:14px 16px}.tight .bar{margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:76px;padding:12px 14px;text-align:left;border-radius:14px}
.tile b{font-size:16px}.tile small{color:var(--mute);font-size:13px}
.ring{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);
 background:radial-gradient(closest-side,var(--paper) 76%,transparent 78%),conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.wide{width:100%}.pri.danger{background:var(--hot);border-color:var(--hot)}
.row-r{display:flex;justify-content:flex-end;margin-top:8px}.link{color:var(--acc);font-weight:700;text-decoration:none}
.item.col{flex-direction:column;align-items:stretch;gap:8px}.chips.in{padding:0}
.date{font:inherit;font-size:14px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:0 8px}
.grid .st{box-shadow:inset 0 0 0 2px #e0a800}
mark{background:#ffe27a;color:#000;border-radius:3px}
.qcard{transition:border-color .2s}.qcard.good{border-color:var(--ok)}.qcard.bad{border-color:var(--hot)}
.qcard.good .ex,.qcard.bad .ex{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.qcard.good .ex,.qcard.bad .ex{animation:none}.qcard,.sw,.sw::after{transition:none}}
.opt{min-height:56px}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:16px;min-height:52vh;padding:24px 20px;border-radius:18px;text-align:center;background:var(--paper);border:1px solid var(--line);color:var(--ink);box-shadow:0 2px 10px #0000000d}
.flash small{color:var(--mute);font-size:13px}.flash b{font-size:calc(24px*var(--fs,1));line-height:1.35}
.flash .fb{font-size:calc(16px*var(--fs,1));line-height:1.65;text-align:left;border-top:1px solid var(--line);padding-top:14px;width:100%}
.flash .hint{color:var(--mute);font-size:14px}.flash.back{justify-content:flex-start}
button.bad{border-color:var(--hot);color:var(--hot)}
.pass{color:var(--ok)}.fail{color:var(--hot)}
</style>

<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="overlay" id="ov"><div class="dlg" id="dlg"></div></div>
<script>
/* 자동 생성 문제: 값만 무작위로 바꾸고 정답은 계산으로 구한다. 각 생성기는 {t,s,q,c,o?,a,e,run?}를 돌려준다. run은 검증용 실행 코드 */
const GEN=(()=>{
const mk=(rnd)=>({
  int:(a,b)=>a+Math.floor(rnd()*(b-a+1)),
  pick:a=>a[Math.floor(rnd()*a.length)],
  shuf:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  rnd
});
/* 객관식: 정답 + 오답 후보 → 서로 다른 보기 4개 */
function mc(R,ans,cands,fill){
  const A=String(ans),o=[A];
  for(const c of cands){const s=String(c);if(o.length<4&&!o.includes(s))o.push(s)}
  let k=1;while(o.length<4&&k<60){const s=String(fill?fill(k):Number(ans)+k*(R.rnd()<.5?-1:1));if(!o.includes(s)&&s!=="NaN")o.push(s);k++}
  if(o.length<4)throw new Error("보기 부족");
  const sh=R.shuf(o);return {o:sh,a:sh.indexOf(A)};
}
const f2=x=>(Math.round(x*100+1e-9)/100).toFixed(2);
const tbl=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const NAMES=["김민수","이서연","박지훈","최유나","정다은","한도윤","오세진","윤하늘"],DEPTS=["CS","EE","ME"];

/* ---------- 공통 조각 ---------- */
function loopCode(R,lang){
  const a=R.int(1,5),b=a+R.int(6,14),st=R.int(1,3),k=R.int(2,4),r=R.int(0,k-1);
  let s=0,all=0,lt=0;for(let i=a;i<=b;i+=st){all+=i;if(i%k===r){s+=i;if(i<b)lt+=i}}
  const code=lang==="Python"?`s = 0\nfor i in range(${a}, ${b+1}, ${st}):\n    if i % ${k} == ${r}:\n        s += i\nprint(s)`
   :lang==="Java"?`int s = 0;\nfor (int i = ${a}; i <= ${b}; i += ${st})\n    if (i % ${k} == ${r}) s += i;\nSystem.out.print(s);`
   :`int s = 0;\nfor (int i = ${a}; i <= ${b}; i += ${st})\n    if (i % ${k} == ${r}) s += i;\nprintf("%d", s);`;
  const vals=[];for(let i=a;i<=b;i+=st)if(i%k===r)vals.push(i);
  return {code,ans:s,alt:[lt,all-s,all],e:`조건(i % ${k} == ${r})을 만족하는 i: ${vals.join(", ")||"없음"} → 합 ${s}.${lang==="Python"?` range의 끝값 ${b+1}은 포함하지 않는다.`:""}`};
}
function sqlTable(R){
  const n=R.int(5,6),names=R.shuf(NAMES).slice(0,n);
  return names.map(nm=>({name:nm,dept:R.pick(DEPTS),score:R.int(5,19)*5}));
}
function sqlQuery(R,rows){
  const kind=R.int(0,4),k=R.pick([60,70,75,80]),d=R.pick([...new Set(rows.map(r=>r.dept))]);
  if(kind===0){const v=rows.filter(r=>r.score>=k).length;return {sql:`SELECT COUNT(*) FROM 학생\nWHERE 점수 >= ${k};`,ans:v,alt:[rows.filter(r=>r.score>k).length,rows.length-v,rows.length],e:`점수가 ${k} 이상인 행 수 = ${v}.`}}
  if(kind===1){const v=rows.filter(r=>r.dept===d).reduce((x,r)=>x+r.score,0);return {sql:`SELECT SUM(점수) FROM 학생\nWHERE 학과 = '${d}';`,ans:v,alt:[rows.reduce((x,r)=>x+r.score,0),v-5,v+5],e:`학과가 ${d}인 행의 점수 합 = ${v}.`}}
  if(kind===2){const v=new Set(rows.map(r=>r.dept)).size;return {sql:`SELECT COUNT(DISTINCT 학과) FROM 학생;`,ans:v,alt:[rows.length,v+1,v-1],e:`중복을 뺀 학과 종류 수 = ${v}.`}}
  if(kind===3){const g={};rows.forEach(r=>g[r.dept]=(g[r.dept]||0)+1);const c=R.int(2,3);const v=Object.values(g).filter(x=>x>=c).length;
    return {sql:`SELECT 학과, COUNT(*) FROM 학생\nGROUP BY 학과\nHAVING COUNT(*) >= ${c};`,ans:v,alt:[Object.keys(g).length,rows.length,v+1],e:`학과별 인원: ${Object.entries(g).map(([a,b])=>a+" "+b+"명").join(", ")}. ${c}명 이상인 학과 수 = ${v}(결과 행 수).`,ask:"결과 행의 개수"}}
  const v=Math.max(...rows.filter(r=>r.dept===d).map(r=>r.score));return {sql:`SELECT MAX(점수) FROM 학생\nWHERE 학과 = '${d}';`,ans:v,alt:[Math.max(...rows.map(r=>r.score)),Math.min(...rows.filter(r=>r.dept===d).map(r=>r.score)),v-5],e:`학과가 ${d}인 행 중 가장 큰 점수 = ${v}.`};
}
const sqlRun=(rows,sql)=>`CREATE TABLE 학생(이름 TEXT, 학과 TEXT, 점수 INT);\n${rows.map(r=>`INSERT INTO 학생 VALUES('${r.name}','${r.dept}',${r.score});`).join("\n")}\n${sql}`;
function tree(R){
  const L="ABCDEFG".split("").slice(0,R.int(5,7));const nodes=L.map(k=>({k,l:null,r:null}));
  for(let i=1;i<nodes.length;i++){let p;do{p=nodes[R.int(0,i-1)]}while(p.l&&p.r);if(!p.l&&(!p.r&&R.rnd()<.5||p.r))p.l=nodes[i];else if(!p.r)p.r=nodes[i];else p.l=nodes[i]}
  const pre=[],ino=[],post=[];const go=n=>{if(!n)return;pre.push(n.k);go(n.l);ino.push(n.k);go(n.r);post.push(n.k)};go(nodes[0]);
  return {nodes,pre:pre.join(" "),in:ino.join(" "),post:post.join(" ")};
}
function relPath(R){
  const words=["home","user","work","src","docs","app","test","lib","data","img"];
  const cwd=["",...R.shuf(words).slice(0,R.int(2,4))];const parts=[];let depth=cwd.length-1,stack=cwd.slice(1);
  const ups=R.int(0,Math.min(2,depth));for(let i=0;i<ups;i++){parts.push("..");stack.pop()}

  if(cA===0||cAB===0){tx[0]=[A,B];cA=tx.filter(t=>t.includes(A)).length;cAB=tx.filter(t=>t.includes(A)&&t.includes(B)).length}

   e:`${A}와 ${B}를 함께 포함한 거래 ${cAB}건, ${A} 포함 ${cA}건, 전체 ${n}건. 지지도 = ${cAB}/${n} = ${f2(cAB/n)}, 신뢰도 = ${cAB}/${cA} = ${f2(cAB/cA)}.`}}},

2"],[1,"DBMS의 필수 기능 3가지가 아닌 것은?",["조작 기능","제어 기능","정의 기능","번역 기능"],3,"DBMS의 필수 기능은 정의(Definition), 조작(Manipulation), 제어(Control).","2-2"],[1,"E-R 다이어그램에서 개체(Entity)를 나타내는 기호는?",["선","마름모","타원","사각형"],3,"사각형 = 개체, 마름모 = 관계, 타원 = 속성, 선 = 연결.","2-2"],[1,"학생 한 명이 여러 과목을 듣고, 한 과목도 여러 학생이 듣는다. 학생과 과목의 관계 유형은?",["1:N","N:1","1:1","N:M"],3,"양쪽 모두 여럿과 연결되면 다대다(N:M). 테이블로 구현할 때는 수강 같은 연결 테이블을 둔다.","2-2"],[1,"데이터 모델링 중 E-R 다이어그램을 그려 현실 세계를 추상화하는 단계는?",["개념적 데이터 모델링","물리적 데이터 모델링","구현","논리적 데이터 모델링"],0,"개념적 모델링에서 개체·속성·관계를 E-R 다이어그램으로 표현한다. DBMS와는 무관한 단계.","2-2"],[1,"데이터 모델의 구성 요소 3가지가 아닌 것은?",["제약 조건","하드웨어","연산","구조"],1,"데이터 모델은 구조(Structure), 연산(Operation), 제약 조건(Constraint)으로 구성된다.","2-2"],[1,"정렬된 배열에서 가운데 값과 비교해 탐색 범위를 절반씩 줄여 가는 탐색 방법은?",["순차 탐색","해시 탐색","이진 탐색","깊이 우선 탐색"],2,"이진 탐색은 정렬된 자료에서만 쓸 수 있고, 시간 복잡도는 O(log n).","2-3"],[1,"양쪽 끝에서 삽입과 삭제가 모두 가능한 자료구조는?",["큐","데크(Deque)","트리","스택"],1,"데크는 Double-Ended Queue로 앞뒤 양쪽에서 넣고 뺄 수 있다.","2-3"],[1,"각 노드가 데이터와 다음 노드를 가리키는 포인터를 가지는 자료구조는?",["배열","해시 테이블","스택","연결 리스트"],3,"연결 리스트는 삽입·삭제가 쉽지만 원하는 위치를 바로 찾기 어렵다(순차 접근).","2-3"],[1,"정점 n개인 무방향 완전 그래프의 간선 수는?",["n(n − 1) / 2","n − 1","n","n(n − 1)"],0,"모든 정점 쌍이 연결되므로 n(n − 1)/2개. 방향 그래프라면 n(n − 1)개.","2-3"],[1,"UI 설계 원칙 중 ‘사용자가 쉽게 이해하고 바로 사용할 수 있어야 한다’는 것은?",["유연성","직관성","유효성","학습성"],1,"직관성(쉽게 이해), 유효성(목적 달성), 학습성(쉽게 배움), 유연성(요구를 최대한 수용하고 실수를 최소화).","2-4"],[1,"화면의 레이아웃과 구성 요소의 위치만 간단한 선과 박스로 나타낸 UI 설계 산출물은?",["프로토타입","목업","와이어프레임","스토리보드"],2,"와이어프레임은 뼈대, 목업은 실제와 비슷한 정적 화면, 스토리보드는 화면·설명·흐름을 담은 최종 설계서, 프로토타입은 동작하는 견본.","2-4"],[1,"터치, 음성, 동작처럼 사람의 자연스러운 행동으로 기기를 조작하는 인터페이스는?",["NUI","TUI","CLI","GUI"],0,"NUI(Natural UI). CLI는 명령어 입력, GUI는 마우스와 아이콘 같은 그래픽 기반.","2-4"],[1,"여러 웹 브라우저에서 화면이 똑같이 보이고 동작하는지 확인하는 UI 테스트는?",["부하 테스트","회귀 테스트","보안 테스트","크로스 브라우징 테스트"],3,"크로스 브라우징은 Chrome, Safari, Edge 등에서 같은 결과가 나오는지 확인한다.","2-4"],[1,"장애인·고령자 등 누구나 웹 콘텐츠를 이용할 수 있도록 보장하는 것은?",["웹 표준","반응형 웹","웹 호환성","웹 접근성"],3,"웹 접근성은 이미지 대체 텍스트(alt), 키보드 조작, 명도 대비 등을 갖추는 것.","2-4"],[2,"테이블에 새로운 열(컬럼)을 추가할 때 사용하는 SQL은?",["CREATE COLUMN","ALTER TABLE ~ ADD","INSERT INTO ~ VALUES","UPDATE ~ SET"],1,"테이블 구조 변경은 DDL인 ALTER TABLE. 열 추가는 ADD, 수정은 MODIFY, 삭제는 DROP COLUMN.","3-6"],[2,"이미 있는 행의 값을 바꾸는 SQL 명령어는?",["UPDATE","CHANGE","MODIFY","ALTER"],0,"UPDATE 테이블 SET 열 = 값 WHERE 조건. ALTER는 테이블 구조를 바꾼다.","3-6"],[2,"다음 중 DML에 해당하는 명령어로만 묶인 것은?",["CREATE, DROP","SELECT, DELETE","COMMIT, ROLLBACK","GRANT, REVOKE"],1,"DML은 SELECT, INSERT, UPDATE, DELETE. CREATE·DROP은 DDL, GRANT·REVOKE는 DCL, COMMIT·ROLLBACK은 TCL.","3-6"],[2,"WHERE 절에서 NULL 값을 올바르게 찾는 조건은?",["점수 == NULL","점수 LIKE NULL","점수 IS NULL","점수 = NULL"],2,"NULL은 = 로 비교할 수 없다. IS NULL, IS NOT NULL을 쓴다.","3-6"],[2,"WHERE 점수 BETWEEN 60 AND 80 과 같은 조건은?",["점수 >= 60 AND 점수 <= 80","점수 >= 60 OR 점수 <= 80","점수 > 60 AND 점수 <= 80","점수 > 60 AND 점수 < 80"],0,"BETWEEN은 양 끝 값을 포함한다.","3-6"],[2,"중복된 행을 제거하고 조회할 때 SELECT 뒤에 쓰는 키워드는?",["DISTINCT","GROUP","ONLY","UNIQUE"],0,"SELECT DISTINCT 학과 FROM 학생 → 학과를 중복 없이 조회한다.","3-6"],[2,"다음 중 집계 함수가 아닌 것은?",["LIKE","COUNT","AVG","SUM"],0,"LIKE는 문자열 패턴 비교 연산자. 집계 함수는 COUNT, SUM, AVG, MAX, MIN.","3-6"],[2,"두 테이블에서 조인 조건을 만족하는 행만 결과로 내는 조인은?",["CROSS JOIN","INNER JOIN","FULL OUTER JOIN","LEFT OUTER JOIN"],1,"INNER JOIN은 양쪽에 짝이 있는 행만. OUTER JOIN은 짝이 없는 행도 NULL로 채워 포함한다.","3-6"],[2,"행이 3개인 테이블과 행이 4개인 테이블을 CROSS JOIN한 결과의 행 수는?",["3","12","7","4"],1,"CROSS JOIN은 모든 조합(카티션 곱)이라 3 × 4 = 12행.","3-6"],[2,"두 SELECT 결과에 모두 있는 행만 구하는 집합 연산자는?",["UNION ALL","EXCEPT","INTERSECT","UNION"],2,"INTERSECT는 교집합. EXCEPT(Oracle은 MINUS)는 첫 결과에서 두 번째 결과를 뺀 차집합.","3-7"],[2,"테이블, 컬럼, 인덱스, 사용자 같은 DB 객체 정보를 담고 있으며 DBMS가 자동으로 관리하는 것은?",["트리거","뷰","시스템 카탈로그","커서"],2,"시스템 카탈로그(데이터 사전)는 메타데이터 저장소. 사용자는 조회만 하고 갱신은 DBMS가 한다.","3-7"],[2,"뷰(VIEW)에 대한 설명으로 옳지 않은 것은?",["보안과 논리적 독립성을 제공한다","ALTER VIEW로 정의를 자유롭게 바꾸는 것이 원칙이다","뷰를 통한 삽입·수정에는 제약이 있다","하나 이상의 테이블에서 유도된 가상 테이블이다"],1,"표준 SQL에서 뷰는 정의를 바꾸려면 DROP 후 다시 CREATE한다.","3-6"],[2,"인덱스에 대한 설명으로 옳은 것은?",["DML 명령어로 만든다","인덱스를 만들면 테이블 데이터가 복사되어 두 배가 된다","모든 열에 만들수록 항상 빨라진다","검색 속도를 높이지만 삽입·수정이 잦으면 성능이 떨어질 수 있다"],3,"인덱스는 CREATE INDEX(DDL)로 만들며, 데이터 변경이 잦으면 인덱스도 갱신해야 해서 느려질 수 있다.","3-6"],[2,"사용자 user1에게 [학생] 테이블 조회 권한을 주는 SQL은?",["GRANT SELECT ON 학생 TO user1;","GRANT SELECT TO 학생 ON user1;","REVOKE SELECT ON 학생 FROM user1;","ALLOW SELECT ON 학생 user1;"],0,"부여: GRANT 권한 ON 객체 TO 사용자. 회수: REVOKE 권한 ON 객체 FROM 사용자.","3-6"],[2,"트랜잭션이 성공적으로 끝나 변경 내용을 데이터베이스에 영구적으로 반영하는 명령어는?",["SAVEPOINT","ROLLBACK","COMMIT","CHECKPOINT"],2,"COMMIT은 확정, ROLLBACK은 취소, SAVEPOINT는 중간 저장점.","3-8"],[2,"트랜잭션의 성질 중 ‘실행 중인 트랜잭션의 중간 결과를 다른 트랜잭션이 볼 수 없다’는 것은?",["일관성","독립성(격리성)","원자성","영속성"],1,"독립성(Isolation)은 동시에 실행되는 트랜잭션끼리 서로 간섭하지 않는다는 성질.","3-8"],[2,"외래키에 대한 설명으로 옳은 것은?",["한 테이블에 하나만 둘 수 있다","NULL 값을 가질 수 없다","항상 기본키와 같은 값이어야 한다","다른 테이블의 기본키를 참조하는 속성이다"],3,"외래키는 참조 대상(다른 테이블의 기본키)에 있는 값이거나 NULL이어야 한다(참조 무결성).","3-4"],[2,"후보키가 갖춰야 할 두 가지 성질은?",["최소성, 가변성","유일성, 최소성","유일성, 중복성","독립성, 영속성"],1,"후보키는 튜플을 유일하게 식별하고(유일성), 꼭 필요한 속성으로만 구성된다(최소성). 슈퍼키는 유일성만 만족한다.","3-4"],[2,"제1정규형(1NF)을 만족하기 위한 조건은?",["이행적 함수 종속 제거","모든 결정자가 후보키","모든 속성 값이 원자값","부분 함수적 종속 제거"],2,"1NF는 반복되거나 여러 값이 들어간 속성을 없애 원자값만 갖게 한다.","3-5"],[2,"정규화를 하지 않아 생기는 문제 중, 한 행을 지웠는데 필요한 다른 정보까지 함께 지워지는 것은?",["조회 이상","삭제 이상","갱신 이상","삽입 이상"],1,"삭제 이상. 삽입 이상은 불필요한 값까지 넣어야 하는 문제, 갱신 이상은 일부만 바뀌어 불일치가 생기는 문제.","3-5"],[3,"테스트에서 ‘제품을 올바르게 만들었는가(명세대로 만들었는가)’를 확인하는 것은?",["감사","확인(Validation)","검증(Verification)","인수"],2,"검증은 개발자 관점에서 명세대로 만들었는지, 확인은 사용자 관점에서 올바른 제품을 만들었는지 본다.","4-1"],[3,"테스트 원리 중 ‘같은 테스트 케이스를 반복하면 더 이상 새 결함을 찾지 못한다’는 것은?",["살충제 패러독스","결함 집중","오류-부재의 궤변","완벽한 테스트 불가능"],0,"살충제 패러독스. 테스트 케이스를 주기적으로 검토하고 바꿔야 한다.","4-1"],[3,"입력 범위가 1~100일 때 0, 1, 100, 101처럼 경계 근처 값으로 테스트하는 블랙박스 기법은?",["원인-효과 그래프","동치 분할","경계값 분석","비교 테스트"],2,"경계값 분석은 오류가 경계에서 많이 난다는 점을 이용한다. 동치 분할은 유효·무효 구간의 대표값을 고른다.","4-1"],[3,"프로그램을 실행하지 않고 코드나 문서를 검토해 결함을 찾는 테스트는?",["동적 테스트","인수 테스트","부하 테스트","정적 테스트"],3,"정적 테스트(동료 검토, 워크스루, 인스펙션). 동적 테스트는 실행하며 검사한다(화이트박스, 블랙박스).","4-1"],[3,"하향식 통합 테스트에서 아직 만들어지지 않은 하위 모듈을 대신하는 가상 모듈은?",["드라이버","스텁","하네스","오라클"],1,"하향식은 스텁(하위 대신), 상향식은 드라이버(상위 대신).","4-1"],[3,"프로그램을 수정한 뒤, 수정 때문에 다른 부분에 새로운 오류가 생기지 않았는지 다시 확인하는 테스트는?",["알파 테스트","인수 테스트","회귀 테스트","스모크 테스트"],2,"회귀 테스트는 변경 후 기존 기능이 그대로 동작하는지 반복 확인한다.","4-1"],[3,"사용자가 개발자 환경(개발 장소)에서 개발자와 함께 수행하는 인수 테스트는?",["단위 테스트","알파 테스트","베타 테스트","시스템 테스트"],1,"알파는 개발자 장소에서 통제된 환경으로, 베타는 사용자 환경에서 여러 사용자가 수행한다.","4-1"],[3,"테스트 결과가 맞는지 판단하기 위해 기대 결과를 제공하는 기준이나 장치는?",["테스트 시나리오","테스트 하네스","테스트 오라클","테스트 스텁"],2,"테스트 오라클은 참값 비교의 기준. 종류로 참·샘플링·휴리스틱·일관성 검사 오라클이 있다.","4-1"],[3,"화이트박스 테스트에서 모든 분기(결정)의 참과 거짓을 최소 한 번씩 수행하는 커버리지는?",["결정(분기) 커버리지","구문 커버리지","다중 조건 커버리지","조건 커버리지"],0,"결정 커버리지는 각 분기문의 참·거짓 결과를 모두 수행한다. 조건 커버리지는 각 개별 조건식의 참·거짓.","4-1"],[3,"디버깅에서 함수 호출이 있는 줄을 실행할 때 함수 안으로 들어가지 않고 한 줄 단위로 넘어가는 기능은?",["Watch","Breakpoint","Step Over","Step Into"],2,"Step Over는 함수를 한 번에 실행하고 다음 줄로, Step Into는 함수 안으로 들어간다. Watch는 변수 값 관찰.","4-1"],[3,"지속적 통합(CI)의 장점으로 거리가 먼 것은?",["배포 가능한 상태를 자주 확인한다","자동 빌드·테스트로 품질을 유지한다","코드를 오랫동안 따로 개발한 뒤 한 번에 합친다","통합 오류를 일찍 발견한다"],2,"CI는 자주, 작게 합치는 것이 핵심이다. 오래 따로 개발하면 통합 충돌이 커진다.","4-2"],[3,"애플리케이션과 실행에 필요한 라이브러리·설정을 함께 묶어, 어느 환경에서나 같게 실행되도록 하는 컨테이너 도구는?",["Docker","Git","Maven","Jenkins"],0,"Docker는 컨테이너로 실행 환경을 통째로 묶는다. Kubernetes는 여러 컨테이너를 운영·관리한다.","4-2"],[3,"Java 프로젝트에서 pom.xml로 라이브러리 의존성과 빌드를 관리하는 도구는?",["Ant","Gradle","Maven","npm"],2,"Maven은 pom.xml, Gradle은 Groovy·Kotlin 스크립트(build.gradle), npm은 JavaScript 패키지 관리자.","4-4"],[3,"코드 편집, 컴파일, 디버깅을 하나의 프로그램에서 할 수 있게 해 주는 개발 도구는?",["IDE","OS","DBMS","WAS"],0,"IDE(통합 개발 환경): Eclipse, IntelliJ, Visual Studio, VS Code 등.","4-4"],[3,"정적 콘텐츠(HTML, 이미지)를 처리하는 웹 서버가 아닌 것은?",["Apache HTTP Server","IIS","Nginx","Tomcat"],3,"Tomcat은 동적 콘텐츠를 처리하는 WAS다.","4-4"],[3,"운영체제의 목적(성능 평가 기준)과 거리가 먼 것은?",["처리 능력 향상","소스 코드 길이 증가","사용 가능도 향상","반환 시간 단축"],1,"운영체제 성능 기준은 처리 능력(Throughput)↑, 반환 시간↓, 사용 가능도↑, 신뢰도↑.","4-3"],[3,"메모리에 항상 상주하며 프로세스·메모리·파일·입출력을 관리하는 운영체제의 핵심 부분은?",["커널","유틸리티","셸","컴파일러"],0,"커널은 OS의 핵심, 셸은 명령어 해석기.","4-3"],[3,"여러 프로그램을 메모리에 올려 두고 CPU 하나가 번갈아 실행해 CPU 사용률을 높이는 운영 방식은?",["다중 프로그래밍","일괄 처리","실시간 처리","분산 처리"],0,"다중 프로그래밍은 CPU 하나로 여러 프로그램을 번갈아 실행한다. 다중 처리는 CPU 여러 개.","4-3"],[3,"Linux에서 파일 이름을 바꾸거나 다른 위치로 옮기는 명령어는?",["mv","rm","ln","cp"],0,"mv는 이동·이름 변경, cp는 복사, rm은 삭제, ln은 링크 생성.","4-3"],[3,"Linux에서 실행 중인 프로세스와 CPU·메모리 사용량을 실시간으로 보여 주는 명령어는?",["kill","df","top","ps"],2,"top은 실시간 모니터링, ps는 그 순간의 프로세스 목록, df는 디스크 사용량.","4-3"],[3,"Windows 명령 프롬프트에서 현재 폴더의 파일 목록을 보여 주는 명령어는?",["list","dir","ls","show"],1,"Windows는 dir, Linux는 ls. 복사는 copy, 삭제는 del, 화면 지우기는 cls.","4-3"],[3,"형상관리에서 ‘공식적으로 검토·승인되어 변경 통제의 기준이 되는 시점의 산출물’을 뜻하는 용어는?",["머지","체크아웃","베이스라인","브랜치"],2,"베이스라인(기준선)은 이후 변경을 통제하는 기준점이다.","4-6"],[3,"형상관리 절차를 순서대로 나열한 것은?",["식별 → 통제 → 감사 → 기록","식별 → 감사 → 통제 → 기록","기록 → 식별 → 통제 → 감사","통제 → 식별 → 기록 → 감사"],0,"형상 식별 → 형상 통제(변경 관리) → 형상 감사(검증) → 형상 기록(보고).","4-6"],[3,"Git에서 원격 저장소의 변경 내용을 가져와 현재 브랜치에 병합까지 하는 명령어는?",["fetch","pull","clone","push"],1,"pull = fetch + merge. fetch는 가져오기만, clone은 저장소 전체 복제.","4-6"],[3,"Git에서 작업 디렉터리의 변경 파일을 커밋 대상(스테이징 영역)에 올리는 명령어는?",["git add","git push","git init","git commit"],0,"add로 스테이징하고 commit으로 로컬 저장소에 기록한 뒤 push로 원격에 올린다.","4-6"],[3,"분산 버전 관리 시스템에 해당하는 것은?",["Git","RCS","CVS","SVN"],0,"Git과 Mercurial은 분산형. CVS와 SVN은 클라이언트/서버형, RCS는 로컬(공유 폴더)형.","4-6"],[3,"백업 방식 중 백업 속도가 가장 빠르고 저장 용량이 가장 작지만, 복원할 때 가장 많은 백업이 필요한 것은?",["증분 백업","전체 백업","미러 백업","차등 백업"],0,"증분 백업은 직전 백업 이후 변경분만 저장해 빠르고 작지만, 복원 시 전체 + 모든 증분이 필요하다.","4-5"],[3,"장애가 났을 때 서비스를 복구하기까지 허용되는 최대 시간을 뜻하는 지표는?",["SLA","RPO","RTO","MTBF"],2,"RTO(목표 복구 시간)는 복구까지 걸리는 시간, RPO(목표 복구 시점)는 데이터 손실을 어느 시점까지 허용하는지.","4-5"],[3,"원본 데이터와 백업을 서로 다른 장소에 두어 화재·재해에도 데이터를 지키는 방법은?",["증분 백업","원격지 백업","RAID 0","스냅숏"],1,"원격지(오프사이트) 백업. RAID 0은 중복 없이 나눠 저장해 디스크 하나만 고장 나도 데이터를 잃는다.","4-5"],[0,"고급 언어로 작성된 원시 프로그램이 실행되기까지의 순서로 옳은 것은?",["링크 → 컴파일 → 로드 → 실행","컴파일 → 링크 → 로드 → 실행","로드 → 컴파일 → 링크 → 실행","컴파일 → 로드 → 링크 → 실행"],1,"원시 프로그램 → 컴파일러 → 목적 프로그램 → 링커 → 로드 모듈 → 로더 → 실행.","1-1"],[0,"인터프리터 방식의 특징으로 옳은 것은?",["프로그램 전체를 번역해 목적 프로그램을 만든다","한 줄씩 번역하며 바로 실행하고 목적 프로그램을 만들지 않는다","번역 후에는 원시 코드가 필요 없다","실행 속도가 컴파일 방식보 정보)는 데이터 사전에 저장된다.","3-1"],[2,"데이터베이스를 사용하는 응용 프로그래머가 쓰는 언어로, 데이터를 검색·삽입·삭제·변경하는 것은?",["DDL","DCL","HTML","DML"],3,"DML(데이터 조작어). DDL은 구조 정의, DCL은 권한·제어.","3-1"],[2,"데이터베이스 설계 단계를 순서대로 나열한 것은?",["요구 분석 → 물리적 설계 → 논리적 설계 → 개념적 설계 → 구현","요구 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현","개념적 설계 → 요구 분석 → 물리적 설계 → 논리적 설계 → 구현","요구 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현"],3,"요구 분석 → 개념적(E-R) → 논리적(테이블·정규화) → 물리적(저장 구조) → 구현.","3-2"],[2,"개념적 설계 단계의 주요 산출물은?",["E-R 다이어그램","테이블 스페이스 정의","SQL DDL 문","인덱스 설계서"],0,"개념적 설계는 DBMS와 무관하게 E-R 다이어그램으로 표현한다.","3-2"],[2,"물리적 설계 단계에서 하는 일이 아닌 것은?",["개체와 관계를 찾아 E-R 다이어그램 작성","인덱스 설계","저장 레코드 형식 결정","접근 경로 설계"],0,"E-R 다이어그램은 개념적 설계 단계의 일이다.","3-2"],[2,"데이터 모델에서 데이터 구조, 연산, 제약 조건 중 ‘연산’이 뜻하는 것은?",["허용되는 값의 범위","데이터를 처리하는 방법(조회·삽입·삭제·변경)","저장 장치의 종류","데이터 사이의 관계"],1,"구조는 개체와 관계, 연산은 처리 방법, 제약 조건은 허용되는 값과 규칙.","3-2"],[2,"관계형 데이터 모델에서 N:M 관계를 테이블로 표현하는 일반적인 방법은?",["한쪽 테이블에 다른 쪽의 모든 속성을 넣는다","두 테이블의 기본키를 외래키로 가지는 별도의 관계 테이블을 만든다","두 테이블을 하나로 합친다","외래키 없이 표현한다"],1,"학생-과목(N:M)은 수강 테이블(학번, 과목코드)로 풀어낸다.","3-2"],[2,"반정규화를 하는 주된 목적은?",["무결성 강화","저장 공간 절약","조회 성능 향상","데이터 중복 제거"],2,"반정규화는 성능을 위해 의도적으로 중복을 허용(테이블 통합·분할, 중복 속성 추가)한다.","3-2"],[2,"정규화의 목적으로 거리가 먼 것은?",["이상 현상을 방지한다","데이터 중복을 일부러 늘려 조회를 빠르게 한다","효율적인 검색 알고리즘의 바탕을 만든다","데이터 구조를 안정적으로 만든다"],1,"중복을 일부러 늘리는 것은 반정규화의 목적이다.","3-2"],[2,"관계형 데이터베이스에서 테이블의 한 행(레코드)을 가리키는 용어는?",["속성","튜플","릴레이션 스키마","도메인"],1,"행 = 튜플, 열 = 속성, 표 = 릴레이션.","3-3"],[2,"속성이 가질 수 있는 원자값들의 집합을 무엇이라 하는가?",["차수","튜플","카디널리티","도메인"],3,"예: 성별 속성의 도메인 = {남, 여}.","3-3"],[2,"속성 4개, 튜플 10개인 릴레이션의 차수(Degree)는?",["40","4","14","10"],1,"차수 = 속성(열) 수, 카디널리티 = 튜플(행) 수.","3-3"],[2,"릴레이션의 특징으로 옳지 않은 것은?",["속성 이름은 서로 달라야 한다","튜플 사이에는 순서가 있다","속성 값은 더 나눌 수 없는 원자값이다","같은 튜플이 중복될 수 없다"],1,"릴레이션의 튜플과 속성에는 순서가 없다.","3-3"],[2,"릴레이션 스키마와 릴레이션 인스턴스에 대한 설명으로 옳은 것은?",["인스턴스는 속성 이름의 목록이다","스키마는 구조(이름과 속성), 인스턴스는 특정 시점의 튜플 집합이다","스키마는 시간에 따라 자주 바뀌고 인스턴스는 고정된다","둘은 같은 의미이다"],1,"스키마는 틀(내포), 인스턴스는 그 시점의 실제 데이터(외연)다.","3-3"],[2,"릴레이션에서 속성 값으로 NULL이 의미하는 것은?",["공백 문자","숫자 0","빈 문자열","아직 모르거나 해당 없는 값"],3,"NULL은 값이 없음을 뜻하며 0이나 공백과 다르다.","3-3"],[2,"카티션 곱(R × S)의 결과 차수와 카디널리티로 옳은 것은? (R: 차수 3·카디널리티 4, S: 차수 2·카디널리티 5)",["차수 5, 카디널리티 20","차수 6, 카디널리티 9","차수 6, 카디널리티 20","차수 5, 카디널리티 9"],0,"카티션 곱은 차수는 더하고(3 + 2), 카디널리티는 곱한다(4 × 5).","3-3"],[2,"슈퍼키에 대한 설명으로 옳은 것은?",["외래키의 다른 이름이다","유일성은 만족하지만 최소성은 만족하지 않을 수 있다","유일성과 최소성을 모두 만족해야 한다","NULL을 허용하지 않는 유일한 키다"],1,"슈퍼키는 튜플을 유일하게 구별하는 속성 집합이지만 불필요한 속성이 섞일 수 있다.","3-4"],[2,"참조 무결성을 지키기 위해, 부모 테이블의 행을 삭제할 때 그 행을 참조하는 자식 테이블의 행도 함께 삭제하는 옵션은?",["NO ACTION","CASCADE","SET NULL","RESTRICT"],1,"CASCADE는 연쇄 삭제·변경, SET NULL은 외래키를 NULL로, RESTRICT는 참조 중이면 거부.","3-4"],[2,"후보키 중 기본키로 선택되지 않은 나머지 키는?",["슈퍼키","외래키","대체키","복합키"],2,"대체키(보조키).","3-4"],[2,"기본키가 두 개 이상의 속성으로 구성된 경우를 무엇이라 하는가?",["대체키","외래키","복합키","슈퍼키"],2,"복합키(연결키). 예: (학번, 과목코드).","3-4"],[2,"X → Y 함수적 종속에서 X를 무엇이라 하는가?",["외래키","결정자","후보키","종속자"],1,"X는 결정자, Y는 종속자. X 값이 정해지면 Y 값이 하나로 정해진다.","3-5"],[2,"BCNF를 만족하기 위한 조건은?",["다치 종속을 제거해야 한다","속성 값이 원자값이어야 한다","조인 종속을 제거해야 한다","모든 결정자가 후보키여야 한다"],3,"BCNF(보이스-코드 정규형)는 결정자이면서 후보키가 아닌 것을 제거한다.","3-5"],[2,"정규화 순서에서 다치 종속을 제거하는 단계는?",["5NF","BCNF","3NF","4NF"],3,"도부이결다조: 1NF(도메인 원자값) → 2NF(부분) → 3NF(이행) → BCNF(결정자) → 4NF(다치) → 5NF(조인).","3-5"],[2,"갱신 이상(Update Anomaly)에 대한 설명으로 옳은 것은?",["조회 속도가 느려지는 현상","필요한 데이터까지 함께 삭제되는 현상","필요 없는 값까지 함께 넣어야 하는 현상","중복된 데이터 중 일부만 수정되어 데이터가 서로 달라지는 현상"],3,"갱신 이상은 불일치, 삽입 이상은 원치 않는 값 삽입, 삭제 이상은 원치 않는 정보 손실.","3-5"],[2,"(학번, 과목코드) → 성적, 학번 → 이름 일 때 제거해야 할 종속과 정규형은?",["조인 종속, 5NF","부분 함수적 종속, 2NF","이행적 종속, 3NF","다치 종속, 4NF"],1,"이름이 기본키 일부인 학번에만 종속되므로 부분 함수적 종속. 이를 제거하면 2NF.","3-5"],[2,"SELECT 문에서 결과를 오름차순으로 정렬할 때 쓰는 키워드는? (기본값)",["ASC","UP","SORT","DESC"],0,"ORDER BY 열 ASC(생략 가능). 내림차순은 DESC.","3-6"],[2,"GROUP BY와 함께 그룹별 행 개수를 셀 때 쓰는 집계 함수는?",["LEN(*)","SUM(*)","COUNT(*)","NUM(*)"],2,"COUNT(*)는 NULL 행도 포함해 센다. COUNT(열)은 NULL을 빼고 센다.","3-6"],[2,"Oracle에서 첫 SELECT 결과에서 두 번째 SELECT 결과를 뺀 차집합을 구하는 연산자는?",["UNION","INTERSECT","MINUS","JOIN"],2,"표준 SQL은 EXCEPT, Oracle은 MINUS.","3-7"],[2,"UNION ALL과 UNION의 차이로 옳은 것은?",["둘은 결과가 항상 같다","UNION ALL은 교집합을 구한다","UNION은 중복 행을 그대로 둔다","UNION ALL은 중복 행을 제거하지 않는다"],3,"UNION은 중복을 제거하고, UNION ALL은 모두 남겨 더 빠르다.","3-7"],[2,"집합 연산자를 사용할 때의 조건으로 옳은 것은?",["ORDER BY를 각 SELECT마다 써야 한다","두 SELECT가 같은 테이블을 조회해야 한다","두 SELECT의 열 개수와 데이터 타입이 맞아야 한다","WHERE 절을 쓸 수 없다"],2,"열 개수·타입이 호환되어야 하고, ORDER BY는 맨 마지막에 한 번만 쓴다.","3-7"],[2,"Oracle에서 현재 사용자가 만든 테이블의 컬럼 정보를 조회하는 데이터 사전 뷰는?",["DBA_USERS","USER_TAB_COLUMNS","USER_INDEXES","USER_VIEWS"],1,"USER_TABLES는 테이블, USER_TAB_COLUMNS는 컬럼, USER_INDEXES는 인덱스, USER_VIEWS는 뷰.","3-7"],[2,"시스템 카탈로그에 대한 설명으로 옳지 않은 것은?",["사용자도 SQL로 조회할 수 있다","메타데이터를 저장한다","사용자가 INSERT로 직접 내용을 갱신한다","DBMS가 스스로 생성·유지한다"],2,"카탈로그 갱신은 DBMS가 자동으로 한다. 사용자는 조회만 한다.","3-7"],[2,"MySQL에서 테이블의 열 구성(이름·타입)을 간단히 확인하는 명령은?",["DESC 테이블명","INFO 테이블명","SHOW 테이블명","LIST 테이블명"],0,"DESC(DESCRIBE) 테이블명. information_schema.COLUMNS를 조회해도 된다.","3-7"],[2,"트랜잭션 상태 중 마지막 연산까지 실행했지만 아직 COMMIT하기 전의 상태는?",["완료","부분 완료","활동","철회"],1,"활동 → 부분 완료 → 완료(커밋). 실패하면 실패 → 철회(롤백).","3-8"],[2,"데이터베이스 회복 기법에서 Redo가 의미하는 것은?",["인덱스를 다시 만든다","로그를 이용해 커밋된 트랜잭션의 변경 내용을 다시 반영한다","백업 파일을 삭제한다","커밋되지 않은 트랜잭션의 변경을 취소한다"],1,"Redo는 재실행, Undo는 취소. 즉시 갱신은 둘 다, 지연 갱신은 Redo만 필요하다.","3-8"],[2,"여러 트랜잭션이 동시에 실행될 때 일관성을 지키기 위해 데이터에 잠금을 거는 병행 제어 기법은?",["정규화","체크포인트","로킹","인덱싱"],2,"로킹 단위가 크면 병행성은 낮고 관리는 쉽다. 작으면 병행성은 높고 관리가 복잡하다.","3-8"],[2,"미리 저장해 두고 이름으로 호출해 실행하는, 일련의 SQL 작업 묶음은?",["트리거","뷰","인덱스","저장 프로시저"],3,"저장 프로시저는 CALL(또는 EXECUTE)로 호출한다. 반환값이 없을 수 있다.","3-9"],[2,"특정 테이블에 INSERT·UPDATE·DELETE 같은 이벤트가 발생하면 자동으로 실행되는 절차형 SQL은?",["커서","사용자 정의 함수","프로시저","트리거"],3,"트리거는 이벤트 기반 자동 실행. 트리거 안에서는 COMMIT·ROLLBACK을 쓸 수 없다.","3-9"],[2,"반드시 하나의 값을 RETURN으로 돌려주며 SQL 문 안에서 호출할 수 있는 절차형 SQL은?",["트리거","사용자 정의 함수","프로시저","패키지"],1,"사용자 정의 함수는 반환값이 반드시 있다.","3-9"],[2,"여러 행으로 된 쿼리 결과를 한 행씩 차례로 처리하기 위해 쓰는 것은?",["시퀀스","뷰","커서","인덱스"],2,"커서는 OPEN → FETCH → CLOSE 순서로 쓴다.","3-9"],[2,"커서 사용 순서로 옳은 것은?",["선언 → OPEN → FETCH → CLOSE","선언 → FETCH → OPEN → CLOSE","FETCH → OPEN → CLOSE → 선언","OPEN → 선언 → CLOSE → FETCH"],0,"커서를 선언하고 열어(OPEN) 한 행씩 가져온(FETCH) 뒤 닫는다(CLOSE).","3-9"],[2,"절차형 SQL에서 조건에 따라 다른 문장을 실행하게 하는 제어문은?",["CREATE ~ AS","IF ~ THEN ~ ELSE","SELECT ~ FROM","GRANT ~ TO"],1,"절차형 SQL은 IF, CASE, LOOP, WHILE 같은 제어 구조를 쓸 수 있다.","3-9"],[2,"저장 프로시저의 장점으로 거리가 먼 것은?",["재사용과 유지보수가 쉽다","권한 관리로 보안을 높일 수 있다","DBMS 종류와 관계없이 그대로 옮겨 쓸 수 있다","네트워크로 보내는 SQL이 줄어든다"],2,"프로시저 문법은 DBMS마다 달라 이식성이 낮은 편이다.","3-9"],[3,"테스트 원리 중 ‘결함의 대부분은 소수의 특정 모듈에 몰려 있다’는 것은?",["오류-부재의 궤변","정황 의존성","살충제 패러독스","결함 집중"],3,"결함 집중(파레토 법칙, 80:20).","4-1"],[3,"테스트 원리 중 ‘결함이 없더라도 사용자 요구를 만족하지 못하면 품질이 높다고 할 수 없다’는 것은?",["오류-부재의 궤변","결함 집중","살충제 패러독스","완벽한 테스트 불가능"],0,"오류-부재의 궤변(Absence of Errors Fallacy).","4-1"],[3,"원인과 결과의 관계를 그래프로 분석해 효용성 높은 테스트 케이스를 고르는 블랙박스 기법은?",["조건 커버리지","원인-효과 그래프","데이터 흐름 테스트","기초 경로 테스트"],1,"원인-효과 그래프는 블랙박스, 나머지는 화이트박스 기법이다.","4-1"],[3,"제어 흐름 그래프에서 간선 수가 9, 노드 수가 7일 때 McCabe 순환 복잡도는?",["4","2","16","3"],0,"V(G) = 간선 − 노드 + 2 = 9 − 7 + 2 = 4. 기초 경로 테스트 케이스 수의 기준이 된다.","4-1"],[3,"테스트 케이스의 구성 요소로 거리가 먼 것은?",["예상 결과","개발자 연봉","입력 데이터","테스트 조건(전제 조건)"],1,"테스트 케이스는 식별자, 테스트 항목, 입력 값, 예상 결과, 테스트 환경, 전제 조건으로 구성된다.","4-1"],[3,"인수 테스트 중 여러 사용자가 실제 사용 환경에서 직접 사용해 보고 피드백하는 테스트는?",["단위 테스트","베타 테스트","통합 테스트","알파 테스트"],1,"베타는 사용자 환경, 알파는 개발자 환경에서 수행한다.","4-1"],[3,"CD(Continuous Delivery, 지속적 전달)에 대한 설명으로 옳은 것은?",["코드를 하루에 한 번만 빌드한다","배포를 모두 수동으로만 한다","테스트를 생략하고 바로 배포한다","테스트를 통과한 결과물을 언제든 배포할 수 있는 상태로 유지한다"],3,"지속적 전달은 배포 가능 상태 유지, 지속적 배포는 운영 환경까지 자동 반영.","4-2"],[3,"CI/CD 파이프라인의 일반적인 순서로 옳은 것은?",["테스트 → 커밋 → 빌드 → 배포","배포 → 테스트 → 빌드 → 커밋","커밋 → 빌드 → 테스트 → 배포","빌드 → 커밋 → 배포 → 테스트"],2,"코드를 커밋하면 자동으로 빌드하고 테스트한 뒤 배포 단계로 넘어간다.","4-2"],[3,"여러 컨테이너의 배포, 확장, 장애 복구를 자동으로 관리하는 오케스트레이션 도구는?",["Git","Docker Hub","Maven","Kubernetes"],3,"Kubernetes(K8s). Docker Hub는 컨테이너 이미지 저장소.","4-2"],[3,"GitHub 저장소에서 코드 푸시를 계기로 빌드·테스트·배포를 자동으로 실행해 주는 기능은?",["Git Blame","Git Stash","GitHub Actions","GitHub Pages"],2,"GitHub Actions는 워크플로 파일(YAML)로 CI/CD를 자동화한다. GitHub Pages는 정적 웹 호스팅.","4-2"],[3,"DevOps가 추구하는 방향으로 거리가 먼 것은?",["자동화로 배포 주기를 짧게 한다","개발과 운영의 협업","개발팀과 운영팀의 역할을 완전히 분리하고 소통을 줄인다","지속적인 모니터링과 피드백"],2,"DevOps는 개발과 운영의 협업·자동화·피드백을 강조한다.","4-2"],[3,"빌드 과정에 대한 설명으로 옳은 것은?",["사용자 요구사항을 수집하는 과정","데이터베이스를 정규화하는 과정","운영 서버의 로그를 지우는 과정","소스 코드를 컴파일하고 라이브러리를 묶어 실행 가능한 결과물을 만드는 과정"],3,"빌드는 컴파일, 의존성 처리, 패키징(jar·war·실행 파일)을 포함한다.","4-2"],[3,"운영체제 운영 방식 중 일정 시간 단위로 CPU를 나눠 여러 사용자가 대화식으로 쓰게 하는 방식은?",["시분할 시스템","일괄 처리 시스템","실시간 처리 시스템","분산 처리 시스템"],0,"시분할은 짧은 시간 할당량(Time Slice)으로 번갈아 실행해 동시에 쓰는 것처럼 보이게 한다.","4-3"],[3,"교착 상태(Deadlock)의 발생 조건이 아닌 것은?",["선점","점유와 대기","상호 배제","환형 대기"],0,"네 조건은 상호 배제, 점유와 대기, 비선점, 환형 대기. 넷 다 만족해야 발생한다.","4-3"],[3,"Linux에서 디스크의 파일 시스템별 사용량과 남은 공간을 보여 주는 명령어는?",["du","df","free","ls"],1,"df는 파일 시스템 전체 사용량, du는 디렉터리·파일 사용량, free는 메모리 사용량.","4-3"],[3,"개발 환경 구축 시 하드웨어 환경 구성 요소가 아닌 것은?",["DB 서버","웹 서버","클라이언트 PC","컴파일러"],3,"컴파일러는 소프트웨어 개발 도구다. 하드웨어 환경은 클라이언트와 서버(웹·WAS·DB·파일).","4-4"],[3,"운영체제와 응용 프로그램 사이에서 분산된 시스템 간 통신·데이터 교환을 중개하는 소프트웨어는?",["펌웨어","디바이스 드라이버","미들웨어","컴파일러"],2,"미들웨어: RPC, MOM, TP-Monitor, ORB, WAS 등.","4-4"],[3,"Gradle에 대한 설명으로 옳은 것은?",["Groovy·Kotlin 스크립트로 빌드를 정의하며 안드로이드의 기본 빌드 도구다","버전 관리 도구다","XML 파일 pom.xml로 빌드를 정의한다","C언어 전용 컴파일러다"],0,"Gradle은 build.gradle(Groovy)이나 build.gradle.kts(Kotlin)를 쓴다. pom.xml은 Maven.","4-4"],[3,"프로그램이 실행될 때 참조하는 설정 값(예: PATH, JAVA_HOME)을 운영체제에 저장해 두는 것은?",["인덱스","캐시","레지스트리 키","환경 변수"],3,"환경 변수는 개발 도구 실행 경로 설정 등에 쓴다. Linux는 export, Windows는 시스템 속성에서 설정한다.","4-4"],[3,"Java 프로그램을 개발하려면 설치해야 하는, 컴파일러(javac)와 실행 환경을 포함한 도구 모음은?",["JDK","JVM만","JSP","JRE만"],0,"JDK = JRE + 개발 도구(javac 등). JRE는 실행만 가능하다.","4-4"],[3,"차등 백업과 증분 백업을 비교한 설명으로 옳은 것은?",["차등 백업은 직전 증분 이후 변경분만 저장한다","복원은 증분 백업이 더 간단하다","두 방식의 백업 용량은 항상 같다","복원은 차등 백업이 더 간단하고, 매일 백업 용량은 증분 백업이 더 작다"],3,"차등은 전체 이후 누적이라 복원 시 2개만 필요, 증분은 하루치만이라 용량이 작다.","4-5"],[3,"재해가 일어났을 때 데이터 손실을 어느 시점까지 허용하는지 나타내는 지표는?",["RPO","MTTR","SLA","RTO"],0,"RPO(목표 복구 시점). RPO가 1시간이면 최대 1시간치 데이터 손실을 허용한다.","4-5"],[3,"Git에서 새 브랜치를 만들고 바로 그 브랜치로 이동하는 명령은?",["git push 브랜치명","git merge 브랜치명","git branch -d 브랜치명","git checkout -b 브랜치명"],3,"git checkout -b(또는 git switch -c)로 생성과 이동을 한 번에 한다. -d는 삭제.","4-6"],[3,"두 사람이 같은 파일의 같은 부분을 다르게 고쳐 병합할 수 없는 상태는?",["체크아웃(Checkout)","태그(Tag)","충돌(Conflict)","커밋(Commit)"],2,"충돌이 나면 직접 내용을 고친 뒤 다시 커밋한다.","4-6"]].map(([s,q,o,a,e,u])=>({s,q,o,a,e,u,t:"mc"})),note:"# 프로그래밍기능사 필기 요약노트\n\nNov 24, 2026 · @훈\n\n## 시험 개요\n\n필기는 4과목 통합 60문항, 60분 동안 풀고 60점(36문항) 이상이면 합격이다. 과목별 과락은 없다. 2026년부터 정보처리기능사가 프로그래밍기능사로 바뀌었고, 실기는 2026년 공지에서 작업형으로 바뀐다고 했지만, 2027~2029년 출제기준표의 검정방법은 필답형이다. 공단 예시문제도 경로·명령어·실행 결과·빈칸·SQL 답을 직접 쓰는 단답형이다.\n\n| 항목 | 내용 |\n| --- | --- |\n| 필기 과목 | 프로그래밍 언어 · 응용SW기초기술 · SQL 활용 · 정보시스템 기초기술 |\n| 방식 | CBT, 객관식 4지 택일 60문항, 60분 |\n| 합격 | 100점 만점에 60점 이상 |\n| 응시자격 | 제한 없음 |\n| 실기 | 기초프로그래밍 실무, 작업형, 1시간 30분 |\n\n**첫 회차 출제 경향**: Java·Python 코드, OSI 7계층, IP 주소, 데이터베이스, SQL 명령어, UNIX 명령어가 나왔다고 알려져 있다([시나공 Q&A](https://sinagong.co.kr/community/001003001/book-qnas/279552)).\n\n**공부 전략 (컴공 기준)**\n\n1. 코드 출력 문제(C·Java·Python)는 직접 손으로 추적하는 연습을 한다. 배점이 가장 확실한 영역이다.\n2. SQL은 문법을 외우고 SELECT 결과를 예측하는 연습을 한다.\n3. 낯선 용어(테스트 기법, 형상관리, 보안 공격)는 표로 외운다.\n4. 마지막 주에는 맨 아래 체크리스트로 훑고 CBT 모의고사를 3회 이상 푼다.\n\n**공식 출제기준(필기, 적용기간 2027.01.01~2029.12.31)의 주요항목**\n\n| 주요항목 | 세부항목 | 이 노트 |\n| --- | --- | --- |\n| 1. 프로그래밍 언어 활용 및 응용 | 구조적 프로그래밍(기초문법, 순차·선택·반복, 컴파일러), 객체지향(OOP, 상속, 다형성, 추상화, 동적 바인딩) | 1과목 |\n| 2. 응용SW 기초 기술 활용 | 네트워크 기초(프로토콜, OSI, IP, TCP/UDP), 데이터베이스 기초(개념, 데이터 모델링, E-R, DB 유형, 무결성, 자료구조) | 2과목 |\n| 3. 화면구현 및 UI 테스트 | UI/UX, UI 테스트 기법, HTML, CSS, JavaScript 기초 | 1-7, 2-4 |\n| 4. SQL 작성 및 활용 | 시스템 카탈로그, SELECT, 집합 연산자, DML·DDL·DCL, 트랜잭션 | 3과목 |\n| 5. 테스트 및 배포 | 단위·통합·블랙박스·화이트박스 테스트, 디버깅, DevOps, CI/CD | 4-1, 4-2 |\n| 6. 개발자 환경 구축 | 운영체제 개념·종류·기본 명령어, 개발환경 설정, 개발도구 | 4-3, 4-4 |\n| 7. 개발 환경 운영 지원 | 백업 용량 산정, 백업 종류와 복원, 소스코드 형상관리 | 4-5, 4-6 |\n\n출제기준에 없는 보안, 진법 변환, CPU 구조, 개발 방법론, 신기술 용어는 이 노트에서 뺐다.\n\n## 1과목 프로그래밍 언어\n\n코드 출력 결과 문제가 핵심이다. 연산자 우선순위, 반복문 횟수, 배열 인덱스, 오버라이딩을 정확히 추적할 수 있어야 한다.\n\n### 1-1. 언어 분류\n\n| 분류 | 특징 | 예 |\n| --- | --- | --- |\n| 구조적(절차적) | 순차·선택·반복 3구조, goto 지양, 함수 단위 | C, Pascal |\n| 객체지향 | 클래스·객체 중심, 재사용성 | Java, C++, Python, C# |\n| 스크립트 | 인터프리터로 실행, 컴파일 불필요 | JavaScript, Python, PHP, Perl, Shell |\n| 선언형 | 무엇을 원하는지 기술 | SQL, HTML, Prolog, Haskell, LISP |\n\n- **컴파일러**: 전체를 미리 번역, 실행 빠름, 목적 프로그램 생성 (C, C++)\n- **인터프리터**: 한 줄씩 번역·실행, 디버깅 쉬움, 목적 프로그램 없음 (Python, JavaScript)\n- **Java**: 바이트코드(.class)로 컴파일 후 JVM이 실행 → 플랫폼 독립성\n- 번역 순서: 원시 프로그램 → 컴파일러 → 목적 프로그램 → 링커 → 로드 모듈 → 로더 → 실행\n\n### 1-2. 공통 문법\n\n**데이터 타입 크기 (C/Java)**\n\n| 타입 | C | Java |\n| --- | --- | --- |\n| char | 1바이트 | 2바이트(유니코드) |\n| short | 2 | 2 |\n| int | 4 | 4 |\n| long | 4 또는 8(환경별) | 8 |\n| float | 4 | 4 |\n| double | 8 | 8 |\n| boolean | 없음(0/1) | 1 |\n\n**연산자 우선순위** (높음 → 낮음)\n\n1. 단항: `++` `--` `!` `~` `sizeof` (오른쪽→왼쪽 결합)\n2. 산술: `*` `/` `%` → `+` `-`\n3. 시프트: `\u003c\u003c` `>>`\n4. 관계: `\u003c` `\u003c=` `>` `>=` → `==` `!=`\n5. 비트: `&` → `^` → `|`\n6. 논리: `&&` → `||`\n7. 조건(삼항): `? :`\n8. 대입: `=` `+=` `-=` 등 (오른쪽→왼쪽)\n9. 순서: `,`\n\n암기법: **단산시관비논조대순**\n\n**자주 틀리는 포인트**\n\n- `a++`는 값을 쓰고 나서 증가, `++a`는 증가 후 사용\n- 정수 나눗셈 `7/2 = 3`, `-7/2 = -3`(C/Java는 0 방향 버림), Python은 `7//2 = 3`, `-7//2 = -4`\n- `%`: Java·C는 부호가 왼쪽 피연산자를 따름(`-7%3 = -1`), Python은 오른쪽을 따름(`-7%3 = 2`)\n- `&&`, `||`는 단축 평가: 앞에서 결과가 정해지면 뒤는 실행 안 함\n- 비트: `5 & 3 = 1`, `5 | 3 = 7`, `5 ^ 3 = 6`, `~5 = -6`, `1 \u003c\u003c 3 = 8`, `16 >> 2 = 4`\n- `switch`에 `break`가 없으면 아래 case까지 계속 실행(fall-through)\n- `do-while`은 조건과 상관없이 최소 1번 실행\n- `continue`는 다음 반복으로, `break`는 반복 탈출\n\n### 1-3. C언어\n\n- 서식 문자: `%d` 정수, `%f` 실수, `%c` 문자, `%s` 문자열, `%x` 16진수, `%o` 8진수, `%p` 주소, `%5d` 5칸 오른쪽 정렬, `%.2f` 소수점 2자리\n- 입출력: `printf`, `scanf(\"%d\", &a)`(주소 전달), `getchar`, `putchar`, `gets`, `puts`\n- 기억 클래스: `auto`(지역, 기본), `register`(CPU 레지스터), `static`(함수 끝나도 값 유지), `extern`(다른 파일의 전역 변수)\n- 문자열 끝에는 `'\\0'`(널 문자)이 붙는다. `char s[] = \"abc\";`는 4바이트\n- 문자열 함수(`string.h`): `strlen`(길이, `\\0` 제외), `strcpy`, `strcat`, `strcmp`(같으면 0)\n- 포인터: `&a` = a의 주소, `*p` = p가 가리키는 값. `arr[i]` = `*(arr + i)`\n- 포인터 연산: `p + 1`은 자료형 크기만큼 이동(int면 4바이트)\n- 구조체: `struct`로 서로 다른 타입 묶음. 일반 변수는 `s.name`, 포인터는 `p->name`\n- 동적 할당: `malloc`(할당), `free`(해제), `calloc`(0으로 초기화)\n- 전처리기: `#include`, `#define`(매크로), `#ifdef`\n\n```c\nint a[5] = {1, 2, 3, 4, 5};\nint *p = a;\nprintf(\"%d\", *(p + 2) + p[4]); // 3 + 5 = 8\n```\n\n### 1-4. Java\n\n- 클래스 = 설계도, 객체(인스턴스) = `new`로 만든 실체\n- 생성자: 클래스 이름과 같고 반환형 없음. `this`는 자기 객체, `super`는 부모\n- 상속: `extends`(단일 상속만), 인터페이스는 `implements`(다중 구현 가능)\n- 자식 객체 생성 시 **부모 생성자가 먼저** 실행된다\n- 오버로딩: 같은 이름, 매개변수 개수·타입이 다름 (한 클래스 안)\n- 오버라이딩: 부모 메서드를 자식이 같은 시그니처로 재정의\n- `Parent p = new Child(); p.show();` → **자식의 show()** 실행(동적 바인딩). 단, static 메서드와 필드는 참조 타입(부모) 기준\n- 접근 제어자: `public`(전체) > `protected`(같은 패키지 + 자식) > `default`(같은 패키지) > `private`(같은 클래스)\n- `static`: 객체 없이 클래스명으로 접근, 모든 객체가 공유\n- `final`: 변수는 상수, 메서드는 오버라이딩 금지, 클래스는 상속 금지\n- 추상 클래스(`abstract`): 추상 메서드 포함 가능, 객체 생성 불가\n- 인터페이스: 모든 메서드가 기본적으로 추상, 변수는 `public static final`\n- 문자열: `==`는 주소 비교, `equals()`는 내용 비교. `String`은 불변 객체\n- 배열: `int[] a = new int[3];` 길이는 `a.length`, 문자열 길이는 `s.length()`\n- 배열·객체는 참조를 넘기므로 메서드 안에서 바꾸면 원본도 바뀜다\n\n```java\nclass A { void f() { System.out.print(\"A\"); } }\nclass B extends A { void f() { System.out.print(\"B\"); } }\nA x = new B(); x.f(); // B\n```\n\n### 1-5. Python\n\n- 동적 타이핑, 들여쓰기로 블록 구분, 세미콜론 불필요\n- 자료형: `list [ ]`(변경 가능), `tuple ( )`(변경 불가), `dict {k: v}`, `set { }`(중복 제거, 순서 없음)\n- 슬라이싱 `s[시작:끝:간격]`: 끝은 포함 안 함. `s[::-1]`은 뒤집기, `s[-1]`은 마지막\n- `range(1, 10, 2)` → 1, 3, 5, 7, 9 (10은 포함 안 함)\n- 리스트 메서드: `append`(끝에 추가), `insert(i, x)`, `extend`(리스트 이어 붙임), `remove(x)`(값 삭제), `pop()`(마지막 꺼냄), `sort`, `reverse`, `index`, `count`\n- 문자열: `split`, `join`, `upper`, `lower`, `replace`, `strip`, `find`\n- 연산자: `**` 거듭제곱, `//` 몫, `in` 포함 여부, `is` 같은 객체 여부, 논리는 `and` `or` `not`\n- 함수: `def`, 기본 매개변수, `lambda x: x * 2`, 여러 값 반환(튜플)\n- 클래스: `class`, 생성자 `__init__(self)`, 메서드 첫 매개변수는 `self`\n- `print(a, b, sep=\",\", end=\"\")`: sep은 구분자, end는 끝 문자(기본 줄바꿈)\n\n```python\na = [1, 2, 3, 4, 5]\nprint(a[1:4], a[::2], sum(a[-2:])) # [2, 3, 4] [1, 3, 5] 9\n```\n\n### 1-6. 객체지향 특징\n\n| 개념 | 의미 |\n| --- | --- |\n| 캡슐화 | 데이터와 함수를 묶고 외부에 숨김(정보 은닉) |\n| 상속 | 부모의 속성·메서드를 물려받음 |\n| 다형성 | 같은 메시지에 객체마다 다르게 반응(오버로딩·오버라이딩) |\n| 추상화 | 필요한 특징만 간추림 |\n| 메시지 | 객체에게 동작을 요청하는 것 |\n\n구성 요소: 클래스, 객체, 속성(attribute), 메서드, 메시지, 인스턴스.\n\n### 1-7. 웹 프로그래밍 (HTML·JavaScript)\n\n- HTML은 구조를 표시하는 마크업 언어. 주요 태그: `\u003chtml>` `\u003chead>` `\u003ctitle>` `\u003cbody>` `\u003ch1>~\u003ch6>` `\u003cp>` `\u003ca href>` `\u003cimg src alt>` `\u003ctable>\u003ctr>\u003ctd>` `\u003cul>\u003col>\u003cli>` `\u003cform>` `\u003cinput>` `\u003cdiv>` `\u003cspan>` `\u003cbr>`\n- `\u003cinput type>`: text, password, radio, checkbox, submit, button, file, hidden\n- `\u003cform method>`: GET(URL에 데이터 노출, 길이 제한) / POST(본문에 담음)\n- CSS는 스타일(색, 크기, 배치). 선택자: 태그 `p`, 클래스 `.name`, 아이디 `#name`\n- JavaScript는 브라우저에서 실행되는 스크립트 언어. 변수 `var`(함수 스코프), `let`(블록, 재할당 가능), `const`(재할당 불가)\n- JS `==`는 타입 변환 후 비교, `===`는 타입까지 비교 (`\"1\" == 1` true, `\"1\" === 1` false)\n- DOM: `document.getElementById()`, 이벤트 `onclick`, `onload`, `onchange`\n- 출력: `alert()`, `console.log()`, `document.write()`\n\n### 1-8. 예외 처리\n\n- 예외(Exception)는 실행 중 발생하는 오류. 프로그램이 멈추지 않게 처리한다\n- Java: `try { } catch (Exception e) { } finally { }` — finally는 예외 여부와 상관없이 항상 실행. 직접 발생 `throw`, 떠넘기기 `throws`\n- Python: `try / except / else / finally`, 직접 발생 `raise`. else는 예외가 없을 때만 실행\n- Java 주요 예외: `ArithmeticException`(0으로 나눔), `ArrayIndexOutOfBoundsException`, `NullPointerException`, `NumberFormatException`, `ClassCastException`\n- Python 주요 예외: `ZeroDivisionError`, `IndexError`, `KeyError`, `ValueError`, `TypeError`, `NameError`\n- Checked 예외(컴파일 시 처리 강제, IOException 등) vs Unchecked(RuntimeException 계열)\n\n### 1-9. 라이브러리\n\n- 라이브러리는 자주 쓰는 함수·클래스를 모아둔 것. 표준 라이브러리(기본 탑재) vs 외부 라이브러리(별도 설치)\n- C 헤더: `stdio.h`(입출력), `stdlib.h`(malloc, rand, atoi), `string.h`(문자열), `math.h`(수학), `time.h`(시간)\n- Java 패키지: `java.lang`(기본, 자동 import: String, Math, System), `java.util`(컨렉션: ArrayList, HashMap, Scanner), `java.io`(입출력), `java.net`(네트워크)\n- Python 모듈: `math`, `random`, `datetime`, `os`, `sys`, `re`(정규식), 가져오기는 `import`, `from ... import`\n- 프레임워크와 차이: 라이브러리는 개발자가 호출, 프레임워크는 틀이 개발자 코드를 호출(제어의 역전, IoC)\n\n## 2과목 응용SW 기초기술\n\n네트워크(OSI·IP·TCP/UDP), 데이터베이스 기초(모델링·E-R·무결성), 자료구조, UI/UX·CSS가 나온다. 서브넷 계산과 계층별 장비·프로토콜은 확실히 외우자.\n\n### 2-1. 네트워크\n\n**OSI 7계층** (아래부터: 물데네전세표응)\n\n| 계층 | 역할 | 단위 | 장비·프로토콜 |\n| --- | --- | --- | --- |\n| 7 응용 | 사용자 서비스 | 데이터 | HTTP, FTP, SMTP, DNS, Telnet |\n| 6 표현 | 코드 변환, 암호화, 압축 | 데이터 | JPEG, MPEG, ASCII |\n| 5 세션 | 연결 설정·유지·동기화(체크포인트) | 데이터 | NetBIOS, RPC |\n| 4 전송 | 종단 간 신뢰성, 흐름·오류 제어 | 세그먼트 | TCP, UDP |\n| 3 네트워크 | 경로 설정(라우팅), 논리 주소(IP) | 패킷 | 라우터, IP, ICMP, ARP |\n| 2 데이터 링크 | 인접 노드 간 전송, MAC 주소, 오류 검출 | 프레임 | 스위치, 브리지, Ethernet, HDLC |\n| 1 물리 | 비트를 전기 신호로 | 비트 | 리피터, 허브, 케이블 |\n\n**TCP/IP 4계층**: 응용(OSI 5\\~7) → 전송(4) → 인터넷(3) → 네트워크 액세스(1\\~2).\n\n- TCP: 연결형, 신뢰성(순서·재전송 보장), 3-way handshake(SYN → SYN+ACK → ACK)\n- UDP: 비연결형, 빠름, 신뢰성 낮음(스트리밍, DNS 조회)\n- ARP: IP → MAC 변환 / RARP: MAC → IP / ICMP: 오류 메시지(ping)\n- DHCP: IP 자동 할당 / DNS: 도메인 → IP / NAT: 사설 IP ↔ 공인 IP 변환\n- 포트 번호: FTP 20·21, SSH 22, Telnet 23, SMTP 25, DNS 53, HTTP 80, POP3 110, IMAP 143, HTTPS 443\n\n**IP 주소 (IPv4)**: 32비트, 8비트씩 4개를 점(.)으로 구분.\n\n| 클래스 | 첫 옥텋 범위 | 기본 서브넷 마스크 | 용도 |\n| --- | --- | --- | --- |\n| A | 0\\~127 | 255.0.0.0 (/8) | 대규모 |\n| B | 128\\~191 | 255.255.0.0 (/16) | 중규모 |\n| C | 192\\~223 | 255.255.255.0 (/24) | 소규모 |\n| D | 224\\~239 | 없음 | 멀티캐스트 |\n| E | 240\\~255 | 없음 | 연구용 |\n\n- 127.0.0.1 = 루프백(자기 자신)\n- 사설 IP: 10.0.0.0/8, 172.16.0.0\\~172.31.255.255, 192.168.0.0/16\n- 서브넷팅: /26 = 255.255.255.192 → 호스트 비트 6개 → 2⁶ = 64개 중 네트워크·브로드캐스트 주소 2개 빼고 **사용 가능 62개**\n- 예) 192.168.1.70/26 → 네트워크 192.168.1.64, 브로드캐스트 192.168.1.127\n- IPv6: 128비트, 16비트씩 8개를 콜론(:)으로 구분, 16진수 표기. 유니캐스트·멀티캐스트·애니캐스트 (브로드캐스트 없음), 보안(IPsec) 기본\n\n**네트워크 기타**\n\n- 토폴로지: 성형(중앙 허브), 버스형(한 케이블), 링형(원형), 트리형, 망형(모두 연결, n(n-1)/2개 회선)\n- 범위: LAN(근거리) \u003c MAN(도시) \u003c WAN(광역)\n- 전송 방식: 단방향(TV), 반이중(무전기), 전이중(전화)\n- 교환 방식: 회선 교환(전용 경로), 패킷 교환(가상 회선 / 데이터그램)\n- 오류 검출: 패리티, CRC, 해밍 코드(오류 정정까지 가능)\n\n### 2-2. 데이터베이스 기초\n\n- 데이터베이스: 통합·저장·운영·공용 데이터. DBMS 필수 기능은 정의·조작·제어\n- 데이터 모델링 3단계: 개념적(E-R 다이어그램, DBMS와 무관) → 논리적(테이블·키·정규화, 특정 데이터 모델에 맞춤) → 물리적(특정 DBMS의 저장 구조·인덱스·데이터 타입)\n- E-R 다이어그램 기호: 사각형 = 개체, 마름모 = 관계, 타원 = 속성, 밑줄 타원 = 기본키 속성, 이중 타원 = 다중값 속성\n- 관계 유형: 1:1, 1:N, N:M\n- DB 유형: 계층형(트리), 망형(그래프), 관계형(테이블, SQL), 객체지향형, NoSQL(키-값, 문서, 컬럼, 그래프)\n- 무결성: 개체(기본키 NULL·중복 불가), 참조(외래키는 참조 대상에 있거나 NULL), 도메인(허용 범위 안의 값) → 자세한 내용은 3-4\n\n### 2-3. 자료구조 기본\n\n| 구분 | 자료구조 | 특징 |\n| --- | --- | --- |\n| 선형 | 배열 | 같은 타입을 연속 저장, 인덱스로 바로 접근 |\n| 선형 | 연결 리스트 | 노드가 다음 노드 주소(포인터)를 가짐, 삽입·삭제 쉬움 |\n| 선형 | 스택 | 후입선출(LIFO), push·pop. 함수 호출, 되돌리기 |\n| 선형 | 큐 | 선입선출(FIFO), enqueue·dequeue. 작업 대기열 |\n| 선형 | 데크 | 양쪽 끝에서 삽입·삭제 |\n| 비선형 | 트리 | 계층 구조. 루트, 단말(리프), 차수, 깊이 |\n| 비선형 | 그래프 | 정점과 간선. 방향·무방향 |\n\n- 이진 트리 순회: 전위(루트-왼-오), 중위(왼-루트-오), 후위(왼-오-루트)\n- 스택 예) push A, B, C 후 pop → C / 큐 예) A, B, C 넣은 뒤 삭제 → A\n\n### 2-4. UI/UX와 화면 구현\n\n\n- UI 유형: CLI(명령어), GUI(그래픽), NUI(터치·음성 등 자연스러운 동작), OUI(사물 자체가 인터페이스)\n- UI 설계 원칙: 직관성(바로 알 수 있음), 유효성(목적 달성), 학습성(쉽게 배움), 유연성(실수 최소화)\n- 설계 도구: 와이어프레임(레이아웃 뼈대), 목업(실제와 비슷한 정적 화면), 스토리보드(화면 + 설명 + 흐름, 최종 산출물), 프로토타입(동적 견본), 유스케이스\n- UX: 사용자가 느끼는 경험. UI는 수단, UX는 경험 전체\n- UI 테스트: 사용성 테스트, 크로스 브라우징(여러 브라우저에서 동일하게 보이는지), 반응형 확인, 웹 접근성(장애인·고령자)\n- 표준: ISO/IEC 9126 → 25010 (품질 특성: 기능성, 신뢰성, 사용성, 효율성, 유지보수성, 이식성)\n- CSS 적용 방법: 인라인(`style=\"\"`), 내부(`\u003cstyle>`), 외부(`\u003clink rel=\"stylesheet\">`)\n- CSS 우선순위: 인라인 > 아이디(`#id`) > 클래스(`.class`) > 태그\n- 박스 모델: content → padding → border → margin\n\n## 3과목 SQL 활용\n\nSQL 문법 분류(DDL·DML·DCL)와 SELECT 결과 예측이 핵심이다. 정규화, 키, 무결성, 트랜잭션 성질은 용어 그대로 나온다.\n\n### 3-1. 데이터베이스 기초\n\n- 데이터베이스 정의: 통합된(중복 최소화), 저장된(보조기억장치), 운영(업무에 필수), 공용(여러 사용자 공유) 데이터\n- 특징: 실시간 접근, 계속적 변화, 동시 공유, 내용에 의한 참조\n- DBMS 필수 기능: 정의(Definition), 조작(Manipulation), 제어(Control)\n- 장점: 중복 최소화, 일관성·무결성·보안 유지, 데이터 독립성 / 단점: 비용, 백업·회복 복잡\n- 스키마 3단계: 외부(사용자별 관점, 서브 스키마) → 개념(전체 논리 구조, 기관 하나에 하나) → 내부(물리적 저장 구조)\n- 데이터 독립성: 논리적 독립성(개념 변경이 외부에 영향 없음), 물리적 독립성(내부 변경이 개념에 영향 없음)\n- 데이터 사전(시스템 카탈로그): DB 객체 정보를 담은 메타데이터. 사용자는 조회만 가능, 갱신은 DBMS가 자동으로\n- DBA(데이터베이스 관리자): 스키마 정의, 보안·권한, 백업·회복, 성능 관리\n\n### 3-2. 데이터베이스 설계\n\n- 순서: 요구 분석 → 개념적 설계(E-R 다이어그램, DBMS 독립) → 논리적 설계(테이블·정규화, 특정 데이터 모델 종속) → 물리적 설계(저장 구조·인덱스, 특정 DBMS 종속) → 구현\n- E-R 다이어그램 기호: 사각형=개체, 마름모=관계, 타원=속성, 밑줄 타원=기본키 속성, 이중 타원=다중값 속성, 선=연결\n- 관계 유형: 1:1, 1:N, N:M\n- 데이터 모델 종류: 계층형(트리), 망형(그래프), 관계형(테이블), 객체지향형\n- 데이터 모델 구성 3요소: 구조, 연산, 제약조건\n\n### 3-3. 관계형 모델 용어\n\n| 용어 | 뜻 | 테이블 용어 |\n| --- | --- | --- |\n| 릴레이션 | 표 전체 | 테이블 |\n| 튜플 | 한 행 | 행(레코드) |\n| 속성(attribute) | 한 열 | 열(컬럼) |\n| 도메인 | 속성이 가질 수 있는 값의 범위 | 데이터 타입·제약 |\n| 차수(Degree) | 속성의 개수 | 열 개수 |\n| 카디널리티(Cardinality) | 튜플의 개수 | 행 개수 |\n\n- 릴레이션 특징: 튜플 중복 없음, 튜플·속성 순서 없음, 속성값은 원자값(더 나눌 수 없음)\n- 예: 5열 10행 테이블 → 차수 5, 카디널리티 10\n\n### 3-4. 키와 무결성\n\n| 키 | 설명 |\n| --- | --- |\n| 후보키 | 튜플을 유일하게 식별. 유일성 + 최소성 |\n| 기본키(PK) | 후보키 중 선택한 하나. NULL·중복 불가 |\n| 대체키 | 기본키로 선택되지 않은 후보키 |\n| 슈퍼키 | 유일성만 만족(최소성 X) |\n| 외래키(FK) | 다른 테이블의 기본키를 참조하는 속성 |\n\n- 개체 무결성: 기본키는 NULL·중복 불가\n- 참조 무결성: 외래키 값은 참조 테이블의 기본키에 있거나 NULL\n- 도메인 무결성: 속성값은 정의된 도메인 범위 안에서\n- 참조 무결성 옵션: `CASCADE`(함께 삭제·변경), `SET NULL`, `RESTRICT`(참조 중이면 거부)\n\n### 3-5. 정규화와 이상\n\n- 이상(Anomaly): 중복 때문에 생기는 문제. 삽입 이상(불필요한 값도 함께 넣어야 함), 삭제 이상(필요한 값도 같이 지워짐), 갱신 이상(일부만 바뀌어 불일치)\n- 함수적 종속 X → Y: X 값이 정해지면 Y 값이 하나로 정해짐 (학번 → 이름)\n\n| 단계 | 조건 (암기: 도부이결다조) |\n| --- | --- |\n| 1NF | 모든 속성값이 원자값(반복·다중값 제거) |\n| 2NF | 부분 함수적 종속 제거(복합키 일부에만 종속된 속성 분리) |\n| 3NF | 이행적 종속 제거(A→B, B→C일 때 A→C 제거) |\n| BCNF | 모든 결정자가 후보키 |\n| 4NF | 다치 종속 제거 |\n| 5NF | 조인 종속 제거 |\n\n- 반정규화: 성능을 위해 일부러 중복을 허용하는 것(테이블 통합·분할, 중복 속성 추가)\n\n### 3-6. SQL 분류\n\n| 분류 | 명령어 | 용도 |\n| --- | --- | --- |\n| DDL(정의어) | CREATE, ALTER, DROP, TRUNCATE, RENAME | 테이블·뷰·인덱스 구조 정의 |\n| DML(조작어) | SELECT, INSERT, UPDATE, DELETE | 데이터 조회·변경 |\n| DCL(제어어) | GRANT, REVOKE | 권한 부여·회수 |\n| TCL(트랜잭션 제어) | COMMIT, ROLLBACK, SAVEPOINT | 트랜잭션 확정·취소 (DCL에 포함하기도 함) |\n\n**DDL**\n\n```sql\nCREATE TABLE 학생 (\n  학번 CHAR(8) PRIMARY KEY,\n  이름 VARCHAR(20) NOT NULL,\n  학과코드 CHAR(3) REFERENCES 학과(코드),\n  학년 INT CHECK (학년 BETWEEN 1 AND 4)\n);\nALTER TABLE 학생 ADD 전화 VARCHAR(15);\nDROP TABLE 학생 CASCADE;\n```\n\n- 제약조건: `PRIMARY KEY`, `FOREIGN KEY ... REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`\n- `DROP`(구조까지 삭제) vs `TRUNCATE`(구조는 남기고 데이터만 전부 삭제) vs `DELETE`(DML, 조건별 삭제, 롤백 가능)\n- `CASCADE`는 참조하는 것까지 함께, `RESTRICT`는 참조 중이면 거부\n- 뷰(VIEW): 가상 테이블. `CREATE VIEW`로 만들고 ALTER로는 수정 불가(DROP 후 재생성). 보안·논리적 독립성 제공, 삽입·수정에 제약\n- 인덱스: 검색 속도 향상, `CREATE [UNIQUE] INDEX 이름 ON 테이블(열)`. 삽입·수정이 잦으면 오히려 느려짐\n\n**DML**\n\n```sql\nINSERT INTO 학생 (학번, 이름) VALUES ('20260001', '김철수');\nUPDATE 학생 SET 학년 = 2 WHERE 학번 = '20260001';\nDELETE FROM 학생 WHERE 학년 = 4;\n```\n\n- `UPDATE`·`DELETE`에 WHERE가 없으면 **전체 행**에 적용\n- 키워드 짝: INSERT **INTO** \\~ **VALUES** / UPDATE \\~ **SET** / DELETE **FROM**\n\n**SELECT 구조와 실행 순서**\n\n```sql\nSELECT 학과, COUNT(*) AS 인원, AVG(점수)\nFROM 학생\nWHERE 학년 >= 2\nGROUP BY 학과\nHAVING COUNT(*) >= 3\nORDER BY 인원 DESC;\n```\n\n실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.\n\n- `DISTINCT`: 중복 제거 / `*`: 모든 열 / `AS`: 별칭\n- 비교: `=`, `\u003c>`(같지 않음), `BETWEEN a AND b`(양끝 포함), `IN (…)`, `IS NULL`(`= NULL`은 틀린 문법)\n- `LIKE`: `%`는 0글자 이상, `_`는 정확히 1글자. `'김%'`=김으로 시작, `'_민%'`=둘째 글자가 민\n- 집계 함수: `COUNT`, `SUM`, `AVG`, `MAX`, `MIN`. NULL은 계산에서 제외(단 `COUNT(*)`는 NULL 행도 셈)\n- WHERE는 행 조건(집계 함수 못 씀), HAVING은 그룹 조건(집계 함수 사용)\n- `ORDER BY`: 기본 ASC(오름차순), DESC는 내림차순\n- 하위 질의: `WHERE 점수 > (SELECT AVG(점수) FROM 학생)`, `IN`, `EXISTS`, `ANY`, `ALL`\n- 집합 연산: `UNION`(합집합, 중복 제거), `UNION ALL`(중복 포함), `INTERSECT`(교집합), `EXCEPT`/`MINUS`(차집합)\n\n**조인**\n\n```sql\nSELECT s.이름, d.학과명\nFROM 학생 s INNER JOIN 학과 d ON s.학과코드 = d.코드;\n```\n\n- INNER JOIN: 양쪽에 모두 있는 행만\n- LEFT OUTER JOIN: 왼쪽은 전부, 오른쪽은 없으면 NULL (RIGHT는 반대, FULL은 양쪽 전부)\n- CROSS JOIN: 카티션 곱(행 수 = m × n)\n- SELF JOIN: 같은 테이블끼리(직원-관리자)\n- 자연 조인(NATURAL JOIN): 같은 이름의 열로 자동 조인, 중복 열 제거\n\n**DCL**\n\n```sql\nGRANT SELECT, UPDATE ON 학생 TO user1 WITH GRANT OPTION;\nREVOKE UPDATE ON 학생 FROM user1 CASCADE;\n```\n\n- `WITH GRANT OPTION`: 받은 권한을 다른 사용자에게도 나눠줄 수 있음\n- 짝: GRANT \\~ **TO** / REVOKE \\~ **FROM**\n\n### 3-7. 시스템 카탈로그와 집합 연산자\n\n- 시스템 카탈로그(데이터 사전): 테이블·컬럼·인덱스·뷰·사용자·권한 같은 DB 객체 정보를 담은 메타데이터. DBMS가 자동으로 갱신하고 사용자는 조회(SELECT)만 한다\n- 조회 예: Oracle `USER_TABLES`(내 테이블), `USER_TAB_COLUMNS`(컬럼), `USER_INDEXES`, `USER_VIEWS` / MySQL `information_schema.TABLES`, `DESC 테이블명`(구조)\n\n| 집합 연산자 | 결과 |\n| --- | --- |\n| UNION | 합집합, 중복 행은 한 번만 |\n| UNION ALL | 합집합, 중복 포함 |\n| INTERSECT | 교집합 |\n| EXCEPT (Oracle은 MINUS) | 차집합 |\n\n- 두 SELECT의 컬럼 개수와 데이터 타입이 맞아야 한다. ORDER BY는 맨 마지막에 한 번만\n\n### 3-8. 트랜잭션과 회복\n\n- 트랜잭션: 하나의 논리적 작업 단위(계좌 이체 = 출금 + 입금)\n\n| ACID | 의미 |\n| --- | --- |\n| 원자성(Atomicity) | 전부 실행되거나 전혀 안 되거나 (Commit/Rollback) |\n| 일관성(Consistency) | 실행 후에도 DB가 일관된 상태 유지 |\n| 독립성(Isolation) | 실행 중인 트랜잭션에 다른 트랜잭션이 끼어들 수 없음 |\n| 영속성(Durability) | 커밋된 결과는 영구 반영 |\n\n- 상태: 활동 → 부분 완료 → 완료(커밋) / 실패 → 철회(롤백)\n- 회복 기법: 즉시 갱신(Undo + Redo), 지연 갱신(Redo만), 체크포인트, 그림자 페이지(Undo 불필요)\n- Redo = 로그로 다시 실행(커밋된 것), Undo = 취소(커밋 안 된 것)\n- 병행 제어: 로킹(Locking, 로킹 단위가 크면 병행성↓ 오버헤드↓), 2단계 로킹(확장 → 축소), 타임스탬프, 낸관적 기법(검증)\n- 병행 제어 실패 문제: 갱신 분실, 현황 파악 오류, 모순성, 연쇄 복귀\n\n### 3-9. 절차형 SQL\n\n- 프로시저: 일련의 SQL을 저장해 호출, 반환값 없을 수 있음 (`CALL`/`EXECUTE`)\n- 사용자 정의 함수: 반드시 값 1개 반환(`RETURN`)\n- 트리거: INSERT·UPDATE·DELETE 같은 이벤트가 발생하면 자동 실행. 트리거 안에서는 COMMIT/ROLLBACK 불가\n- 커서: 여러 행 결과를 한 행씩 처리(OPEN → FETCH → CLOSE)\n\n## 4과목 정보시스템 기초기술\n\n테스트·디버깅, DevOps·CI/CD, 운영체제와 명령어, 개발환경, 백업·복원, 형상관리가 나온다.\n\n### 4-1. 애플리케이션 테스트와 디버깅\n\n\n- 테스트 원리: 결함 존재 증명(없음은 증명 못 함), 완벽한 테스트 불가능, 결함 집중(파레토 80:20), 살충제 패러독스(같은 테스트 반복하면 결함 못 찾음), 오류-부재의 궁식, 정황 의존성, 조기 테스트\n- 검증(Verification): 제품을 올바르게 만들었나(개발자 관점) / 확인(Validation): 올바른 제품을 만들었나(사용자 관점)\n- 정적 테스트(실행 안 함: 동료 검토, 워크스루, 인스펙션) / 동적 테스트(실행함: 화이트박스, 블랙박스)\n\n| 구분 | 화이트박스 | 블랙박스 |\n| --- | --- | --- |\n| 관점 | 내부 구조·로직 | 기능·명세(입출력) |\n| 기법 | 기초 경로, 제어 구조(조건·루프·데이터 흐름), 커버리지(구문·결정·조건·MC/DC) | 동치 분할, 경계값 분석, 원인-효과 그래프, 오류 예측, 비교 |\n\n- 순환 복잡도(McCabe) V(G) = 간선 수 − 노드 수 + 2 (또는 영역 수 + 1 또는 조건 수 + 1)\n- 테스트 레벨(V-모델): 단위(모듈) → 통합(인터페이스) → 시스템(전체 기능·성능) → 인수(사용자 요구사항)\n- 인수 테스트: 알파(개발자 장소에서 사용자가) / 베타(사용자 환경에서 여러 사용자가)\n- 통합 테스트: 하향식(상위부터, **스텁** 필요) / 상향식(하위부터, **드라이버** 필요) / 빅뱅(한꺼번에)\n- 회귀 테스트: 수정 후 다른 부분에 새 오류가 없는지 다시 확인\n- 테스트 오라클: 기대 결과를 판단하는 기준(참, 샘플링, 휴리스틱, 일관성 검사)\n- 테스트 케이스 구성: 식별자, 테스트 항목, 입력 데이터, 예상 결과, 테스트 환경, 전제 조건\n- 경계값 예: 입력 1\\~100이 유효하면 0, 1, 100, 101을 테스트한다\n- 디버깅: 오류의 원인을 찾아 고치는 과정. 중단점(Breakpoint)으로 실행을 멈추고, 한 줄씩 실행(Step Over/Into)하며 변수 값을 확인(Watch)한다\n- 로그 출력(`print`, `console.log`)으로 실행 흐름과 값을 확인하는 것도 디버깅 방법이다\n\n### 4-2. 애플리케이션 배포 (DevOps·CI/CD)\n\n- DevOps: 개발(Development)과 운영(Operations)을 통합해 협업과 자동화로 빠르고 안정적으로 배포하는 문화·방법\n- CI(지속적 통합): 코드를 공유 저장소에 자주 합치고 그때마다 자동 빌드·테스트\n- CD(지속적 전달·배포): 테스트를 통과한 결과물을 배포 가능한 상태로 유지하거나(전달) 운영 환경까지 자동 배포(배포)\n- 파이프라인: 코드 커밋 → 빌드 → 테스트 → 배포\n- 도구: Jenkins(CI 서버), GitHub Actions, GitLab CI, Docker(컨테이너), Kubernetes(컨테이너 운영)\n\n### 4-3. 운영체제 기초 활용\n\n\n- 운영체제(OS)는 하드웨어와 사용자 사이의 인터페이스. 자원(CPU, 메모리, 입출력, 파일) 관리\n- 성능 평가 기준: 처리 능력(Throughput) ↑, 반환 시간(Turnaround Time) ↓, 사용 가능도(Availability) ↑, 신뢰도(Reliability) ↑\n- 구성: 제어 프로그램(감시, 작업 관리, 데이터 관리) + 처리 프로그램(언어 번역, 서비스, 문제)\n- 커널: OS의 핵심, 항상 메모리에 상주. 셸(Shell): 사용자 명령을 해석하는 명령어 해석기\n\n**운영 방식**\n\n| 방식 | 특징 |\n| --- | --- |\n| 일괄 처리 | 일정량·기간 모아서 한 번에 처리(급여 계산) |\n| 실시간 | 요청 즉시 처리(예약, 은행) |\n| 시분할 | CPU 시간을 쪼개 여러 사용자가 번갈아 사용 |\n| 다중 프로그래밍 | 여러 프로그램을 메모리에 올려 CPU 1개로 번갈아 실행 |\n| 다중 처리 | CPU 여러 개로 동시에 처리 |\n| 분산 처리 | 네트워크로 연결된 여러 컴퓨터가 나눠 처리 |\n\n발달 순서: 일괄 → 실시간 → 다중 프로그래밍·시분할·다중 처리 → 분산 처리.\n\n**프로세스·메모리 기본 개념** (출제기준 '운영체제 개념'에 해당, 계산 문제보다 용어 위주로)\n\n- 프로세스 = 실행 중인 프로그램, 스레드 = 프로세스 안의 실행 단위\n- 프로세스 상태: 생성 → 준비 → 실행 → 대기 → 종료\n- 교착 상태 4조건: 상호 배제, 점유와 대기, 비선점, 환형 대기\n- 가상 기억장치: 페이징(같은 크기), 세그먼테이션(논리 단위). 스래싱은 페이지 교체가 지나치게 잦은 현상\n\n**운영체제 종류**\n\n| 종류 | 특징 |\n| --- | --- |\n| Windows | 마이크로소프트, GUI 중심, PC에서 가장 많이 씀 |\n| Linux | 오픈소스 커널, 서버에서 많이 씀(Ubuntu, CentOS 등) |\n| UNIX | 다중 사용자·다중 작업, 대부분 C로 작성 |\n| macOS / iOS | 애플 운영체제 |\n| Android | 리눅스 커널 기반 모바일 OS |\n\n\n- 구성: 커널(프로세스·메모리·파일 관리), 셸(명령어 해석: sh, bash, csh, ksh), 유틸리티\n- 특징: 다중 사용자·다중 작업, 대부분 C로 작성(이식성 높음), 트리 구조 파일 시스템, 대소문자 구분\n- 디렉터리: `/`(루트), `/bin`(기본 명령어), `/etc`(설정 파일), `/home`(사용자), `/dev`(장치), `/tmp`(임시), `/var`(로그)\n- inode: 파일의 소유자, 크기, 권한, 위치 등 정보를 담은 구조체 (파일 이름은 없음)\n\n| 명령어 | 기능 |\n| --- | --- |\n| `ls` | 목록 보기 (`-l` 자세히, `-a` 숨김 파일) |\n| `cd` / `pwd` | 디렉터리 이동 / 현재 경로 |\n| `mkdir` / `rmdir` | 디렉터리 생성 / 빈 디렉터리 삭제 |\n| `cp` / `mv` / `rm` | 복사 / 이동·이름 변경 / 삭제 (`rm -r` 하위 포함) |\n| `cat` | 파일 내용 출력 |\n| `more` / `less` / `head` / `tail` | 화면 단위 출력 / 앞부분 / 끝부분 |\n| `chmod` | 권한 변경 |\n| `chown` / `chgrp` | 소유자 / 그룹 변경 |\n| `ps` / `kill` | 프로세스 보기 / 종료 |\n| `grep` | 파일에서 문자열 찾기 |\n| `find` | 파일 찾기 |\n| `fork` / `exec` | 자식 프로세스 복제 / 새 프로그램 실행 |\n| `mount` / `umount` | 파일 시스템 연결 / 해제 |\n| `tar` / `gzip` | 묶기 / 압축 |\n| `man` | 도움말 |\n| `who` / `whoami` | 접속자 / 현재 사용자 |\n| `ifconfig` / `ping` | 네트워크 설정 / 연결 확인 |\n\n**권한 (chmod)**: `-rwxr-xr--` = 소유자(rwx=7) 그룹(r-x=5) 기타(r--=4) → `chmod 754 file`. r=4, w=2, x=1. 예) `chmod 644` = rw-r--r--.\n\n**리다이렉션·파이프**: `>` 덮어쓰기, `>>` 이어쓰기, `\u003c` 입력, `|` 앞 명령 결과를 다음 명령 입력으로 (`ls | grep txt`).\n\n**Windows 대응 명령어**: `dir`(=ls), `copy`(=cp), `del`(=rm), `type`(=cat), `cls`(화면 지움), `ipconfig`(=ifconfig), `attrib`(속성 변경).\n\n### 4-4. 개발환경 구축\n\n- 하드웨어 환경: 클라이언트(PC, 모바일) + 서버(웹 서버, WAS, DB 서버, 파일 서버)\n- 웹 서버: 정적 콘텐츠(HTML, 이미지) 처리 — Apache, Nginx, IIS\n- WAS: 동적 콘텐츠·비즈니스 로직 처리 — Tomcat, JBoss, WebLogic, JEUS\n- DB 서버: Oracle, MySQL, MariaDB, MS-SQL, PostgreSQL\n- 소프트웨어 환경: 시스템 SW(OS, DBMS, JVM) + 개발 SW(요구사항 관리, 설계·모델링, 구현, 테스트, 형상관리, 빌드 도구)\n- IDE(통합 개발 환경): 편집·컴파일·디버깅을 한 곳에서 — Eclipse, IntelliJ, Visual Studio, VS Code\n- 빌드 도구: Ant(XML, 규칙 없음), Maven(pom.xml, 의존성 관리), Gradle(Groovy/Kotlin 스크립트, 안드로이드 기본), Jenkins(CI 서버)\n- 미들웨어: OS와 응용 프로그램 사이에서 통신·연결을 담당 — RPC, MOM(메시지 지향), TP-Monitor(트랜잭션 처리), ORB(객체), WAS\n- 가상화·컨테이너: VM(하이퍼바이저 위에 OS 통째로), Docker(OS 커널 공유, 가벼움), Kubernetes(컨테이너 오케스트레이션)\n\n### 4-5. 개발 환경 백업 및 복원\n\n| 백업 종류 | 저장 대상 | 복원에 필요한 것 |\n| --- | --- | --- |\n| 전체 백업 | 모든 데이터 | 전체 백업 1개 |\n| 차등 백업 | 마지막 전체 백업 이후 바뀐 것 전부(누적) | 전체 + 가장 최근 차등 1개 |\n| 증분 백업 | 직전 백업(전체·증분) 이후 바뀐 것만 | 전체 + 그 뒤 모든 증분 |\n\n- 백업 속도·용량: 증분이 가장 빠르고 작다. 복원 속도: 전체 > 차등 > 증분\n- 백업 용량 산정 예: 전체 100GB, 하루 변경 10GB, 일요일 전체 + 6일 증분 → 100 + 10 × 6 = 160GB. 6일 차등이면 10 + 20 + … + 60 = 210GB를 더해 310GB\n- 백업 시스템: 테이프, 디스크(NAS·SAN), 클라우드. 원본과 다른 장소에 보관(원격지 백업)\n- 복원 목표: RTO(복구까지 걸리는 시간), RPO(복구 시점, 데이터 손실 허용 범위)\n\n### 4-6. 소스코드 형상관리\n\n\n- 형상관리(SCM): 개발 과정의 변경 사항을 관리·통제. 절차: 식별 → 통제 → 감사 → 기록(보고)\n- 버전 관리 방식: 공유 폴더(RCS, SCCS), 클라이언트/서버(CVS, SVN), 분산 저장소(Git, Mercurial, Bitkeeper)\n- 용어: 저장소(Repository), 체크아웃(받기), 커밋(올리기), 임포트(최초 등록), 동기화(Update), 브랜치, 병합(Merge), 충돌(Conflict), 베이스라인(기준선)\n- Git 명령어: `init`(생성), `clone`(복제), `add`(스테이징), `commit`(로컬 저장), `push`(원격 업로드), `pull`(원격 가져와 병합), `fetch`(가져오기만), `branch`, `checkout`/`switch`, `merge`, `status`, `log`\n- Git 영역: 작업 디렉터리 → (add) → 스테이징 영역 → (commit) → 로컬 저장소 → (push) → 원격 저장소\n- CI/CD: 지속적 통합(코드를 자주 합치고 자동 빌드·테스트), 지속적 배포(자동으로 운영 환경에 배포)\n- 패키징: 사용자 중심, 모듈화, 다양한 환경 고려. 작업 순서: 기능 식별 → 모듈화 → 빌드 진행 → 사용자 환경 분석 → 패키징 및 변경 개선 → 배포\n- 릴리즈 노트: 버전, 추가·수정 기능, 버그 수정 내용을 사용자에게 알리는 문서 (헤더, 개요, 목적, 이슈 요약, 재현 항목, 수정/개선, 면책 조항)\n- 배포 도구: 빌드 도구(Maven, Gradle), 형상관리(Git), 패키징 도구, CI 도구(Jenkins)\n\n## 시험 직전 암기 체크리스트\n\n시험 전날 이 목록만 다시 보고, 설명 못 하는 항목은 위 본문으로 돌아가자.\n\n- [ ] 연산자 우선순위: 단산시관비논조대순\n- [ ] `a++` vs `++a`, 정수 나눗셈·`%` 부호 (C/Java vs Python)\n- [ ] C 포인터 `*(p+i)` = `p[i]`, 문자열 끝 `\\0`\n- [ ] Java 오버라이딩 → 자식 메서드 실행(동적 바인딩), 부모 생성자 먼저\n- [ ] 접근 제어자 4종 범위, 추상 클래스 vs 인터페이스\n- [ ] Python 슬라이싱·`range` 끝값 미포함\n- [ ] 컴파일러 vs 인터프리터\n- [ ] HTML 태그, CSS 선택자·우선순위, JS `==` vs `===`\n- [ ] OSI 7계층: 물데네전세표응 + 계층별 장비·프로토콜\n- [ ] TCP vs UDP, ARP/ICMP/DHCP/DNS, 주요 포트 번호\n- [ ] IP 클래스 범위, 서브넷 호스트 수 = 2ⁿ − 2\n- [ ] 데이터 모델링 3단계, E-R 기호\n- [ ] 스택(LIFO) vs 큐(FIFO), 트리 용어와 순회\n- [ ] 키 5종, 무결성 3종, 정규화: 도부이결다조\n- [ ] SQL 분류(DDL·DML·DCL·TCL), SELECT 실행 순서, WHERE vs HAVING\n- [ ] UNION vs UNION ALL vs INTERSECT vs EXCEPT, 조인 종류\n- [ ] DROP vs TRUNCATE vs DELETE, ACID\n- [ ] 단위→통합→시스템→인수, 블랙박스 vs 화이트박스, 스텁 vs 드라이버\n- [ ] 구문·결정·조건 커버리지, 디버깅 중단점\n- [ ] DevOps, CI vs CD, Jenkins\n- [ ] 커널 vs 셸, OS 종류, Linux 명령어와 `chmod` 숫자\n- [ ] 웹 서버 vs WAS, 빌드 도구(Maven·Gradle)\n- [ ] 전체·차등·증분 백업과 복원에 필요한 것, 백업 용량 계산\n- [ ] Git 흐름(add → commit → push), 형상관리 절차\n",cards:[{"f": "구조적(절차적)", "b": "특징: 순차·선택·반복 3구조, goto 지양, 함수 단위 / 예: C, Pascal", "u": "1-1. 언어 분류"}, {"f": "객체지향", "b": "특징: 클래스·객체 중심, 재사용성 / 예: Java, C++, Python, C#", "u": "1-1. 언어 분류"}, {"f": "스크립트", "b": "특징: 인터프리터로 실행, 컴파일 불필요 / 예: JavaScript, Python, PHP, Perl, Shell", "u": "1-1. 언어 분류"}, {"f": "선언형", "b": "특징: 무엇을 원하는지 기술 / 예: SQL, HTML, Prolog, Haskell, LISP", "u": "1-1. 언어 분류"}, {"f": "컴파일러", "b": "전체를 미리 번역, 실행 빠름, 목적 프로그램 생성 (C, C++)", "u": "1-1. 언어 분류"}, {"f": "인터프리터", "b": "한 줄씩 번역·실행, 디버깅 쉬움, 목적 프로그램 없음 (Python, JavaScript)", "u": "1-1. 언어 분류"}, {"f": "Java", "b": "바이트코드(.class)로 컴파일 후 JVM이 실행 → 플랫폼 독립성", "u": "1-1. 언어 분류"}, {"f": "번역 순서", "b": "원시 프로그램 → 컴파일러 → 목적 프로그램 → 링커 → 로드 모듈 → 로더 → 실행", "u": "1-1. 언어 분류"}, {"f": "char", "b": "C: 1바이트 / Java: 2바이트(유니코드)", "u": "1-2. 공통 문법"}, {"f": "short", "b": "C: 2 / Java: 2", "u": "1-2. 공통 문법"}, {"f": "int", "b": "C: 4 / Java: 4", "u": "1-2. 공통 문법"}, {"f": "long", "b": "C: 4 또는 8(환경별) / Java: 8", "u": "1-2. 공통 문법"}, {"f": "float", "b": "C: 4 / Java: 4", "u": "1-2. 공통 문법"}, {"f": "double", "b": "C: 8 / Java: 8", "u": "1-2. 공통 문법"}, {"f": "boolean", "b": "C: 없음(0/1) / Java: 1", "u": "1-2. 공통 문법"}, {"f": "비트", "b": "`5 & 3 = 1`, `5 | 3 = 7`, `5 ^ 3 = 6`, `~5 = -6`, `1 \u003c\u003c 3 = 8`, `16 >> 2 = 4`", "u": "1-2. 공통 문법"}, {"f": "서식 문자", "b": "`%d` 정수, `%f` 실수, `%c` 문자, `%s` 문자열, `%x` 16진수, `%o` 8진수, `%p` 주소, `%5d` 5칸 오른쪽 정렬, `%.2f` 소수점 2자리", "u": "1-3. C언어"}, {"f": "입출력", "b": "`printf`, `scanf(\"%d\", &a)`(주소 전달), `getchar`, `putchar`, `gets`, `puts`", "u": "1-3. C언어"}, {"f": "기억 클래스", "b": "`auto`(지역, 기본), `register`(CPU 레지스터), `static`(함수 끝나도 값 유지), `extern`(다른 파일의 전역 변수)", "u": "1-3. C언어"}, {"f": "포인터", "b": "`&a` = a의 주소, `*p` = p가 가리키는 값. `arr[i]` = `*(arr + i)`", "u": "1-3. C언어"}, {"f": "포인터 연산", "b": "`p + 1`은 자료형 크기만큼 이동(int면 4바이트)", "u": "1-3. C언어"}, {"f": "구조체", "b": "`struct`로 서로 다른 타입 묶음. 일반 변수는 `s.name`, 포인터는 `p->name`", "u": "1-3. C언어"}, {"f": "동적 할당", "b": "`malloc`(할당), `free`(해제), `calloc`(0으로 초기화)", "u": "1-3. C언어"}, {"f": "전처리기", "b": "`#include`, `#define`(매크로), `#ifdef`", "u": "1-3. C언어"}, {"f": "생성자", "b": "클래스 이름과 같고 반환형 없음. `this`는 자기 객체, `super`는 부모", "u": "1-4. Java"}, {"f": "상속", "b": "`extends`(단일 상속만), 인터페이스는 `implements`(다중 구현 가능)", "u": "1-4. Java"}, {"f": "오버로딩", "b": "같은 이름, 매개변수 개수·타입이 다름 (한 클래스 안)", "u": "1-4. Java"}, {"f": "오버라이딩", "b": "부모 메서드를 자식이 같은 시그니처로 재정의", "u": "1-4. Java"}, {"f": "접근 제어자", "b": "`public`(전체) > `protected`(같은 패키지 + 자식) > `default`(같은 패키지) > `private`(같은 클래스)", "u": "1-4. Java"}, {"f": "인터페이스", "b": "모든 메서드가 기본적으로 추상, 변수는 `public static final`", "u": "1-4. Java"}, {"f": "문자열", "b": "`==`는 주소 비교, `equals()`는 내용 비교. `String`은 불변 객체", "u": "1-4. Java"}, {"f": "배열", "b": "`int[] a = new int[3];` 길이는 `a.length`, 문자열 길이는 `s.length()`", "u": "1-4. Java"}, {"f": "자료형", "b": "`list [ ]`(변경 가능), `tuple ( )`(변경 불가), `dict {k: v}`, `set { }`(중복 제거, 순서 없음)", "u": "1-5. Python"}, {"f": "리스트 메서드", "b": "`append`(끝에 추가), `insert(i, x)`, `extend`(리스트 이어 붙임), `remove(x)`(값 삭제), `pop()`(마지막 꺼냄), `sort`, `reverse`, `index`, `count`", "u": "1-5. Python"}, {"f": "문자열", "b": "`split`, `join`, `upper`, `lower`, `replace`, `strip`, `find`", "u": "1-5. Python"}, {"f": "연산자", "b": "`**` 거듭제곱, `//` 몫, `in` 포함 여부, `is` 같은 객체 여부, 논리는 `and` `or` `not`", "u": "1-5. Python"}, {"f": "함수", "b": "`def`, 기본 매개변수, `lambda x: x * 2`, 여러 값 반환(튜플)", "u": "1-5. Python"}, {"f": "클래스", "b": "`class`, 생성자 `__init__(self)`, 메서드 첫 매개변수는 `self`", "u": "1-5. Python"}, {"f": "캡슐화", "b": "의미: 데이터와 함수를 묶고 외부에 숨김(정보 은닉)", "u": "1-6. 객체지향 특징"}, {"f": "상속", "b": "의미: 부모의 속성·메서드를 물려받음", "u": "1-6. 객체지향 특징"}, {"f": "다형성", "b": "의미: 같은 메시지에 객체마다 다르게 반응(오버로딩·오버라이딩)", "u": "1-6. 객체지향 특징"}, {"f": "추상화", "b": "의미: 필요한 특징만 간추림", "u": "1-6. 객체지향 특징"}, {"f": "메시지", "b": "의미: 객체에게 동작을 요청하는 것", "u": "1-6. 객체지향 특징"}, {"f": "HTML은 구조를 표시하는 마크업 언어. 주요 태그", "b": "`\u003chtml>` `\u003chead>` `\u003ctitle>` `\u003cbody>` `\u003ch1>~\u003ch6>` `\u003cp>` `\u003ca href>` `\u003cimg src alt>` `\u003ctable>\u003ctr>\u003ctd>` `\u003cul>\u003col>\u003cli>` `\u003cform>` `\u003cinput>` `\u003cdiv>` `\u003cspan>` `\u003cbr>`", "u": "1-7. 웹 프로그래밍 (HTML·JavaScript)"}, {"f": "CSS는 스타일(색, 크기, 배치). 선택자", "b": "태그 `p`, 클래스 `.name`, 아이디 `#name`", "u": "1-7. 웹 프로그래밍 (HTML·JavaScript)"}, {"f": "DOM", "b": "`document.getElementById()`, 이벤트 `onclick`, `onload`, `onchange`", "u": "1-7. 웹 프로그래밍 (HTML·JavaScript)"}, {"f": "출력", "b": "`alert()`, `console.log()`, `document.write()`", "u": "1-7. 웹 프로그래밍 (HTML·JavaScript)"}, {"f": "Java", "b": "`try { } catch (Exception e) { } finally { }` — finally는 예외 여부와 상관없이 항상 실행. 직접 발생 `throw`, 떠넘기기 `throws`", "u": "1-8. 예외 처리"}, {"f": "Python", "b": "`try / except / else / finally`, 직접 발생 `raise`. else는 예외가 없을 때만 실행", "u": "1-8. 예외 처리"}, {"f": "Java 주요 예외", "b": "`ArithmeticException`(0으로 나눔), `ArrayIndexOutOfBoundsException`, `NullPointerException`, `NumberFormatException`, `ClassCastException`", "u": "1-8. 예외 처리"}, {"f": "Python 주요 예외", "b": "`ZeroDivisionError`, `IndexError`, `KeyError`, `ValueError`, `TypeError`, `NameError`", "u": "1-8. 예외 처리"}, {"f": "C 헤더", "b": "`stdio.h`(입출력), `stdlib.h`(malloc, rand, atoi), `string.h`(문자열), `math.h`(수학), `time.h`(시간)", "u": "1-9. 라이브러리"}, {"f": "Java 패키지", "b": "`java.lang`(기본, 자동 import: String, Math, System), `java.util`(컨렉션: ArrayList, HashMap, Scanner), `java.io`(입출력), `java.net`(네트워크)", "u": "1-9. 라이브러리"}, {"f": "Python 모듈", "b": "`math`, `random`, `datetime`, `os`, `sys`, `re`(정규식), 가져오기는 `import`, `from ... import`", "u": "1-9. 라이브러리"}, {"f": "프레임워크와 차이", "b": "라이브러리는 개발자가 호출, 프레임워크는 틀이 개발자 코드를 호출(제어의 역전, IoC)", "u": "1-9. 라이브러리"}, {"f": "7 응용", "b": "역할: 사용자 서비스 / 단위: 데이터 / 장비·프로토콜: HTTP, FTP, SMTP, DNS, Telnet", "u": "2-1. 네트워크"}, {"f": "6 표현", "b": "역할: 코드 변환, 암호화, 압축 / 단위: 데이터 / 장비·프로토콜: JPEG, MPEG, ASCII", "u": "2-1. 네트워크"}, {"f": "5 세션", "b": "역할: 연결 설정·유지·동기화(체크포인트) / 단위: 데이터 / 장비·프로토콜: NetBIOS, RPC", "u": "2-1. 네트워크"}, {"f": "4 전송", "b": "역할: 종단 간 신뢰성, 흐름·오류 제어 / 단위: 세그먼트 / 장비·프로토콜: TCP, UDP", "u": "2-1. 네트워크"}, {"f": "3 네트워크", "b": "역할: 경로 설정(라우팅), 논리 주소(IP) / 단위: 패킷 / 장비·프로토콜: 라우터, IP, ICMP, ARP", "u": "2-1. 네트워크"}, {"f": "2 데이터 링크", "b": "역할: 인접 노드 간 전송, MAC 주소, 오류 검출 / 단위: 프레임 / 장비·프로토콜: 스위치, 브리지, Ethernet, HDLC", "u": "2-1. 네트워크"}, {"f": "1 물리", "b": "역할: 비트를 전기 신호로 / 단위: 비트 / 장비·프로토콜: 리피터, 허브, 케이블", "u": "2-1. 네트워크"}, {"f": "TCP", "b": "연결형, 신뢰성(순서·재전송 보장), 3-way handshake(SYN → SYN+ACK → ACK)", "u": "2-1. 네트워크"}, {"f": "UDP", "b": "비연결형, 빠름, 신뢰성 낮음(스트리밍, DNS 조회)", "u": "2-1. 네트워크"}, {"f": "ARP", "b": "IP → MAC 변환 / RARP: MAC → IP / ICMP: 오류 메시지(ping)", "u": "2-1. 네트워크"}, {"f": "DHCP", "b": "IP 자동 할당 / DNS: 도메인 → IP / NAT: 사설 IP ↔ 공인 IP 변환", "u": "2-1. 네트워크"}, {"f": "포트 번호", "b": "FTP 20·21, SSH 22, Telnet 23, SMTP 25, DNS 53, HTTP 80, POP3 110, IMAP 143, HTTPS 443", "u": "2-1. 네트워크"}, {"f": "A", "b": "첫 옥텋 범위: 0\\~127 / 기본 서브넷 마스크: 255.0.0.0 (/8) / 용도: 대규모", "u": "2-1. 네트워크"}, {"f": "B", "b": "첫 옥텋 범위: 128\\~191 / 기본 서브넷 마스크: 255.255.0.0 (/16) / 용도: 중규모", "u": "2-1. 네트워크"}, {"f": "C", "b": "첫 옥텋 범위: 192\\~223 / 기본 서브넷 마스크: 255.255.255.0 (/24) / 용도: 소규모", "u": "2-1. 네트워크"}, {"f": "D", "b": "첫 옥텋 범위: 224\\~239 / 기본 서브넷 마스크: 없음 / 용도: 멀티캐스트", "u": "2-1. 네트워크"}, {"f": "E", "b": "첫 옥텋 범위: 240\\~255 / 기본 서브넷 마스크: 없음 / 용도: 연구용", "u": "2-1. 네트워크"}, {"f": "사설 IP", "b": "10.0.0.0/8, 172.16.0.0\\~172.31.255.255, 192.168.0.0/16", "u": "2-1. 네트워크"}, {"f": "서브넷팅", "b": "/26 = 255.255.255.192 → 호스트 비트 6개 → 2⁶ = 64개 중 네트워크·브로드캐스트 주소 2개 빼고 **사용 가능 62개**", "u": "2-1. 네트워크"}, {"f": "IPv6", "b": "128비트, 16비트씩 8개를 콜론(:)으로 구분, 16진수 표기. 유니캐스트·멀티캐스트·애니캐스트 (브로드캐스트 없음), 보안(IPsec) 기본", "u": "2-1. 네트워크"}, {"f": "토폴로지", "b": "성형(중앙 허브), 버스형(한 케이블), 링형(원형), 트리형, 망형(모두 연결, n(n-1)/2개 회선)", "u": "2-1. 네트워크"}, {"f": "범위", "b": "LAN(근거리) \u003c MAN(도시) \u003c WAN(광역)", "u": "2-1. 네트워크"}, {"f": "전송 방식", "b": "단방향(TV), 반이중(무전기), 전이중(전화)", "u": "2-1. 네트워크"}, {"f": "교환 방식", "b": "회선 교환(전용 경로), 패킷 교환(가상 회선 / 데이터그램)", "u": "2-1. 네트워크"}, {"f": "오류 검출", "b": "패리티, CRC, 해밍 코드(오류 정정까지 가능)", "u": "2-1. 네트워크"}, {"f": "데이터베이스", "b": "통합·저장·운영·공용 데이터. DBMS 필수 기능은 정의·조작·제어", "u": "2-2. 데이터베이스 기초"}, {"f": "데이터 모델링 3단계", "b": "개념적(E-R 다이어그램, DBMS와 무관) → 논리적(테이블·키·정규화, 특정 데이터 모델에 맞춤) → 물리적(특정 DBMS의 저장 구조·인덱스·데이터 타입)", "u": "2-2. 데이터베이스 기초"}, {"f": "E-R 다이어그램 기호", "b": "사각형 = 개체, 마름모 = 관계, 타원 = 속성, 밑줄 타원 = 기본키 속성, 이중 타원 = 다중값 속성", "u": "2-2. 데이터베이스 기초"}, {"f": "관계 유형", "b": "1:1, 1:N, N:M", "u": "2-2. 데이터베이스 기초"}, {"f": "DB 유형", "b": "계층형(트리), 망형(그래프), 관계형(테이블, SQL), 객체지향형, NoSQL(키-값, 문서, 컬럼, 그래프)", "u": "2-2. 데이터베이스 기초"}, {"f": "무결성", "b": "개체(기본키 NULL·중복 불가), 참조(외래키는 참조 대상에 있거나 NULL), 도메인(허용 범위 안의 값) → 자세한 내용은 3-4", "u": "2-2. 데이터베이스 기초"}, {"f": "이진 트리 순회", "b": "전위(루트-왼-오), 중위(왼-루트-오), 후위(왼-오-루트)", "u": "2-3. 자료구조 기본"}, {"f": "UI 유형", "b": "CLI(명령어), GUI(그래픽), NUI(터치·음성 등 자연스러운 동작), OUI(사물 자체가 인터페이스)", "u": "2-4. UI/UX와 화면 구현"}, {"f": "UI 설계 원칙", "b": "직관성(바로 알 수 있음), 유효성(목적 달성), 학습성(쉽게 배움), 유연성(실수 최소화)", "u": "2-4. UI/UX와 화면 구현"}, {"f": "설계 도구", "b": "와이어프레임(레이아웃 뼈대), 목업(실제와 비슷한 정적 화면), 스토리보드(화면 + 설명 + 흐름, 최종 산출물), 프로토타입(동적 견본), 유스케이스", "u": "2-4. UI/UX와 화면 구현"}, {"f": "UX", "b": "사용자가 느끼는 경험. UI는 수단, UX는 경험 전체", "u": "2-4. UI/UX와 화면 구현"}, {"f": "UI 테스트", "b": "사용성 테스트, 크로스 브라우징(여러 브라우저에서 동일하게 보이는지), 반응형 확인, 웹 접근성(장애인·고령자)", "u": "2-4. UI/UX와 화면 구현"}, {"f": "표준", "b": "ISO/IEC 9126 → 25010 (품질 특성: 기능성, 신뢰성, 사용성, 효율성, 유지보수성, 이식성)", "u": "2-4. UI/UX와 화면 구현"}, {"f": "CSS 적용 방법", "b": "인라인(`style=\"\"`), 내부(`\u003cstyle>`), 외부(`\u003clink rel=\"stylesheet\">`)", "u": "2-4. UI/UX와 화면 구현"}, {"f": "CSS 우선순위", "b": "인라인 > 아이디(`#id`) > 클래스(`.class`) > 태그", "u": "2-4. UI/UX와 화면 구현"}, {"f": "박스 모델", "b": "content → padding → border → margin", "u": "2-4. UI/UX와 화면 구현"}, {"f": "데이터베이스 정의", "b": "통합된(중복 최소화), 저장된(보조기억장치), 운영(업무에 필수), 공용(여러 사용자 공유) 데이터", "u": "3-1. 데이터베이스 기초"}, {"f": "특징", "b": "실시간 접근, 계속적 변화, 동시 공유, 내용에 의한 참조", "u": "3-1. 데이터베이스 기초"}, {"f": "DBMS 필수 기능", "b": "정의(Definition), 조작(Manipulation), 제어(Control)", "u": "3-1. 데이터베이스 기초"}, {"f": "장점", "b": "중복 최소화, 일관성·무결성·보안 유지, 데이터 독립성 / 단점: 비용, 백업·회복 복잡", "u": "3-1. 데이터베이스 기초"}, {"f": "스키마 3단계", "b": "외부(사용자별 관점, 서브 스키마) → 개념(전체 논리 구조, 기관 하나에 하나) → 내부(물리적 저장 구조)", "u": "3-1. 데이터베이스 기초"}, {"f": "데이터 독립성", "b": "논리적 독립성(개념 변경이 외부에 영향 없음), 물리적 독립성(내부 변경이 개념에 영향 없음)", "u": "3-1. 데이터베이스 기초"}, {"f": "데이터 사전(시스템 카탈로그)", "b": "DB 객체 정보를 담은 메타데이터. 사용자는 조회만 가능, 갱신은 DBMS가 자동으로", "u": "3-1. 데이터베이스 기초"}, {"f": "DBA(데이터베이스 관리자)", "b": "스키마 정의, 보안·권한, 백업·회복, 성능 관리", "u": "3-1. 데이터베이스 기초"}, {"f": "순서", "b": "요구 분석 → 개념적 설계(E-R 다이어그램, DBMS 독립) → 논리적 설계(테이블·정규화, 특정 데이터 모델 종속) → 물리적 설계(저장 구조·인덱스, 특정 DBMS 종속) → 구현", "u": "3-2. 데이터베이스 설계"}, {"f": "E-R 다이어그램 기호", "b": "사각형=개체, 마름모=관계, 타원=속성, 밑줄 타원=기본키 속성, 이중 타원=다중값 속성, 선=연결", "u": "3-2. 데이터베이스 설계"}, {"f": "데이터 모델 종류", "b": "계층형(트리), 망형(그래프), 관계형(테이블), 객체지향형", "u": "3-2. 데이터베이스 설계"}, {"f": "데이터 모델 구성 3요소", "b": "구조, 연산, 제약조건", "u": "3-2. 데이터베이스 설계"}, {"f": "릴레이션", "b": "뜻: 표 전체 / 테이블 용어: 테이블", "u": "3-3. 관계형 모델 용어"}, {"f": "튜플", "b": "뜻: 한 행 / 테이블 용어: 행(레코드)", "u": "3-3. 관계형 모델 용어"}, {"f": "속성(attribute)", "b": "뜻: 한 열 / 테이블 용어: 열(컬럼)", "u": "3-3. 관계형 모델 용어"}, {"f": "도메인", "b": "뜻: 속성이 가질 수 있는 값의 범위 / 테이블 용어: 데이터 타입·제약", "u": "3-3. 관계형 모델 용어"}, {"f": "차수(Degree)", "b": "뜻: 속성의 개수 / 테이블 용어: 열 개수", "u": "3-3. 관계형 모델 용어"}, {"f": "카디널리티(Cardinality)", "b": "뜻: 튜플의 개수 / 테이블 용어: 행 개수", "u": "3-3. 관계형 모델 용어"}, {"f": "릴레이션 특징", "b": "튜플 중복 없음, 튜플·속성 순서 없음, 속성값은 원자값(더 나눌 수 없음)", "u": "3-3. 관계형 모델 용어"}, {"f": "후보키", "b": "설명: 튜플을 유일하게 식별. 유일성 + 최소성", "u": "3-4. 키와 무결성"}, {"f": "기본키(PK)", "b": "설명: 후보키 중 선택한 하나. NULL·중복 불가", "u": "3-4. 키와 무결성"}, {"f": "대체키", "b": "설명: 기본키로 선택되지 않은 후보키", "u": "3-4. 키와 무결성"}, {"f": "슈퍼키", "b": "설명: 유일성만 만족(최소성 X)", "u": "3-4. 키와 무결성"}, {"f": "외래키(FK)", "b": "설명: 다른 테이블의 기본키를 참조하는 속성", "u": "3-4. 키와 무결성"}, {"f": "개체 무결성", "b": "기본키는 NULL·중복 불가", "u": "3-4. 키와 무결성"}, {"f": "참조 무결성", "b": "외래키 값은 참조 테이블의 기본키에 있거나 NULL", "u": "3-4. 키와 무결성"}, {"f": "도메인 무결성", "b": "속성값은 정의된 도메인 범위 안에서", "u": "3-4. 키와 무결성"}, {"f": "참조 무결성 옵션", "b": "`CASCADE`(함께 삭제·변경), `SET NULL`, `RESTRICT`(참조 중이면 거부)", "u": "3-4. 키와 무결성"}, {"f": "이상(Anomaly)", "b": "중복 때문에 생기는 문제. 삽입 이상(불필요한 값도 함께 넣어야 함), 삭제 이상(필요한 값도 같이 지워짐), 갱신 이상(일부만 바뀌어 불일치)", "u": "3-5. 정규화와 이상"}, {"f": "함수적 종속 X → Y", "b": "X 값이 정해지면 Y 값이 하나로 정해짐 (학번 → 이름)", "u": "3-5. 정규화와 이상"}, {"f": "1NF", "b": "조건 (암기: 도부이결다조): 모든 속성값이 원자값(반복·다중값 제거)", "u": "3-5. 정규화와 이상"}, {"f": "2NF", "b": "조건 (암기: 도부이결다조): 부분 함수적 종속 제거(복합키 일부에만 종속된 속성 분리)", "u": "3-5. 정규화와 이상"}, {"f": "3NF", "b": "조건 (암기: 도부이결다조): 이행적 종속 제거(A→B, B→C일 때 A→C 제거)", "u": "3-5. 정규화와 이상"}, {"f": "BCNF", "b": "조건 (암기: 도부이결다조): 모든 결정자가 후보키", "u": "3-5. 정규화와 이상"}, {"f": "4NF", "b": "조건 (암기: 도부이결다조): 다치 종속 제거", "u": "3-5. 정규화와 이상"}, {"f": "5NF", "b": "조건 (암기: 도부이결다조): 조인 종속 제거", "u": "3-5. 정규화와 이상"}, {"f": "반정규화", "b": "성능을 위해 일부러 중복을 허용하는 것(테이블 통합·분할, 중복 속성 추가)", "u": "3-5. 정규화와 이상"}, {"f": "DDL(정의어)", "b": "명령어: CREATE, ALTER, DROP, TRUNCATE, RENAME / 용도: 테이블·뷰·인덱스 구조 정의", "u": "3-6. SQL 분류"}, {"f": "DML(조작어)", "b": "명령어: SELECT, INSERT, UPDATE, DELETE / 용도: 데이터 조회·변경", "u": "3-6. SQL 분류"}, {"f": "DCL(제어어)", "b": "명령어: GRANT, REVOKE / 용도: 권한 부여·회수", "u": "3-6. SQL 분류"}, {"f": "TCL(트랜잭션 제어)", "b": "명령어: COMMIT, ROLLBACK, SAVEPOINT / 용도: 트랜잭션 확정·취소 (DCL에 포함하기도 함)", "u": "3-6. SQL 분류"}, {"f": "제약조건", "b": "`PRIMARY KEY`, `FOREIGN KEY ... REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`", "u": "3-6. SQL 분류"}, {"f": "뷰(VIEW)", "b": "가상 테이블. `CREATE VIEW`로 만들고 ALTER로는 수정 불가(DROP 후 재생성). 보안·논리적 독립성 제공, 삽입·수정에 제약", "u": "3-6. SQL 분류"}, {"f": "인덱스", "b": "검색 속도 향상, `CREATE [UNIQUE] INDEX 이름 ON 테이블(열)`. 삽입·수정이 잦으면 오히려 느려짐", "u": "3-6. SQL 분류"}, {"f": "키워드 짝", "b": "INSERT **INTO** \\~ **VALUES** / UPDATE \\~ **SET** / DELETE **FROM**", "u": "3-6. SQL 분류"}, {"f": "비교", "b": "`=`, `\u003c>`(같지 않음), `BETWEEN a AND b`(양끝 포함), `IN (…)`, `IS NULL`(`= NULL`은 틀린 문법)", "u": "3-6. SQL 분류"}, {"f": "집계 함수", "b": "`COUNT`, `SUM`, `AVG`, `MAX`, `MIN`. NULL은 계산에서 제외(단 `COUNT(*)`는 NULL 행도 셈)", "u": "3-6. SQL 분류"}, {"f": "하위 질의", "b": "`WHERE 점수 > (SELECT AVG(점수) FROM 학생)`, `IN`, `EXISTS`, `ANY`, `ALL`", "u": "3-6. SQL 분류"}, {"f": "집합 연산", "b": "`UNION`(합집합, 중복 제거), `UNION ALL`(중복 포함), `INTERSECT`(교집합), `EXCEPT`/`MINUS`(차집합)", "u": "3-6. SQL 분류"}, {"f": "INNER JOIN", "b": "양쪽에 모두 있는 행만", "u": "3-6. SQL 분류"}, {"f": "LEFT OUTER JOIN", "b": "왼쪽은 전부, 오른쪽은 없으면 NULL (RIGHT는 반대, FULL은 양쪽 전부)", "u": "3-6. SQL 분류"}, {"f": "CROSS JOIN", "b": "카티션 곱(행 수 = m × n)", "u": "3-6. SQL 분류"}, {"f": "SELF JOIN", "b": "같은 테이블끼리(직원-관리자)", "u": "3-6. SQL 분류"}, {"f": "자연 조인(NATURAL JOIN)", "b": "같은 이름의 열로 자동 조인, 중복 열 제거", "u": "3-6. SQL 분류"}, {"f": "시스템 카탈로그(데이터 사전)", "b": "테이블·컬럼·인덱스·뷰·사용자·권한 같은 DB 객체 정보를 담은 메타데이터. DBMS가 자동으로 갱신하고 사용자는 조회(SELECT)만 한다", "u": "3-7. 시스템 카탈로그와 집합 연산자"}, {"f": "조회 예", "b": "Oracle `USER_TABLES`(내 테이블), `USER_TAB_COLUMNS`(컬럼), `USER_INDEXES`, `USER_VIEWS` / MySQL `information_schema.TABLES`, `DESC 테이블명`(구조)", "u": "3-7. 시스템 카탈로그와 집합 연산자"}, {"f": "UNION", "b": "결과: 합집합, 중복 행은 한 번만", "u": "3-7. 시스템 카탈로그와 집합 연산자"}, {"f": "UNION ALL", "b": "결과: 합집합, 중복 포함", "u": "3-7. 시스템 카탈로그와 집합 연산자"}, {"f": "INTERSECT", "b": "결과: 교집합", "u": "3-7. 시스템 카탈로그와 집합 연산자"}, {"f": "EXCEPT (Oracle은 MINUS)", "b": "결과: 차집합", "u": "3-7. 시스템 카탈로그와 집합 연산자"}, {"f": "트랜잭션", "b": "하나의 논리적 작업 단위(계좌 이체 = 출금 + 입금)", "u": "3-8. 트랜잭션과 회복"}, {"f": "원자성(Atomicity)", "b": "의미: 전부 실행되거나 전혀 안 되거나 (Commit/Rollback)", "u": "3-8. 트랜잭션과 회복"}, {"f": "일관성(Consistency)", "b": "의미: 실행 후에도 DB가 일관된 상태 유지", "u": "3-8. 트랜잭션과 회복"}, {"f": "독립성(Isolation)", "b": "의미: 실행 중인 트랜잭션에 다른 트랜잭션이 끼어들 수 없음", "u": "3-8. 트랜잭션과 회복"}, {"f": "영속성(Durability)", "b": "의미: 커밋된 결과는 영구 반영", "u": "3-8. 트랜잭션과 회복"}, {"f": "상태", "b": "활동 → 부분 완료 → 완료(커밋) / 실패 → 철회(롤백)", "u": "3-8. 트랜잭션과 회복"}, {"f": "회복 기법", "b": "즉시 갱신(Undo + Redo), 지연 갱신(Redo만), 체크포인트, 그림자 페이지(Undo 불필요)", "u": "3-8. 트랜잭션과 회복"}, {"f": "병행 제어", "b": "로킹(Locking, 로킹 단위가 크면 병행성↓ 오버헤드↓), 2단계 로킹(확장 → 축소), 타임스탬프, 낸관적 기법(검증)", "u": "3-8. 트랜잭션과 회복"}, {"f": "병행 제어 실패 문제", "b": "갱신 분실, 현황 파악 오류, 모순성, 연쇄 복귀", "u": "3-8. 트랜잭션과 회복"}, {"f": "프로시저", "b": "일련의 SQL을 저장해 호출, 반환값 없을 수 있음 (`CALL`/`EXECUTE`)", "u": "3-9. 절차형 SQL"}, {"f": "사용자 정의 함수", "b": "반드시 값 1개 반환(`RETURN`)", "u": "3-9. 절차형 SQL"}, {"f": "트리거", "b": "INSERT·UPDATE·DELETE 같은 이벤트가 발생하면 자동 실행. 트리거 안에서는 COMMIT/ROLLBACK 불가", "u": "3-9. 절차형 SQL"}, {"f": "커서", "b": "여러 행 결과를 한 행씩 처리(OPEN → FETCH → CLOSE)", "u": "3-9. 절차형 SQL"}, {"f": "테스트 원리", "b": "결함 존재 증명(없음은 증명 못 함), 완벽한 테스트 불가능, 결함 집중(파레토 80:20), 살충제 패러독스(같은 테스트 반복하면 결함 못 찾음), 오류-부재의 궁식, 정황 의존성, 조기 테스트", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "검증(Verification)", "b": "제품을 올바르게 만들었나(개발자 관점) / 확인(Validation): 올바른 제품을 만들었나(사용자 관점)", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "정적 테스트(실행 안 함", "b": "동료 검토, 워크스루, 인스펙션) / 동적 테스트(실행함: 화이트박스, 블랙박스)", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "테스트 레벨(V-모델)", "b": "단위(모듈) → 통합(인터페이스) → 시스템(전체 기능·성능) → 인수(사용자 요구사항)", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "인수 테스트", "b": "알파(개발자 장소에서 사용자가) / 베타(사용자 환경에서 여러 사용자가)", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "통합 테스트", "b": "하향식(상위부터, **스텁** 필요) / 상향식(하위부터, **드라이버** 필요) / 빅뱅(한꺼번에)", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "회귀 테스트", "b": "수정 후 다른 부분에 새 오류가 없는지 다시 확인", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "테스트 오라클", "b": "기대 결과를 판단하는 기준(참, 샘플링, 휴리스틱, 일관성 검사)", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "테스트 케이스 구성", "b": "식별자, 테스트 항목, 입력 데이터, 예상 결과, 테스트 환경, 전제 조건", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "경계값 예", "b": "입력 1\\~100이 유효하면 0, 1, 100, 101을 테스트한다", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "디버깅", "b": "오류의 원인을 찾아 고치는 과정. 중단점(Breakpoint)으로 실행을 멈추고, 한 줄씩 실행(Step Over/Into)하며 변수 값을 확인(Watch)한다", "u": "4-1. 애플리케이션 테스트와 디버깅"}, {"f": "DevOps", "b": "개발(Development)과 운영(Operations)을 통합해 협업과 자동화로 빠르고 안정적으로 배포하는 문화·방법", "u": "4-2. 애플리케이션 배포 (DevOps·CI/CD)"}, {"f": "CI(지속적 통합)", "b": "코드를 공유 저장소에 자주 합치고 그때마다 자동 빌드·테스트", "u": "4-2. 애플리케이션 배포 (DevOps·CI/CD)"}, {"f": "CD(지속적 전달·배포)", "b": "테스트를 통과한 결과물을 배포 가능한 상태로 유지하거나(전달) 운영 환경까지 자동 배포(배포)", "u": "4-2. 애플리케이션 배포 (DevOps·CI/CD)"}, {"f": "파이프라인", "b": "코드 커밋 → 빌드 → 테스트 → 배포", "u": "4-2. 애플리케이션 배포 (DevOps·CI/CD)"}, {"f": "도구", "b": "Jenkins(CI 서버), GitHub Actions, GitLab CI, Docker(컨테이너), Kubernetes(컨테이너 운영)", "u": "4-2. 애플리케이션 배포 (DevOps·CI/CD)"}, {"f": "성능 평가 기준", "b": "처리 능력(Throughput) ↑, 반환 시간(Turnaround Time) ↓, 사용 가능도(Availability) ↑, 신뢰도(Reliability) ↑", "u": "4-3. 운영체제 기초 활용"}, {"f": "구성", "b": "제어 프로그램(감시, 작업 관리, 데이터 관리) + 처리 프로그램(언어 번역, 서비스, 문제)", "u": "4-3. 운영체제 기초 활용"}, {"f": "커널", "b": "OS의 핵심, 항상 메모리에 상주. 셸(Shell): 사용자 명령을 해석하는 명령어 해석기", "u": "4-3. 운영체제 기초 활용"}, {"f": "일괄 처리", "b": "특징: 일정량·기간 모아서 한 번에 처리(급여 계산)", "u": "4-3. 운영체제 기초 활용"}, {"f": "실시간", "b": "특징: 요청 즉시 처리(예약, 은행)", "u": "4-3. 운영체제 기초 활용"}, {"f": "시분할", "b": "특징: CPU 시간을 쪼개 여러 사용자가 번갈아 사용", "u": "4-3. 운영체제 기초 활용"}, {"f": "다중 프로그래밍", "b": "특징: 여러 프로그램을 메모리에 올려 CPU 1개로 번갈아 실행", "u": "4-3. 운영체제 기초 활용"}, {"f": "다중 처리", "b": "특징: CPU 여러 개로 동시에 처리", "u": "4-3. 운영체제 기초 활용"}, {"f": "분산 처리", "b": "특징: 네트워크로 연결된 여러 컴퓨터가 나눠 처리", "u": "4-3. 운영체제 기초 활용"}, {"f": "프로세스 상태", "b": "생성 → 준비 → 실행 → 대기 → 종료", "u": "4-3. 운영체제 기초 활용"}, {"f": "교착 상태 4조건", "b": "상호 배제, 점유와 대기, 비선점, 환형 대기", "u": "4-3. 운영체제 기초 활용"}, {"f": "가상 기억장치", "b": "페이징(같은 크기), 세그먼테이션(논리 단위). 스래싱은 페이지 교체가 지나치게 잦은 현상", "u": "4-3. 운영체제 기초 활용"}, {"f": "Windows", "b": "특징: 마이크로소프트, GUI 중심, PC에서 가장 많이 씀", "u": "4-3. 운영체제 기초 활용"}, {"f": "Linux", "b": "특징: 오픈소스 커널, 서버에서 많이 씀(Ubuntu, CentOS 등)", "u": "4-3. 운영체제 기초 활용"}, {"f": "UNIX", "b": "특징: 다중 사용자·다중 작업, 대부분 C로 작성", "u": "4-3. 운영체제 기초 활용"}, {"f": "macOS / iOS", "b": "특징: 애플 운영체제", "u": "4-3. 운영체제 기초 활용"}, {"f": "Android", "b": "특징: 리눅스 커널 기반 모바일 OS", "u": "4-3. 운영체제 기초 활용"}, {"f": "구성", "b": "커널(프로세스·메모리·파일 관리), 셸(명령어 해석: sh, bash, csh, ksh), 유틸리티", "u": "4-3. 운영체제 기초 활용"}, {"f": "특징", "b": "다중 사용자·다중 작업, 대부분 C로 작성(이식성 높음), 트리 구조 파일 시스템, 대소문자 구분", "u": "4-3. 운영체제 기초 활용"}, {"f": "디렉터리", "b": "`/`(루트), `/bin`(기본 명령어), `/etc`(설정 파일), `/home`(사용자), `/dev`(장치), `/tmp`(임시), `/var`(로그)", "u": "4-3. 운영체제 기초 활용"}, {"f": "inode", "b": "파일의 소유자, 크기, 권한, 위치 등 정보를 담은 구조체 (파일 이름은 없음)", "u": "4-3. 운영체제 기초 활용"}, {"f": "`ls`", "b": "기능: 목록 보기 (`-l` 자세히, `-a` 숨김 파일)", "u": "4-3. 운영체제 기초 활용"}, {"f": "`cd` / `pwd`", "b": "기능: 디렉터리 이동 / 현재 경로", "u": "4-3. 운영체제 기초 활용"}, {"f": "`mkdir` / `rmdir`", "b": "기능: 디렉터리 생성 / 빈 디렉터리 삭제", "u": "4-3. 운영체제 기초 활용"}, {"f": "`cp` / `mv` / `rm`", "b": "기능: 복사 / 이동·이름 변경 / 삭제 (`rm -r` 하위 포함)", "u": "4-3. 운영체제 기초 활용"}, {"f": "`cat`", "b": "기능: 파일 내용 출력", "u": "4-3. 운영체제 기초 활용"}, {"f": "`chmod`", "b": "기능: 권한 변경", "u": "4-3. 운영체제 기초 활용"}, {"f": "`chown` / `chgrp`", "b": "기능: 소유자 / 그룹 변경", "u": "4-3. 운영체제 기초 활용"}, {"f": "`ps` / `kill`", "b": "기능: 프로세스 보기 / 종료", "u": "4-3. 운영체제 기초 활용"}, {"f": "`grep`", "b": "기능: 파일에서 문자열 찾기", "u": "4-3. 운영체제 기초 활용"}, {"f": "`find`", "b": "기능: 파일 찾기", "u": "4-3. 운영체제 기초 활용"}, {"f": "`fork` / `exec`", "b": "기능: 자식 프로세스 복제 / 새 프로그램 실행", "u": "4-3. 운영체제 기초 활용"}, {"f": "`mount` / `umount`", "b": "기능: 파일 시스템 연결 / 해제", "u": "4-3. 운영체제 기초 활용"}, {"f": "`tar` / `gzip`", "b": "기능: 묶기 / 압축", "u": "4-3. 운영체제 기초 활용"}, {"f": "`man`", "b": "기능: 도움말", "u": "4-3. 운영체제 기초 활용"}, {"f": "`who` / `whoami`", "b": "기능: 접속자 / 현재 사용자", "u": "4-3. 운영체제 기초 활용"}, {"f": "`ifconfig` / `ping`", "b": "기능: 네트워크 설정 / 연결 확인", "u": "4-3. 운영체제 기초 활용"}, {"f": "하드웨어 환경", "b": "클라이언트(PC, 모바일) + 서버(웹 서버, WAS, DB 서버, 파일 서버)", "u": "4-4. 개발환경 구축"}, {"f": "웹 서버", "b": "정적 콘텐츠(HTML, 이미지) 처리 — Apache, Nginx, IIS", "u": "4-4. 개발환경 구축"}, {"f": "WAS", "b": "동적 콘텐츠·비즈니스 로직 처리 — Tomcat, JBoss, WebLogic, JEUS", "u": "4-4. 개발환경 구축"}, {"f": "DB 서버", "b": "Oracle, MySQL, MariaDB, MS-SQL, PostgreSQL", "u": "4-4. 개발환경 구축"}, {"f": "소프트웨어 환경", "b": "시스템 SW(OS, DBMS, JVM) + 개발 SW(요구사항 관리, 설계·모델링, 구현, 테스트, 형상관리, 빌드 도구)", "u": "4-4. 개발환경 구축"}, {"f": "IDE(통합 개발 환경)", "b": "편집·컴파일·디버깅을 한 곳에서 — Eclipse, IntelliJ, Visual Studio, VS Code", "u": "4-4. 개발환경 구축"}, {"f": "빌드 도구", "b": "Ant(XML, 규칙 없음), Maven(pom.xml, 의존성 관리), Gradle(Groovy/Kotlin 스크립트, 안드로이드 기본), Jenkins(CI 서버)", "u": "4-4. 개발환경 구축"}, {"f": "미들웨어", "b": "OS와 응용 프로그램 사이에서 통신·연결을 담당 — RPC, MOM(메시지 지향), TP-Monitor(트랜잭션 처리), ORB(객체), WAS", "u": "4-4. 개발환경 구축"}, {"f": "가상화·컨테이너", "b": "VM(하이퍼바이저 위에 OS 통째로), Docker(OS 커널 공유, 가벼움), Kubernetes(컨테이너 오케스트레이션)", "u": "4-4. 개발환경 구축"}, {"f": "전체 백업", "b": "저장 대상: 모든 데이터 / 복원에 필요한 것: 전체 백업 1개", "u": "4-5. 개발 환경 백업 및 복원"}, {"f": "차등 백업", "b": "저장 대상: 마지막 전체 백업 이후 바뀐 것 전부(누적) / 복원에 필요한 것: 전체 + 가장 최근 차등 1개", "u": "4-5. 개발 환경 백업 및 복원"}, {"f": "증분 백업", "b": "저장 대상: 직전 백업(전체·증분) 이후 바뀐 것만 / 복원에 필요한 것: 전체 + 그 뒤 모든 증분", "u": "4-5. 개발 환경 백업 및 복원"}, {"f": "백업 속도·용량", "b": "증분이 가장 빠르고 작다. 복원 속도: 전체 > 차등 > 증분", "u": "4-5. 개발 환경 백업 및 복원"}, {"f": "백업 용량 산정 예", "b": "전체 100GB, 하루 변경 10GB, 일요일 전체 + 6일 증분 → 100 + 10 × 6 = 160GB. 6일 차등이면 10 + 20 + … + 60 = 210GB를 더해 310GB", "u": "4-5. 개발 환경 백업 및 복원"}, {"f": "백업 시스템", "b": "테이프, 디스크(NAS·SAN), 클라우드. 원본과 다른 장소에 보관(원격지 백업)", "u": "4-5. 개발 환경 백업 및 복원"}, {"f": "복원 목표", "b": "RTO(복구까지 걸리는 시간), RPO(복구 시점, 데이터 손실 허용 범위)", "u": "4-5. 개발 환경 백업 및 복원"}, {"f": "형상관리(SCM)", "b": "개발 과정의 변경 사항을 관리·통제. 절차: 식별 → 통제 → 감사 → 기록(보고)", "u": "4-6. 소스코드 형상관리"}, {"f": "버전 관리 방식", "b": "공유 폴더(RCS, SCCS), 클라이언트/서버(CVS, SVN), 분산 저장소(Git, Mercurial, Bitkeeper)", "u": "4-6. 소스코드 형상관리"}, {"f": "용어", "b": "저장소(Repository), 체크아웃(받기), 커밋(올리기), 임포트(최초 등록), 동기화(Update), 브랜치, 병합(Merge), 충돌(Conflict), 베이스라인(기준선)", "u": "4-6. 소스코드 형상관리"}, {"f": "Git 명령어", "b": "`init`(생성), `clone`(복제), `add`(스테이징), `commit`(로컬 저장), `push`(원격 업로드), `pull`(원격 가져와 병합), `fetch`(가져오기만), `branch`, `checkout`/`switch`, `merge`, `status`, `log`", "u": "4-6. 소스코드 형상관리"}, {"f": "Git 영역", "b": "작업 디렉터리 → (add) → 스테이징 영역 → (commit) → 로컬 저장소 → (push) → 원격 저장소", "u": "4-6. 소스코드 형상관리"}, {"f": "CI/CD", "b": "지속적 통합(코드를 자주 합치고 자동 빌드·테스트), 지속적 배포(자동으로 운영 환경에 배포)", "u": "4-6. 소스코드 형상관리"}, {"f": "패키징", "b": "사용자 중심, 모듈화, 다양한 환경 고려. 작업 순서: 기능 식별 → 모듈화 → 빌드 진행 → 사용자 환경 분석 → 패키징 및 변경 개선 → 배포", "u": "4-6. 소스코드 형상관리"}, {"f": "릴리즈 노트", "b": "버전, 추가·수정 기능, 버그 수정 내용을 사용자에게 알리는 문서 (헤더, 개요, 목적, 이슈 요약, 재현 항목, 수정/개선, 면책 조항)", "u": "4-6. 소스코드 형상관리"}, {"f": "배포 도구", "b": "빌드 도구(Maven, Gradle), 형상관리(Git), 패키징 도구, CI 도구(Jenkins)", "u": "4-6. 소스코드 형상관리"}],unitMode:"h3"},
