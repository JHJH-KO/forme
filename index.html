/* ========== 연습 (과목·단원·약점·별표·오답·무한) ========== */
let pr=null;
function sessionQs(mode,k,arg){
  const e=EX[k];
  if(mode==="retry")return wrongIds(k).map(id=>({...getQ(id),_retry:true}));
  if(mode==="star")return shuffle(starIds(k).map(getQ));
  if(mode==="upr")return e.units[+arg]?pickQs(e.units[+arg].qs,15):[];
  if(mode==="weak"){const wq=wrongIds(k).filter(id=>QID[id]).slice(0,5).map(id=>({...QID[id],_retry:true}));const used=new Set(wq.map(q=>q.id));
    const units=weakUnits(k).slice(0,4).map(x=>x.u);const pool=units.flatMap(u=>u.qs).filter(q=>!used.has(q.id)&&!data.flag[q.id]);
    pool.sort((a,b)=>{const sa=data.stat[a.id],sb=data.stat[b.id],ra=sa?(sa.c+1)/(sa.c+sa.w+2):.5,rb=sb?(sb.c+1)/(sb.c+sb.w+2):.5;return ra-rb||Math.random()-.5});
    return shuffle([...wq,...pool.slice(0,15-wq.length)])}
  if(mode==="prac")return pickQs(arg==="all"?e.Q:e.Q.filter(q=>q.s===+arg-1),arg==="all"?20:15);
  return [];
}
function practice(key){
  const m=key.match(/^(prac|retry|gen|upr|ugen|weak|star)-(pf|ps|ad)(?:-(\d+|all))?$/);if(!m)return quiz();
  const [,mode,k,arg]=m,e=EX[k],isGen=mode==="gen"||mode==="ugen",backTo=mode==="upr"||mode==="ugen"?`unit-${k}-${arg}`:"quiz";
  if(!pr||pr.key!==key)pr={key,qs:isGen?[]:sessionQs(mode,k,arg),i:0,pick:{},right:0,done:0,saved:false};
  const pool0=isGen?(mode==="ugen"?(e.units[+arg]||{gens:[]}).gens:e.gen):null;
  if(isGen&&!pool0.length){setTabs("quiz");app.innerHTML=`<div class="hd">${back()}<h1>무한 문제</h1></div><p class="empty">이 단원엔 무한 문제 유형이 없어요.</p>`;bindBack(backTo);return}
  if(isGen&&pr.i>=pr.qs.length){const pool=pool0;const g=RNG.pick(pool),q=g.f(RNG);delete q.run;pr.qs.push({...q,id:"g-"+k+"-"+Date.now().toString(36)+Math.floor(Math.random()*1e4),ex:k,s:g.s,u:g.u,gen:true,gname:g.name})}
  const title={retry:"오답 다시 풀기",star:"별표 문제",weak:"약점 집중",gen:"무한 문제",ugen:"무한 문제",upr:"확인 문제",prac:arg==="all"?"전체 섞어 풀기":e.subj[+arg-1]}[mode];
  setTabs("quiz",false);
  if(!pr.qs.length){setTabs("quiz");app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)}</h1></div><p class="empty">풀 문제가 없어요.</p>`;bindBack(backTo);return}
  if(pr.i>=pr.qs.length||pr.end){
    const n=pr.done,sc=n?Math.round(pr.right/n*100):0;
    if(!pr.saved&&n){pr.saved=true;pushHist({t:Date.now(),ex:k,mode,label:mode==="upr"?`확인 문제 · ${e.units[+arg].title}`:title,score:sc,right:pr.right,total:n,pass:sc>=60});save()}
    setTabs("quiz");
    app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)}</h1></div><div class="card" style="text-align:center"><div class="big ${sc>=60?"pass":"fail"}">${sc}</div><p>${n}문항 중 ${pr.right}문항 정답</p>
    <p class="note">${mode==="retry"?`맞힌 문제는 오답노트에서 뺐어요. 남은 오답 ${wrongIds(k).length}개.`:"틀린 문제는 오답노트에 추가됐어요."}</p></div>
    ${foot(`<button id="bk2">${backTo==="quiz"?"문제 목록":"단원으로"}</button><button class="pri" id="ag">${mode==="retry"||mode==="star"?"다시 풀기":"새 문제로 계속"}</button>`)}`;
    bindBack(backTo);$("bk2").onclick=()=>go(backTo);$("ag").onclick=()=>{pr=null;practice(key)};return;
  }
  const q=pr.qs[pr.i],m2=pr.pick[pr.i],done=m2!==undefined,w=data.wrong[q.id],ok=done&&isRight(q,m2.v);
  const total=isGen?`${pr.right}/${pr.done}`:`${pr.i+1}/${pr.qs.length}`;
  app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)} · ${total}</h1>${isGen?'<button id="end">끝내기</button>':""}</div>${isGen?"":`<div class="prog"><i style="width:${pr.i/pr.qs.length*100}%"></i></div>`}
  <div class="card qcard${done?(ok?" good":" bad"):""}" id="qc"><div class="subj">${tagEx(k)} ${esc(e.subj[q.s])}${q.gen?` · <span class="gtag">${esc(q.gname||"생성 문제")}</span>`:""}${w?` · <span class="fail">${w.n}회 틀림</span>`:""}<span class="sp"></span>${starBtn(q)}</div>
  <div class="qt">${qhtml(q)}</div>
  ${q.t==="mc"?answerBox(q,done?m2.v:-1,done,done?(i=>i===q.a?"o":i===m2.v?"x":""):null):answerBox(q,done?m2.v:"",done)}
  ${done?`<div class="ex"><b class="${ok?"pass":"fail"}">${ok?"정답이에요":"오답이에요"}</b>${q.t==="sa"?` · 내 답 <code>${esc(m2.v||"(빈칸)")}</code>`:""}<br><b>${model(q)}</b><br>${esc(q.e)}${q.u&&EX[k].units.some(u=>u.id===q.u&&!u.read)?`<div style="margin-top:8px"><a href="#unit-${k}-${EX[k].units.find(u=>u.id===q.u).i}" class="link">개념 다시 보기 ›</a></div>`:""}</div>
   <div class="row-r">${flagBtn(q)}</div>`:""}</div>
  ${foot(done?`<button class="pri" id="nx">${isGen||pr.i+1<pr.qs.length?"다음 문제 ›":"결과 보기"}</button>`
    :(q.t==="mc"?`<button id="sk">모르겠어요</button>`:`<button id="sk">모르겠어요</button><button class="pri" id="ck">채점하기</button>`))}`;
  bindBack(backTo);bindMarks(q,()=>practice(key));
  const mark=v=>{pr.pick[pr.i]={v};const r=isRight(q,v);pr.done++;if(r)pr.right++;record(q,r);save();practice(key);
    if(navigator.vibrate)try{navigator.vibrate(r?15:[30,40,30])}catch(e){}};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>mark(+b.dataset.o));
  if($("ck"))$("ck").onclick=()=>mark($("ans").value);
  const a=$("ans");if(a&&!done){a.onkeydown=ev=>{if(ev.key==="Enter")$("ck").click()}}
  const next=()=>{pr.i++;practice(key);scrollTo(0,0)};
  if($("nx"))$("nx").onclick=next;
  if(done)swipe($("qc"),next,null);
  if($("sk"))$("sk").onclick=()=>mark(q.t==="mc"?-1:"");
  if($("end"))$("end").onclick=()=>{pr.end=true;practice(key)};
}

/* ========== 오답노트 ========== */
let ws=-1,wk="";
function wrong(k){
  if(k!==wk){wk=k;ws=-1}setTabs("quiz");const e=EX[k];
  const all=wrongIds(k),ids=all.filter(i=>ws<0||getQ(i).s===ws);
  app.innerHTML=`<div class="hd">${back()}<h1>${esc(e.tag)} 오답노트 · ${all.length}</h1>${all.length?`<button data-h="retry-${k}">다시 풀기</button>`:""}</div>
  <div class="chips"><button data-s="-1" class="${ws<0?"on":""}">전체</button>${e.subj.map((t,s)=>`<button data-s="${s}" class="${ws===s?"on":""}">${esc(t)} (${all.filter(i=>getQ(i).s===s).length})</button>`).join("")}</div>
  ${ids.length?ids.map(i=>{const q=getQ(i),w=data.wrong[i];return `<article class="card"><div class="subj"><span class="tag">${w.n}회 틀림</span>${esc(e.subj[q.s])}${q.gen?` · <span class="gtag">${esc(q.gname||"생성 문제")}</span>`:""} · ${ago(w.t)}<span class="sp"></span>${starBtn(q)}</div>
  <div class="qt">${qhtml(q)}</div>${q.t==="mc"?`<div class="opts">${q.o.map((o,j)=>`<div class="opt"><span class="n">${N[j]}</span><span>${esc(o)}</span></div>`).join("")}</div>`:""}
  <details><summary>정답과 해설 보기</summary>${explain(q)}</details>
  <div class="btns"><button data-rm="${esc(i)}">다 외웠어요 (빼기)</button></div></article>`}).join(""):`<p class="empty">${all.length?"이 과목엔 오답이 없어요.":"아직 오답이 없어요."}</p>`}`;
  bindBack("quiz");bindGo();bindMarks(null,()=>wrong(k));
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ws=+b.dataset.s;wrong(k)});
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const id=b.dataset.rm;delete data.wrong[id];if(!data.star[id])delete data.gq[id];save();wrong(k)});
}

/* ========== 암기 (용어 카드) ========== */
function cardsHome(){
  const k=curEx(),e=EX[k];setTabs("cards");
  const lv=c=>data.card[c.id]?.lv??-1,known=e.cards.filter(c=>lv(c)>=2).length,unk=e.cards.filter(c=>lv(c)===0).length,neu=e.cards.filter(c=>lv(c)<0).length;
  const byU={};e.cards.forEach(c=>{(byU[c.u]=byU[c.u]||[]).push(c)});
  app.innerHTML=topBar(true)+`<div class="hero"><div class="stats"><div class="stat"><b>${known}</b><span>외운 카드</span></div><div class="stat"><b>${unk}</b><span>헷갈리는 카드</span></div><div class="stat"><b>${neu}</b><span>새 카드</span></div></div></div>
  <div class="pad"><button class="pri wide" data-h="card-${k}">카드 학습 시작 (20장)</button><p class="note">헷갈리는 카드와 새 카드가 먼저 나와요. ‘알아요’를 두 번 누르면 외운 카드가 돼요.</p></div>
  <div class="sec">단원별 카드</div><div class="list">${Object.entries(byU).map(([u,cs])=>{const ui=e.units.findIndex(x=>x.title===u||x.id===u);const kn=cs.filter(c=>lv(c)>=2).length;
    return `<button class="item" data-h="card-${k}-${ui}"><span class="ring" style="--p:${Math.round(kn/cs.length*100)}">${kn}/${cs.length}</span><span class="t"><b>${esc(u)}</b><small>${cs.length}장</small></span><span class="ar">›</span></button>`}).join("")}</div>`;
  bindTop(cardsHome);bindGo();
}
let cs=null;
function cardSession(key){
  const m=key.match(/^card-(pf|ps|ad)(?:-(\d+))?$/);if(!m)return cardsHome();const [,k,ui]=m,e=EX[k];
  if(!cs||cs.key!==key){let pool=e.cards;if(ui!==undefined){const u=e.units[+ui];pool=pool.filter(c=>u&&(c.u===u.title||c.u===u.id))}
    const lv=c=>data.card[c.id]?.lv??-1,pr0=c=>{const l=lv(c);return l===0?0:l<0?1:l===1?2:3+l};
    const arr=shuffle(pool.slice()).sort((a,b)=>pr0(a)-pr0(b)||((data.card[a.id]?.t||0)-(data.card[b.id]?.t||0)));
    cs={key,q:arr.slice(0,ui!==undefined?arr.length:20),i:0,flip:false,know:0,again:0}}
  setTabs("cards",false);
  if(cs.i>=cs.q.length){setTabs("cards");app.innerHTML=`<div class="hd">${back()}<h1>카드 학습 끝</h1></div><div class="card" style="text-align:center"><div class="big pass">${cs.know}</div><p>장을 알고 있었어요 · 다시 볼 카드 ${cs.again}장</p></div>${foot(`<button data-h="cards">암기 홈</button><button class="pri" id="ag">한 번 더</button>`)}`;
    bindBack("cards");bindGo();$("ag").onclick=()=>{cs=null;cardSession(key)};return}
  const c=cs.q[cs.i];
  app.innerHTML=`<div class="hd">${back()}<h1>${cs.i+1} / ${cs.q.length}</h1></div><div class="prog"><i style="width:${cs.i/cs.q.length*100}%"></i></div>
  <button class="flash${cs.flip?" back":""}" id="fc" aria-label="카드 뒤집기"><small>${esc(c.u)}</small><b>${inline(c.f)}</b>${cs.flip?`<div class="fb">${inline(c.b)}</div>`:'<span class="hint">눌러서 뜻 보기</span>'}</button>
  ${foot(cs.flip?`<button id="no" class="bad">모르겠어요</button><button id="yes" class="pri">알아요</button>`:`<button class="pri" id="fl">뜻 보기</button>`)}`;
  bindBack("cards");
  const flip=()=>{cs.flip=true;cardSession(key)};$("fc").onclick=()=>{if(!cs.flip)flip()};if($("fl"))$("fl").onclick=flip;
  const ans=good=>{const s=data.card[c.id]||{lv:-1,t:0};s.lv=good?Math.min(5,Math.max(0,s.lv)+1):0;s.t=Date.now();data.card[c.id]=s;const d=today();data.days[d]=(data.days[d]||0)+1;
    if(good)cs.know++;else{cs.again++;if(cs.q.length-cs.i<40)cs.q.splice(Math.min(cs.q.length,cs.i+4),0,c)}cs.i++;cs.flip=false;save();cardSession(key)};
  if($("yes"))$("yes").onclick=()=>ans(true);if($("no"))$("no").onclick=()=>ans(false);
  if(cs.flip)swipe($("fc"),()=>ans(true),()=>ans(false));
}

/* ========== 설정 ========== */
function setup(){
  setTabs("setup");const p=data.pref,fl=Object.keys(data.flag);
  app.innerHTML=`<div class="hd"><h1>설정</h1></div>
  <div class="sec">화면</div><div class="list">
   <div class="item col"><b>테마</b><div class="chips in">${[["auto","자동"],["light","라이트"],["dark","다크"]].map(([v,t])=>`<button data-th="${v}" class="${p.theme===v?"on":""}">${t}</button>`).join("")}</div></div>
   <div class="item col"><b>문제·노트 글자 크기</b><div class="chips in">${[[0.9,"작게"],[1,"보통"],[1.15,"크게"],[1.3,"아주 크게"]].map(([v,t])=>`<button data-fs="${v}" class="${+p.fs===v?"on":""}">${t}</button>`).join("")}</div></div></div>
  <div class="sec">학습</div><div class="list">
   <label class="item"><span class="t"><b>안 푼 문제 먼저 내기</b><small>연습·모의고사에서 오래전에 풀었거나 안 푼 문제를 먼저 골라요</small></span><input type="checkbox" class="sw" id="av"${p.avoid?" checked":""}></label>
   ${KEYS.map(k=>`<div class="item"><span class="t"><b>${esc(EX[k].name)} 시험일</b><small>${p.dday[k]||"정하지 않음"}</small></span><input type="date" class="date" data-dd="${k}" value="${p.dday[k]||""}" aria-label="${esc(EX[k].name)} 시험일"></div>`).join("")}</div>
  <div class="sec">문제 오류 신고 (${fl.length})</div><div class="list">${fl.length?fl.map(id=>{const q=QID[id];return `<div class="item"><span class="t"><small>${tagEx(q.ex)} ${esc(EX[q.ex].subj[q.s])} · ${esc(id)}</small><b>${esc(q.q.replace(/<table[\s\S]*$/,"").slice(0,60))}</b></span><button class="mini" data-unflag="${esc(id)}">취소</button></div>`}).join("")+
   `<div class="pad"><p class="note" style="margin-top:0">신고한 문제는 연습과 모의고사에서 빠져요. 복사해서 Claude에게 보내 주면 고쳐 드릴게요.</p><button id="cp" class="pri wide">신고 목록 복사</button></div>`:'<p class="note pad" style="margin:0">문제를 푼 뒤 해설 아래 ‘오류 신고’를 누르면 여기에 모여요.</p>'}</div>
  <div class="sec">데이터</div><div class="list"><div class="item"><span class="t"><b>저장 위치</b><small>기록·오답·별표·카드 진도·설정은 ${WHERE}에 저장돼요</small></span></div>
   <button class="item" id="rs"><span class="t"><b class="fail">기록 모두 지우기</b><small>설정은 남고 학습 기록만 지워져요. 되돌릴 수 없어요</small></span></button></div>
  <div class="sec">정보</div><div class="list"><div class="item"><span class="t"><b>문제 은행</b><small>필기 ${EX.pf.Q.length} · 실기 ${EX.ps.Q.length} · ADsP ${EX.ad.Q.length}문항 · 무한 문제 ${KEYS.reduce((a,k)=>a+EX[k].gen.length,0)}유형 · 용어 카드 ${KEYS.reduce((a,k)=>a+EX[k].cards.length,0)}장</small></span></div>
   <div class="item"><span class="t"><small>모든 문제는 직접 만든 연습 문제이며 실제 기출이 아니에요. 범위는 큐넷 프로그래밍기능사 출제기준(2027~2029)과 데이터자격검정 ADsP 안내를 따랐어요. 계산·코드 문제는 실제 실행으로 검증했어요.</small></span></div></div>`;
  app.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{p.theme=b.dataset.th;applyPrefs();save();setup()});
  app.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{p.fs=+b.dataset.fs;applyPrefs();save();setup()});
  app.querySelectorAll("[data-dd]").forEach(i=>i.onchange=()=>{const k=i.dataset.dd;if(i.value)p.dday[k]=i.value;else delete p.dday[k];save();setup()});
  $("av").onchange=ev=>{p.avoid=ev.target.checked;save()};
  app.querySelectorAll("[data-unflag]").forEach(b=>b.onclick=()=>{delete data.flag[b.dataset.unflag];save();setup()});
  if($("cp"))$("cp").onclick=async()=>{const txt=fl.map(id=>{const q=QID[id];return `[${id}] ${q.q.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,120)}`}).join("\n");
    try{await navigator.clipboard.writeText(txt);$("cp").textContent="복사했어요"}catch(e){modal(`<h2>신고 목록</h2><p class="note">길게 눌러 복사하세요.</p><pre style="white-space:pre-wrap">${esc(txt)}</pre><div class="btns"><button id="cx">닫기</button></div>`);$("cx").onclick=close}};
  $("rs").onclick=()=>{modal(`<h2>기록을 모두 지울까요?</h2><p>모의고사 기록, 정답률, 오답노트, 별표, 카드 진도, 신고 목록이 지워져요. 되돌릴 수 없어요.</p><div class="btns"><button id="cx">취소</button><button class="pri danger" id="ok">모두 지우기</button></div>`);
    $("cx").onclick=close;$("ok").onclick=()=>{data=fresh(data.pref);save();close();setup()}};
}

/* ========== 라우팅 ========== */
function setGroupFor(k){if(k==="ad")data.pref.g="adsp";else{data.pref.g="prog";data.pref.lv=k}}
function route(){
  close();applyPrefs();const h=location.hash.slice(1);let m;
  if((m=h.match(/^exam-(pf|ps|ad)$/))){setGroupFor(m[1]);examView(m[1])}
  else if((m=h.match(/^(?:prac|retry|gen|upr|ugen|weak|star)-(pf|ps|ad)/))){setGroupFor(m[1]);practice(h)}
  else if((m=h.match(/^unit-(pf|ps|ad)-(\d+)$/))){setGroupFor(m[1]);unit(m[1],+m[2])}
  else if((m=h.match(/^wrong-(pf|ps|ad)$/))){setGroupFor(m[1]);wrong(m[1])}
  else if((m=h.match(/^card-(pf|ps|ad)/))){setGroupFor(m[1]);cardSession(h)}
  else if(h==="study")study();else if(h==="quiz")quiz();else if(h==="cards")cardsHome();else if(h==="setup")setup();
  else home();
  if(h!=="study"||!qn)scrollTo(0,0);
}
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(pr&&h!==pr.key)pr=null;if(cs&&h!==cs.key)cs=null;route()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&ov.classList.contains("show"))return close();
  if(/INPUT|TEXTAREA/.test(e.target.tagName)||ov.classList.contains("show"))return;
  const m=location.hash.match(/^#exam-(pf|ps|ad)$/);if(m){const k=m[1],x=exams[k];if(!x||x.done)return;const q=x.qs[x.cur];
    if(q.t==="mc"&&/^[1-4]$/.test(e.key)){const i=+e.key-1;x.ans[x.cur]=x.ans[x.cur]===i?-1:i;examView(k)}
    else if(e.key==="ArrowRight"&&x.cur<x.qs.length-1){x.cur++;examView(k)}else if(e.key==="ArrowLeft"&&x.cur>0){x.cur--;examView(k)}return}
  if(pr&&location.hash==="#"+pr.key){const q=pr.qs[pr.i],done=pr.pick[pr.i]!==undefined;
    if(!done&&q&&q.t==="mc"&&/^[1-4]$/.test(e.key)){const b=app.querySelector(`[data-o="${+e.key-1}"]`);if(b)b.click()}
    else if(done&&(e.key==="Enter"||e.key==="ArrowRight")){const b=$("nx");if(b)b.click()}}
});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
route();
}

</script>
