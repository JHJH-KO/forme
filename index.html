  const hits=term?ks.flatMap(k=>EX[k].notes.flatMap((n,ni)=>n.body.split("\n").filter(l=>!l.startsWith("#")&&l.toLowerCase().includes(term)).slice(0,5).map(l=>({k,ni,l})))):[];
  app.innerHTML=`<div class="hd">${only?back():""}<h1>${only?esc(EX[only].name)+" 요약노트":"요약노트"}</h1></div><div class="pad"><input class="search" id="qs" type="search" placeholder="용어 검색 (예: 정규화, 향상도, chmod)" value="${esc(qn)}" autocomplete="off"></div>
  ${term?`<div class="list">${hits.length?hits.slice(0,40).map(h=>`<button class="item" data-h="note-${h.k}-${h.ni}"><span class="t"><small>${tagEx(h.k)} ${esc(EX[h.k].notes[h.ni].title)}</small><b>${hl(h.l.replace(/^[-|\d. ]+|\|/g," ").replace(/[`*]/g,"").trim())}</b></span><span class="ar">›</span></button>`).join(""):'<p class="empty">찾는 내용이 없어요.</p>'}</div>`:
  ks.map(k=>`${only?"":`<div class="sec">${esc(EX[k].name)}</div>`}<div class="list">${EX[k].notes.map((n,i)=>`<button class="item" data-h="note-${k}-${i}"><span class="ic" style="background:${EX[k].color}">${i+1}</span><span class="t"><b>${esc(n.title)}</b><small>${n.subs.length?esc(n.subs.map(s=>s.replace(/^\d-\d\. /,"")).slice(0,4).join(" · "))+(n.subs.length>4?" 외":""):"핵심 정리"}</small></span><span class="ar">›</span></button>`).join("")}</div>`).join("")}`;
  if(only)bindBack("");
  const qs=$("qs");qs.oninput=()=>{qn=qs.value;const p=qs.selectionStart;notes(only);const n=$("qs");n.focus();n.setSelectionRange(p,p)};
  bindGo();
}
function note(k,i){
  const ns=EX[k].notes,n=ns[i];if(!n)return notes();
  setTabs("notes");
  app.innerHTML=`<div class="hd">${back()}<h1>${esc(n.title)}</h1></div><div class="card md"><div class="subj">${tagEx(k)} ${esc(EX[k].name)}</div>${md(n.body)}</div>
  <div class="pad" style="display:flex;gap:8px">${i>0?`<button data-h="note-${k}-${i-1}" style="flex:1">‹ 이전</button>`:""}${i<ns.length-1?`<button data-h="note-${k}-${i+1}" class="pri" style="flex:1">다음 ›</button>`:""}</div>`;
  bindBack("notes-"+k);bindGo();
}

/* ---------- 오답노트 ---------- */
let wk="",ws=-1;
function wrong(k){
  if(k!==undefined&&k!==wk){wk=k;ws=-1}
  setTabs("wrong");
  const all=wrongIds(wk),ids=all.filter(i=>ws<0||QID[i].s===ws);
  app.innerHTML=`<div class="hd"><h1>오답노트 · ${wrongIds().length}</h1>${all.length&&wk?`<button data-h="retry-${wk}">다시 풀기</button>`:""}</div>
  <div class="chips"><button data-k="" class="${wk?"":"on"}">전체 (${wrongIds().length})</button>${KEYS.map(x=>`<button data-k="${x}" class="${wk===x?"on":""}">${EX[x].tag} (${wrongIds(x).length})</button>`).join("")}</div>
  ${wk?`<div class="chips" style="padding-top:8px"><button data-s="-1" class="${ws<0?"on":""}">모든 과목</button>${EX[wk].subj.map((t,s)=>`<button data-s="${s}" class="${ws===s?"on":""}">${esc(t)} (${all.filter(i=>QID[i].s===s).length})</button>`).join("")}</div>`:`<p class="note pad" style="padding-bottom:0">자격증을 고르면 과목별로 보고 다시 풀 수 있어요.</p>`}
  ${ids.length?ids.map(i=>{const q=QID[i],w=data.wrong[i];return `<article class="card"><div class="subj"><span class="tag">${w.n}회 틀림</span>${tagEx(q.ex)} ${esc(EX[q.ex].subj[q.s])} · ${q.n}번 · ${ago(w.t)}</div>
  <div class="qt">${qhtml(q)}</div>${q.t==="mc"?`<div class="opts">${q.o.map((o,j)=>`<div class="opt"><span class="n">${N[j]}</span><span>${esc(o)}</span></div>`).join("")}</div>`:""}
  <details><summary>정답과 해설 보기</summary>${explain(q)}</details>
  <div class="btns"><button data-rm="${i}">다 외웠어요 (빼기)</button></div></article>`}).join(""):`<p class="empty">${wrongIds().length?"여기엔 오답이 없어요.":"아직 오답이 없어요. 문제를 풀면 틀린 문제가 여기에 모여요."}</p>`}`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>go(b.dataset.k?"wrong-"+b.dataset.k:"wrong"));
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ws=+b.dataset.s;wrong()});
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{delete data.wrong[b.dataset.rm];save();wrong()});
  bindGo();
}

/* ---------- 라우팅 ---------- */
function route(){
  close();const h=location.hash.slice(1);let m;
  if((m=h.match(/^exam-(pf|ps|ad)$/)))examView(m[1]);
  else if((m=h.match(/^c-(pf|ps|ad)$/)))cert(m[1]);
  else if(/^(prac|retry)-/.test(h))practice(h);
  else if(h==="notes")notes();
  else if((m=h.match(/^notes-(pf|ps|ad)$/)))notes(m[1]);
  else if((m=h.match(/^note-(pf|ps|ad)-(\d+)$/)))note(m[1],+m[2]);
  else if(h==="wrong")wrong("");
  else if((m=h.match(/^wrong-(pf|ps|ad)$/)))wrong(m[1]);
  else home();
  if(!/^notes/.test(h)||!qn)scrollTo(0,0);
}
addEventListener("hashchange",()=>{if(pr&&location.hash.slice(1)!==pr.key)pr=null;route()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&ov.classList.contains("show"))return close();
  const m=location.hash.match(/^#exam-(pf|ps|ad)$/);if(!m)return;const k=m[1],x=exams[k];
  if(!x||x.done||/INPUT|TEXTAREA/.test(e.target.tagName)||ov.classList.contains("show"))return;
  const q=x.qs[x.cur];
  if(q.t==="mc"&&/^[1-4]$/.test(e.key)){const i=+e.key-1;x.ans[x.cur]=x.ans[x.cur]===i?-1:i;examView(k)}
  else if(e.key==="ArrowRight"&&x.cur<x.qs.length-1){x.cur++;examView(k)}else if(e.key==="ArrowLeft"&&x.cur>0){x.cur--;examView(k)}
});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
route();
}

</script>
