  ps:{name:"프로그래밍기능사 실기",tag:"실기",color:"#7a4fd6",subj:["Python","Java","C","SQL","Linux·경로"],limit:5400,mockN:[3,3,2,5,2],rule:"60점 이상",pass:sc=>sc>=60,Q:[{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"a = [1, 2, 3]\nb = a\nb.append(4)\nprint(len(a))","a":["4"],"e":"b = a는 같은 리스트를 가리킨다. b에 추가하면 a도 길이 4.","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"s = \"abcdef\"\nprint(s[::-2])","a":["fdb"],"e":"끝에서부터 2칸씩: f, d, b.","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"print([x * x for x in range(5) if x % 2 == 0])","a":["[0, 4, 16]","[0,4,16]"],"e":"0, 2, 4의 제곱 → [0, 4, 16].","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"def f(n):\n    return n if n < 2 else f(n - 1) + f(n - 2)\n\nprint(f(6))","a":["8"],"e":"피보나치: 0, 1, 1, 2, 3, 5, 8 → f(6) = 8.","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오. (end=\" \"이므로 값 사이에 공백 하나)","c":"class Node:\n    def __init__(self, key):\n        self.key = key\n        self.left = None\n        self.right = None\n\ndef visit(n):\n    if n:\n        print(n.key, end=\" \")\n        visit(n.left)\n        visit(n.right)\n\nroot = Node(1)\nroot.left = Node(2)\nroot.right = Node(3)\nroot.left.left = Node(4)\nroot.left.right = Node(5)\nvisit(root)","a":["1 2 4 5 3"],"e":"자기 자신을 먼저 출력하고 왼쪽, 오른쪽 순으로 방문하는 전위 순회. 1 → 2 → 4 → 5 → 3. 출력을 왼쪽 방문과 오른쪽 방문 사이에 두면 중위 순회(4 2 5 1 3), 맨 뒤에 두면 후위 순회(4 5 2 3 1).","u":"트리 순회 (Python 예시 유형)"},{"s":0,"t":"sa","q":"딕셔너리 d의 key만 모아 리스트로 만들려고 한다. 빈칸 ①에 들어갈 메서드 이름을 쓰시오.","c":"d = {\"a\": 1, \"b\": 2}\nprint(list(d.( ① )()))","a":["keys","keys()"],"e":"keys()는 키, values()는 값, items()는 (키, 값) 쌍을 돌려준다.","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 프로그램을 실행하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  def total(nums):\n2      s = 0\n3      for n in nums:\n4          s += n\n5  return s\n6\n7  print(total([1, 2, 3]))","a":["5"],"e":"5번 줄 return이 함수 안으로 들여쓰기되지 않아 함수 밖 return이 되어 SyntaxError가 난다.","u":"오류 찾기·빈칸 문제 요령"},{"s":0,"t":"sa","q":"다음은 return 줄의 들여쓰기 오류를 고친 프로그램이다. 실행 결과를 쓰시오.","c":"def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s\n\nprint(total([1, 2, 3]))","a":["6"],"e":"1 + 2 + 3 = 6.","u":"오류 찾기·빈칸 문제 요령"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"String s = \"Hello\";\nSystem.out.print(s.length() + s.charAt(0));","a":["77"],"e":"int + char는 숫자 덧셈이다. 5 + 'H'(72) = 77. 문자열 연결이 아니다.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"class C {\n    static int cnt = 0;\n    C() { cnt++; }\n}\n// main\nnew C(); new C(); new C();\nSystem.out.print(C.cnt);","a":["3"],"e":"static 변수는 모든 객체가 공유한다. 생성자가 3번 실행돼 3.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int x = 5;\nx += x++ + ++x;\nSystem.out.print(x);","a":["17"],"e":"x += 식 은 x = 5 + (x++ + ++x). x++는 5(이후 x=6), ++x는 7. 5 + 12 = 17.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"try {\n    int a = 10 / 0;\n    System.out.print(\"A\");\n} catch (ArithmeticException e) {\n    System.out.print(\"B\");\n} finally {\n    System.out.print(\"C\");\n}","a":["BC"],"e":"0으로 나눠 예외가 나서 A는 건너뛰고 B, 이어서 finally의 C.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"String a = \"Hi\";\nString b = new String(\"Hi\");\nSystem.out.print((a == b) + \" \" + a.equals(b));","a":["false true"],"e":"new로 만든 문자열은 다른 객체라 ==(참조 비교)는 false, equals(내용 비교)는 true.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"class A {\n    A() { System.out.print(\"1\"); }\n    A(int x) { this(); System.out.print(\"2\"); }\n}\nclass B extends A {\n    B() { super(5); System.out.print(\"3\"); }\n}\n// main\nnew B();","a":["123"],"e":"B() → super(5)로 A(int) 호출 → this()로 A() 호출해 1 → A(int) 나머지 2 → B() 나머지 3.","u":"Java 핵심"},{"s":1,"t":"sa","q":"인터페이스 Shape을 Circle 클래스가 구현하려고 한다. 빈칸 ①에 들어갈 키워드를 한 단어로 쓰시오.","c":"interface Shape {\n    double area();\n}\n\nclass Circle ( ① ) Shape {\n    double r = 2;\n    public double area() { return 3.14 * r * r; }\n}","a":["implements"],"e":"인터페이스 구현은 implements, 클래스 상속은 extends.","u":"Java 핵심"},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int x = 7, y = 3;\nprintf(\"%d %d\", x / y, x % y);","a":["2 1"],"e":"정수 나눗셈 7/3 = 2, 나머지 7%3 = 1.","u":"C 핵심"},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int a[5] = {5, 3, 8, 1, 4};\nint max = a[0];\nfor (int i = 1; i < 5; i++)\n    if (a[i] > max) max = a[i];\nprintf(\"%d\", max);","a":["8"],"e":"배열을 돌며 더 큰 값으로 바꾼다. 최댓값은 8.","u":"C 핵심"},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오. (string.h 포함)","c":"char s[] = \"HELLO\";\nprintf(\"%d %c\", (int)strlen(s), s[1]);","a":["5 E"],"e":"strlen은 널 문자를 빼고 5. s[1]은 두 번째 글자 E.","u":"C 핵심"},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int a = 10, *p = &a;\n*p += 5;\nprintf(\"%d\", a);","a":["15"],"e":"p가 a를 가리키므로 *p += 5는 a를 15로 바꾼다.","u":"C 핵심"},{"s":3,"t":"sa","q":"[학생] 테이블을 점수가 높은 순으로 정렬하려고 한다. 빈칸에 알맞은 키워드를 쓰시오.","c":"SELECT * FROM 학생 ORDER BY 점수 (    );","a":["DESC"],"e":"내림차순은 DESC, 오름차순은 ASC(기본값).","u":"SQL 핵심"},{"s":3,"t":"sa","q":"학과별 평균 점수가 80 이상인 학과만 조회하려고 한다. 빈칸에 알맞은 키워드를 쓰시오.","c":"SELECT 학과, AVG(점수) FROM 학생\nGROUP BY 학과\n(    ) AVG(점수) >= 80;","a":["HAVING"],"e":"그룹에 거는 조건은 HAVING.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"user1에게 준 [학생] 테이블의 UPDATE 권한을 회수하려고 한다. 빈칸에 알맞은 명령어를 쓰시오.","c":"(    ) UPDATE ON 학생 FROM user1;","a":["REVOKE"],"e":"권한 회수는 REVOKE ~ FROM, 부여는 GRANT ~ TO.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"[member] 테이블에서 성이 '김'이고 이름 전체가 정확히 세 글자인 사람을 찾으려고 한다. 빈칸 ①에 들어갈 패턴을 쓰시오.","c":"SELECT * FROM member WHERE name LIKE '( ① )';","a":["김__"],"e":"_는 정확히 한 글자, %는 0글자 이상. 김 + 두 글자 = '김__'.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"[score] 테이블의 구조는 남기고 데이터만 모두 삭제하는 SQL을, 키워드 2개와 테이블 이름(score)만 사용해 쓰시오.","a":["TRUNCATE TABLE score","TRUNCATE TABLE score;"],"e":"TRUNCATE TABLE은 구조를 남기고 모든 행을 지운다. DROP TABLE은 구조까지 삭제하고, CASCADE를 붙이면 참조하는 제약 조건까지 함께 삭제한다.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"다음 SQL을 실행한 결과 ans의 값을 쓰시오.<table><tr><th colspan=\"2\">t1</th><th></th><th colspan=\"2\">t2</th></tr><tr><th>c1</th><th>c2</th><th></th><th>c1</th><th>c2</th></tr><tr><td>A</td><td>1</td><td></td><td>A</td><td>4</td></tr><tr><td>B</td><td>2</td><td></td><td>B</td><td>1</td></tr><tr><td>C</td><td>3</td><td></td><td>E</td><td>6</td></tr><tr><td></td><td></td><td></td><td>F</td><td>2</td></tr></table>","c":"SELECT SUM(c2) AS ans\nFROM t2\nWHERE c1 IN (SELECT c1 FROM t1);","a":["5"],"e":"t1의 c1은 A, B, C. t2에서 c1이 그 안에 있는 행은 A(4), B(1) → 4 + 1 = 5. NOT IN이었다면 E(6), F(2) → 8.","u":"SQL 핵심"},{"s":4,"t":"sa","q":"현재 작업 디렉터리의 절대 경로가 /home/kim/project일 때, 상대 경로 \"../docs/a.txt\"의 절대 경로를 쓰시오.","a":["/home/kim/docs/a.txt"],"e":"..은 상위 디렉터리(/home/kim)로 올라간다. 거기서 docs/a.txt → /home/kim/docs/a.txt.","u":"경로와 Linux"},{"s":4,"t":"sa","q":"현재 작업 디렉터리의 절대 경로가 /var/log일 때, 상대 경로 \"./app/../sys\"의 절대 경로를 쓰시오.","a":["/var/log/sys","/var/log/sys/"],"e":".은 현재 디렉터리, app으로 들어갔다가 ..으로 다시 나온 뒤 sys → /var/log/sys.","u":"경로와 Linux"},{"s":4,"t":"sa","q":"Linux에서 파일 file.txt의 권한을 rw-r--r--로 바꾸려고 한다. 빈칸에 알맞은 숫자를 쓰시오.","c":"chmod (    ) file.txt","a":["644"],"e":"rw- = 6, r-- = 4, r-- = 4.","u":"경로와 Linux"},{"s":4,"t":"sa","q":"Linux에서 파일 안에서 특정 문자열이 들어 있는 줄만 찾아 출력하는 명령어를 쓰시오.","a":["grep"],"e":"grep 문자열 파일명. 예) grep error log.txt","u":"경로와 Linux"},{"s":4,"t":"sa","q":"Linux 터미널에서 환경 변수를 설정해 하위 프로세스에서도 쓸 수 있게 하는 명령어를 쓰시오. (예: ( ) PATH=$PATH:/opt/bin)","a":["export"],"e":"export. 설정된 값을 확인할 때는 echo $PATH.","u":"경로와 Linux"},{"s":3,"t":"sa","q":"Oracle에서 현재 사용자가 소유한 테이블 목록을 조회하려고 한다. 빈칸 ①에 들어갈 데이터 사전 뷰 이름을 쓰시오.","c":"SELECT table_name FROM ( ① );","a":["USER_TABLES"],"e":"USER_TABLES는 내 테이블, ALL_TABLES는 접근 가능한 테이블, DBA_TABLES는 전체 테이블. 컬럼은 USER_TAB_COLUMNS, 인덱스는 USER_INDEXES, 뷰는 USER_VIEWS.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"조회 속도를 높이려고 student 테이블의 name 컬럼에 idx_name을 만들려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"CREATE ( ① ) idx_name ON student(name);","a":["INDEX"],"e":"CREATE INDEX 인덱스명 ON 테이블(컬럼). 중복을 막으려면 CREATE UNIQUE INDEX.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"student 테이블에서 dept가 'CS'인 행만 보여 주는 가상 테이블 v_cs를 만들려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"CREATE ( ① ) v_cs AS\nSELECT * FROM student WHERE dept = 'CS';","a":["VIEW"],"e":"CREATE VIEW 뷰이름 AS SELECT …. 기존 테이블로 새 테이블을 만들 때는 CREATE TABLE 새테이블 AS SELECT ….","u":"SQL 핵심"},{"s":3,"t":"sa","q":"다음 SQL을 실행했을 때 결과 행의 개수를 쓰시오.<table><tr><th>t1.c1</th><th></th><th>t2.c1</th></tr><tr><td>A</td><td></td><td>B</td></tr><tr><td>B</td><td></td><td>C</td></tr><tr><td>C</td><td></td><td>D</td></tr></table>","c":"SELECT c1 FROM t1\nUNION\nSELECT c1 FROM t2;","a":["4"],"e":"UNION은 중복을 없앤 합집합: A, B, C, D → 4행. UNION ALL이면 6행, INTERSECT면 B, C → 2행.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"부서가 없는 사원까지 모든 사원을 출력하려고 한다. 빈칸 ①에 들어갈 키워드를 한 단어로 쓰시오.","c":"SELECT e.name, d.dname\nFROM emp e ( ① ) JOIN dept d\nON e.dept_id = d.id;","a":["LEFT","LEFT OUTER"],"e":"LEFT (OUTER) JOIN은 왼쪽 테이블(emp)의 행을 모두 남기고, 짝이 없으면 오른쪽 컬럼을 NULL로 채운다.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"트랜잭션 도중 실행한 변경을 모두 취소하고 마지막으로 확정한 상태로 되돌리는 명령어를 쓰시오.","a":["ROLLBACK","ROLLBACK;"],"e":"COMMIT은 변경 확정, ROLLBACK은 취소, SAVEPOINT는 중간 저장점(ROLLBACK TO 저장점).","u":"SQL 핵심"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"class Animal:\n    def sound(self):\n        return \"...\"\n\nclass Dog(Animal):\n    def sound(self):\n        return \"Woof\"\n\nfor a in [Animal(), Dog()]:\n    print(a.sound(), end=\" \")","a":["... Woof","... Woof "],"e":"Dog가 sound를 오버라이딩했으므로 Animal 객체는 ..., Dog 객체는 Woof를 돌려준다.","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"def f(x, y=10):\n    return x * y\n\nprint(f(3), f(3, 2))","a":["30 6"],"e":"y를 생략하면 기본값 10 → 30, y = 2를 주면 6.","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"nums = [3, 1, 4, 1, 5]\nnums.sort(reverse=True)\nprint(nums[1] + nums[-1])","a":["5"],"e":"내림차순 정렬 [5, 4, 3, 1, 1] → nums[1] = 4, nums[-1] = 1 → 5.","u":"Python 핵심"},{"s":0,"t":"sa","q":"딕셔너리의 (키, 값) 쌍을 차례로 꺼내 출력하려고 한다. 빈칸 ①에 들어갈 메서드 이름을 쓰시오.","c":"score = {\"kim\": 90, \"lee\": 85}\nfor name, s in score.( ① )():\n    print(name, s)","a":["items","items()"],"e":"items()는 (키, 값) 튜플을 돌려준다. 키만은 keys(), 값만은 values().","u":"Python 핵심"},{"s":0,"t":"sa","q":"다음 Python 프로그램을 실행하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  data = [10, 20, 30]\n2  total = 0\n3  for i in range(len(data)):\n4      total += data[i]\n5  print(\"합계: \" + total)","a":["5"],"e":"5번 줄에서 문자열과 정수를 +로 이어 TypeError가 난다. str(total)로 바꾸거나 print(\"합계:\", total)로 고친다.","u":"오류 찾기·빈칸 문제 요령"},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"try:\n    x = int(\"12a\")\n    print(\"A\")\nexcept ValueError:\n    print(\"B\")\nelse:\n    print(\"C\")\nfinally:\n    print(\"D\")","a":["B D","BD"],"e":"int(\"12a\")에서 ValueError → except의 B, else는 예외가 없을 때만 실행되므로 건너뛰고, finally의 D. 두 줄로 B와 D가 출력된다.","u":"Python 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"abstract class Shape {\n    abstract int area();\n    void show() { System.out.print(area()); }\n}\nclass Rect extends Shape {\n    int w = 3, h = 4;\n    int area() { return w * h; }\n}\n// main\nShape s = new Rect();\ns.show();","a":["12"],"e":"show()는 부모에 있지만 area()는 실제 객체인 Rect의 구현이 호출된다(동적 바인딩) → 12.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int[][] m = {{1, 2, 3}, {4, 5, 6}};\nint s = 0;\nfor (int i = 0; i < m.length; i++)\n    s += m[i][m[i].length - 1];\nSystem.out.print(s);","a":["9"],"e":"각 행의 마지막 원소 3과 6을 더한다 → 9. m.length는 행 수 2.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"String s = \"programming\";\nSystem.out.print(s.substring(3, 7) + s.indexOf(\"g\"));","a":["gram3"],"e":"substring(3, 7)은 인덱스 3~6 → \"gram\". indexOf(\"g\")는 처음 나오는 위치 3 → gram3.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 코드에서 부모 클래스 생성자를 호출하려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"class Person {\n    String name;\n    Person(String name) { this.name = name; }\n}\nclass Student extends Person {\n    int id;\n    Student(String name, int id) {\n        ( ① )(name);\n        this.id = id;\n    }\n}","a":["super"],"e":"super(…)는 부모 생성자 호출이며 생성자의 첫 줄에 와야 한다. this(…)는 같은 클래스의 다른 생성자 호출.","u":"Java 핵심"},{"s":1,"t":"sa","q":"다음 Java 프로그램을 컴파일하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  public class Main {\n2      public static void main(String[] args) {\n3          final int MAX = 10;\n4          int sum = 0;\n5          MAX = 20;\n6          System.out.println(sum + MAX);\n7      }\n8  }","a":["5"],"e":"final 변수는 값을 다시 바꿀 수 없다. 5번 줄에서 컴파일 오류.","u":"오류 찾기·빈칸 문제 요령"},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int a = 7;\nString r = (a % 2 == 0) ? \"even\" : \"odd\";\nSystem.out.print(r + (a > 5 ? 1 : 0));","a":["odd1"],"e":"7 % 2 = 1이므로 \"odd\", a > 5는 참이라 1 → odd1.","u":"Java 핵심"},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int n = 3, r = 0;\nswitch (n) {\n    case 1: r += 1;\n    case 3: r += 3;\n    case 5: r += 5;\n        break;\n    default: r += 100;\n}\nprintf(\"%d\", r);","a":["8"],"e":"case 3부터 실행되고 break가 없어 case 5까지 이어진다(3 + 5 = 8). break에서 멈춰 default는 실행되지 않는다.","u":"C 핵심"},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int i = 0, s = 0;\nwhile (i < 10) {\n    i += 3;\n    if (i == 6) continue;\n    s += i;\n}\nprintf(\"%d %d\", i, s);","a":["12 24"],"e":"i는 3, 6, 9, 12로 바뀐다. 6일 때만 건너뛰므로 s = 3 + 9 + 12 = 24. 마지막 i는 12.","u":"C 핵심"},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"void swap(int *a, int *b) {\n    int t = *a; *a = *b; *b = t;\n}\n// main\nint x = 1, y = 2;\nswap(&x, &y);\nprintf(\"%d %d\", x, y);","a":["2 1"],"e":"주소를 넘겼으므로 함수 안에서 원래 변수 값이 바뀐다(참조에 의한 호출 효과).","u":"C 핵심"},{"s":3,"t":"sa","q":"[member] 테이블에 이름이 '박서준', 나이가 25인 행을 추가하려고 한다. 빈칸 ①, ②에 들어갈 키워드를 차례로 쓰시오. (예: A, B)","c":"INSERT ( ① ) member (name, age)\n( ② ) ('박서준', 25);","a":["INTO, VALUES","INTO,VALUES","INTO VALUES"],"e":"INSERT INTO 테이블 (열 목록) VALUES (값 목록);","u":"SQL 핵심"},{"s":3,"t":"sa","q":"[member] 테이블에서 나이가 20 미만인 회원의 등급을 'junior'로 바꾸려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"UPDATE member ( ① ) grade = 'junior'\nWHERE age < 20;","a":["SET"],"e":"UPDATE 테이블 SET 열 = 값 WHERE 조건. WHERE가 없으면 모든 행이 바뀐다.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"[member] 테이블에 이메일 열에 같은 값이 두 번 들어가지 않게 하는 제약조건을 추가하려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"ALTER TABLE member ADD CONSTRAINT uq_email ( ① ) (email);","a":["UNIQUE"],"e":"UNIQUE는 중복을 막는다(NULL은 허용). PRIMARY KEY는 UNIQUE + NOT NULL.","u":"SQL 핵심"},{"s":3,"t":"sa","q":"다음 SQL을 실행한 결과 행의 개수를 쓰시오.<table><tr><th colspan=\"2\">emp</th><th></th><th colspan=\"2\">dept</th></tr><tr><th>name</th><th>dept_id</th><th></th><th>id</th><th>dname</th></tr><tr><td>A</td><td>10</td><td></td><td>10</td><td>개발</td></tr><tr><td>B</td><td>20</td><td></td><td>20</td><td>영업</td></tr><tr><td>C</td><td>30</td><td></td><td>40</td><td>인사</td></tr><tr><td>D</td><td>10</td><td></td><td></td><td></td></tr></table>","c":"SELECT e.name, d.dname\nFROM emp e INNER JOIN dept d\nON e.dept_id = d.id;","a":["3"],"e":"dept_id가 dept.id에 있는 사원만: A(개발), B(영업), D(개발) → 3행. C(30)는 짝이 없어 빠진다. LEFT JOIN이었다면 4행.","u":"SQL 핵심"},{"s":4,"t":"sa","q":"Linux에서 하위 디렉터리와 파일까지 모두 포함해 디렉터리 old를 삭제하려고 한다. 빈칸 ①에 들어갈 옵션을 쓰시오.","c":"rm ( ① ) old","a":["-r","-rf","-R"],"e":"rm -r은 하위까지 재귀적으로 삭제한다. -f를 붙이면 확인 없이 강제로 지운다. 빈 디렉터리만 지울 때는 rmdir.","u":"경로와 Linux"},{"s":0,"u":"Python 핵심","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"a = [1, 2, 3, 4, 5]\nprint(sum(a[1::2]))","a":["6"],"e":"a[1::2]는 인덱스 1, 3 → [2, 4] → 합 6.","t":"sa"},{"s":0,"u":"Python 핵심","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"s = \"Hello World\"\nprint(s.lower().count(\"o\"), s.split()[1])","a":["2 World"],"e":"소문자로 바꾸면 o가 2개, split()은 공백 기준으로 나눠 두 번째는 World.","t":"sa"},{"s":0,"u":"Python 핵심","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"x = 10\ndef f():\n    x = 20\n    return x\nprint(f(), x)","a":["20 10"],"e":"함수 안의 x는 지역 변수라 전역 x(10)는 바뀌지 않는다.","t":"sa"},{"s":0,"u":"Python 핵심","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"t = (1, 2, 3)\na, b, c = t\nprint(c, a)","a":["3 1"],"e":"튜플 언패킹: a = 1, b = 2, c = 3.","t":"sa"},{"s":0,"u":"Python 핵심","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"result = list(map(lambda x: x * 3, [1, 2, 3]))\nprint(result)","a":["[3, 6, 9]","[3,6,9]"],"e":"map이 각 원소에 lambda를 적용한다.","t":"sa"},{"s":0,"u":"Python 핵심","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"class Counter:\n    count = 0\n    def __init__(self):\n        Counter.count += 1\n\na = Counter()\nb = Counter()\nprint(Counter.count)","a":["2"],"e":"클래스 변수 count는 모든 인스턴스가 공유한다. 객체 2개 → 2.","t":"sa"},{"s":0,"u":"Python 핵심","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"n = 0\nwhile True:\n    n += 1\n    if n * n > 30:\n        break\nprint(n)","a":["6"],"e":"5² = 25, 6² = 36 > 30에서 멈춘다.","t":"sa"},{"s":0,"u":"트리 순회 (Python 예시 유형)","q":"다음 Python 코드의 출력 결과를 쓰시오. (값 사이 공백 하나)","c":"class Node:\n    def __init__(self, k, l=None, r=None):\n        self.k, self.l, self.r = k, l, r\n\ndef visit(n):\n    if n:\n        visit(n.l)\n        visit(n.r)\n        print(n.k, end=\" \")\n\nroot = Node(\"A\", Node(\"B\", Node(\"D\")), Node(\"C\", None, Node(\"E\")))\nvisit(root)","a":["D B E C A","D B E C A "],"e":"출력이 재귀 호출 뒤에 있으므로 후위 순회: 왼쪽 → 오른쪽 → 루트.","t":"sa"},{"s":0,"u":"오류 찾기·빈칸 문제 요령","q":"다음 Python 프로그램을 실행하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  nums = [4, 8, 15]\n2  for i in range(4):\n3      print(nums[i])","a":["3"],"e":"range(4)는 0~3. i = 3일 때 nums[3]이 없어 3번 줄에서 IndexError. range(len(nums))로 고친다.","t":"sa"},{"s":0,"u":"오류 찾기·빈칸 문제 요령","q":"리스트를 오름차순으로 정렬해 원래 리스트를 바꾸려고 한다. 빈칸 ①에 들어갈 메서드 이름을 쓰시오.","c":"a = [3, 1, 2]\na.( ① )()\nprint(a)  # [1, 2, 3]","a":["sort","sort()"],"e":"list.sort()는 원본을 바꾸고, sorted(a)는 새 리스트를 돌려준다.","t":"sa"},{"s":1,"u":"Java 핵심","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int[] a = {3, 7, 2, 9};\nint max = a[0], idx = 0;\nfor (int i = 1; i < a.length; i++)\n    if (a[i] > max) { max = a[i]; idx = i; }\nSystem.out.print(max + \",\" + idx);","a":["9,3","9, 3"],"e":"최댓값 9는 인덱스 3에 있다.","t":"sa"},{"s":1,"u":"Java 핵심","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"StringBuilder sb = new StringBuilder(\"abc\");\nsb.append(\"de\").reverse();\nSystem.out.print(sb);","a":["edcba"],"e":"abcde를 뒤집으면 edcba. StringBuilder는 내용을 바꿀 수 있다.","t":"sa"},{"s":1,"u":"Java 핵심","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int a = 10;\nint b = 3;\ndouble c = a / b;\nSystem.out.print(c);","a":["3.0"],"e":"a / b는 정수 나눗셈으로 먼저 3이 되고, double에 담겨 3.0.","t":"sa"},{"s":1,"u":"Java 핵심","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int s = 0;\nfor (int i = 1; i <= 3; i++)\n    for (int j = 1; j <= i; j++)\n        s += j;\nSystem.out.print(s);","a":["10"],"e":"i=1: 1, i=2: 1+2, i=3: 1+2+3 → 1 + 3 + 6 = 10.","t":"sa"},{"s":1,"u":"Java 핵심","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"class P { int v = 1; int get() { return v; } }\nclass C extends P { int v = 2; int get() { return v; } }\n// main\nP p = new C();\nSystem.out.print(p.v + \" \" + p.get());","a":["1 2"],"e":"필드는 참조 변수 타입(P) 기준이라 p.v = 1, 메서드는 실제 객체(C) 기준이라 get() = 2.","t":"sa"},{"s":1,"u":"Java 핵심","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"static int f(int n) {\n    if (n == 0) return 0;\n    return n % 10 + f(n / 10);\n}\n// main\nSystem.out.print(f(1234));","a":["10"],"e":"각 자리 숫자의 합: 4 + 3 + 2 + 1 = 10.","t":"sa"},{"s":1,"u":"Java 핵심","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"String s = \"A,B,,C\";\nString[] p = s.split(\",\");\nSystem.out.print(p.length);","a":["4"],"e":"\"A\", \"B\", \"\", \"C\" → 4개. 빈 문자열도 원소로 남는다(끝의 빈 문자열만 제거됨).","t":"sa"},{"s":1,"u":"오류 찾기·빈칸 문제 요령","q":"다음 Java 코드에서 추상 메서드를 선언하려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"( ① ) class Animal {\n    ( ① ) void sound();\n}","a":["abstract"],"e":"추상 메서드가 있는 클래스는 abstract로 선언해야 한다.","t":"sa"},{"s":1,"u":"오류 찾기·빈칸 문제 요령","q":"다음 Java 프로그램을 컴파일하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  public class Main {\n2      public static void main(String[] args) {\n3          int x = 5;\n4          String s = x;\n5          System.out.println(s);\n6      }\n7  }","a":["4"],"e":"int를 String 변수에 바로 넣을 수 없다. String.valueOf(x)나 \"\" + x로 바꿔야 한다.","t":"sa"},{"s":1,"u":"오류 찾기·빈칸 문제 요령","q":"Java에서 예외 발생 여부와 관계없이 항상 실행할 코드를 넣는 블록의 키워드를 쓰시오.","c":"try {\n    ...\n} catch (Exception e) {\n    ...\n} ( ① ) {\n    System.out.println(\"끝\");\n}","a":["finally"],"e":"finally 블록은 예외가 나든 안 나든 실행된다.","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int i, s = 0;\nfor (i = 10; i > 0; i -= 3)\n    s += i;\nprintf(\"%d %d\", s, i);","a":["22 -2"],"e":"i = 10, 7, 4, 1을 더해 22. 1 − 3 = −2에서 조건이 거짓이 되어 끝난다.","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"char s[] = \"Code\";\nint n = 0;\nwhile (s[n] != '\\0') n++;\nprintf(\"%d %c\", n, s[n - 1]);","a":["4 e"],"e":"널 문자 전까지 세면 4. 마지막 글자 s[3] = 'e'.","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int a[2][3] = {{1, 2, 3}, {4, 5, 6}};\nprintf(\"%d\", a[1][2] - a[0][1]);","a":["4"],"e":"a[1][2] = 6, a[0][1] = 2 → 4.","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int x = 5;\nint *p = &x;\nint **pp = &p;\n**pp = 9;\nprintf(\"%d\", x);","a":["9"],"e":"pp는 p를, p는 x를 가리킨다. **pp = 9는 x를 9로 바꾼다.","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int f(int n) {\n    if (n <= 1) return n;\n    return f(n - 1) + f(n - 2);\n}\n// main\nprintf(\"%d\", f(7));","a":["13"],"e":"피보나치: 0, 1, 1, 2, 3, 5, 8, 13 → f(7) = 13.","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"struct P { int x, y; };\nstruct P a = {3, 4};\nstruct P *q = &a;\nq->x += q->y;\nprintf(\"%d %d\", a.x, a.y);","a":["7 4"],"e":"q->x는 a.x. 3 + 4 = 7.","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int a = 7, b = 2;\nprintf(\"%d %d %d\", a & b, a | b, a ^ b);","a":["2 7 5"],"e":"111 & 010 = 010(2), 111 | 010 = 111(7), 111 ^ 010 = 101(5).","t":"sa"},{"s":2,"u":"C 핵심","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int a = 5, b = 0;\nif (a > 3 || ++b > 0) a++;\nprintf(\"%d %d\", a, b);","a":["6 0"],"e":"a > 3이 참이라 || 오른쪽(++b)은 실행되지 않는다(단축 평가). a만 6.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"[member] 테이블에서 나이(age)가 20 이상 30 이하인 회원을 조회하려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"SELECT * FROM member\nWHERE age ( ① ) 20 AND 30;","a":["BETWEEN"],"e":"BETWEEN a AND b는 양 끝을 포함한다.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"[member] 테이블에서 이메일이 비어 있는(NULL) 회원만 조회하려고 한다. 빈칸 ①에 알맞은 두 단어를 쓰시오.","c":"SELECT * FROM member WHERE email ( ① );","a":["IS NULL"],"e":"NULL 비교는 = 가 아니라 IS NULL / IS NOT NULL.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"[orders] 테이블에서 고객(cust)별 주문 금액(amount) 합계를 구하려고 한다. 빈칸 ①에 들어갈 두 단어를 쓰시오.","c":"SELECT cust, SUM(amount)\nFROM orders\n( ① ) cust;","a":["GROUP BY"],"e":"집계 함수를 그룹별로 계산할 때 GROUP BY를 쓴다.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"다음 SQL을 실행한 결과 값을 쓰시오.<table><tr><th>name</th><th>score</th></tr><tr><td>A</td><td>70</td></tr><tr><td>B</td><td>NULL</td></tr><tr><td>C</td><td>90</td></tr><tr><td>D</td><td>80</td></tr></table>","c":"SELECT COUNT(*) - COUNT(score) FROM t;","a":["1"],"e":"COUNT(*)는 4, COUNT(score)는 NULL을 빼고 3 → 1.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"다음 SQL을 실행한 결과 값을 쓰시오.<table><tr><th>name</th><th>dept</th><th>sal</th></tr><tr><td>A</td><td>개발</td><td>300</td></tr><tr><td>B</td><td>개발</td><td>500</td></tr><tr><td>C</td><td>영업</td><td>400</td></tr><tr><td>D</td><td>영업</td><td>200</td></tr><tr><td>E</td><td>인사</td><td>350</td></tr></table>","c":"SELECT COUNT(*) FROM emp\nWHERE sal > (SELECT AVG(sal) FROM emp);","a":["2"],"e":"평균 = (300+500+400+200+350)/5 = 350. 350보다 큰 행: 500, 400 → 2.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"다음 SQL을 실행한 결과 행의 개수를 쓰시오.<table><tr><th>name</th><th>dept</th><th>sal</th></tr><tr><td>A</td><td>개발</td><td>300</td></tr><tr><td>B</td><td>개발</td><td>500</td></tr><tr><td>C</td><td>영업</td><td>400</td></tr><tr><td>D</td><td>영업</td><td>200</td></tr><tr><td>E</td><td>인사</td><td>350</td></tr></table>","c":"SELECT dept, AVG(sal) FROM emp\nGROUP BY dept\nHAVING AVG(sal) >= 350;","a":["2"],"e":"부서별 평균: 개발 400, 영업 300, 인사 350 → 350 이상은 개발·인사 2행.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"다음 SQL을 실행한 결과 값을 쓰시오.<table><tr><th>name</th><th>dept</th><th>sal</th></tr><tr><td>A</td><td>개발</td><td>300</td></tr><tr><td>B</td><td>개발</td><td>500</td></tr><tr><td>C</td><td>영업</td><td>400</td></tr><tr><td>D</td><td>영업</td><td>200</td></tr><tr><td>E</td><td>인사</td><td>350</td></tr></table>","c":"SELECT name FROM emp\nORDER BY sal DESC\nLIMIT 1 OFFSET 1;","a":["C"],"e":"급여 내림차순: B(500), C(400), E(350)… OFFSET 1로 첫 행을 건너뛰고 1개 → C. (LIMIT·OFFSET은 MySQL·PostgreSQL 문법)","t":"sa"},{"s":3,"u":"SQL 핵심","q":"[student] 테이블의 dept 열 값으로 중복 없이 학과 목록을 조회하려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"SELECT ( ① ) dept FROM student;","a":["DISTINCT"],"e":"DISTINCT는 중복 행을 제거한다.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"user1에게 [student] 테이블의 SELECT 권한을 주면서, user1이 이 권한을 다른 사용자에게도 줄 수 있게 하려고 한다. 빈칸 ①에 들어갈 두 단어를 쓰시오.","c":"GRANT SELECT ON student TO user1 WITH ( ① );","a":["GRANT OPTION"],"e":"WITH GRANT OPTION을 붙이면 받은 권한을 다른 사용자에게 다시 부여할 수 있다.","t":"sa"},{"s":3,"u":"SQL 핵심","q":"트랜잭션 중간에 저장점 sp1을 만들려고 한다. 빈칸 ①에 들어갈 명령어를 쓰시오.","c":"UPDATE acc SET bal = bal - 100 WHERE id = 1;\n( ① ) sp1;\nUPDATE acc SET bal = bal + 100 WHERE id = 2;","a":["SAVEPOINT"],"e":"SAVEPOINT 이름으로 저장점을 만들고 ROLLBACK TO 이름으로 그 지점까지 되돌린다.","t":"sa"},{"s":4,"u":"경로와 Linux","q":"현재 작업 디렉터리의 절대 경로가 /usr/local/bin일 때, 상대 경로 \"../../share/doc\"의 절대 경로를 쓰시오.","a":["/usr/share/doc","/usr/share/doc/"],"e":"..로 /usr/local, 한 번 더 ..로 /usr, 거기서 share/doc → /usr/share/doc.","t":"sa"},{"s":4,"u":"경로와 Linux","q":"Linux에서 현재 작업 중인 디렉터리의 절대 경로를 출력하는 명령어를 쓰시오.","a":["pwd"],"e":"pwd = print working directory.","t":"sa"},{"s":4,"u":"경로와 Linux","q":"Linux에서 파일 a.txt를 b.txt라는 이름으로 복사하는 명령을 쓰시오.","a":["cp a.txt b.txt"],"e":"cp 원본 대상. 이름 바꾸기·이동은 mv.","t":"sa"},{"s":4,"u":"경로와 Linux","q":"Linux에서 파일 내용을 처음 10줄만 출력하는 명령어 이름을 쓰시오.","a":["head"],"e":"head는 앞부분(기본 10줄), tail은 뒷부분. tail -f는 계속 추가되는 로그를 실시간으로 본다.","t":"sa"},{"s":4,"u":"경로와 Linux","q":"Linux에서 실행 중인 프로세스를 종료하는 명령어 이름을 쓰시오. (예: ( ) 1234)","a":["kill"],"e":"kill PID. 강제 종료는 kill -9 PID.","t":"sa"},{"s":4,"u":"경로와 Linux","q":"Linux에서 파일 log.txt의 줄 수를 세려고 한다. 빈칸 ①에 들어갈 옵션을 쓰시오.","c":"wc ( ① ) log.txt","a":["-l"],"e":"wc -l은 줄 수, -w는 단어 수, -c는 바이트 수.","t":"sa"}],note:"## 실기 개요\n\n실기 과제명은 '프로그래밍 기초', 1시간 30분, 100점 만점에 60점 이상 합격이다. 2026년 큐넷 공지는 '작업형'이라고 했지만, 2027~2029년 출제기준표의 검정방법은 '필답형'이다. 공단 예시문제도 코드를 처음부터 짜는 문제가 아니라 답을 직접 써 넣는 단답형 11문항이었다.\n\n출제기준 실기 범위는 프로그래밍 언어 활용(구조적·객체지향·스크립트 언어, 오류 식별과 수정), 프로그래밍 언어 응용(언어 특성, 라이브러리), SQL 활용(데이터 사전, 조인·서브쿼리·집합 연산자, DDL, 트랜잭션, 인덱스, 뷰), SQL 작성(조회, 삽입·변경·삭제)이다. 4개 주요항목 중 2개가 SQL이라 SQL 비중이 크다. 구조적 언어(C 계열)도 범위에 들어 있으니 C를 완전히 빼지는 말자.\n\n| 예시문제 유형 | 묻는 것 |\n| --- | --- |\n| 경로 | 작업 폴더 기준 상대 경로 → 절대 경로 |\n| Linux 명령어 | 기능 설명 보고 명령어 고르기(pwd, chmod 등) |\n| Python 실행 결과 | 클래스·재귀(트리 순회) 출력 |\n| Python 빈칸 | 딕셔너리 메서드(items 등) |\n| Python 오류 찾기 | 오류 줄 번호 + 고친 뒤 실행 결과 |\n| Java 빈칸 | 인터페이스 구현 키워드 |\n| Java 실행 결과 | 문자열 ==, 생성자 this()·super() 호출 순서 |\n| SQL | LIKE 와일드카드, 테이블 삭제 쿼리, 서브쿼리 결과 |\n\n## 경로와 Linux\n\n- 절대 경로: `/`부터 시작하는 전체 경로. 상대 경로: 현재 위치 기준\n- `.`은 현재 디렉터리, `..`은 상위 디렉터리, `~`는 홈 디렉터리\n- 풀이: 작업 폴더에서 출발해 `..`마다 한 단계씩 올라가고, 나머지 이름을 차례로 붙인다\n- 예) 작업 폴더 `/a/b/c`, 상대 경로 `../../d` → `/a/d`\n- 자주 나오는 명령어: `pwd`(현재 경로), `cd`(이동), `ls`(목록), `cat`(내용 출력), `cp`(복사), `rm`(삭제), `chmod`(권한 변경), `vi`(편집기), `top`(실시간 프로세스·자원), `echo`(문자열·변수 출력), `export`(환경 변수 설정), `ifconfig`(네트워크 설정)\n\n## 코드 추적 요령\n\n1. 변수마다 칸을 만들고 줄이 바뀔 때마다 값을 적는다.\n2. 반복문은 i 값과 조건 결과를 한 줄씩 표로 적는다. 마지막 1회와 종료 조건을 특히 조심한다.\n3. 출력 형식을 그대로 쓴다. 공백, 줄바꿈, 소수점(`5.0`), 따옴표 유무까지 답이다.\n4. 함수 호출은 호출 스택을 적는다. 재귀는 가장 안쪽부터 값을 채워 올라온다.\n\n**자주 나오는 함정**\n\n- C·Java 정수 나눗셈은 몫만 남는다: `7 / 2 = 3`. Python `/`는 실수(`3.5`), `//`는 내림.\n- `x++`는 쓰고 나서 증가, `++x`는 증가하고 나서 사용.\n- Java `int + char`는 숫자 덧셈(`5 + 'H' = 77`). `\"\" + 5 + 'H'`처럼 문자열이 먼저 오면 연결(`5H`).\n- Java `==`는 참조 비교, `equals()`는 내용 비교.\n- 오버라이딩된 메서드는 실제 객체 기준으로 실행. static 변수는 모든 객체가 공유.\n- 예외가 나면 try의 나머지 줄은 건너뛰고 catch → finally 순서로 실행.\n- Python `b = a`는 같은 리스트를 가리킨다. 복사는 `a[:]`나 `a.copy()`.\n- Python 슬라이싱 끝 인덱스는 포함하지 않는다. `s[::-1]`은 뒤집기.\n- C 포인터 `*p`를 바꾸면 가리키는 변수도 바뀐다.\n- `switch`에 `break`가 없으면 아래 case까지 실행된다.\n\n## C 핵심\n\n- 출력: `printf(\"%d %c %s %f\\n\", 정수, 문자, 문자열, 실수)`, `%.2f` 소수 둘째 자리, `%5d` 5칸\n- 입력: `scanf(\"%d\", &a)` (변수 앞에 &)\n- 배열: `int a[5] = {1, 2, 3};` 나머지는 0. 인덱스 0부터\n- 문자열: `char s[] = \"abc\";` 끝에 `'\\0'`. `strlen`, `strcpy`, `strcmp`, `strcat`\n- 포인터: `int *p = &a;` `*p`는 값, `p + 1`은 다음 원소\n- 구조체: `s.x`, 포인터는 `p->x`\n- 함수: 값에 의한 호출이 기본. 원본을 바꾸려면 포인터 전달\n\n## Java 핵심\n\n- 출력: `System.out.print()`, `println()`은 줄바꿈 포함, `printf()`\n- 배열: `int[] a = new int[5];` 길이는 `a.length`, 문자열 길이는 `s.length()`\n- 향상된 for: `for (int v : arr)`\n- 클래스: 생성자, `this`, `super`, 상속 `extends`, 인터페이스 `implements`\n- 생성 순서: 부모 생성자 → 자식 생성자\n- 오버로딩(같은 이름, 다른 매개변수) / 오버라이딩(부모 메서드 재정의)\n- 문자열: `charAt(i)`, `substring(a, b)`(b 미포함), `indexOf`, `toUpperCase`, `split`\n- 예외: `try / catch / finally`, `throw`, `throws`\n\n## Python 핵심\n\n- 입출력: `input()`은 문자열. 숫자는 `int(input())`, 여러 개는 `map(int, input().split())`\n- 출력: `print(a, b, sep=\",\", end=\"\")`, f-string `f\"{a} + {b}\"`\n- 리스트: `append`, `insert`, `pop`, `remove`, `sort`, `len`, 슬라이싱\n- 딕셔너리: `d[k] = v`, `d.get(k)`, `keys()`, `values()`, `items()`\n- 집합: `|` 합집합, `&` 교집합, `-` 차집합\n- 컴프리헨션: `[x * 2 for x in range(5) if x > 1]`\n- 함수: `def`, 기본값, `return`, `lambda`\n- 클래스: `__init__(self)`, 상속 `class B(A):`\n\n## SQL 핵심\n\n| 분류 | 명령어 | 짝 키워드 |\n| --- | --- | --- |\n| DDL | CREATE, ALTER, DROP, TRUNCATE | ALTER TABLE ~ ADD |\n| DML | SELECT, INSERT, UPDATE, DELETE | INSERT INTO ~ VALUES, UPDATE ~ SET, DELETE FROM |\n| DCL | GRANT, REVOKE | GRANT ~ TO, REVOKE ~ FROM |\n| TCL | COMMIT, ROLLBACK, SAVEPOINT | |\n\n- SELECT 실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY\n- 정렬: `ORDER BY 열 ASC`(기본) / `DESC`\n- 그룹 조건은 HAVING, 행 조건은 WHERE\n- `LIKE '김%'` 김으로 시작, `'_a%'` 둘째 글자 a\n- `BETWEEN 1 AND 10`은 양 끝 포함, `IN (1, 2)`, `IS NULL`\n- 집계: `COUNT`, `SUM`, `AVG`, `MAX`, `MIN` (NULL 제외, `COUNT(*)`만 포함)\n- 조인: `A JOIN B ON A.키 = B.키`, LEFT/RIGHT/FULL OUTER JOIN\n- 집합 연산: `UNION`(중복 제거), `UNION ALL`(중복 포함), `INTERSECT`, `EXCEPT`/`MINUS`\n- 서브쿼리: `WHERE c1 IN (SELECT …)`, `NOT IN`, `EXISTS`. 안쪽 결과를 먼저 적고 대조\n- 데이터 사전(Oracle): `USER_TABLES`, `USER_TAB_COLUMNS`, `USER_CONSTRAINTS`, `USER_INDEXES`, `USER_VIEWS`\n- 인덱스: `CREATE [UNIQUE] INDEX 이름 ON 테이블(컬럼);`, 삭제 `DROP INDEX 이름;`\n- 뷰: `CREATE VIEW 이름 AS SELECT …;`, 기존 테이블로 새 테이블 `CREATE TABLE 새이름 AS SELECT …;`\n- 제약조건: `PRIMARY KEY`, `FOREIGN KEY … REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`\n- 수정: `ALTER TABLE 테이블 ADD 컬럼 타입;`, `MODIFY`, `DROP COLUMN`\n- 트랜잭션: `COMMIT`(확정), `ROLLBACK`(취소), `SAVEPOINT 이름` / `ROLLBACK TO 이름`\n\n## Linux 명령어 정리\n\n| 명령어 | 기능 |\n| --- | --- |\n| `ls -l` | 목록 자세히 |\n| `cd` / `pwd` | 이동 / 현재 위치 |\n| `mkdir` / `rmdir` / `rm -r` | 디렉터리 생성 / 빈 디렉터리 삭제 / 하위 포함 삭제 |\n| `cp` / `mv` | 복사 / 이동·이름 변경 |\n| `cat` / `head` / `tail` | 내용 출력 / 앞부분 / 뒷부분 |\n| `chmod` / `chown` | 권한 변경 / 소유자 변경 |\n| `ps` / `kill` | 프로세스 보기 / 종료 |\n| `grep` / `find` | 문자열 찾기 / 파일 찾기 |\n| `wc -l` | 줄 수 세기 |\n\n- 권한 숫자: r = 4, w = 2, x = 1. `rwxr-x---` = 750, `rw-r--r--` = 644\n- `>` 덮어쓰기, `>>` 이어쓰기, `|` 파이프 (`ps | grep java`)\n\n## 오류 찾기·빈칸 문제 요령\n\n1. 오류 찾기는 문법부터 본다: 들여쓰기, 콜론(`:`), 괄호 짝, 따옴표, `return`·`break`가 함수나 반복문 밖에 있는지.\n2. 오류 줄 번호를 물으면 원인이 되는 줄을 쓴다. 고친 뒤 실행 결과를 물으면 고친 코드로 끝까지 추적한다.\n3. 빈칸 키워드는 짝으로 외운다: `implements`(인터페이스 구현), `extends`(상속), `super`/`this`(생성자 호출), `items()`·`keys()`·`values()`(딕셔너리).\n4. SQL 서브쿼리는 안쪽 결과를 먼저 목록으로 적고, 바깥 조건(IN, NOT IN)을 하나씩 대조한다.\n5. 테이블 삭제: 구조까지 `DROP TABLE 이름`, 참조 제약까지 함께 `DROP TABLE 이름 CASCADE`, 데이터만 `TRUNCATE TABLE 이름`.\n6. 답은 출력 그대로 쓴다. 구분자(`/`, 공백), 따옴표, 대소문자까지 확인한다.\n\n## 트리 순회 (Python 예시 유형)\n\n| 순회 | 순서 | 출력 위치 |\n| --- | --- | --- |\n| 전위 | 루트 → 왼쪽 → 오른쪽 | 재귀 호출 전 |\n| 중위 | 왼쪽 → 루트 → 오른쪽 | 왼쪽 호출과 오른쪽 호출 사이 |\n| 후위 | 왼쪽 → 오른쪽 → 루트 | 재귀 호출 후 |\n\n- 출력문이 어디에 있는지 보고 순회 종류를 먼저 정한 뒤, 트리를 그림으로 그려 순서대로 적는다.\n",cards:[{"f": "절대 경로", "b": "`/`부터 시작하는 전체 경로. 상대 경로: 현재 위치 기준", "u": "경로와 Linux"}, {"f": "풀이", "b": "작업 폴더에서 출발해 `..`마다 한 단계씩 올라가고, 나머지 이름을 차례로 붙인다", "u": "경로와 Linux"}, {"f": "자주 나오는 명령어", "b": "`pwd`(현재 경로), `cd`(이동), `ls`(목록), `cat`(내용 출력), `cp`(복사), `rm`(삭제), `chmod`(권한 변경), `vi`(편집기), `top`(실시간 프로세스·자원), `echo`(문자열·변수 출력), `export`(환경 변수 설정), `ifconfig`(네트워크 설정)", "u": "경로와 Linux"}, {"f": "C·Java 정수 나눗셈은 몫만 남는다", "b": "`7 / 2 = 3`. Python `/`는 실수(`3.5`), `//`는 내림.", "u": "코드 추적 요령"}, {"f": "출력", "b": "`printf(\"%d %c %s %f\\n\", 정수, 문자, 문자열, 실수)`, `%.2f` 소수 둘째 자리, `%5d` 5칸", "u": "C 핵심"}, {"f": "입력", "b": "`scanf(\"%d\", &a)` (변수 앞에 &)", "u": "C 핵심"}, {"f": "배열", "b": "`int a[5] = {1, 2, 3};` 나머지는 0. 인덱스 0부터", "u": "C 핵심"}, {"f": "문자열", "b": "`char s[] = \"abc\";` 끝에 `'\\0'`. `strlen`, `strcpy`, `strcmp`, `strcat`", "u": "C 핵심"}, {"f": "포인터", "b": "`int *p = &a;` `*p`는 값, `p + 1`은 다음 원소", "u": "C 핵심"}, {"f": "구조체", "b": "`s.x`, 포인터는 `p->x`", "u": "C 핵심"}, {"f": "함수", "b": "값에 의한 호출이 기본. 원본을 바꾸려면 포인터 전달", "u": "C 핵심"}, {"f": "출력", "b": "`System.out.print()`, `println()`은 줄바꿈 포함, `printf()`", "u": "Java 핵심"}, {"f": "배열", "b": "`int[] a = new int[5];` 길이는 `a.length`, 문자열 길이는 `s.length()`", "u": "Java 핵심"}, {"f": "향상된 for", "b": "`for (int v : arr)`", "u": "Java 핵심"}, {"f": "클래스", "b": "생성자, `this`, `super`, 상속 `extends`, 인터페이스 `implements`", "u": "Java 핵심"}, {"f": "생성 순서", "b": "부모 생성자 → 자식 생성자", "u": "Java 핵심"}, {"f": "문자열", "b": "`charAt(i)`, `substring(a, b)`(b 미포함), `indexOf`, `toUpperCase`, `split`", "u": "Java 핵심"}, {"f": "예외", "b": "`try / catch / finally`, `throw`, `throws`", "u": "Java 핵심"}, {"f": "입출력", "b": "`input()`은 문자열. 숫자는 `int(input())`, 여러 개는 `map(int, input().split())`", "u": "Python 핵심"}, {"f": "출력", "b": "`print(a, b, sep=\",\", end=\"\")`, f-string `f\"{a} + {b}\"`", "u": "Python 핵심"}, {"f": "리스트", "b": "`append`, `insert`, `pop`, `remove`, `sort`, `len`, 슬라이싱", "u": "Python 핵심"}, {"f": "딕셔너리", "b": "`d[k] = v`, `d.get(k)`, `keys()`, `values()`, `items()`", "u": "Python 핵심"}, {"f": "집합", "b": "`|` 합집합, `&` 교집합, `-` 차집합", "u": "Python 핵심"}, {"f": "컴프리헨션", "b": "`[x * 2 for x in range(5) if x > 1]`", "u": "Python 핵심"}, {"f": "함수", "b": "`def`, 기본값, `return`, `lambda`", "u": "Python 핵심"}, {"f": "클래스", "b": "`__init__(self)`, 상속 `class B(A):`", "u": "Python 핵심"}, {"f": "DDL", "b": "명령어: CREATE, ALTER, DROP, TRUNCATE / 짝 키워드: ALTER TABLE ~ ADD", "u": "SQL 핵심"}, {"f": "DML", "b": "명령어: SELECT, INSERT, UPDATE, DELETE / 짝 키워드: INSERT INTO ~ VALUES, UPDATE ~ SET, DELETE FROM", "u": "SQL 핵심"}, {"f": "DCL", "b": "명령어: GRANT, REVOKE / 짝 키워드: GRANT ~ TO, REVOKE ~ FROM", "u": "SQL 핵심"}, {"f": "TCL", "b": "명령어: COMMIT, ROLLBACK, SAVEPOINT", "u": "SQL 핵심"}, {"f": "SELECT 실행 순서", "b": "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "u": "SQL 핵심"}, {"f": "정렬", "b": "`ORDER BY 열 ASC`(기본) / `DESC`", "u": "SQL 핵심"}, {"f": "집계", "b": "`COUNT`, `SUM`, `AVG`, `MAX`, `MIN` (NULL 제외, `COUNT(*)`만 포함)", "u": "SQL 핵심"}, {"f": "조인", "b": "`A JOIN B ON A.키 = B.키`, LEFT/RIGHT/FULL OUTER JOIN", "u": "SQL 핵심"}, {"f": "집합 연산", "b": "`UNION`(중복 제거), `UNION ALL`(중복 포함), `INTERSECT`, `EXCEPT`/`MINUS`", "u": "SQL 핵심"}, {"f": "서브쿼리", "b": "`WHERE c1 IN (SELECT …)`, `NOT IN`, `EXISTS`. 안쪽 결과를 먼저 적고 대조", "u": "SQL 핵심"}, {"f": "데이터 사전(Oracle)", "b": "`USER_TABLES`, `USER_TAB_COLUMNS`, `USER_CONSTRAINTS`, `USER_INDEXES`, `USER_VIEWS`", "u": "SQL 핵심"}, {"f": "인덱스", "b": "`CREATE [UNIQUE] INDEX 이름 ON 테이블(컬럼);`, 삭제 `DROP INDEX 이름;`", "u": "SQL 핵심"}, {"f": "제약조건", "b": "`PRIMARY KEY`, `FOREIGN KEY … REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`", "u": "SQL 핵심"}, {"f": "수정", "b": "`ALTER TABLE 테이블 ADD 컬럼 타입;`, `MODIFY`, `DROP COLUMN`", "u": "SQL 핵심"}, {"f": "트랜잭션", "b": "`COMMIT`(확정), `ROLLBACK`(취소), `SAVEPOINT 이름` / `ROLLBACK TO 이름`", "u": "SQL 핵심"}, {"f": "`ls -l`", "b": "기능: 목록 자세히", "u": "Linux 명령어 정리"}, {"f": "`cd` / `pwd`", "b": "기능: 이동 / 현재 위치", "u": "Linux 명령어 정리"}, {"f": "`mkdir` / `rmdir` / `rm -r`", "b": "기능: 디렉터리 생성 / 빈 디렉터리 삭제 / 하위 포함 삭제", "u": "Linux 명령어 정리"}, {"f": "`cp` / `mv`", "b": "기능: 복사 / 이동·이름 변경", "u": "Linux 명령어 정리"}, {"f": "`cat` / `head` / `tail`", "b": "기능: 내용 출력 / 앞부분 / 뒷부분", "u": "Linux 명령어 정리"}, {"f": "`chmod` / `chown`", "b": "기능: 권한 변경 / 소유자 변경", "u": "Linux 명령어 정리"}, {"f": "`ps` / `kill`", "b": "기능: 프로세스 보기 / 종료", "u": "Linux 명령어 정리"}, {"f": "`grep` / `find`", "b": "기능: 문자열 찾기 / 파일 찾기", "u": "Linux 명령어 정리"}, {"f": "`wc -l`", "b": "기능: 줄 수 세기", "u": "Linux 명령어 정리"}, {"f": "권한 숫자", "b": "r = 4, w = 2, x = 1. `rwxr-x---` = 750, `rw-r--r--` = 644", "u": "Linux 명령어 정리"}, {"f": "전위", "b": "순서: 루트 → 왼쪽 → 오른쪽 / 출력 위치: 재귀 호출 전", "u": "트리 순회 (Python 예시 유형)"}, {"f": "중위", "b": "순서: 왼쪽 → 루트 → 오른쪽 / 출력 위치: 왼쪽 호출과 오른쪽 호출 사이", "u": "트리 순회 (Python 예시 유형)"}, {"f": "후위", "b": "순서: 왼쪽 → 오른쪽 → 루트 / 출력 위치: 재귀 호출 후", "u": "트리 순회 (Python 예시 유형)"}],unitMode:"h2"},
  ad:{name:"ADsP",tag:"ADsP",color:"#0f8a7e",subj:["데이터 이해","데이터 분석 기획","데이터 분석"],limit:5400,mockN:[10,10,30],rule:"60점 이상, 과목별 40% 이상",pass:(sc,per)=>sc>=60&&per.every(([r,t])=>!t||r/t>=0.4),
      Q:[{"s":0,"q":"다음 중 정성적 데이터에 해당하는 것은?","o":["월별 매출액","측정한 기온","설문조사의 주관식 응답","학생의 키"],"a":2,"e":"정성적 데이터는 언어·문자처럼 형태와 형식이 정해지지 않은 데이터다. 나머지는 수치로 표현되는 정량적 데이터.","u":"데이터와 정보"},{"s":0,"q":"암묵지와 형식지의 상호작용에서, 개인의 암묵지를 언어나 문서 같은 형식지로 바꾸는 과정은?","o":["공통화","표출화","연결화","내면화"],"a":1,"e":"공통화(암묵지 공유) → 표출화(암묵지 → 형식지) → 연결화(형식지 결합) → 내면화(형식지 → 암묵지).","u":"데이터와 정보"},{"s":0,"q":"‘A마트 연필 100원, B마트 연필 200원’이라는 사실에서 ‘상대적으로 저렴한 A마트에서 연필을 사야겠다’고 판단했다. DIKW 피라미드에서 이 판단은?","o":["데이터","정보","지식","지혜"],"a":2,"e":"가격 자체는 데이터, ‘A마트가 더 싸다’는 정보, 이를 바탕으로 한 행동 판단은 지식. ‘A마트의 다른 상품도 쌀 것’처럼 창의적으로 넓히면 지혜.","u":"데이터와 정보"},{"s":0,"q":"데이터베이스의 일반적인 특징이 아닌 것은?","o":["통합된 데이터","저장된 데이터","공용 데이터","독점 데이터"],"a":3,"e":"데이터베이스는 통합된·저장된·공용·변화되는 데이터의 특징을 가진다.","u":"데이터베이스"},{"s":0,"q":"빅데이터의 특징인 3V에 해당하지 않는 것은?","o":["Volume","Variety","Velocity","Visualization"],"a":3,"e":"3V는 규모(Volume), 다양성(Variety), 속도(Velocity). 4V일 때는 가치(Value)를 더한다.","u":"빅데이터"},{"s":0,"q":"빅데이터가 만들어 낸 본질적인 변화로 옳지 않은 것은?","o":["사전 처리에서 사후 처리로","표본 조사에서 전수 조사로","양보다 질을 중시","인과관계에서 상관관계로"],"a":2,"e":"빅데이터 시대에는 질보다 양을 중시하는 방향으로 바뀌었다.","u":"빅데이터"},{"s":0,"q":"빅데이터의 위기 요인 중 ‘데이터 오용’에 대한 통제 방안은?","o":["동의에서 책임으로","결과 기반 책임 원칙 고수","알고리즈미스트","개인정보 비식별화"],"a":2,"e":"데이터 오용 → 알고리즘 접근 허용과 알고리즈미스트. 사생활 침해 → 동의에서 책임으로. 책임 원칙 훼손 → 결과 기반 책임 원칙.","u":"빅데이터"},{"s":0,"q":"데이터 사이언티스트의 역량 중 소프트 스킬이 아닌 것은?","o":["통찰력 있는 분석","설득력 있는 전달","다분야 간 협력","분석 기술의 숙련도"],"a":3,"e":"분석 기술 숙련도와 빅데이터 이론 지식은 하드 스킬이다.","u":"데이터 사이언스"},{"s":0,"q":"주민등록번호 뒷자리를 ‘*******’로 바꿔 보이지 않게 하는 비식별화 기법은?","o":["가명처리","총계처리","데이터 범주화","데이터 마스킹"],"a":3,"e":"데이터 마스킹은 개인 식별 정보 일부를 공백·별표 등으로 가린다. 범주화는 값을 구간으로 묶는 것(35세 → 30대).","u":"데이터 사이언스"},{"s":0,"q":"원재료 조달부터 생산, 고객 배송까지 공급망 전체의 흐름을 관리하는 기업 정보 시스템은?","o":["ERP","CRM","SCM","BI"],"a":2,"e":"SCM(공급망 관리). ERP는 전사적 자원 관리, CRM은 고객 관계 관리, BI는 비즈니스 인텔리전스.","u":"데이터베이스"},{"s":1,"q":"분석 대상(What)은 알지만 분석 방법(How)을 모를 때의 분석 주제 유형은?","o":["최적화","솔루션","통찰","발견"],"a":1,"e":"대상·방법 모두 앎 = 최적화, 대상만 앎 = 솔루션, 방법만 앎 = 통찰, 둘 다 모름 = 발견.","u":"분석 기획"},{"s":1,"q":"하향식 접근 방식의 분석 과제 발굴 순서로 옳은 것은?","o":["문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토","문제 정의 → 문제 탐색 → 타당성 검토 → 해결 방안 탐색","문제 탐색 → 해결 방안 탐색 → 문제 정의 → 타당성 검토","타당성 검토 → 문제 탐색 → 문제 정의 → 해결 방안 탐색"],"a":0,"e":"하향식: 문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토.","u":"분석 기획"},{"s":1,"q":"상향식 접근 방식에 대한 설명으로 옳지 않은 것은?","o":["데이터 자체를 들여다보며 인사이트를 찾는다","비지도 학습 방법을 주로 활용한다","문제가 명확하게 정의되어 있을 때 사용한다","프로토타이핑 방식을 활용할 수 있다"],"a":2,"e":"문제가 명확할 때는 하향식 접근을 쓴다. 상향식은 문제 정의가 어려울 때 데이터에서 출발한다.","u":"분석 기획"},{"s":1,"q":"KDD 분석 방법론의 절차로 옳은 것은?","o":["데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 해석·평가","전처리 → 데이터셋 선택 → 변환 → 데이터 마이닝 → 해석·평가","데이터셋 선택 → 변환 → 전처리 → 데이터 마이닝 → 해석·평가","업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가"],"a":0,"e":"KDD: 선택 → 전처리 → 변환 → 마이닝 → 해석·평가. ④는 CRISP-DM.","u":"분석 방법론"},{"s":1,"q":"CRISP-DM 방법론의 단계가 아닌 것은?","o":["업무 이해","데이터 준비","평가","데이터 변환"],"a":3,"e":"CRISP-DM: 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개. ‘데이터 변환’은 KDD 단계.","u":"분석 방법론"},{"s":1,"q":"빅데이터 분석 방법론 5단계 중 가장 먼저 수행하는 단계는?","o":["데이터 준비","분석 기획","데이터 분석","시스템 구현"],"a":1,"e":"분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개.","u":"분석 방법론"},{"s":1,"q":"분석 과제 우선순위를 정하는 사분면(시급성 × 난이도)에서 ‘현재 시급하고 난이도가 쉬운’ 과제가 속하는 사분면은?","o":["1사분면","2사분면","3사분면","4사분면"],"a":2,"e":"3사분면이 가장 먼저 수행할 과제다. 시급성 기준이면 3 → 4 → 2, 난이도 기준이면 3 → 1 → 2 순서.","u":"분석 과제 관리와 마스터 플랜"},{"s":1,"q":"분석 마스터 플랜에서 ‘우선순위’를 정할 때 고려하는 요소가 아닌 것은?","o":["전략적 중요도","비즈니스 성과·ROI","실행 용이성","기술 적용 수준"],"a":3,"e":"기술 적용 수준은 우선순위가 아니라 ‘적용 범위·방식’을 정할 때 고려한다(업무 내재화, 분석 데이터, 기술 적용 수준).","u":"분석 과제 관리와 마스터 플랜"},{"s":1,"q":"분석 성숙도 모델의 단계를 순서대로 나열한 것은?","o":["도입 → 활용 → 확산 → 최적화","활용 → 도입 → 확산 → 최적화","도입 → 확산 → 활용 → 최적화","도입 → 활용 → 최적화 → 확산"],"a":0,"e":"도입 → 활용 → 확산 → 최적화.","u":"분석 거버넌스"},{"s":1,"q":"데이터 거버넌스의 구성 요소가 아닌 것은?","o":["원칙","조직","프로세스","알고리즘"],"a":3,"e":"데이터 거버넌스 구성 요소는 원칙(Principle), 조직(Organization), 프로세스(Process).","u":"분석 거버넌스"},{"s":2,"q":"결측값이 하나라도 있는 레코드를 삭제하고, 값이 모두 있는 자료만으로 분석하는 결측값 처리 방법은?","o":["평균 대치법","단순 확률 대치법","다중 대치법","완전 분석법"],"a":3,"e":"완전 분석법은 간단하지만 자료가 줄어 효율성이 떨어진다. 평균 대치법은 평균으로 채우고, 다중 대치법은 대치 → 분석 → 결합의 3단계를 거친다.","u":"데이터 마트, 결측값, 이상값"},{"s":2,"q":"R의 reshape 패키지에서 데이터를 식별자(id), variable, value 형태의 긴 형식으로 바꾸는 함수는?","o":["cast","melt","merge","apply"],"a":1,"e":"melt로 녹인 뒤 cast로 원하는 모양(요약 테이블)으로 다시 만든다. 데이터 마트 구성에 쓰는 대표 함수.","u":"데이터 마트, 결측값, 이상값"},{"s":2,"q":"R에서 결측값(missing value)을 나타내는 것은?","o":["NULL","NaN","NA","Inf"],"a":2,"e":"결측값은 NA. NaN은 0/0 같은 계산 불가, NULL은 값이 없는 객체, Inf는 무한대.","u":"R 기초"},{"s":2,"q":"R에서 데이터프레임의 행 개수와 열 개수를 함께 알려 주는 함수는?","o":["length()","dim()","str()","nrow()"],"a":1,"e":"dim()은 (행, 열)을 반환한다. nrow()는 행 수만, str()은 구조를 보여 준다.","u":"R 기초"},{"s":2,"q":"섭씨온도처럼 간격은 의미가 있지만 절대 0점이 없는 척도는?","o":["명목척도","서열척도","등간척도","비율척도"],"a":2,"e":"등간척도는 더하기·빼기는 되지만 비율 비교(2배 덥다)는 안 된다. 키·무게처럼 절대 0이 있으면 비율척도.","u":"통계 기초"},{"s":2,"q":"모집단을 서로 겹치지 않는 여러 계층으로 나누고, 각 계층에서 무작위로 표본을 뽑는 방법은?","o":["단순 무작위 추출","계통 추출","집락 추출","층화 추출"],"a":3,"e":"층화 추출. 집락 추출은 집단(집락)을 뽑아 그 안을 전부 조사한다.","u":"통계 기초"},{"s":2,"q":"이상치(극단값)의 영향을 가장 적게 받는 대푯값은?","o":["산술평균","중앙값","범위","표준편차"],"a":1,"e":"중앙값은 순서상 가운데 값이라 극단값에 덜 민감하다.","u":"통계 기초"},{"s":2,"q":"제1종 오류에 대한 설명으로 옳은 것은?","o":["귀무가설이 참인데 귀무가설을 기각하는 오류","귀무가설이 거짓인데 귀무가설을 채택하는 오류","대립가설이 참인데 대립가설을 채택하는 오류","표본 크기가 작아서 생기는 오류"],"a":0,"e":"제1종 오류(α): 참인 귀무가설을 기각. 제2종 오류(β): 거짓인 귀무가설을 채택.","u":"가설 검정"},{"s":2,"q":"유의수준 0.05에서 검정한 결과 p-value가 0.01이었다. 올바른 판단은?","o":["귀무가설을 채택한다","귀무가설을 기각한다","대립가설을 기각한다","판단할 수 없다"],"a":1,"e":"p-value < 유의수준이면 귀무가설을 기각한다.","u":"가설 검정"},{"s":2,"q":"두 변수가 모두 서열척도일 때 사용하는 상관계수는?","o":["피어슨 상관계수","스피어만 상관계수","결정계수","공분산"],"a":1,"e":"스피어만은 순위 기반(서열척도, 비선형 단조 관계). 피어슨은 등간·비율척도의 선형 관계.","u":"상관과 회귀"},{"s":2,"q":"회귀모형의 결정계수(R²)가 0.8이라는 의미로 옳은 것은?","o":["독립변수와 종속변수의 상관계수가 0.8이다","종속변수 변동의 80%를 회귀모형이 설명한다","예측 정확도가 80%이다","회귀계수가 0.8이다"],"a":1,"e":"결정계수는 전체 변동 중 모형이 설명하는 비율(0~1). 단순회귀에서 상관계수의 제곱과 같다.","u":"상관과 회귀"},{"s":2,"q":"회귀분석에서 독립변수 간 다중공선성을 진단하는 지표는?","o":["VIF","AIC","p-value","MSE"],"a":0,"e":"VIF(분산팽창요인)가 보통 10을 넘으면 다중공선성이 심하다고 본다.","u":"상관과 회귀"},{"s":2,"q":"모든 독립변수를 넣은 모형에서 시작해 중요도가 낮은 변수를 하나씩 제거하는 변수 선택 방법은?","o":["전진 선택법","후진 제거법","단계적 선택법","라쏘 회귀"],"a":1,"e":"후진 제거법. 전진 선택법은 빈 모형에서 하나씩 추가, 단계적은 추가와 제거를 함께.","u":"상관과 회귀"},{"s":2,"q":"평균이 일정하지 않은 비정상 시계열을 정상 시계열로 바꾸는 방법은?","o":["차분","로그 변환","이동 평균","정규화"],"a":0,"e":"평균이 일정하지 않으면 차분, 분산이 일정하지 않으면 변환(로그 등)을 한다.","u":"시계열과 차원 축소"},{"s":2,"q":"ARIMA(p, d, q) 모형에서 d가 의미하는 것은?","o":["자기회귀 차수","차분 횟수","이동평균 차수","계절 주기"],"a":1,"e":"p는 AR 차수, d는 차분 횟수, q는 MA 차수.","u":"시계열과 차원 축소"},{"s":2,"q":"주성분분석(PCA)에 대한 설명으로 옳지 않은 것은?","o":["변수의 차원을 줄이는 데 쓴다","주성분끼리는 서로 상관관계가 없다","첫 번째 주성분이 분산을 가장 많이 설명한다","종속변수를 예측하는 지도학습 기법이다"],"a":3,"e":"PCA는 종속변수 없이 변수들의 구조를 요약하는 비지도 기법이다.","u":"시계열과 차원 축소"},{"s":2,"q":"세 개 이상 집단의 평균 차이를 검정하는 방법은?","o":["독립표본 t-검정","대응표본 t-검정","분산분석(ANOVA)","카이제곱 검정"],"a":2,"e":"두 집단은 t-검정, 세 집단 이상은 분산분석(F-검정).","u":"가설 검정"},{"s":2,"q":"두 범주형 변수가 서로 독립인지 검정하는 방법은?","o":["카이제곱 검정","t-검정","회귀분석","Shapiro-Wilk 검정"],"a":0,"e":"교차표로 정리한 뒤 카이제곱 독립성 검정을 한다. Shapiro-Wilk는 정규성 검정.","u":"가설 검정"},{"s":2,"q":"다음 중 지도학습 기법이 아닌 것은?","o":["의사결정나무","로지스틱 회귀","인공신경망","K-평균 군집"],"a":3,"e":"K-평균 군집은 정답(레이블) 없이 묶는 비지도학습이다.","u":"정형 데이터 마이닝"},{"s":2,"q":"로지스틱 회귀분석에 대한 설명으로 옳은 것은?","o":["종속변수가 연속형일 때 사용한다","종속변수가 범주형(예: 0/1)일 때 사용한다","독립변수는 반드시 범주형이어야 한다","출력값이 -∞~∞ 범위이다"],"a":1,"e":"로지스틱 회귀는 시그모이드 함수로 0~1 확률을 출력해 범주를 분류한다.","u":"정형 데이터 마이닝"},{"s":2,"q":"분류나무(목표변수가 범주형)의 분리 기준이 아닌 것은?","o":["지니 지수","엔트로피 지수","카이제곱 통계량의 p-value","분산 감소량"],"a":3,"e":"분산 감소량과 F 통계량은 회귀나무(목표변수가 연속형)의 분리 기준이다.","u":"정형 데이터 마이닝"},{"s":2,"q":"약한 학습기를 순차적으로 학습시키면서 이전에 잘못 분류한 데이터에 더 큰 가중치를 주는 앙상블 기법은?","o":["배깅","부스팅","랜덤 포레스트","보팅"],"a":1,"e":"부스팅(AdaBoost, GBM 등). 배깅과 랜덤 포레스트는 부트스트랩 표본으로 병렬 학습한다.","u":"정형 데이터 마이닝"},{"s":2,"q":"혼동행렬에서 TP = 40, FP = 10, FN = 20, TN = 30일 때 정밀도(Precision)는?","o":["0.67","0.7","0.75","0.8"],"a":3,"e":"정밀도 = TP / (TP + FP) = 40 / 50 = 0.8. 재현율은 40/60 ≈ 0.67, 정확도는 70/100 = 0.7.","u":"모형 평가"},{"s":2,"q":"ROC 곡선에 대한 설명으로 옳은 것은?","o":["x축은 민감도, y축은 특이도이다","AUC가 1에 가까울수록 좋은 모형이다","AUC가 0.5이면 완벽한 모형이다","회귀모형 평가에 주로 쓴다"],"a":1,"e":"x축은 1 − 특이도(FPR), y축은 민감도(TPR). AUC 0.5는 무작위 수준이다.","u":"모형 평가"},{"s":2,"q":"과대적합(Overfitting)을 줄이는 방법이 아닌 것은?","o":["가지치기","교차 검증","정규화(규제)","모델의 복잡도를 높이기"],"a":3,"e":"복잡도를 높이면 과대적합이 더 심해진다. 학습 데이터를 늘리거나 드롭아웃을 쓰는 것도 방법이다.","u":"모형 평가"},{"s":2,"q":"계층적 군집에서 군집을 합칠 때 군집 내 오차제곱합의 증가량이 최소가 되도록 하는 연결법은?","o":["최단 연결법","최장 연결법","평균 연결법","와드 연결법"],"a":3,"e":"와드 연결법. 최단은 가장 가까운 점 사이 거리, 최장은 가장 먼 점 사이 거리를 기준으로 한다.","u":"군집 분석"},{"s":2,"q":"K-평균 군집에 대한 설명으로 옳지 않은 것은?","o":["군집 수 K를 미리 정해야 한다","초기 중심값에 따라 결과가 달라질 수 있다","이상치에 강건하다","거리 기반으로 군집을 나눈다"],"a":2,"e":"K-평균은 평균을 중심으로 쓰기 때문에 이상치에 민감하다. 이를 보완한 것이 K-medoids.","u":"군집 분석"},{"s":2,"q":"전체 거래 100건 중 A 포함 40건, B 포함 50건, A와 B 동시 포함 20건이다. 연관규칙 A → B의 향상도(Lift)는?","o":["0.5","1","1.25","2"],"a":1,"e":"신뢰도 = 20/40 = 0.5, P(B) = 50/100 = 0.5, 향상도 = 0.5 / 0.5 = 1. 향상도 1이면 A와 B는 서로 독립.","u":"연관 분석"},{"s":2,"q":"인공신경망에서 여러 범주 중 하나로 분류하는 출력층에 주로 쓰는 활성화 함수는?","o":["계단 함수","ReLU","소프트맥스","부호 함수"],"a":2,"e":"소프트맥스는 출력값을 합이 1인 확률로 바꿔 다중 분류에 쓴다.","u":"정형 데이터 마이닝"},{"s":2,"q":"변수 간의 상관관계(공분산)를 고려해 계산하는 거리는?","o":["유클리드 거리","맨해튼 거리","마할라노비스 거리","민코프스키 거리"],"a":2,"e":"마할라노비스 거리는 공분산 행렬을 반영해 변수의 척도와 상관을 보정한다.","u":"군집 분석"},{"s":0,"q":"데이터의 유형 중 정형 데이터에 대한 설명으로 옳은 것은?","o":["형태가 정해지지 않은 텍스트, 영상 데이터","메타데이터를 포함한 XML, JSON 데이터","고정된 필드(스키마)에 저장되어 행과 열로 표현되는 데이터","센서에서 실시간으로 쌓이는 음성 데이터"],"a":2,"e":"정형 데이터는 RDB 테이블처럼 고정된 스키마를 가진다. XML·JSON·HTML은 반정형, 텍스트·이미지·영상은 비정형.","u":"데이터와 정보"},{"s":0,"q":"다음 중 반정형 데이터에 해당하는 것은?","o":["JSON 문서","관계형 데이터베이스의 테이블","동영상 파일","녹음 파일"],"a":0,"e":"반정형 데이터는 스키마(구조) 정보를 데이터 안에 함께 담는다: XML, JSON, HTML, 로그 파일 등.","u":"데이터와 정보"},{"s":0,"q":"개인이 학습과 경험으로 체득했지만 겉으로 드러나지 않는 지식은?","o":["데이터","정보","형식지","암묵지"],"a":3,"e":"암묵지는 개인에게 체화되어 공유가 어렵다. 형식지는 문서·매뉴얼처럼 형상화된 지식.","u":"데이터와 정보"},{"s":0,"q":"데이터 웨어하우스의 특징이 아닌 것은?","o":["주제 지향적","통합적","휘발적","시계열적"],"a":2,"e":"데이터 웨어하우스는 주제 지향, 통합, 시계열, 비휘발(한 번 적재되면 잘 바뀌지 않음)의 특징을 가진다.","u":"데이터베이스"},{"s":0,"q":"여러 차원에서 데이터를 다각도로 분석하는 대화형 분석 기술은?","o":["SCM","OLTP","ERP","OLAP"],"a":3,"e":"OLAP(온라인 분석 처리)은 다차원 분석, OLTP(온라인 거래 처리)는 실시간 거래를 빠르게 처리한다.","u":"데이터베이스"},{"s":0,"q":"고객 정보를 통합해 마케팅, 영업, 고객 서비스에 활용하는 기업 정보 시스템은?","o":["SCM","ERP","KMS","CRM"],"a":3,"e":"CRM(고객 관계 관리). KMS는 지식 관리 시스템.","u":"데이터베이스"},{"s":0,"q":"빅데이터 출현의 배경으로 거리가 먼 것은?","o":["저장 장치 가격 하락","클라우드 컴퓨팅 확산","스마트폰과 SNS 보급","표본 조사의 중요성 증가"],"a":3,"e":"빅데이터 시대에는 표본 조사보다 전수 조사가 가능해졌다. 저장 비용 하락, 클라우드, 모바일·SNS가 출현 배경이다.","u":"빅데이터"},{"s":0,"q":"빅데이터 가치 산정이 어려운 이유가 아닌 것은?","o":["데이터 활용 방식이 다양해졌다","분석 기술이 빠르게 발전한다","데이터 저장 비용이 크게 올랐다","새로운 가치가 창출된다"],"a":2,"e":"가치 산정이 어려운 이유는 활용 방식의 다양화, 새로운 가치 창출, 분석 기술 발전. 저장 비용은 오히려 크게 떨어졌다.","u":"빅데이터"},{"s":0,"q":"빅데이터의 위기 요인 중 ‘사생활 침해’에 대한 통제 방안은?","o":["결과 기반 책임 원칙 고수","알고리즈미스트","동의에서 책임으로","데이터 독점 허용"],"a":2,"e":"개인 동의에만 의존하지 않고 데이터를 사용하는 쪽이 책임지게 한다(동의에서 책임으로).","u":"빅데이터"},{"s":0,"q":"‘예측 알고리즘으로 범죄 가능성이 높다고 판단된 사람을 미리 처벌하는 것’과 관련된 빅데이터 위기 요인은?","o":["데이터 유출","책임 원칙 훼손","데이터 오용","사생활 침해"],"a":1,"e":"책임 원칙 훼손: 일어나지 않은 일에 대한 예측으로 처벌할 수 있다. 통제 방안은 결과 기반 책임 원칙 고수.","u":"빅데이터"},{"s":0,"q":"알고리즘의 부당한 결과로 피해를 본 사람을 구제하기 위해 알고리즘을 해석하는 전문 인력은?","o":["알고리즈미스트","데이터 엔지니어","DBA","데이터 아키텍트"],"a":0,"e":"알고리즈미스트는 데이터 오용에 대한 통제 방안으로 제시된 전문 인력이다.","u":"빅데이터"},{"s":0,"q":"데이터 사이언스에 대한 설명으로 옳지 않은 것은?","o":["분석에 그치지 않고 효과적인 구현과 전달까지 포함한다","비즈니스 성과를 내는 데 초점을 둔다","통계학과 달리 정형 데이터만 분석한다","정형뿐 아니라 비정형 데이터도 다룬다"],"a":2,"e":"통계학이 주로 정형 데이터를 다루는 것과 달리, 데이터 사이언스는 정형·반정형·비정형 데이터를 모두 다룬다.","u":"데이터 사이언스"},{"s":0,"q":"전략 인사이트 도출을 위해 데이터 사이언티스트에게 필요한 ‘인문학적 사고’가 강조되는 이유로 거리가 먼 것은?","o":["단순 세계화에서 복잡한 세계화로의 변화","생산에서 시장 창조로의 변화","제품 생산에서 서비스로의 변화","하드웨어 가격 상승"],"a":3,"e":"인문학이 강조된 외부 환경 변화는 복잡한 세계화, 서비스로의 비즈니스 중심 이동, 시장 창조로의 경제·산업 논리 변화다.","u":"데이터 사이언스"},{"s":0,"q":"비식별화 기법 중 ‘35세 → 30대’, ‘키 172cm → 170~175cm’처럼 값을 구간이나 범주로 바꾸는 것은?","o":["총계처리","데이터 마스킹","가명처리","데이터 범주화"],"a":3,"e":"데이터 범주화는 단일 식별 값을 구간 값으로 바꾼다. 총계처리는 합계·평균 같은 통계값으로 바꾼다.","u":"데이터 사이언스"},{"s":0,"q":"비식별화 기법 중 ‘홍길동 → 임꺽정’처럼 개인 식별이 가능한 값을 다른 값으로 대체하는 것은?","o":["총계처리","데이터 삭제","가명처리","데이터 범주화"],"a":2,"e":"가명처리(휴리스틱 가명화, 암호화, 교환 방법 등).","u":"데이터 사이언스"},{"s":1,"q":"분석 기획 시 고려해야 할 사항이 아닌 것은?","o":["분석 결과의 화려한 시각화 디자인","가용한 데이터","적절한 유스케이스 탐색","분석 수행 시 발생 가능한 장애 요소"],"a":0,"e":"분석 기획의 고려 사항은 가용 데이터(데이터 확보 가능성), 적절한 유스케이스, 장애 요소에 대한 사전 계획이다.","u":"분석 기획"},{"s":1,"q":"분석 대상(What)과 분석 방법(How)을 모두 모를 때의 분석 주제 유형은?","o":["발견","솔루션","최적화","통찰"],"a":0,"e":"둘 다 모름 = 발견(Discovery). 대상은 모르고 방법만 알면 통찰(Insight).","u":"분석 기획"},{"s":1,"q":"분석 대상(What)은 모르지만 분석 방법(How)을 알고 있을 때의 분석 주제 유형은?","o":["솔루션","통찰","발견","최적화"],"a":1,"e":"방법만 앎 = 통찰(Insight). 대상만 앎 = 솔루션.","u":"분석 기획"},{"s":1,"q":"하향식 접근 방식에서 ‘문제 탐색’ 단계에 활용하는 도구로, 업무·제품·고객·규제와 감사·지원 인프라 영역으로 문제를 찾는 것은?","o":["프로토타이핑","디자인 사고","비즈니스 모델 캔버스","분석 유스케이스 정의서"],"a":2,"e":"비즈니스 모델 캔버스의 5가지 영역(업무, 제품, 고객, 규제와 감사, 지원 인프라)으로 문제를 빠짐없이 탐색한다.","u":"분석 기획"},{"s":1,"q":"하향식 접근 방식에서 비즈니스 문제를 데이터 분석 문제로 바꾸는 단계는?","o":["타당성 검토","문제 탐색","해결 방안 탐색","문제 정의"],"a":3,"e":"문제 정의 단계에서 식별된 비즈니스 문제를 데이터 문제로 변환한다.","u":"분석 기획"},{"s":1,"q":"하향식 접근 방식의 타당성 검토 단계에서 검토하는 항목이 아닌 것은?","o":["기술적 타당성","데이터 타당성","경제적 타당성","디자인 타당성"],"a":3,"e":"타당성 검토는 경제적 타당성, 데이터 및 기술적 타당성을 따진다.","u":"분석 기획"},{"s":1,"q":"상향식 접근 방식에 대한 설명으로 옳은 것은?","o":["지도 학습만 사용한다","분석 대상과 방법이 모두 정해져 있을 때 쓴다","문제를 먼저 명확히 정의하고 해결 방안을 찾는다","데이터를 그대로 들여다보며 인사이트를 찾는 발산적 사고를 쓴다"],"a":3,"e":"상향식은 데이터에서 출발해 비지도 학습, 디자인 사고(발산), 프로토타이핑으로 문제를 찾는다.","u":"분석 기획"},{"s":1,"q":"프로토타이핑 접근법이 필요한 이유로 거리가 먼 것은?","o":["문제에 대한 인식 수준이 낮을 때","데이터 사용 목적이 가변적일 때","필요한 데이터가 존재하는지 불확실할 때","요구사항이 처음부터 완벽하게 정해져 있을 때"],"a":3,"e":"프로토타이핑은 요구사항이 불명확하거나 데이터 존재·목적이 불확실할 때 빠르게 시도하며 다듬는 방법이다.","u":"분석 기획"},{"s":1,"q":"분석 과제 관리를 위해 고려해야 할 5가지 주요 영역이 아닌 것은?","o":["분석 복잡도","분석가의 연봉","데이터 복잡도","데이터 크기"],"a":1,"e":"5가지 영역: 데이터 크기(Size), 데이터 복잡도(Complexity), 속도(Speed), 분석 복잡도, 정확도와 정밀도.","u":"분석 과제 관리와 마스터 플랜"},{"s":1,"q":"분석 모델의 정확도(Accuracy)와 정밀도(Precision)에 대한 설명으로 옳은 것은?","o":["정밀도는 모델과 실제 값의 차이가 적은 정도를 뜻한다","정확도는 반복했을 때 결과가 얼마나 일관된지를 뜻한다","정확도는 활용 측면, 정밀도는 안정성 측면에서 중요하며 둘은 트레이드오프 관계일 수 있다","둘은 항상 함께 높아진다"],"a":2,"e":"정확도는 실제 값과의 차이(활용 측면), 정밀도는 반복 시 편차의 일관성(안정성 측면)이며 서로 트레이드오프일 때가 많다.","u":"분석 과제 관리와 마스터 플랜"},{"s":1,"q":"빅데이터 분석 방법론의 계층적 프로세스 3단계로 옳은 것은?","o":["목표 – 전략 – 실행","단계(Phase) – 태스크(Task) – 스텝(Step)","계획 – 실행 – 평가","단계 – 프로세스 – 산출물"],"a":1,"e":"방법론은 단계(Phase), 태스크(Task), 스텝(Step)의 3계층으로 구성된다. 각 단계는 기준선(Baseline)으로 관리된다.","u":"분석 방법론"},{"s":1,"q":"빅데이터 분석 방법론의 ‘분석 기획’ 단계에서 하는 일이 아닌 것은?","o":["비즈니스 이해 및 범위 설정","모델 성능 평가 및 모니터링","프로젝트 정의 및 수행 계획 수립","프로젝트 위험 계획 수립"],"a":1,"e":"모델 평가와 모니터링은 ‘평가 및 전개’ 단계. 분석 기획은 범위 설정, 프로젝트 정의, 위험 계획.","u":"분석 방법론"},{"s":1,"q":"분석 마스터 플랜 수립 시 ‘적용 범위와 방식’을 정할 때 고려하는 요소가 아닌 것은?","o":["전략적 중요도","기술 적용 수준","분석 데이터 적용 수준","업무 내재화 적용 수준"],"a":0,"e":"전략적 중요도는 ‘우선순위’를 정할 때 고려한다.","u":"분석 과제 관리와 마스터 플랜"},{"s":1,"q":"분석 조직 구조 중 별도의 전담 분석 조직 없이 각 현업 부서에서 직접 분석을 수행하는 형태는?","o":["집중형","기능 중심형","매트릭스형","분산형"],"a":1,"e":"기능 중심형은 각 부서가 직접 분석한다. 집중형은 전담 조직이 모든 분석을 맡고, 분산형은 전담 인력을 현업 부서에 배치한다.","u":"분석 거버넌스"},{"s":1,"q":"분석 준비도(Readiness)를 진단하는 6가지 영역이 아닌 것은?","o":["분석 업무 파악","분석 결과 판매 수익","분석 기법","인력 및 조직"],"a":1,"e":"6가지 영역: 분석 업무 파악, 인력 및 조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라.","u":"분석 거버넌스"},{"s":1,"q":"분석 수준 진단에서 준비도는 높지만 성숙도가 낮은 기업 유형은?","o":["도입형","준비형","정착형","확산형"],"a":0,"e":"도입형은 준비도는 높고 성숙도는 낮다. 정착형은 준비도 낮고 성숙도 높음, 확산형은 둘 다 높음, 준비형은 둘 다 낮음.","u":"분석 거버넌스"},{"s":1,"q":"데이터 거버넌스 체계의 구성 요소 중 데이터 표준화 단계에서 하는 일이 아닌 것은?","o":["분석 모델 배포","메타데이터 구축","데이터 표준 용어 설정","명명 규칙 수립"],"a":0,"e":"데이터 표준화는 표준 용어 설정, 명명 규칙, 메타데이터 구축, 데이터 사전 구축을 한다.","u":"분석 거버넌스"},{"s":2,"q":"R에서 다음 코드의 실행 결과는?","c":"x <- c(2, 4, 6, 8)\nmean(x)","o":["20","5","6","4"],"a":1,"e":"(2 + 4 + 6 + 8) / 4 = 5.","u":"R 기초"},{"s":2,"q":"R에서 1부터 10까지 2씩 증가하는 수열을 만드는 코드는?","o":["rep(1, 10, 2)","seq(1, 10, by = 2)","range(1, 10, 2)","c(1:10, 2)"],"a":1,"e":"seq(1, 10, by = 2) → 1 3 5 7 9. rep는 반복, range는 최솟값과 최댓값을 돌려준다.","u":"R 기초"},{"s":2,"q":"R에서 rep(c(1, 2), times = 3)의 결과는?","o":["3 6","1 2 3","1 1 1 2 2 2","1 2 1 2 1 2"],"a":3,"e":"times는 벡터 전체를 반복한다. each = 3이면 1 1 1 2 2 2.","u":"R 기초"},{"s":2,"q":"R에서 서로 다른 자료형의 객체를 함께 담을 수 있는 자료 구조는?","o":["행렬","벡터","배열","리스트"],"a":3,"e":"리스트는 서로 다른 형태·타입의 원소를 담을 수 있다. 벡터·행렬·배열은 한 가지 타입만.","u":"R 기초"},{"s":2,"q":"R에서 결측값을 제외하고 평균을 구하는 코드는?","o":["mean(x, NA = FALSE)","mean(x, na.rm = TRUE)","mean(na.omit = x)","avg(x)"],"a":1,"e":"na.rm = TRUE로 NA를 빼고 계산한다. NA가 있으면 기본적으로 결과도 NA.","u":"R 기초"},{"s":2,"q":"결측값 처리 방법 중 결측값을 여러 번 대치해 여러 개의 완전한 자료를 만들고, 분석한 뒤 결과를 결합하는 방법은?","o":["완전 분석법","단순 확률 대치법","평균 대치법","다중 대치법"],"a":3,"e":"다중 대치법은 대치 → 분석 → 결합의 3단계를 거친다.","u":"데이터 마트, 결측값, 이상값"},{"s":2,"q":"이상값 판단 기준 중 ESD(Extreme Studentized Deviation) 방법의 기준은?","o":["평균 ± 1 표준편차 밖","평균 ± 2 표준편차 밖","중앙값 ± 1.5 IQR 밖","평균 ± 3 표준편차 밖"],"a":3,"e":"ESD는 평균으로부터 3 표준편차 밖의 값을 이상값으로 본다.","u":"데이터 마트, 결측값, 이상값"},{"s":2,"q":"표본조사에서 모집단을 여러 집단으로 나눈 뒤 일부 집단을 무작위로 뽑고, 뽑힌 집단은 전부 조사하는 방법은?","o":["층화 추출","단순 무작위 추출","집락(군집) 추출","계통 추출"],"a":2,"e":"집락 추출은 집단 단위로 뽑는다. 층화 추출은 모든 계층에서 각각 표본을 뽑는다.","u":"통계 기초"},{"s":2,"q":"모집단에 번호를 매기고 일정한 간격(k번째마다)으로 표본을 뽑는 방법은?","o":["계통 추출","집락 추출","층화 추출","편의 추출"],"a":0,"e":"계통 추출은 첫 번째만 무작위로 고르고 이후 일정 간격으로 뽑는다.","u":"통계 기초"},{"s":2,"q":"학점(A, B, C, D)처럼 순서는 있지만 간격이 같다고 할 수 없는 척도는?","o":["서열척도","비율척도","등간척도","명목척도"],"a":0,"e":"서열척도는 순서만 의미가 있다. 성별·혈액형은 명목, 온도는 등간, 키·무게는 비율척도.","u":"통계 기초"},{"s":2,"q":"분포가 오른쪽으로 긴 꼬리를 가질 때(양의 왜도) 대푯값의 일반적인 크기 순서는?","o":["평균 > 중앙값 > 최빈값","중앙값 > 평균 > 최빈값","최빈값 > 중앙값 > 평균","평균 = 중앙값 = 최빈값"],"a":0,"e":"오른쪽 꼬리(양의 왜도)는 큰 값들이 평균을 끌어올려 평균 > 중앙값 > 최빈값. 대칭이면 셋이 같다.","u":"통계 기초"},{"s":2,"q":"중심극한정리에 대한 설명으로 옳은 것은?","o":["표본의 분산은 항상 0이 된다","모집단은 반드시 정규분포여야 한다","표본 크기가 작을수록 정규분포에 가깝다","표본 크기가 커지면 표본평균의 분포가 정규분포에 가까워진다"],"a":3,"e":"모집단 분포와 관계없이 표본 크기가 충분히 크면(보통 30 이상) 표본평균은 정규분포를 따른다.","u":"통계 기초"},{"s":2,"q":"검정력(Power)에 대한 설명으로 옳은 것은?","o":["대립가설이 참일 때 귀무가설을 기각할 확률(1 − β)","p-value와 같은 값","제1종 오류를 범할 확률","귀무가설이 참일 때 채택할 확률"],"a":0,"e":"검정력 = 1 − β. 거짓인 귀무가설을 올바르게 기각할 확률.","u":"가설 검정"},{"s":2,"q":"같은 대상에게 다이어트 전과 후의 체중을 측정해 평균 차이를 검정하는 방법은?","o":["대응표본 t-검정","카이제곱 검정","일원분산분석","독립표본 t-검정"],"a":0,"e":"같은 대상의 전후 비교는 대응(쌍체)표본 t-검정. 서로 다른 두 집단 비교는 독립표본 t-검정.","u":"가설 검정"},{"s":2,"q":"모집단의 분포를 가정하지 않고, 순위나 부호를 이용해 검정하는 방법을 무엇이라 하는가?","o":["분산분석","모수 검정","비모수 검정","회귀분석"],"a":2,"e":"비모수 검정: 부호 검정, 윌콕슨 순위합 검정, 만-위트니 U 검정, 크루스칼-왈리스 검정 등.","u":"가설 검정"},{"s":2,"q":"자료가 정규분포를 따르는지 확인하는 검정 방법은?","o":["Durbin-Watson 검정","Shapiro-Wilk 검정","카이제곱 독립성 검정","F 검정"],"a":1,"e":"Shapiro-Wilk(또는 Kolmogorov-Smirnov), Q-Q plot으로 정규성을 확인한다. Durbin-Watson은 잔차의 자기상관 검정.","u":"가설 검정"},{"s":2,"q":"회귀분석의 기본 가정이 아닌 것은?","o":["다중공선성","선형성","독립성","등분산성"],"a":0,"e":"가정은 선형성, 독립성, 등분산성, 비상관성, 정상성(정규성). 다중공선성은 피해야 할 문제다.","u":"상관과 회귀"},{"s":2,"q":"회귀분석에서 잔차들 사이에 자기상관이 있는지 검정하는 통계량은?","o":["Durbin-Watson","AIC","R²","VIF"],"a":0,"e":"Durbin-Watson 통계량이 2에 가까우면 자기상관이 없다고 본다.","u":"상관과 회귀"},{"s":2,"q":"AIC와 BIC에 대한 설명으로 옳은 것은?","o":["결정계수와 같은 값이다","값이 작을수록 좋은 모형이며 변수가 많아질수록 벌점을 준다","값이 클수록 좋은 모형이다","분류 모형에서만 쓴다"],"a":1,"e":"AIC·BIC는 작을수록 좋다. BIC는 변수 수에 더 큰 벌점을 준다.","u":"상관과 회귀"},{"s":2,"q":"라쏘(Lasso) 회귀에 대한 설명으로 옳은 것은?","o":["일부 회귀계수를 정확히 0으로 만들어 변수 선택 효과가 있다","항상 모든 변수를 남긴다","L2 규제를 사용한다","다중공선성을 키운다"],"a":0,"e":"라쏘는 L1 규제로 일부 계수를 0으로 만든다. 릿지는 L2 규제로 계수를 0에 가깝게 줄이지만 0으로 만들지는 않는다.","u":"상관과 회귀"},{"s":2,"q":"시계열의 구성 요소가 아닌 것은?","o":["계절 요인","표본 요인","순환 요인","추세 요인"],"a":1,"e":"시계열 분해 요인: 추세, 계절, 순환, 불규칙 요인.","u":"시계열과 차원 축소"},{"s":2,"q":"자기 자신의 과거 값으로 현재 값을 설명하는 시계열 모형은?","o":["회귀나무","AR 모형","MA 모형","로지스틱 회귀"],"a":1,"e":"AR(자기회귀)은 과거 관측값, MA(이동평균)는 과거 오차항으로 현재를 설명한다.","u":"시계열과 차원 축소"},{"s":2,"q":"주성분분석에서 주성분 개수를 정할 때 쓰는 방법이 아닌 것은?","o":["고윳값이 1 이상인 성분","스크리 플롯에서 기울기가 완만해지는 지점","누적 기여율이 일정 수준(예: 80%) 이상이 되는 지점","p-value가 0.05 이하인 성분"],"a":3,"e":"주성분 개수는 누적 기여율, 스크리 플롯의 꺾이는 지점, 고윳값 기준으로 정한다.","u":"시계열과 차원 축소"},{"s":2,"q":"여러 개체 간의 거리(비유사성)를 저차원 공간에 점으로 배치해 관계를 시각화하는 다변량 기법은?","o":["연관분석","판별분석","다차원 척도법(MDS)","회귀분석"],"a":2,"e":"MDS의 적합도는 스트레스 값으로 판단하며 0에 가까울수록 좋다.","u":"연관 분석"},{"s":2,"q":"데이터를 훈련용과 평가용으로 나눌 때, 데이터를 K개로 나눠 K번 반복 학습·평가하는 방법은?","o":["부트스트랩","홀드아웃","층화 추출","K-fold 교차 검증"],"a":3,"e":"K-fold는 K개 중 하나를 검증용, 나머지를 훈련용으로 K번 돌려 평균 성능을 본다.","u":"모형 평가"},{"s":2,"q":"부트스트랩(Bootstrap)에 대한 설명으로 옳은 것은?","o":["복원 추출로 원래 크기의 표본을 여러 번 만든다","데이터를 K개로 똑같이 나눈다","시계열 데이터에만 쓴다","비복원 추출로 표본을 만든다"],"a":0,"e":"부트스트랩은 복원 추출이라 한 번도 뽑히지 않는 데이터(약 36.8%)가 생기고, 이를 검증용(OOB)으로 쓸 수 있다.","u":"모형 평가"},{"s":2,"q":"의사결정나무에서 과대적합을 막기 위해 불필요한 가지를 잘라 내는 것은?","o":["앙상블","가지치기","정지 규칙","분할"],"a":1,"e":"가지치기(Pruning)로 복잡도를 줄인다. 정지 규칙은 나무가 더 자라지 않게 미리 멈추는 기준.","u":"정형 데이터 마이닝"},{"s":2,"q":"의사결정나무의 장점이 아닌 것은?","o":["변수의 선형성·정규성 가정이 필요 없다","결과를 해석하기 쉽다","분류 경계 근처에서 항상 매우 안정적이다","연속형·범주형 변수를 모두 다룬다"],"a":2,"e":"의사결정나무는 분류 경계 근처에서 오차가 크고, 데이터가 조금만 바뀌어도 구조가 달라지는 불안정성이 단점이다.","u":"정형 데이터 마이닝"},{"s":2,"q":"랜덤 포레스트에 대한 설명으로 옳은 것은?","o":["배깅에 더해 각 분할에서 변수를 무작위로 일부만 골라 여러 나무를 만든다","의사결정나무 하나만 깊게 학습한다","오분류 데이터에 가중치를 주며 순차 학습한다","비지도 학습 기법이다"],"a":0,"e":"랜덤 포레스트는 부트스트랩 표본과 무작위 변수 선택으로 다양한 나무를 만들어 투표(평균)한다.","u":"정형 데이터 마이닝"},{"s":2,"q":"SVM(서포트 벡터 머신)에 대한 설명으로 옳은 것은?","o":["두 클래스 사이의 마진을 최대화하는 초평면을 찾는다","항상 선형 분리만 가능하다","마진을 최소화하는 경계를 찾는다","군집 분석 기법이다"],"a":0,"e":"SVM은 마진 최대화가 목표이며, 커널 기법으로 비선형 분리도 한다.","u":"정형 데이터 마이닝"},{"s":2,"q":"K-최근접 이웃(KNN)에 대한 설명으로 옳지 않은 것은?","o":["거리 계산이 필요하다","학습 단계에서 복잡한 모델 파라미터를 추정한다","새 데이터와 가까운 K개의 이웃을 보고 분류한다","K 값에 따라 결과가 달라진다"],"a":1,"e":"KNN은 별도의 학습 과정 없이 데이터를 저장해 두는 게으른 학습(lazy learning)이다.","u":"정형 데이터 마이닝"},{"s":2,"q":"인공신경망에서 출력값과 실제값의 오차를 출력층에서 입력층 방향으로 전달해 가중치를 조정하는 알고리즘은?","o":["역전파","순전파","드롭아웃","배치 정규화"],"a":0,"e":"역전파(Backpropagation)는 경사하강법으로 가중치를 갱신한다.","u":"정형 데이터 마이닝"},{"s":2,"q":"인공신경망의 은닉층이 깊어질 때 앞쪽 층의 기울기가 0에 가까워져 학습이 잘 안 되는 문제는?","o":["다중공선성","차원의 저주","과소적합","기울기 소실"],"a":3,"e":"기울기 소실(Vanishing Gradient)은 시그모이드 같은 활성화 함수에서 심하며, ReLU 등으로 완화한다.","u":"정형 데이터 마이닝"},{"s":2,"q":"이익 도표(Gain Chart)와 향상도 곡선(Lift Curve)은 무엇을 평가하는 데 쓰는가?","o":["분류 모형의 성능","군집의 개수","연관규칙의 지지도","시계열의 정상성"],"a":0,"e":"예측 확률이 높은 순서로 나눈 구간별로 실제 반응이 얼마나 잘 잡히는지 보며 분류 모형을 평가한다.","u":"연관 분석"},{"s":2,"q":"군집 분석 결과를 평가하는 지표로, 1에 가까울수록 군집이 잘 나뉜 것을 뜻하는 것은?","o":["실루엣 계수","VIF","지지도","결정계수"],"a":0,"e":"실루엣 계수는 같은 군집 안의 응집도와 다른 군집과의 분리도를 함께 본다(−1 ~ 1).","u":"연관 분석"},{"s":2,"q":"계층적 군집에서 두 군집 사이의 거리를 각 군집에서 가장 가까운 두 점 사이 거리로 정의하는 방법은?","o":["와드 연결법","평균 연결법","최단 연결법","최장 연결법"],"a":2,"e":"최단 연결법(single linkage). 최장 연결법은 가장 먼 두 점 사이 거리.","u":"군집 분석"},{"s":2,"q":"자기조직화지도(SOM)에 대한 설명으로 옳은 것은?","o":["연관규칙을 찾는 알고리즘이다","시계열 예측 모형이다","지도학습 분류 기법이다","고차원 데이터를 저차원(주로 2차원) 격자에 표현하는 비지도 신경망이다"],"a":3,"e":"SOM은 경쟁 학습으로 비슷한 데이터를 가까운 뉴런에 배치하는 비지도 군집·시각화 기법이다.","u":"연관 분석"},{"s":2,"q":"혼합 분포 군집에서 모수를 추정하는 데 쓰는 알고리즘은?","o":["역전파","EM 알고리즘","Apriori","K-means++"],"a":1,"e":"EM 알고리즘은 E 단계(소속 확률 계산)와 M 단계(모수 갱신)를 반복한다.","u":"연관 분석"},{"s":2,"q":"Apriori 알고리즘에 대한 설명으로 옳은 것은?","o":["최소 지지도 이상인 빈발 항목집합만 확장해 연관규칙을 찾는다","항목을 트리 구조로 압축해 데이터를 한 번만 읽는다","군집 수를 미리 정해야 한다","연속형 변수만 다룬다"],"a":0,"e":"Apriori는 빈발하지 않은 항목집합의 상위 집합도 빈발하지 않다는 원리를 쓴다. 트리로 압축하는 것은 FP-Growth.","u":"연관 분석"},{"s":2,"q":"연관규칙의 향상도가 1보다 작을 때의 의미는?","o":["두 품목이 서로 독립이다","두 품목이 양의 관계다","두 품목이 음의 관계(함께 사지 않는 경향)다","규칙을 계산할 수 없다"],"a":2,"e":"향상도 = 1이면 독립, 1보다 크면 양의 관계, 1보다 작으면 음의 관계.","u":"연관 분석"},{"s":2,"q":"과소적합(Underfitting)에 대한 설명으로 옳은 것은?","o":["학습 데이터에는 잘 맞지만 새 데이터에서 성능이 떨어진다","모델이 너무 단순해 학습 데이터에서도 성능이 낮다","학습 데이터를 늘리면 반드시 생긴다","정규화를 하면 항상 해결된다"],"a":1,"e":"과소적합은 모델이 너무 단순해서 생긴다. ①은 과대적합의 설명.","u":"모형 평가"},{"s":0,"q":"DIKW 피라미드의 순서로 옳은 것은?","o":["데이터 → 정보 → 지식 → 지혜","정보 → 데이터 → 지식 → 지혜","지식 → 데이터 → 정보 → 지혜","데이터 → 지식 → 정보 → 지혜"],"a":0,"e":"데이터(사실) → 정보(의미) → 지식(구조화된 판단) → 지혜(창의적 통찰).","u":"데이터와 정보"},{"s":0,"q":"지식 창조 메커니즘(SECI)에서 형식지를 다시 개인의 암묵지로 체화하는 과정은?","o":["연결화","내면화","공통화","표출화"],"a":1,"e":"공통화(암묵→암묵), 표출화(암묵→형식), 연결화(형식→형식), 내면화(형식→암묵).","u":"데이터와 정보"},{"s":0,"q":"여러 개의 형식지를 결합해 새로운 형식지를 만드는 과정은?","o":["공통화","연결화","표출화","내면화"],"a":1,"e":"연결화(Combination).","u":"데이터와 정보"},{"s":0,"q":"데이터의 기능으로 거리가 먼 것은?","o":["추론과 판단의 근거가 된다","사실을 기록한다","정보·지식을 만드는 원천이 된다","의사결정의 근거를 없앤다"],"a":3,"e":"데이터는 의사결정의 근거가 된다.","u":"데이터와 정보"},{"s":0,"q":"다음 중 정량적 데이터에 해당하는 것은?","o":["인터뷰 녹취록","월평균 기온 23.5℃","SNS 게시글","고객 리뷰 문장"],"a":1,"e":"정량적 데이터는 수치로 표현된다. 텍스트·음성 등은 정성적 데이터.","u":"데이터와 정보"},{"s":0,"q":"데이터베이스의 일반적 특징이 아닌 것은?","o":["정보 관리","정보 이용","정보 독점","정보의 축적 및 전달"],"a":2,"e":"일반적 특징은 정보 축적·전달, 이용, 관리, 기술 발전, 경제·산업적 측면이다.","u":"데이터베이스"},{"s":0,"q":"기업 전체의 생산·재무·인사·물류 같은 자원을 통합 관리하는 시스템은?","o":["CRM","ERP","SCM","KMS"],"a":1,"e":"ERP(전사적 자원 관리).","u":"데이터베이스"},{"s":0,"q":"의사결정을 돕기 위해 데이터를 분석·보고하는 도구와 기술을 통틀어 이르는 말은?","o":["ETL","DBMS","OLTP","BI(비즈니스 인텔리전스)"],"a":3,"e":"BI는 리포트·대시보드·OLAP 분석으로 의사결정을 지원한다. ETL은 추출·변환·적재 과정.","u":"데이터베이스"},{"s":0,"q":"여러 원천 시스템의 데이터를 추출(Extract)·변환(Transform)·적재(Load)해 데이터 웨어하우스에 모으는 과정은?","o":["CRM","ETL","OLAP","SCM"],"a":1,"e":"ETL. 데이터 웨어하우스 구축의 핵심 과정이다.","u":"데이터베이스"},{"s":0,"q":"실시간으로 많은 거래를 빠르게 처리하는 것이 목적인 시스템은?","o":["데이터 마이닝","데이터 마트","OLTP","OLAP"],"a":2,"e":"OLTP(온라인 거래 처리)는 은행 거래·주문 처리처럼 짧은 갱신이 많다. OLAP은 다차원 분석.","u":"데이터베이스"},{"s":0,"q":"빅데이터의 4V를 말할 때 3V(Volume·Variety·Velocity)에 더하는 것은?","o":["Visualization","Value","Vector","Validity"],"a":1,"e":"투자 비용 측면의 3V에 비즈니스 효과 측면의 가치(Value)를 더한다.","u":"빅데이터"},{"s":0,"q":"빅데이터 활용의 기본 테크닉 중 ‘A를 산 사람이 B도 산다’처럼 변수 간 관계를 찾는 것은?","o":["연관 규칙 학습","유전 알고리즘","회귀 분석","감정 분석"],"a":0,"e":"연관 규칙 학습(장바구니 분석). 유전 알고리즘은 최적화, 감정 분석은 텍스트의 긍정·부정 판단.","u":"빅데이터"},{"s":0,"q":"‘택배 차량을 어떻게 배치해야 가장 효율적인가?’ 같은 최적화 문제에 쓰는 빅데이터 테크닉은?","o":["연관 규칙 학습","유전 알고리즘","소셜 네트워크 분석","감정 분석"],"a":1,"e":"유전 알고리즘은 진화 과정을 본떠 최적 해를 찾는다.","u":"빅데이터"},{"s":0,"q":"빅데이터의 가치 창출 방식으로 거리가 먼 것은?","o":["새로운 비즈니스 모델을 만든다","고객 세분화로 맞춤 서비스를 제공한다","의사결정을 지원하거나 대체한다","데이터를 공개하지 않아 투명성을 낮춘다"],"a":3,"e":"빅데이터는 투명성을 높이고, 세분화, 의사결정 지원, 새로운 비즈니스 모델 창출로 가치를 만든다.","u":"빅데이터"},{"s":0,"q":"빅데이터 시대의 본질적 변화 중 ‘표본 조사에서 전수 조사로’가 가능해진 가장 큰 이유는?","o":["데이터 양이 줄었다","데이터 수집·저장·처리 비용이 크게 줄었다","통계 이론이 사라졌다","표본 조사가 법으로 금지되었다"],"a":1,"e":"저장·처리 비용 하락과 기술 발전으로 전체 데이터를 다룰 수 있게 되었다.","u":"빅데이터"},{"s":0,"q":"데이터 사이언티스트에게 요구되는 하드 스킬은?","o":["스토리텔링","커뮤니케이션","다분야 간 협력","빅데이터 관련 이론적 지식"],"a":3,"e":"하드 스킬: 빅데이터 이론 지식, 분석 기술 숙련. 나머지는 소프트 스킬.","u":"데이터 사이언스"},{"s":0,"q":"분석 결과를 시각화와 이야기로 풀어 의 ,"a":1,"e":"좋은 추정량은 불편성(편향 없음), 효율성(분산 작음), 일치성, 충족성을 갖춘다.","u":"통계 기초"},{"s":2,"q":"제2종 오류에 대한 설명으로 옳은 것은?","o":["대립가설이 참인데 귀무가설을 채택하는 오류","유의수준과 같은 값이다","귀무가설이 참인데 기각하는 오류","표본 크기와 무관하다"],"a":0,"e":"제2종 오류(β): 거짓인 귀무가설을 기각하지 못함. 제1종 오류(α): 참인 귀무가설을 기각.","u":"가설 검정"},{"s":2,"q":"유의수준(α)에 대한 설명으로 옳은 것은?","o":["제2종 오류의 확률","제1종 오류를 범할 최대 허용 확률","검정력","p-value의 다른 이름"],"a":1,"e":"보통 0.05나 0.01로 정한다.","u":"가설 검정"},{"s":2,"q":"세 집단 이상 평균 비교에서 분산분석(ANOVA) 결과가 유의할 때, 어느 집단끼리 차이가 나는지 확인하는 방법은?","o":["사후 검정(Tukey 등)","회귀분석","Shapiro-Wilk 검정","카이제곱 검정"],"a":0,"e":"사후 검정(다중 비교)으로 짝별 차이를 확인한다.","u":"가설 검정"},{"s":2,"q":"두 독립 집단의 평균 비교에서 정규성 가정을 만족하지 못할 때 쓰는 비모수 검정은?","o":["F 검정","Z 검정","독립표본 t-검정","윌콕슨 순위합 검정(만-위트니 U 검정)"],"a":3,"e":"윌콕슨 순위합(만-위트니 U)은 독립 두 집단, 윌콕슨 부호순위는 대응 표본, 크루스칼-왈리스는 세 집단 이상.","u":"가설 검정"},{"s":2,"q":"카이제곱 검정의 용도로 옳지 않은 것은?","o":["적합도 검정","두 연속형 변수의 평균 차이 검정","동질성 검정","독립성 검정"],"a":1,"e":"평균 차이는 t-검정이나 ANOVA. 카이제곱은 범주형 자료의 적합도·독립성·동질성 검정.","u":"가설 검정"},{"s":2,"q":"표본 크기를 늘렸을 때 일반적으로 나타나는 변화는?","o":["제1종 오류 확률이 반드시 커진다","p-value가 항상 1이 된다","표준오차가 커진다","검정력이 높아진다"],"a":3,"e":"표본이 커지면 표준오차가 줄고 검정력이 높아진다.","u":"가설 검정"},{"s":2,"q":"상관계수가 −0.9일 때의 해석으로 옳은 것은?","o":["관계가 없음","강한 음의 선형 관계","약한 양의 관계","인과관계가 확실함"],"a":1,"e":"부호는 방향, 절댓값은 강도. 상관은 인과관계를 뜻하지 않는다.","u":"상관과 회귀"},{"s":2,"q":"단순선형회귀 Y = β₀ + β₁X 에서 β₁의 의미는?","o":["결정계수","오차의 분산","X가 0일 때 Y의 값","X가 1 증가할 때 Y의 평균 변화량"],"a":3,"e":"β₁은 기울기(회귀계수), β₀는 절편.","u":"상관과 회귀"},{"s":2,"q":"최소제곱법(OLS)이 최소화하는 것은?","o":["잔차 제곱합","잔차의 합","결정계수","회귀계수의 합"],"a":0,"e":"관측값과 예측값 차이(잔차)를 제곱해 더한 값을 최소로 하는 계수를 구한다.","u":"상관과 회귀"},{"s":2,"q":"수정된 결정계수(Adjusted R²)를 쓰는 이유는?","o":["범주형 변수를 처리하려고","잔차를 없애려고","시계열을 분석하려고","설명변수가 늘면 결정계수가 무조건 커지는 문제를 보정하려고"],"a":3,"e":"의미 없는 변수를 추가해도 R²는 커지므로, 변수 수를 반영해 보정한다.","u":"상관과 회귀"},{"s":2,"q":"회귀모형의 전체 유의성을 검정하는 통계량은?","o":["t 통계량(개별 계수)","Durbin-Watson 통계량","카이제곱 통계량","F 통계량"],"a":3,"e":"F 검정은 모형 전체, t 검정은 개별 회귀계수의 유의성을 본다.","u":"상관과 회귀"},{"s":2,"q":"릿지(Ridge) 회귀에 대한 설명으로 옳은 것은?","o":["규제를 전혀 하지 않는다","L2 규제로 회귀계수를 0에 가깝게 줄이지만 0으로 만들지는 않는다","분류 문제 전용이다","L1 규제로 일부 계수를 0으로 만든다"],"a":1,"e":"릿지는 L2, 라쏘는 L1, 엘라스틱넷은 둘을 함께 쓴다.","u":"상관과 회귀"},{"s":2,"q":"정상 시계열의 조건이 아닌 것은?","o":["공분산이 시차에만 의존한다","분산이 일정하다","평균이 일정하다","시간이 지남에 따라 평균이 증가한다"],"a":3,"e":"평균이 변하면 비정상 시계열이며 차분으로 정상화한다.","u":"시계열과 차원 축소"},{"s":2,"q":"분산이 시간에 따라 커지는 시계열을 정상화하는 방법으로 알맞은 것은?","o":["이동평균","차분","표본 추출","로그 같은 변환"],"a":3,"e":"평균이 변하면 차분, 분산이 변하면 변환(로그·제곱근).","u":"시계열과 차원 축소"},{"s":2,"q":"시계열 분해에서 1년 주기처럼 일정한 간격으로 반복되는 변동은?","o":["추세 요인","순환 요인","계절 요인","불규칙 요인"],"a":2,"e":"계절(고정 주기), 순환(주기가 일정하지 않은 장기 변동), 추세(장기 증가·감소), 불규칙(우연).","u":"시계열과 차원 축소"},{"s":2,"q":"자기상관함수(ACF)와 부분자기상관함수(PACF)를 보는 목적은?","o":["변수를 표준화하기 위해","결측값을 채우기 위해","군집 수를 정하기 위해","AR·MA 모형의 차수를 정하기 위해"],"a":3,"e":"AR(p)는 PACF가 p 이후 절단, MA(q)는 ACF가 q 이후 절단되는 특징으로 차수를 정한다.","u":"시계열과 차원 축소"},{"s":2,"q":"주성분분석 전에 변수를 표준화하는 이유는?","o":["종속변수를 만들려고","결측값을 없애려고","변수 단위나 척도 차이 때문에 특정 변수가 주성분을 지배하지 않게 하려고","표본 수를 늘리려고"],"a":2,"e":"분산이 큰 변수가 주성분을 좌우하므로 상관행렬(표준화) 기반으로 분석하는 경우가 많다.","u":"시계열과 차원 축소"},{"s":2,"q":"여러 관측 변수 뒤에 숨어 있는 공통 잠재 요인을 찾는 다변량 기법은?","o":["판별분석","주성분분석","요인분석","군집분석"],"a":2,"e":"요인분석은 변수들의 공통 요인을 찾고, 주성분분석은 분산을 최대로 설명하는 선형 결합을 찾는다.","u":"시계열과 차원 축소"},{"s":2,"q":"데이터 마이닝 기법 중 비지도학습에 해당하는 것은?","o":["로지스틱 회귀","연관 분석","서포트 벡터 머신","의사결정나무"],"a":1,"e":"비지도학습: 군집, 연관 분석, 차원 축소. 나머지는 정답이 있는 지도학습.","u":"정형 데이터 마이닝"},{"s":2,"q":"로지스틱 회귀에서 오즈(Odds)의 정의는?","o":["사건이 일어날 확률 / 일어나지 않을 확률","회귀계수의 제곱","일어나지 않을 확률 / 전체","사건이 일어날 확률 × 2"],"a":0,"e":"오즈 = p / (1 − p). 회귀계수를 지수 변환한 exp(β)는 오즈비.","u":"정형 데이터 마이닝"},{"s":2,"q":"의사결정나무에서 지니 지수가 0이라는 것은?","o":["오분류율이 50%다","노드 안의 범주가 완전히 섞여 있다","노드 안의 데이터가 모두 같은 범주다","나무를 더 나눌 수 있다"],"a":2,"e":"지니 지수·엔트로피는 불순도. 0이면 순수(한 범주만 존재).","u":"정형 데이터 마이닝"},{"s":2,"q":"배깅(Bagging)에 대한 설명으로 옳은 것은?","o":["부트스트랩 표본으로 여러 모델을 만들고 결과를 투표·평균한다","비지도학습 기법이다","오분류 데이터에 가중치를 주며 순차 학습한다","단일 모델만 사용한다"],"a":0,"e":"배깅은 병렬 학습으로 분산을 줄인다. 순차 가중치는 부스팅.","u":"정형 데이터 마이닝"},{"s":2,"q":"인공신경망에서 입력의 가중합이 0보다 크면 그대로, 0 이하면 0을 출력하는 활성화 함수는?","o":["시그모이드","계단 함수","ReLU","tanh"],"a":2,"e":"ReLU = max(0, x). 기울기 소실을 줄여 깊은 신경망에 많이 쓴다.","u":"정형 데이터 마이닝"},{"s":2,"q":"분류 모형을 만들 때 목표변수의 범주 비율이 크게 차이 나는 불균형 문제를 완화하는 방법은?","o":["오버샘플링·언더샘플링","차분","결정계수 계산","변수 삭제"],"a":0,"e":"소수 범주를 늘리거나(오버샘플링, SMOTE) 다수 범주를 줄인다(언더샘플링).","u":"정형 데이터 마이닝"},{"s":2,"q":"나이브 베이즈 분류기의 기본 가정은?","o":["주어진 범주 안에서 설명변수들이 서로 조건부 독립이다","변수 사이에 강한 상관이 있다","모든 변수가 정규분포를 따르지 않는다","목표변수가 연속형이다"],"a":0,"e":"베이즈 정리에 변수 간 조건부 독립을 가정한 단순하고 빠른 분류기.","u":"정형 데이터 마이닝"},{"s":2,"q":"실제 양성인 것 중 모델이 양성으로 맞게 예측한 비율은?","o":["특이도","정밀도","재현율(민감도)","정확도"],"a":2,"e":"재현율 = TP / (TP + FN). 정밀도 = TP / (TP + FP).","u":"모형 평가"},{"s":2,"q":"실제 음성인 것 중 모델이 음성으로 맞게 예측한 비율은?","o":["정밀도","특이도","민감도","F1 점수"],"a":1,"e":"특이도 = TN / (TN + FP). ROC 곡선 x축은 1 − 특이도.","u":"모형 평가"},{"s":2,"q":"정밀도와 재현율의 조화평균은?","o":["향상도","F1 점수","AUC","정확도"],"a":1,"e":"F1 = 2 × 정밀도 × 재현율 / (정밀도 + 재현율).","u":"모형 평가"},{"s":2,"q":"데이터를 학습용·검증용·평가용으로 나눌 때 검증용 데이터의 역할은?","o":["모델 학습","하이퍼파라미터 조정과 과대적합 여부 확인","데이터 수집","최종 성능 보고"],"a":1,"e":"학습용으로 학습, 검증용으로 튜닝, 평가용(테스트)으로 최종 성능을 본다.","u":"모형 평가"},{"s":2,"q":"회귀 모형의 평가 지표가 아닌 것은?","o":["MAE","RMSE","AUC","MSE"],"a":2,"e":"AUC는 분류 모형 지표. MSE·RMSE·MAE는 예측값과 실제값 차이를 본다.","u":"모형 평가"},{"s":2,"q":"계층적 군집 결과를 나무 모양으로 나타낸 그림은?","o":["ROC 곡선","덴드로그램","히스토그램","산점도"],"a":1,"e":"덴드로그램을 원하는 높이에서 잘라 군집 수를 정한다.","u":"군집 분석"},{"s":2,"q":"군집 간 거리를 각 군집에서 가장 먼 두 점 사이 거리로 정의하는 방법은?","o":["평균 연결법","중심 연결법","최장 연결법","최단 연결법"],"a":2,"e":"최장 연결법(complete linkage)은 둥근 모양의 군집을 만드는 경향이 있다.","u":"군집 분석"},{"s":2,"q":"K-평균 군집에서 적절한 K를 정할 때 쓰는 방법은?","o":["향상도","Durbin-Watson 검정","VIF","엘보우(Elbow) 방법"],"a":3,"e":"K에 따른 군집 내 제곱합의 감소가 완만해지는 지점(팔꿈치)을 고른다. 실루엣 계수도 쓴다.","u":"군집 분석"},{"s":2,"q":"이상값의 영향을 줄이기 위해 평균 대신 실제 데이터 점을 군집 중심으로 쓰는 방법은?","o":["DBSCAN","SOM","K-medoids(PAM)","K-means"],"a":2,"e":"K-medoids는 중심을 실제 관측치로 잡아 이상값에 덜 민감하다.","u":"군집 분석"},{"s":2,"q":"밀도 기반으로 임의 모양의 군집을 찾고 잡음(이상값)을 따로 구분하는 군집 기법은?","o":["와드 연결법","DBSCAN","주성분분석","K-means"],"a":1,"e":"DBSCAN은 반경(eps)과 최소 점 수(minPts)로 밀도가 높은 영역을 군집으로 묶는다.","u":"군집 분석"},{"s":2,"q":"범주형(이진) 변수의 유사성을 측정할 때 쓰는 지표는?","o":["유클리드 거리","맨해튼 거리","자카드 계수","마할라노비스 거리"],"a":2,"e":"자카드 계수는 두 집합의 교집합 / 합집합. 연속형 변수에는 유클리드 등을 쓴다.","u":"군집 분석"},{"s":2,"q":"연관규칙 A → B의 신뢰도의 정의는?","o":["B를 포함한 거래 수 / 전체 거래 수","향상도 × 지지도","A와 B를 함께 포함한 거래 수 / A를 포함한 거래 수","A와 B를 함께 포함한 거래 수 / 전체 거래 수"],"a":2,"e":"신뢰도 = P(B | A). 지지도 = P(A ∩ B).","u":"연관 분석"},{"s":2,"q":"연관 분석의 장점으로 옳은 것은?","o":["연속형 변수를 그대로 쓴다","결과가 ‘A면 B’ 형태라 이해하기 쉽다","품목이 많아도 계산량이 늘지 않는다","목표변수가 반드시 필요하다"],"a":1,"e":"조건-결과 규칙이라 해석이 쉽지만, 품목이 늘면 계산량이 기하급수적으로 늘어난다.","u":"연관 분석"},{"s":2,"q":"시간 순서를 고려해 ‘A를 산 뒤 일정 기간 안에 B를 산다’는 규칙을 찾는 분석은?","o":["군집 분석","주성분분석","순차 패턴 분석","판별분석"],"a":2,"e":"순차 패턴(Sequence) 분석은 구매 순서까지 고려한다.","u":"연관 분석"},{"s":2,"q":"FP-Growth 알고리즘의 특징은?","o":["모든 후보 집합을 생성해 지지도를 반복 계산한다","FP-Tree로 데이터를 압축해 후보 집합을 만들지 않고 빈발 항목을 찾는다","연속형 변수만 다룬다","군집 수를 미리 정한다"],"a":1,"e":"Apriori보다 데이터베이스를 읽는 횟수가 적어 빠르다.","u":"연관 분석"}].map(q=>({...q,t:"mc"})),note:"## 시험 개요\n\nADsP(데이터분석 준전문가)는 한국데이터산업진흥원이 시행하는 국가공인 민간자격이다. 실기 없이 필기만 있고, 객관식 50문항을 90분 동안 푼다. 총점 60점 이상이면서 과목별로 40% 이상 맞혀야 한다(과락). 이 앱의 모의고사는 문항당 2점으로 계산한다.\n\n| 과목 | 문항 | 과락 기준 |\n| --- | --- | --- |\n| 1. 데이터 이해 | 10 | 4문항 미만 |\n| 2. 데이터 분석 기획 | 10 | 4문항 미만 |\n| 3. 데이터 분석 | 30 | 12문항 미만 |\n\n배점과 과락 기준은 회차별 공고(dataq.or.kr)로 꼭 확인하자.\n\n## 1과목 데이터 이해\n\n### 데이터와 정보\n\n- 정량적 데이터: 수치·기호(정형). 정성적 데이터: 언어·문자(비정형)\n- 암묵지(체화된 지식) ↔ 형식지(문서화된 지식)\n- 지식 창조(SECI): 공통화(암묵→암묵) → 표출화(암묵→형식) → 연결화(형식→형식) → 내면화(형식→암묵)\n- DIKW: 데이터(사실) → 정보(의미·관계) → 지식(정보를 구조화해 판단) → 지혜(창의적 아이디어)\n\n### 데이터베이스\n\n- 특징: 통합된, 저장된, 공용, 변화되는 데이터\n- 일반적 특징: 정보 축적·전달, 이용, 기술 발전, 경제·산업적 측면\n- 기업 시스템: ERP(전사적 자원), CRM(고객 관계), SCM(공급망), KMS(지식 관리), BI(의사결정 지원), OLTP(실시간 거래 처리), OLAP(다차원 분석)\n- 데이터 웨어하우스 특징: 주제 지향, 통합, 시계열, 비휘발\n\n### 빅데이터\n\n- 3V: Volume(규모), Variety(다양성), Velocity(속도). 4V에 Value(가치) 추가\n- 본질적 변화: 사전 처리 → 사후 처리, 표본 조사 → 전수 조사, 질 → 양, 인과관계 → 상관관계\n- 빅데이터 가치 산정이 어려운 이유: 데이터 활용 방식 다양, 새로운 가치 창출, 분석 기술 발전\n- 활용 기본 테크닉: 연관 규칙, 유형 분석(분류), 유전 알고리즘, 기계 학습, 회귀 분석, 감정 분석, 소셜 네트워크 분석\n\n| 위기 요인 | 통제 방안 |\n| --- | --- |\n| 사생활 침해 | 동의에서 책임으로 |\n| 책임 원칙 훼손 | 결과 기반 책임 원칙 고수 |\n| 데이터 오용 | 알고리즘 접근 허용, 알고리즈미스트 |\n\n- 빅데이터 비즈니스 모델: 데이터 활용으로 투명성 제고, 고객 세분화, 의사결정 지원·대체, 새로운 비즈니스 모델·제품·서비스 창출\n- 미래의 빅데이터: 모든 것의 데이터화(사물인터넷, 웨어러블), 분석 기술의 진화(인공지능, 딥러닝), 인력(데이터 사이언티스트, 알고리즈미스트)\n\n### 데이터 사이언스\n\n- 데이터 사이언티스트 하드 스킬: 빅데이터 이론 지식, 분석 기술 숙련\n- 소프트 스킬: 통찰력 있는 분석(창의적 사고, 호기심), 설득력 있는 전달(스토리텔링, 시각화), 다분야 간 협력\n- 비식별화 기법: 가명처리(이름 → 임의값), 총계처리(합계·평균만), 데이터 삭제, 데이터 범주화(35세 → 30대), 데이터 마스킹(일부 가림)\n\n## 2과목 데이터 분석 기획\n\n### 분석 기획\n\n| 분석 주제 유형 | 분석 대상(What) | 분석 방법(How) |\n| --- | --- | --- |\n| 최적화 | 앎 | 앎 |\n| 솔루션 | 앎 | 모름 |\n| 통찰 | 모름 | 앎 |\n| 발견 | 모름 | 모름 |\n\n- 분석 기획 시 고려사항: 가용 데이터, 적절한 유스케이스, 장애 요소\n- 하향식 접근: 문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토(경제적·데이터·기술적)\n- 상향식 접근: 데이터에서 출발, 비지도 학습, 디자인 사고(발산), 프로토타이핑\n- 문제 탐색 도구: 비즈니스 모델 캔버스(업무·제품·고객·규제와 감사·지원 인프라), 분석 기회 발굴 범위 확장(거시·경쟁자·시장 니즈·역량)\n\n### 분석 방법론\n\n- KDD: 데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 해석·평가\n- CRISP-DM: 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개 (단계 사이 피드백 가능)\n- 빅데이터 분석 방법론: 분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개 (단계-태스크-스텝 3계층)\n- 방법론 모델: 폭포수(순차), 프로토타입(빠른 시제품), 나선형(반복 + 위험 분석)\n\n### 분석 과제 관리와 마스터 플랜\n\n- 분석 과제 관리 5영역: 데이터 크기, 데이터 복잡도, 속도, 분석 복잡도, 정확도·정밀도\n- ROI 관점 4V: 투자 비용(Volume, Variety, Velocity) + 비즈니스 효과(Value)\n- 우선순위 사분면(시급성 × 난이도): 3사분면(현재 시급, 쉬움)이 최우선. 시급성 기준 3 → 4 → 2, 난이도 기준 3 → 1 → 2\n- 마스터 플랜 우선순위 고려: 전략적 중요도, 비즈니스 성과·ROI, 실행 용이성\n- 적용 범위·방식 고려: 업무 내재화 적용 수준, 분석 데이터 적용 수준, 기술 적용 수준\n\n### 분석 거버넌스\n\n- 구성 요소: 조직, 프로세스, 시스템, 데이터, 분석 관련 교육·마인드 육성\n- 분석 성숙도: 도입 → 활용 → 확산 → 최적화\n- 분석 준비도 6영역: 분석 업무, 분석 인력·조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라\n- 분석 조직 구조: 집중형(전담 조직), 기능 중심형(각 부서), 분산형(전담 인력을 부서에 배치)\n- 데이터 거버넌스 구성 요소: 원칙, 조직, 프로세스. 체계: 데이터 표준화 → 데이터 관리 체계 → 데이터 저장소 관리 → 표준화 활동\n\n## 3과목 데이터 분석\n\n### R 기초\n\n- 대입 `\u003c-`, 벡터 `c(1, 2, 3)`, 인덱스는 1부터, 음수 인덱스는 제외(`x[-1]`)\n- 결측값 `NA`, 계산 불가 `NaN`, 빈 객체 `NULL`. `is.na()`, `na.rm = TRUE`\n- 자료 구조: 벡터, 행렬(`matrix`), 배열, 리스트, 데이터프레임(`data.frame`)\n- 함수: `dim()`, `nrow()`, `ncol()`, `str()`, `summary()`, `head()`, `seq()`, `rep()`, `apply()`\n\n### 데이터 마트, 결측값, 이상값\n\n- 데이터 마트: 데이터 웨어하우스에서 특정 부서·목적에 맞게 뽑아낸 작은 저장소. 분석용 요약 변수(기간별 구매 금액 등)와 파생 변수(근무 시간대 구매 여부 등)를 만든다\n- R 패키지: `reshape`(`melt`로 녹이고 `cast`로 재구성), `sqldf`(R에서 SQL 사용), `plyr`(`ddply` 등 split-apply-combine), `data.table`(빠른 데이터프레임)\n- 결측값 처리: 완전 분석법(결측 행 삭제), 평균 대치법, 단순 확률 대치법(Hot-deck, 비슷한 다른 관측값으로), 다중 대치법(대치 → 분석 → 결합)\n- R 함수: `is.na()`, `complete.cases()`, `na.omit()`, `mean(x, na.rm = TRUE)`\n- 이상값 판단: ESD(평균 ± 3 표준편차 밖), 상자 그림(Q1 − 1.5×IQR, Q3 + 1.5×IQR 밖). 이상값이라고 무조건 지우지 않고 원인과 분석 목적을 보고 판단한다\n\n### 통계 기초\n\n- 척도: 명목(성별), 서열(학점), 등간(섭씨온도, 0이 절대값 아님), 비율(키, 무게)\n- 표본 추출: 단순 무작위, 계통(일정 간격), 집락(집단 단위 선택), 층화(계층별 무작위)\n- 대푯값: 평균(이상치에 민감), 중앙값(덜 민감), 최빈값\n- 산포도: 분산, 표준편차, 범위, 사분위수 범위(IQR = Q3 − Q1)\n- 이상치 기준(상자 그림): Q1 − 1.5×IQR 미만 또는 Q3 + 1.5×IQR 초과\n\n### 가설 검정\n\n- 귀무가설(H0, 차이 없음) vs 대립가설(H1, 차이 있음)\n- 제1종 오류(α): 참인 H0를 기각 / 제2종 오류(β): 거짓인 H0를 채택. 검정력 = 1 − β\n- p-value \u003c 유의수준(보통 0.05) → H0 기각\n- 모수 검정: t-검정(두 집단 평균), 분산분석(세 집단 이상), 카이제곱(범주형 독립성)\n- 비모수 검정: 부호 검정, 윌콕슨 순위합, 만-위트니, 크루스칼-왈리스\n- 정규성 검정: Shapiro-Wilk, Q-Q plot\n\n### 상관과 회귀\n\n- 상관계수 범위 −1 ~ 1. 피어슨(선형, 등간·비율), 스피어만(순위, 서열)\n- 회귀 가정: 선형성, 독립성, 등분산성, 정규성\n- 결정계수 R²: 종속변수 변동 중 모형이 설명하는 비율(0~1)\n- 수정 결정계수: 변수 수가 늘어나는 것을 보정\n- 다중공선성: 독립변수끼리 강한 상관. VIF > 10이면 의심\n- 변수 선택: 전진 선택, 후진 제거, 단계적 선택. 평가 지표 AIC, BIC(작을수록 좋음)\n- 규제: 릿지(L2, 계수 축소), 라쏘(L1, 일부 계수를 0으로 → 변수 선택)\n\n### 시계열과 차원 축소\n\n- 정상성: 평균·분산이 일정하고 공분산이 시차에만 의존\n- 평균이 변하면 차분, 분산이 변하면 변환(로그)\n- AR(자기회귀), MA(이동평균), ARIMA(p, d, q): d는 차분 횟수\n- 분해 요인: 추세, 계절, 순환, 불규칙\n- 주성분분석(PCA): 상관 없는 주성분으로 차원 축소. 스크리 플롯·누적 기여율 80% 이상으로 개수 결정\n- 다차원 척도법(MDS): 개체 사이 거리(유사성)를 저차원 공간에 점으로 나타낸다. 적합도는 스트레스 값(0에 가까울수록 좋음)\n- 다변량 분석 정리: 다중회귀, 주성분분석, 다차원 척도법, 요인분석, 판별분석\n\n### 정형 데이터 마이닝\n\n- 지도학습: 의사결정나무, 회귀, 로지스틱 회귀, 인공신경망, SVM, KNN, 앙상블\n- 비지도학습: 군집(K-평균, 계층적, SOM), 연관 분석, PCA\n- 데이터 분할: 훈련 / 검증 / 테스트. 홀드아웃, K-fold 교차 검증, 부트스트랩\n- 로지스틱 회귀: 시그모이드로 0~1 확률 출력, 오즈비 해석\n- 의사결정나무: 분류나무(지니 지수, 엔트로피, 카이제곱 p-value), 회귀나무(분산 감소량, F 통계량). 과대적합은 가지치기로\n- 앙상블: 배깅(부트스트랩 병렬), 부스팅(오분류 가중, 순차), 랜덤 포레스트(배깅 + 변수 무작위 선택)\n- 인공신경망 활성화 함수: 시그모이드, tanh, ReLU, 소프트맥스(다중 분류 출력)\n\n### 모형 평가\n\n| 지표 | 식 |\n| --- | --- |\n| 정확도 | (TP + TN) / 전체 |\n| 정밀도 | TP / (TP + FP) |\n| 재현율(민감도) | TP / (TP + FN) |\n| 특이도 | TN / (TN + FP) |\n| F1 점수 | 2 × 정밀도 × 재현율 / (정밀도 + 재현율) |\n\n- ROC 곡선: x축 FPR(1 − 특이도), y축 TPR(민감도). AUC가 1에 가까울수록 좋고 0.5는 무작위 수준\n- 이익 도표(Gain chart), 향상도 곡선(Lift chart)도 분류 모형 평가에 쓴다\n\n### 군집 분석\n\n- 거리: 유클리드, 맨해튼, 민코프스키, 마할라노비스(공분산 반영), 범주형은 자카드\n- 계층적 군집 연결법: 최단(single), 최장(complete), 평균, 중심, 와드(오차제곱합 증가 최소)\n- K-평균: K를 미리 지정, 초기 중심에 민감, 이상치에 민감. 보완: K-medoids\n- 군집 평가: 실루엣 계수(1에 가까울수록 좋음)\n- 혼합 분포 군집: EM 알고리즘. SOM: 고차원 → 2차원 지도\n\n### 연관 분석\n\n- 지지도 = A와 B 동시 포함 / 전체\n- 신뢰도 = A와 B 동시 포함 / A 포함 = P(B | A)\n- 향상도 = 신뢰도 / P(B). 1이면 독립, 1보다 크면 양의 관계, 1보다 작으면 음의 관계\n- Apriori 알고리즘: 최소 지지도 이상인 빈발 항목만 확장. FP-Growth는 트리로 더 빠르게\n",cards:[{"f": "정량적 데이터", "b": "수치·기호(정형). 정성적 데이터: 언어·문자(비정형)", "u": "데이터와 정보"}, {"f": "지식 창조(SECI)", "b": "공통화(암묵→암묵) → 표출화(암묵→형식) → 연결화(형식→형식) → 내면화(형식→암묵)", "u": "데이터와 정보"}, {"f": "DIKW", "b": "데이터(사실) → 정보(의미·관계) → 지식(정보를 구조화해 판단) → 지혜(창의적 아이디어)", "u": "데이터와 정보"}, {"f": "특징", "b": "통합된, 저장된, 공용, 변화되는 데이터", "u": "데이터베이스"}, {"f": "일반적 특징", "b": "정보 축적·전달, 이용, 기술 발전, 경제·산업적 측면", "u": "데이터베이스"}, {"f": "기업 시스템", "b": "ERP(전사적 자원), CRM(고객 관계), SCM(공급망), KMS(지식 관리), BI(의사결정 지원), OLTP(실시간 거래 처리), OLAP(다차원 분석)", "u": "데이터베이스"}, {"f": "데이터 웨어하우스 특징", "b": "주제 지향, 통합, 시계열, 비휘발", "u": "데이터베이스"}, {"f": "3V", "b": "Volume(규모), Variety(다양성), Velocity(속도). 4V에 Value(가치) 추가", "u": "빅데이터"}, {"f": "본질적 변화", "b": "사전 처리 → 사후 처리, 표본 조사 → 전수 조사, 질 → 양, 인과관계 → 상관관계", "u": "빅데이터"}, {"f": "빅데이터 가치 산정이 어려운 이유", "b": "데이터 활용 방식 다양, 새로운 가치 창출, 분석 기술 발전", "u": "빅데이터"}, {"f": "활용 기본 테크닉", "b": "연관 규칙, 유형 분석(분류), 유전 알고리즘, 기계 학습, 회귀 분석, 감정 분석, 소셜 네트워크 분석", "u": "빅데이터"}, {"f": "사생   for(const k in src){const id=/^\d+$/.test(k)?"pf-"+k:k;if(v<2&&id.startsWith("ps-"))continue;if(v<3&&CH3.has(id))continue;
    if((QID[id]||gq[id])&&src[k]&&typeof src[k].n==="number")w[id]={n:src[k].n,t:+src[k].t||Date.now()}}

  return {v:5,wrong:w,gq,stat,hist:Array.isArray(d.hist)?d.hist.filter(h=>h&&typeof h.score==="number"&&EX[h.ex||"pf"]).map(h=>({...h,ex:h.ex||"pf"})).slice(0,80):[],

function inline(s){
  return s.split(/(`[^`]+`)/).map(p=>p.length>1&&p.startsWith("`")&&p.endsWith("`")?`<code>${esc(p.slice(1,-1))}</code>`:
    esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')).join("");
}
function md(src){
  const L=src.split("\n"),out=[];let i=0;
  const cells=r=>{const s=r.trim().replace(/^\|/,"").replace(/\|$/,"");const o=[];let c="",bt=false;for(const ch of s){if(ch==="`")bt=!bt;if(ch==="|"&&!bt){o.push(c.trim());c=""}else c+=ch}o.push(c.trim());return o};
  while(i<L.length){
    const l=L[i];
    if(l.startsWith("```")){const b=[];i++;while(i<L.length&&!L[i].startsWith("```"))b.push(L[i++]);i++;out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`);continue}
    if(/^### /.test(l)){out.push(`<h3>${inline(l.slice(4))}</h3>`);i++;continue}
    if(/^## /.test(l)){out.push(`<h2>${inline(l.slice(3))}</h2>`);i++;continue}
    if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].startsWith("|"))rows.push(L[i++]);const h=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push(`<div class="tw"><table><tr>${h.map(c=>`<th>${inline(c)}</th>`).join("")}</tr>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);continue}
    if(/^- /.test(l)){const it=[];while(i<L.length&&/^- /.test(L[i]))it.push(L[i++].slice(2));out.push(`<ul>${it.map(t=>t.startsWith("[ ] ")?`<li class="ck">☐ ${inline(t.slice(4))}</li>`:`<li>${inline(t)}</li>`).join("")}</ul>`);continue}
    if(/^\d+\. /.test(l)){const it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push(L[i++].replace(/^\d+\. /,""));out.push(`<ol>${it.map(t=>`<li>${inline(t)}</li>`).join("")}</ol>`);continue}
    if(l.trim()){const p=[];while(i<L.length&&L[i].trim()&&!/^(#|\||- |\d+\. |```)/.test(L[i]))p.push(L[i++]);out.push(`<p>${inline(p.join(" "))}</p>`);continue}
    i++;
  }
  return out.join("");
}
