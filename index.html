<style>
/* VOICE: 손에 쥐고 매일 여는 공부 앱, 차분하고 단단하게
   IDEA: 수험서 한 권 = 목차(홈) + 모의고사 + 요약노트 + 오답노트
   PICTURE: 홈 상단의 진도 카드(오답 수, 최근 점수), 그 아래 목록
   COLOUR and TYPE: 흰 바탕, 짙은 남색 헤더, 파랑 강조, 오답만 적색 / Noto Sans KR + JetBrains Mono
   LAYOUT: 폰 한 열(최대 560px), 하단 탭바 4개, 넓은 화면에선 가운데 정렬 */
:root{color-scheme:light dark;--bg:light-dark(#f3f4f7,#0d1118);--paper:light-dark(#fff,#161b26);--ink:light-dark(#121826,#e8ebf1);--mute:light-dark(#5e6677,#98a1b3);--line:light-dark(#dde1e8,#283041);--bar:#1d2b4f;--acc:#2f6fed;--hot:#e2462f;--ok:#1f9d55;--sel:light-dark(#e7efff,#1c2b4b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow-x:clip}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45}.opt:disabled{opacity:1}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.hd{background:var(--bar);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hd h1{font-size:18px;margin:0;flex:1;line-height:1.3}
.hd button{background:#ffffff1a;border-color:#ffffff33;color:#fff;min-height:38px;padding:0 12px;font-size:14px}
.pad{padding:16px}
.hero{background:var(--bar);color:#fff;padding:22px 16px 26px}
.hero h1{font-size:28px;line-height:1.15;margin:0 0 4px}
.hero p{margin:0;opacity:.8;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{background:#ffffff14;border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px/1.1 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
.stat span{font-size:13px;opacity:.85}
.sec{font-size:14px;color:var(--mute);margin:20px 16px 8px;font-weight:700}
.list{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;min-height:64px}
.item:last-child{border-bottom:0}

.tabs a.on{color:var(--acc);font-weight:700}

.foot .in{max-width:528px;margin:0 auto;display:flex;gap:8px}.foot .in>*{flex:1}

.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--acc)}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}
.overlay.show{display:flex}

.dlg h2{margin:0 0 8px;font-size:19px}.btns{display:flex;gap:8px;margin-top:16px}.btns>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}

.grid .done{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.big{font:700 64px/1 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}

.bar{display:grid;grid-template-columns:8.6em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:13.5px;margin-top:8px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i s{display:block;height:100%;background:var(--acc)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;color:#fff;background:var(--hot)}
.tag.ok{background:var(--ok)}.tag.m{background:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.chips button{flex:none;min-height:36px;padding:0 14px;border-radius:99px;font-size:14px}
.chips .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.md{font-size:15.5px}.md h2{font-size:21px;margin:4px 0 10px;line-height:1.3}.md h3{font-size:17px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.md ul,.md ol{padding-left:20px;margin:8px 0}.md li{margin:4px 0}.md p{margin:8px 0}
.md .tw{overflow-x:auto}
.md li.ck{list-style:none;margin-left:-20px}
.search{width:100%;font:inherit;font-size:16px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.note{font-size:13px;color:var(--mute)}
details summary{cursor:pointer;list-style:none;font-weight:500;color:var(--acc);margin-top:10px;min-height:32px}
mark{background:#ffe36a;color:#111;border-radius:3px}
@media(prefers-reduced-motion:no-preference){.card,.list{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
.mini{min-height:32px;padding:0 10px;font-size:13px}
textarea.code{width:100%;min-height:200px;font:14px/1.5 ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical;tab-size:4}
.btns .on{background:var(--hot);border-color:var(--hot);color:#fff}
.subj .tag{margin-right:2px}
.ex pre{margin:8px 0;background:var(--paper)}
.top{background:var(--bar);padding:12px 16px 14px;position:sticky;top:0;z-index:5}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ffffff1a;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:#ffffffcc;min-height:40px;font-weight:500}
.seg button.on{background:#fff;color:var(--bar);font-weight:700}
.lv{display:flex;gap:6px;margin-top:10px}.lv button{min-height:34px;border-radius:99px;padding:0 16px;font-size:14px;background:none;border-color:#ffffff40;color:#fff}
.lv button.on{background:#ffffff26;border-color:#fff;font-weight:700}
.hero{padding:6px 16px 18px}.stat b small{font-size:14px;opacity:.7;margin-left:2px}
.gtag{color:#e08a00;font-weight:700}
.ghost{background:none;border-color:var(--line);color:var(--mute)}
.item[disabled]{opacity:.45}
label.item{cursor:pointer}
.sw{appearance:none;flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--acc)}.sw:checked::after{left:23px}
.md{font-size:calc(15.5px*var(--fs,1))}

<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="overlay" id="ov"><div class="dlg" id="dlg"></div></div>
<script>
/* 자동 생성 문제: 값만 무작위로 바꾸고 정답은 계산으로 구한다. 각 생성기는 {t,s,q,c,o?,a,e,run?}를 돌려준다. run은 검증용 실행 코드 */
const GEN=(()=>{
const mk=(rnd)=>({
  int:(a,b)=>a+Math.floor(rnd()*(b-a+1)),
  pick:a=>a[Math.floor(rnd()*a.length)],
  shuf:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  rnd
});
/* 객관식: 정답 + 오답 후보 → 서로 다른 보기 4개 */
function mc(R,ans,cands,fill){
  const A=String(ans),o=[A];
  for(const c of cands){const s=String(c);if(o.length<4&&!o.includes(s))o.push(s)}
  let k=1;while(o.length<4&&k<60){const s=String(fill?fill(k):Number(ans)+k*(R.rnd()<.5?-1:1));if(!o.includes(s)&&s!=="NaN")o.push(s);k++}
  if(o.length<4)throw new Error("보기 부족");
  const sh=R.shuf(o);return {o:sh,a:sh.indexOf(A)};
}
const f2=x=>(Math.round(x*100+1e-9)/100).toFixed(2);
const tbl=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const NAMES=["김민수","이서연","박지훈","최유나","정다은","한도윤","오세진","윤하늘"],DEPTS=["CS","EE","ME"];

/* ---------- 공통 조각 ---------- */
function loopCode(R,lang){
  const a=R.int(1,5),b=a+R.int(6,14),st=R.int(1,3),k=R.int(2,4),r=R.int(0,k-1);
  let s=0,all=0,lt=0;for(let i=a;i<=b;i+=st){all+=i;if(i%k===r){s+=i;if(i<b)lt+=i}}
  const code=lang==="Python"?`s = 0\nfor i in range(${a}, ${b+1}, ${st}):\n    if i % ${k} == ${r}:\n        s += i\nprint(s)`
   :lang==="Java"?`int s = 0;\nfor (int i = ${a}; i <= ${b}; i += ${st})\n    if (i % ${k} == ${r}) s += i;\nSystem.out.print(s);`
   :`int s = 0;\nfor (int i = ${a}; i <= ${b}; i += ${st})\n    if (i % ${k} == ${r}) s += i;\nprintf("%d", s);`;
  const vals=[];for(let i=a;i<=b;i+=st)if(i%k===r)vals.push(i);
  return {code,ans:s,alt:[lt,all-s,all],e:`조건(i % ${k} == ${r})을 만족하는 i: ${vals.join(", ")||"없음"} → 합 ${s}.${lang==="Python"?` range의 끝값 ${b+1}은 포함하지 않는다.`:""}`};
}
function sqlTable(R){
  const n=R.int(5,6),names=R.shuf(NAMES).slice(0,n);
  return names.map(nm=>({name:nm,dept:R.pick(DEPTS),score:R.int(5,19)*5}));
}
function sqlQuery(R,rows){
  const kind=R.int(0,4),k=R.pick([60,70,75,80]),d=R.pick([...new Set(rows.map(r=>r.dept))]);
  if(kind===0){const v=rows.filter(r=>r.score>=k).length;return {sql:`SELECT COUNT(*) FROM 학생\nWHERE 점수 >= ${k};`,ans:v,alt:[rows.filter(r=>r.score>k).length,rows.length-v,rows.length],e:`점수가 ${k} 이상인 행 수 = ${v}.`}}
  if(kind===1){const v=rows.filter(r=>r.dept===d).reduce((x,r)=>x+r.score,0);return {sql:`SELECT SUM(점수) FROM 학생\nWHERE 학과 = '${d}';`,ans:v,alt:[rows.reduce((x,r)=>x+r.score,0),v-5,v+5],e:`학과가 ${d}인 행의 점수 합 = ${v}.`}}
  if(kind===2){const v=new Set(rows.map(r=>r.dept)).size;return {sql:`SELECT COUNT(DISTINCT 학과) FROM 학생;`,ans:v,alt:[rows.length,v+1,v-1],e:`중복을 뺀 학과 종류 수 = ${v}.`}}
  if(kind===3){const g={};rows.forEach(r=>g[r.dept]=(g[r.dept]||0)+1);const c=R.int(2,3);const v=Object.values(g).filter(x=>x>=c).length;
    return {sql:`SELECT 학과, COUNT(*) FROM 학생\nGROUP BY 학과\nHAVING COUNT(*) >= ${c};`,ans:v,alt:[Object.keys(g).length,rows.length,v+1],e:`학과별 인원: ${Object.entries(g).map(([a,b])=>a+" "+b+"명").join(", ")}. ${c}명 이상인 학과 수 = ${v}(결과 행 수).`,ask:"결과 행의 개수"}}
  const v=Math.max(...rows.filter(r=>r.dept===d).map(r=>r.score));return {sql:`SELECT MAX(점수) FROM 학생\nWHERE 학과 = '${d}';`,ans:v,alt:[Math.max(...rows.map(r=>r.score)),Math.min(...rows.filter(r=>r.dept===d).map(r=>r.score)),v-5],e:`학과가 ${d}인 행 중 가장 큰 점수 = ${v}.`};
}
const sqlRun=(rows,sql)=>`CREATE TABLE 학생(이름 TEXT, 학과 TEXT, 점수 INT);\n${rows.map(r=>`INSERT INTO 학생 VALUES('${r.name}','${r.dept}',${r.score});`).join("\n")}\n${sql}`;
function tree(R){
  const L="ABCDEFG".split("").slice(0,R.int(5,7));const nodes=L.map(k=>({k,l:null,r:null}));
  for(let i=1;i<nodes.length;i++){let p;do{p=nodes[R.int(0,i-1)]}while(p.l&&p.r);if(!p.l&&(!p.r&&R.rnd()<.5||p.r))p.l=nodes[i];else if(!p.r)p.r=nodes[i];else p.l=nodes[i]}
  const pre=[],ino=[],post=[];const go=n=>{if(!n)return;pre.push(n.k);go(n.l);ino.push(n.k);go(n.r);post.push(n.k)};go(nodes[0]);
  return {nodes,pre:pre.join(" "),in:ino.join(" "),post:post.join(" ")};
}
function relPath(R){
  const words=["home","user","work","src","docs","app","test","lib","data","img"];
  const cwd=["",...R.shuf(words).slice(0,R.int(2,4))];const parts=[];let depth=cwd.length-1,stack=cwd.slice(1);
  const ups=R.int(0,Math.min(2,depth));for(let i=0;i<ups;i++){parts.push("..");stack.pop()}
  const n=R.int(1,3);for(let i=0;i<n;i++){const w=R.pick(words);if(R.rnd()<.25){parts.push(".")}parts.push(w);stack.push(w);if(R.rnd()<.2&&i<n-1){parts.push("..");stack.pop()}}
  if(parts[0]!==".."&&R.rnd()<.4)parts.unshift(".");
  return {cwd:cwd.join("/")||"/",rel:parts.join("/"),abs:"/"+stack.join("/")};
}
const perm=()=>{};
function rwx(R){const d=[R.int(4,7),R.int(0,7),R.int(0,7)];const s=d.map(x=>(x&4?"r":"-")+(x&2?"w":"-")+(x&1?"x":"-")).join("");return {n:d.join(""),s}}

/* ---------- 프로그래밍기능사 필기 ---------- */
const pf=[
 {s:0,name:"반복문 실행 결과",f(R){const lang=R.pick(["C","Java","Python"]),x=loopCode(R,lang),m=mc(R,x.ans,x.alt);
  return {t:"mc",q:`다음 ${lang} 코드의 출력 결과는?`,c:x.code,...m,e:x.e,run:{lang,src:x.code,out:String(x.ans)}}}},
 {s:0,name:"몫과 나머지",f(R){const py=R.rnd()<.4;
  if(py){const y=R.int(3,9);let x=-R.int(7,40);if(x%y===0)x-=1;const q=Math.floor(x/y),r=x-q*y,tq=Math.trunc(x/y),tr=x-tq*y;const code=`print(${x} // ${y}, ${x} % ${y})`;
   const m=mc(R,`${q} ${r}`,[`${tq} ${tr}`,`${tq} ${r}`,`${q} ${tr}`],k=>`${q-k} ${r}`);
   return {t:"mc",q:"다음 Python 코드의 출력 결과는?",c:code,...m,e:`Python의 //는 음의 무한대 방향으로 내림한다: ${x} // ${y} = ${q}. %는 나누는 수의 부호를 따른다: ${x} - (${y} × ${q}) = ${r}.`,run:{lang:"Python",src:code,out:`${q} ${r}`}}}
  const lang=R.pick(["C","Java"]),x=R.int(10,60),y=R.int(3,9),q=Math.trunc(x/y),r=x%y;
  const code=lang==="C"?`int x = ${x}, y = ${y};\nprintf("%d %d", x / y, x % y);`:`int x = ${x}, y = ${y};\nSystem.out.print(x / y + " " + x % y);`;
  const m=mc(R,`${q} ${r}`,[`${r} ${q}`,`${q+1} ${r}`,`${(x/y).toFixed(1)} ${r}`],k=>`${q} ${r+k}`);
  return {t:"mc",q:`다음 ${lang} 코드의 출력 결과는?`,c:code,...m,e:`정수끼리 나누면 몫만 남는다: ${x} / ${y} = ${q}, 나머지 ${x} % ${y} = ${r}.`,run:{lang,src:code,out:`${q} ${r}`}}}},
 {s:0,name:"증감 연산자",f(R){const v=R.int(2,9),k=R.int(0,2);let code,a,b,e;

 {s:1,name:"스택·큐 연산",f(R){const isS=R.rnd()<.5,L="ABCDEFG".split("");let i=0;const ops=[],st=[],out=[];

,"짝수는 건너뛰고 홀수만 더한다. 1+3+5+7+9 = 25.","int s = 0;\nfor (int i = 1; i <= 10; i++) {\n    if (i % 2 == 0) continue;\n    s += i;\n}\nprintf(\"%d\", s);"],[1,"후입선출(LIFO) 방식으로 동작하며, 함수 호출 시 복귀 주소를 저장하는 데 쓰는 자료구조는?",["큐","트리","데크","스택"],3,"스택은 나중에 넣은 것이 먼저 나온다(LIFO). 큐는 먼저 넣은 것이 먼저 나온다(FIFO)."],[1,"빈 큐에 A, B, C를 차례로 삽입(enqueue)한 뒤 한 번 삭제(dequeue)하면 삭제되는 원소는?",["A","B","C","없음"],0,"큐는 선입선출(FIFO)이라 가장 먼저 들어간 A가 나온다. 스택이었다면 C."],[1,"데이터 모델링 단계 중, 특정 DBMS에 맞춰 테이블·인덱스·저장 구조를 구체적으로 정하는 단계는?",["요구사항 분석","개념적 데이터 모델링","논리적 데이터 모델링","물리적 데이터 모델링"],3,"개념적(E-R 다이어그램) → 논리적(테이블·키·정규화, DBMS 독립) → 물리적(특정 DBMS의 저장 구조·인덱스)."],[1,"E-R 다이어그램에서 마름모 기호가 나타내는 것은?",["개체","기본키 속성","속성","관계"],3,"사각형 = 개체, 마름모 = 관계, 타원 = 속성, 밑줄 친 타원 = 기본키 속성."],[1,"OSI 7계층 중 경로 설정(라우팅)을 담당하는 계층은?",["데이터 링크 계층","세션 계층","전송 계층","네트워크 계층"],3,"라우터와 IP는 네트워크 계층(3계층)."],[1,"‘비연결형이고 전송 속도가 빠르지만, 순서와 도착을 보장하지 않는다.’에 해당하는 프로토콜은?",["TCP","HTTP","IP","UDP"],3,"UDP는 비연결형이다. TCP는 연결형이고 신뢰성을 보장한다."],[1,"IP 주소를 MAC 주소로 바꾸는 프로토콜은?",["ARP","RARP","ICMP","DHCP"],0,"ARP는 IP→MAC, RARP는 MAC→IP."],[1,"HTTP의 기본 포트 번호는?",["21","23","80","443"],2,"21 FTP, 23 Telnet, 443 HTTPS."],[1,"네트워크 192.168.10.0/27에서 호스트에 할당할 수 있는 IP 주소는 몇 개인가?",["14","30","32","62"],1,"호스트 비트 5개 → 2⁵ = 32개, 네트워크·브로드캐스트 주소 2개를 빼면 30개."],[1,"IPv4 C 클래스의 첫 번째 옥텟 범위는?",["0~127","128~191","224~239","192~223"],3,"A 0~127, B 128~191, C 192~223, D 224~239."],[1,"UNIX에서 chmod 754 file을 실행한 뒤의 파일 권한은?",["rwxr-xr--","rwxr--r-x","rw-r-xr--","rwxrw-r--"],0,"7=rwx, 5=r-x, 4=r--."],[1,"UNIX에서 현재 작업 중인 디렉터리의 경로를 출력하는 명령어는?",["ls","cd","cat","pwd"],3,"pwd = print working directory."],[3,"블랙박스 테스트 기법이 아닌 것은?",["동치 분할","경계값 분석","원인-효과 그래프","기초 경로 테스트"],3,"기초 경로 테스트는 내부 구조를 보는 화이트박스 기법이다."],[3,"상향식 통합 테스트에서 상위 모듈 역할을 대신하는 가상 모듈은?",["스텁","드라이버","오라클","클러스터"],1,"상향식은 드라이버, 하향식은 스텁을 쓴다."],[1,"사용자가 제품이나 서비스를 이용하면서 느끼고 생각하는 경험 전체를 뜻하는 용어는?",["UI","UX","GUI","CLI"],1,"UX(사용자 경험)는 경험 전체, UI(사용자 인터페이스)는 그 경험을 위한 화면·조작 수단이다."],[2,"다음 중 DDL(데이터 정의어)이 아닌 것은?",["CREATE","ALTER","DROP","UPDATE"],3,"UPDATE는 DML(조작어)이다."],[2,"사용자에게 데이터베이스 객체에 대한 권한을 부여하는 SQL 명령어는?",["GRANT","REVOKE","COMMIT","INSERT"],0,"GRANT는 권한 부여, REVOKE는 회수."],[2,"속성이 5개, 튜플이 8개인 릴레이션의 카디널리티는?",["5","8","13","40"],1,"카디널리티 = 튜플(행) 수, 차수 = 속성(열) 수."],[2,"‘기본키는 NULL 값이나 중복 값을 가질 수 없다’는 규칙은?",["개체 무결성","참조 무결성","도메인 무결성","사용자 정의 무결성"],0,"개체 무결성. 참조 무결성은 외래키에 관한 규칙이다."],[2,"제1정규형에서 제2정규형으로 가기 위해 제거하는 것은?",["다중값 속성","부분 함수적 종속","이행적 함수 종속","다치 종속"],1,"2NF는 부분 함수적 종속을 제거한다 (도부이결다조)."],[2,"A → B, B → C일 때 A → C가 성립하는 종속을 제거하는 정규형은?",["1NF","2NF","3NF","BCNF"],2,"3NF는 이행적 종속을 제거한다."],[2,"WHERE 이름 LIKE '김_' 조건에 맞는 것은?",["김","김연","김연아","박김"],1,"_는 정확히 한 글자. 김 + 한 글자 = 두 글자."],[2,"GROUP BY로 묶은 그룹에 조건을 거는 절은?",["WHERE","HAVING","ORDER BY","DISTINCT"],1,"WHERE는 행 조건, HAVING은 그룹 조건."],[2,"SELECT 문에서 가장 먼저 처리되는 절은?",["SELECT","WHERE","FROM","GROUP BY"],2,"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY."],[2,"테이블 구조는 남기고 모든 행을 삭제하는 DDL 명령어는?",["DROP","DELETE","TRUNCATE","ALTER"],2,"TRUNCATE는 DDL로 구조는 남긴다. DELETE는 DML, DROP은 구조까지 삭제."],[2,"트랜잭션의 연산이 모두 반영되거나 전혀 반영되지 않아야 한다는 성질은?",["원자성","일관성","독립성","영속성"],0,"원자성(All or Nothing)."],[2,"두 SELECT 문의 결과를 합치면서 중복된 행은 한 번만 남기는 집합 연산자는?",["UNION","UNION ALL","INTERSECT","EXCEPT"],0,"UNION은 합집합(중복 제거), UNION ALL은 중복 포함, INTERSECT는 교집합, EXCEPT(MINUS)는 차집합."],[2,"스키마 3단계 중 사용자나 응용 프로그래머 각각의 관점에서 본 논리 구조는?",["외부 스키마","개념 스키마","내부 스키마","물리 스키마"],0,"외부 스키마 = 서브 스키마, 사용자 관점."],[2,"[성적] 테이블에서 다음 SQL의 결과는?<table><tr><th>이름</th><th>점수</th></tr><tr><td>가</td><td>80</td></tr><tr><td>나</td><td>NULL</td></tr><tr><td>다</td><td>60</td></tr></table>",["3, 46.7","3, 70","2, 70","2, 46.7"],2,"NULL은 집계에서 빠진다. COUNT = 2, AVG = (80+60)/2 = 70.","SELECT COUNT(점수), AVG(점수) FROM 성적;"],[2,"LEFT OUTER JOIN에 대한 설명으로 옳은 것은?",["양쪽 테이블에 모두 있는 행만 출력한다","왼쪽 테이블의 행은 모두 출력하고, 오른쪽에 맞는 행이 없으면 NULL로 채운다","두 테이블의 모든 조합을 출력한다","오른쪽 테이블의 행만 모두 출력한다"],1,"①은 INNER JOIN, ③은 CROSS JOIN, ④는 RIGHT OUTER JOIN에 가깝다."],[1,"데이터를 행과 열로 이루어진 테이블에 저장하고 SQL로 다루는 데이터베이스 유형은?",["계층형","망형","관계형","키-값형(NoSQL)"],2, ~ ADD","INSERT INTO ~ VALUES","UPDATE ~ SET"],1,"테이블 구조 변경은 DDL인 ALTER TABLE. 열 추가는 ADD, 수정은 MODIFY, 삭제는 DROP COLUMN."],[2,"이미 있는 행의 값을 바꾸는 SQL 명령어는?",["UPDATE","CHANGE","MODIFY","ALTER"],0,"UPDATE 테이블 SET 열 = 값 WHERE 조건. ALTER는 테이블 구조를 바꾼다."],[2,"다음 중 DML에 해당하는 명령어로만 묶인 것은?",["CREATE, DROP","SELECT, DELETE","COMMIT, ROLLBACK","GRANT, REVOKE"],1,"DML은 SELECT, INSERT, UPDATE, DELETE. CREATE·DROP은 DDL, GRANT·REVOKE는 DCL, COMMIT·ROLLBACK은 TCL."],[2,"WHERE 절에서 NULL 값을 올바르게 찾는 조건은?",["점수 == NULL","점수 LIKE NULL","점수 IS NULL","점수 = NULL"],2,"NULL은 = 로 비교할 수 없다. IS NULL, IS NOT NULL을 쓴다."],[2,"WHERE 점수 BETWEEN 60 AND 80 과 같은 조건은?",["점수 >= 60 AND 점수 <= 80","점수 >= 60 OR 점수 <= 80","점수 > 60 AND 점수 <= 80","점수 > 60 AND 점수 < 80"],0,"BETWEEN은 양 끝 값을 포함한다."],[2,"중복된 행을 제거하고 조회할 때 SELECT 뒤에 쓰는 키워드는?",["DISTINCT","GROUP","ONLY","UNIQUE"],0,"SELECT DISTINCT 학과 FROM 학생 → 학과를 중복 없이 조회한다."],[2,"다음 중 집계 함수가 아닌 것은?",["LIKE","COUNT","AVG","SUM"],0,"LIKE는 문자열 패턴 비교 연산자. 집계 함수는 COUNT, SUM, AVG, MAX, MIN."],[2,"두 테이블에서 조인 조건을 만족하는 행만 결과로 내는 조인은?",["CROSS JOIN","INNER JOIN","FULL OUTER JOIN","LEFT OUTER JOIN"],1,"INNER JOIN은 양쪽에 짝이 있는 행만. OUTER JOIN은 짝이 없는 행도 NULL로 채워 포함한다."],[2,"행이 3개인 테이블과 행이 4개인 테이블을 CROSS JOIN한 결과의 행 수는?",["3","12","7","4"],1,"CROSS JOIN은 모든 조합(카티션 곱)이라 3 × 4 = 12행."],[2,"두 SELECT 결과에 모두 있는 행만 구하는 집합 연산자는?",["UNION ALL","EXCEPT","INTERSECT","UNION"],2,"INTERSECT는 교집합. EXCEPT(Oracle은 MINUS)는 첫 결과에서 두 번째 결과를 뺀 차집합."],[2,"테이블, 컬럼, 인덱스, 사용자 같은 DB 객체 정보를 담고 있으며 DBMS가 자동으로 관리하는 것은?",["트리거","뷰","시스템 카탈로그","커서"],2,"시스템 카탈로그(데이터 사전)는 메타데이터 저장소. 사용자는 조회만 하고 갱신은 DBMS가 한다."],[2,"뷰(VIEW)에 대한 설명으로 옳지 않은 것은?",["보안과 논리적 독립성을 제공한다","ALTER VIEW로 정의를 자유롭게 바꾸는 것이 원칙이다","뷰를 통한 삽입·수정에는 제약이 있다","하나 이상의 테이블에서 유도된 가상 테이블이다"],1,"표준 SQL에서 뷰는 정의를 바꾸려면 DROP 후 다시 CREATE한다."],[2,"인덱스에 대한 설명으로 옳은 것은?",["DML 명령어로 만든다","인덱스를 만들면 테이블 데이터가 복사되어 두 배가 된다","모든 열에 만들수록 항상 빨라진다","검색 속도를 높이지만 삽입·수정이 잦으면 성능이 떨어질 수 있다"],3,"인덱스는 CREATE INDEX(DDL)로 만들며, 데이터 변경이 잦으면 인덱스도 갱신해야 해서 느려질 수 있다."],[2,"사용자 user1에게 [학생] 테이블 조회 권한을 주는 SQL은?",["GRANT SELECT ON 학생 TO user1;","GRANT SELECT TO 학생 ON user1;","REVOKE SELECT ON 학생 FROM user1;","ALLOW SELECT ON 학생 user1;"],0,"부여: GRANT 권한 ON 객체 TO 사용자. 회수: REVOKE 권한 ON 객체 FROM 사용자."],[2,"트랜잭션이 성공적으로 끝나 변경 내용을 데이터베이스에 영구적으로 반영하는 명령어는?",["SAVEPOINT","ROLLBACK","COMMIT","CHECKPOINT"],2,"COMMIT은 확정, ROLLBACK은 취소, SAVEPOINT는 중간 저장점."],[2,"트랜잭션의 성질 중 ‘실행 중인 트랜잭션의 중간 결과를 다른 트랜잭션이 볼 수 없다’는 것은?",["일관성","독립성(격리성)","원자성","영속성"],1,"독립성(Isolation)은 동시에 실행되는 트랜잭션끼리 서로 간섭하지 않는다는 성질."],[2,"외래키에 대한 설명으로 옳은 것은?",["한 테이블에 하나만 둘 수 있다","NULL 값을 가질 수 없다","항상 기본키와 같은 값이어야 한다","다른 테이블의 기본키를 참조하는 속성이다"],3,"외래키는 참조 대상(다른 테이블의 기본키)에 있는 값이거나 NULL이어야 한다(참조 무결성)."],[2,"후보키가 갖춰야 할 두 가지 성질은?",["최소성, 가변성","유일성, 최소성","유일성, 중복성","독립성, 영속성"],1,"후보키는 튜플을 유일하게 식별하고(유일성), 꼭 필요한 속성으로만 구성된다(최소성). 슈퍼키는 유일성만 만족한다."],[2,"제1정규형(1NF)을 만족하기 위한 조건은?",["이행적 함수 종속 제거","모든 결정자가 후보키","모든 속성 값이 원자값","부분 함수적 종속 제거"],2,"1NF는 반복되거나 여러 값이 들어간 속성을 없애 원자값만 갖게 한다."],[2,"정규화를 하지 않아 생기는 문제 중, 한 행을 지웠는데 필요한 다른 정보까지 함께 지워지는 것은?",["조회 이상","삭제 이상","갱신 이상","삽입 이상"],1,"삭제 이상. 삽입 이상은 불필요한 값까지 넣어야 하는 문제, 갱신 이상은 일부만 바뀌어 불일치가 생기는 문제."],[3,"테스트에서 ‘제품을 올바르게 만들었는가(명세대로 만들었는가)’를 확인하는 것은?",["감사","확인(Validation)","검증(Verification)","인수"],2,"검증은 개발자 관점에서 명세대로 만들었는지, 확인은 사용자 관점에서 올바른 제품을 만들었는지 본다."],[3,"테스트 원리 중 ‘같은 테스트 케이스를 반복하면 더 이상 새 결함을 찾지 못한다’는 것은?",["살충제 패러독스","결함 집중","오류-부재의 궤변","완벽한 테스트 불가능"],0,"살충제 패러독스. 테스트 케이스를 주기적으로 검토하고 바꿔야 한다."],[3,"입력 범위가 1~100일 때 0, 1, 100, 101처럼 경계 근처 값으로 테스트하는 블랙박스 기법은?",["원인-효과 그래프","동치 분할","경계값 분석","비교 테스트"],2,"경계값 분석은 오류가 경계에서 많이 난다는 점을 이용한다. 동치 분할은 유효·무효 구간의 대표값을 고른다."],[3,"프로그램을 실행하지 않고 코드나 문서를 검토해 결함을 찾는 테스트는?",["동적 테스트","인수 테스트","부하 테스트","정적 테스트"],3,"정적 테스트(동료 검토, 워크스루, 인스펙션). 동적 테스트는 실행하며 검사한다(화이트박스, 블랙박스)."],[3,"하향식 통합 테스트에서 아직 만들어지지 않은 하위 모듈을 대신하는 가상 모듈은?",["드라이버","스텁","하네스","오라클"],1,"하향식은 스텁(하위 대신), 상향식은 드라이버(상위 대신)."],[3,"프로그램을 수정한 뒤, 수정 때문에 다른 부분에 새로운 오류가 생기지 않았는지 다시 확인하는 테스트는?",["알파 테스트","인수 테스트","회귀 테스트","스모크 테스트"],2,"회귀 테스트는 변경 후 기존 기능이 그대로 동작하는지 반복 확인한다."],[3,"사용자가 개발자 환경(개발 장소)에서 개발자와 함께 수행하는 인수 테스트는?",["단위 테스트","알파 테스트","베타 테스트","시스템 테스트"],1,"알파는 개발자 장소에서 통제된 환경으로, 베타는 사용자 환경에서 여러 사용자가 수행한다."],[3,"테스트 결과가 맞는지 판단하기 위해 기대 결과를 제공하는 기준이나 장치는?",["테스트 시나리오","테스트 하네스","테스트 오라클","테스트 스텁"],2,"테스트 오라클은 참값 비교의 기준. 종류로 참·샘플링·휴리스틱·일관성 검사 오라클이 있다."],[3,"화이트박스 테스트에서 모든 분기(결정)의 참과 거짓을 최소 한 번씩 수행하는 커버리지는?",["결정(분기) 커버리지","구문 커버리지","다중 조건 커버리지","조건 커버리지"],0,"결정 커버리지는 각 분기문의 참·거짓 결과를 모두 수행한다. 조건 커버리지는 각 개별 조건식의 참·거짓."],[3,"디버깅에서 함수 호출이 있는 줄을 실행할 때 함수 안으로 들어가지 않고 한 줄 단위로 넘어가는 기능은?",["Watch","Breakpoint","Step Over","Step Into"],2,"Step Over는 함수를 한 번에 실행하고 다음 줄로, Step Into는 함수 안으로 들어간다. Watch는 변수 값 관찰."],[3,"지속적 통합(CI)의 장점으로 거리가 먼 것은?",["배포 가능한 상태를 자주 확인한다","자동 빌드·테스트로 품질을 유지한다","코드를 오랫동안 따로 개발한 뒤 한 번에 합친다","통합 오류를 일찍 발견한다"],2,"CI는 자주, 작게 합치는 것이 핵심이다. 오래 따로 개발하면 통합 충돌이 커진다."],[3,"애플리케이션과 실행에 필요한 라이브러리·설정을 함께 묶어, 어느 환경에서나 같게 실행되도록 하는 컨테이너 도구는?",["Docker","Git","Maven","Jenkins"],0,"Docker는 컨테이너로 실행 환경을 통째로 묶는다. Kubernetes는 여러 컨테이너를 운영·관리한다."],[3,"Java 프로젝트에서 pom.xml로 라이브러리 의존성과 빌드를 관리하는 도구는?",["Ant","Gradle","Maven","npm"],2,"Maven은 pom.xml, Gradle은 Groovy·Kotlin 스크립트(build.gradle), npm은 JavaScript 패키지 관리자."],[3,"코드 편집, 컴파일, 디버깅을 하나의 프로그램에서 할 수 있게 해 주는 개발 도구는?",["IDE","OS","DBMS","WAS"],0,"IDE(통합 개발 환경): Eclipse, IntelliJ, Visual Studio, VS Code 등."],[3,"정적 콘텐츠(HTML, 이미지)를 처리하는 웹 서버가 아닌 것은?",["Apache HTTP Server","IIS","Nginx","Tomcat"],3,"Tomcat은 동적 콘텐츠를 처리하는 WAS다."],[3,"운영체제의 목적(성능 평가 기준)과 거리가 먼 것은?",["처리 능력 향상","소스 코드 길이 증가","사용 가능도 향상","반환 시간 단축"],1,"운영체제 성능 기준은 처리 능력(Throughput)↑, 반환 시간↓, 사용 가능도↑, 신뢰도↑."],[3,"메모리에 항상 상주하며 프로세스·메모리·파일·입출력을 관리하는 운영체제의 핵심 부분은?",["커널","유틸리티","셸","컴파일러"],0,"커널은 OS의 핵심, 셸은 명령어 해석기."],[3,"여러 프로그램을 메모리에 올려 두고 CPU 하나가 번갈아 실행해 CPU 사용률을 높이는 운영 방식은?",["다중 프로그래밍","일괄 처리","실시간 처리","분산 처리"],0,"다중 프로그래밍은 CPU 하나로 여러 프로그램을 번갈아 실행한다. 다중 처리는 CPU 여러 개."],[3,"Linux에서 파일 이름을 바꾸거나 다른 위치로 옮기는 명령어는?",["mv","rm","ln","cp"],0,"mv는 이동·이름 변경, cp는 복사, rm은 삭제, ln은 링크 생성."],[3,"Linux에서 실행 중인 프로세스와 CPU·메모리 사용량을 실시간으로 보여 주는 명령어는?",["kill","df","top","ps"],2,"top은 실시간 모니터링, ps는 그 순간의 프로세스 목록, df는 디스크 사용량."],[3,"Windows 명령 프롬프트에서 현재 폴더의 파일 목록을 보여 주는 명령어는?",["list","dir","ls","show"],1,"Windows는 dir, Linux는 ls. 복사는 copy, 삭제는 del, 화면 지우기는 cls."],[3,"형상관리에서 ‘공식적으로 검토·승인되어 변경 통제의 기준이 되는 시점의 산출물’을 뜻하는 용어는?",["머지","체크아웃","베이스라인","브랜치"],2,"베이스라인(기준선)은 이후 변경을 통제하는 기준점이다."],[3,"형상관리 절차를 순서대로 나열한 것은?",["식별 → 통제 → 감사 → 기록","식별 → 감사 → 통제 → 기록","기록 → 식별 → 통제 → 감사","통제 → 식별 → 기록 → 감사"],0,"형상 식별 → 형상 통제(변경 관리) → 형상 감사(검증) → 형상 기록(보고)."],[3,"Git에서 원격 저장소의 변경 내용을 가져와 현재 브랜치에 병합까지 하는 명령어는?",["fetch","pull","clone","push"],1,"pull = fetch + merge. fetch는 가져오기만, clone은 저장소 전체 복제."],[3,"Git에서 작업 디렉터리의 변경 파일을 커밋 대상(스테이징 영역)에 올리는 명령어는?",["git add","git push","git init","git commit"],0,"add로 스테이징하고 commit으로 로컬 저장소에 기록한 뒤 push로 원격에 올린다."],[3,"분산 버전 관리 시스템에 해당하는 것은?",["Git","RCS","CVS","SVN"],0,"Git과 Mercurial은 분산형. CVS와 SVN은 클라이언트/서버형, RCS는 로컬(공유 폴더)형."],[3,"백업 방식 중 백업 속도가 가장 빠르고 저장 용량이 가장 작지만, 복원할 때 가장 많은 백업이 필요한 것은?",["증분 백업","전체 백업","미러 백업","차등 백업"],0,"증분 백업은 직전 백업 이후 변경분만 저장해 빠르고 작지만, 복원 시 전체 + 모든 증분이 필요하다."],[3,"장애가 났을 때 서비스를 복구하기까지 허용되는 최대 시간을 뜻하는 지표는?",["SLA","RPO","RTO","MTBF"],2,"RTO(목표 복구 시간)는 복구까지 걸리는 시간, RPO(목표 복구 시점)는 데이터 손실을 어느 시점까지 허용하는지."],[3,"원본 데이터와 백업을 서로 다른 장소에 두어 화재·재해에도 데이터를 지키는 방법은?",["증분 백업","원격지 백업","RAID 0","스냅숏"],1,"원격지(오프사이트) 백업. RAID 0은 중복 없이 나눠 저장해 디스크 하나만 고장 나도 데이터를 잃는다."]].map(([s,q,o,a,e,c])=>({s,q,o,a,e,c,t:"mc"})),note:"# 프로그래밍기능사 필기 요약노트\n\nNov 24, 2026 · @훈\n\n## 시험 개요\n\n필기는 4과목 통합 60문항, 60분 동안 풀고 60점(36문항) 이상이면 합격이다. 과목별 과락은 없다. 2026년부터 정보처리기능사가 프로그래밍기능사로 바뀌었고, 실기는 2026년 공지에서 작업형으로 바뀐다고 했지만, 2027~2029년 출제기준표의 검정방법은 필답형이다. 공단 예시문제도 경로·명령어·실행 결과·빈칸·SQL 답을 직접 쓰는 단답형이다.\n\n| 항목 | 내용 |\n| --- | --- |\n| 필기 과목 | 프로그래밍 언어 · 응용SW기초기술 · SQL 활용 · 정보시스템 기초기술 |\n| 방식 | CBT, 객관식 4지 택일 60문항, 60분 |\n| 합격 | 100점 만점에 60점 이상 |\n| 응시자격 | 제한 없음 |\n| 실기 | 기초프로그래밍 실무, 작업형, 1시간 30분 |\n\n**첫 회차 출제 경향**: Java·Python 코드, OSI 7계층, IP 주소, 데이터베이스, SQL 명령어, UNIX 명령어가 나왔다고 알려져 있다([시나공 Q&A](https://sinagong.co.kr/community/001003001/book-qnas/279552)).\n\n**공부 전략 (컴공 기준)**\n\n1. 코드 출력 문제(C·Java·Python)는 직접 손으로 추적하는 연습을 한다. 배점이 가장 확실한 영역이다.\n2. SQL은 문법을 외우고 SELECT 결과를 예측하는 연습을 한다.\n3. 낯선 용어(테스트 기법, 형상관리, 보안 공격)는 표로 외운다.\n4. 마지막 주에는 맨 아래 체크리스트로 훑고 CBT 모의고사를 3회 이상 푼다.\n\n**공식 출제기준(필기, 적용기간 2027.01.01~2029.12.31)의 주요항목**\n\n| 주요항목 | 세부항목 | 이 노트 |\n| --- | --- | --- |\n| 1. 프로그래밍 언어 활용 및 응용 | 구조적 프로그래밍(기초문법, 순차·선택·반복, 컴파일러), 객체지향(OOP, 상속, 다형성, 추상화, 동적 바인딩) | 1과목 |\n| 2. 응용SW 기초 기술 활용 | 네트워크 기초(프로토콜, OSI, IP, TCP/UDP), 데이터베이스 기초(개념, 데이터 모델링, E-R, DB 유형, 무결성, 자료구조) | 2과목 |\n| 3. 화면구현 및 UI 테스트 | UI/UX, UI 테스트 기법, HTML, CSS, JavaScript 기초 | 1-7, 2-4 |\n| 4. SQL 작성 및 활용 | 시스템 카탈로그, SELECT, 집합 연산자, DML·DDL·DCL, 트랜잭션 | 3과목 |\n| 5. 테스트 및 배포 | 단위·통합·블랙박스·화이트박스 테스트, 디버깅, DevOps, CI/CD | 4-1, 4-2 |\n| 6. 개발자 환경 구축 | 운영체제 개념·종류·기본 명령어, 개발환경 설정, 개발도구 | 4-3, 4-4 |\n| 7. 개발 환경 운영 지원 | 백업 용량 산정, 백업 종류와 복원, 소스코드 형상관리 | 4-5, 4-6 |\n\n출제기준에 없는 보안, 진법 변환, CPU 구조, 개발 방법론, 신기술 용어는 이 노트에서 뺐다.\n\n## 1과목 프로그래밍 언어\n\n코드 출력 결과 문제가 핵심이다. 연산자 우선순위, 반복문 횟수, 배열 인덱스, 오버라이딩을 정확히 추적할 수 있어야 한다.\n\n### 1-1. 언어 분류\n\n| 분류 | 특징 | 예 |\n| --- | --- | --- |\n| 구조적(절차적) | 순차·선택·반복 3구조, goto 지양, 함수 단위 | C, Pascal |\n| 객체지향 | 클래스·객체 중심, 재사용성 | Java, C++, Python, C# |\n| 스크립트 | 인터프리터로 실행, 컴파일 불필요 | JavaScript, Python, PHP, Perl, Shell |\n| 선언형 | 무엇을 원하는지 기술 | SQL, HTML, Prolog, Haskell, LISP |\n\n- **컴파일러**: 전체를 미리 번역, 실행 빠름, 목적 프로그램 생성 (C, C++)\n- **인터프리터**: 한 줄씩 번역·실행, 디버깅 쉬움, 목적 프로그램 없음 (Python, JavaScript)\n- **Java**: 바이트코드(.class)로 컴파일 후 JVM이 실행 → 플랫폼 독립성\n- 번역 순서: 원시 프로그램 → 컴파일러 → 목적 프로그램 → 링커 → 로드 모듈 → 로더 → 실행\n\n### 1-2. 공통 문법\n\n**데이터 타입 크기 (C/Java)**\n\n| 타입 | C | Java |\n| --- | --- | --- |\n| char | 1바이트 | 2바이트(유니코드) |\n| short | 2 | 2 |\n| int | 4 | 4 |\n| long | 4 또는 8(환경별) | 8 |\n| float | 4 | 4 |\n| double | 8 | 8 |\n| boolean | 없음(0/1) | 1 |\n\n**연산자 우선순위** (높음 → 낮음)\n\n1. 단항: `++` `--` `!` `~` `sizeof` (오른쪽→왼쪽 결합)\n2. 산술: `*` `/` `%` → `+` `-`\n3. 시프트: `\u003c\u003c` `>>`\n4. 관계: `\u003c` `\u003c=` `>` `>=` → `==` `!=`\n5. 비트: `&` → `^` → `|`\n6. 논리: `&&` → `||`\n7. 조건(삼항): `? :`\n8. 대입: `=` `+=` `-=` 등 (오른쪽→왼쪽)\n9. 순서: `,`\n\n암기법: **단산시관비논조대순**\n\n**자주 틀리는 포인트**\n\n- `a++`는 값을 쓰고 나서 증가, `++a`는 증가 후 사용\n- 정수 나눗셈 `7/2 = 3`, `-7/2 = -3`(C/Java는 0 방향 버림), Python은 `7//2 = 3`, `-7//2 = -4`\n- `%`: Java·C는 부호가 왼쪽 피연산자를 따름(`-7%3 = -1`), Python은 오른쪽을 따름(`-7%3 = 2`)\n- `&&`, `||`는 단축 평가: 앞에서 결과가 정해지면 뒤는 실행 안 함\n- 비트: `5 & 3 = 1`, `5 | 3 = 7`, `5 ^ 3 = 6`, `~5 = -6`, `1 \u003c\u003c 3 = 8`, `16 >> 2 = 4`\n- `switch`에 `break`가 없으면 아래 case까지 계속 실행(fall-through)\n- `do-while`은 조건과 상관없이 최소 1번 실행\n- `continue`는 다음 반복으로, `break`는 반복 탈출\n\n### 1-3. C언어\n\n- 서식 문자: `%d` 정수, `%f` 실수, `%c` 문자, `%s` 문자열, `%x` 16진수, `%o` 8진수, `%p` 주소, `%5d` 5칸 오른쪽 정렬, `%.2f` 소수점 2자리\n- 입출력: `printf`, `scanf(\"%d\", &a)`(주소 전달), `getchar`, `putchar`, `gets`, `puts`\n- 기억 클래스: `auto`(지역, 기본), `register`(CPU 레지스터), `static`(함수 끝나도 값 유지), `extern`(다른 파일의 전역 변수)\n- 문자열 끝에는 `'\\0'`(널 문자)이 붙는다. `char s[] = \"abc\";`는 4바이트\n- 문자열 함수(`string.h`): `strlen`(길이, `\\0` 제외), `strcpy`, `strcat`, `strcmp`(같으면 0)\n- 포인터: `&a` = a의 주소, `*p` = p가 가리키는 값. `arr[i]` = `*(arr + i)`\n- 포인터 연산: `p + 1`은 자료형 크기만큼 이동(int면 4바이트)\n- 구조체: `struct`로 서로 다른 타입 묶음. 일반 변수는 `s.name`, 포인터는 `p->name`\n- 동적 할당: `malloc`(할당), `free`(해제), `calloc`(0으로 초기화)\n- 전처리기: `#include`, `#define`(매크로), `#ifdef`\n\n```c\nint a[5] = {1, 2, 3, 4, 5};\nint *p = a;\nprintf(\"%d\", *(p + 2) + p[4]); // 3 + 5 = 8\n```\n\n### 1-4. Java\n\n- 클래스 = 설계도, 객체(인스턴스) = `new`로 만든 실체\n- 생성자: 클래스 이름과 같고 반환형 없음. `this`는 자기 객체, `super`는 부모\n- 상속: `extends`(단일 상속만), 인터페이스는 `implements`(다중 구현 가능)\n- 자식 객체 생성 시 **부모 생성자가 먼저** 실행된다\n- 오버로딩: 같은 이름, 매개변수 개수·타입이 다름 (한 클래스 안)\n- 오버라이딩: 부모 메서드를 자식이 같은 시그니처로 재정의\n- `Parent p = new Child(); p.show();` → **자식의 show()** 실행(동적 바인딩). 단, static 메서드와 필드는 참조 타입(부모) 기준\n- 접근 제어자: `public`(전체) > `protected`(같은 패키지 + 자식) > `default`(같은 패키지) > `private`(같은 클래스)\n- `static`: 객체 없이 클래스명으로 접근, 모든 객체가 공유\n- `final`: 변수는 상수, 메서드는 오버라이딩 금지, 클래스는 상속 금지\n- 추상 클래스(`abstract`): 추상 메서드 포함 가능, 객체 생성 불가\n- 인터페이스: 모든 메서드가 기본적으로 추상, 변수는 `public static final`\n- 문자열: `==`는 주소 비교, `equals()`는 내용 비교. `String`은 불변 객체\n- 배열: `int[] a = new int[3];` 길이는 `a.length`, 문자열 길이는 `s.length()`\n- 배열·객체는 참조를 넘기므로 메서드 안에서 바꾸면 원본도 바뀜다\n\n```java\nclass A { void f() { System.out.print(\"A\"); } }\nclass B extends A { void f() { System.out.print(\"B\"); } }\nA x = new B(); x.f(); // B\n```\n\n### 1-5. Python\n\n- 동적 타이핑, 들여쓰기로 블록 구분, 세미콜론 불필요\n- 자료형: `list [ ]`(변경 가능), `tuple ( )`(변경 불가), `dict {k: v}`, `set { }`(중복 제거, 순서 없음)\n- 슬라이싱 `s[시작:끝:간격]`: 끝은 포함 안 함. `s[::-1]`은 뒤집기, `s[-1]`은 마지막\n- `range(1, 10, 2)` → 1, 3, 5, 7, 9 (10은 포함 안 함)\n- 리스트 메서드: `append`(끝에 추가), `insert(i, x)`, `extend`(리스트 이어 붙임), `remove(x)`(값 삭제), `pop()`(마지막 꺼냄), `sort`, `reverse`, `index`, `count`\n- 문자열: `split`, `join`, `upper`, `lower`, `replace`, `strip`, `find`\n- 연산자: `**` 거듭제곱, `//` 몫, `in` 포함 여부, `is` 같은 객체 여부, 논리는 `and` `or` `not`\n- 함수: `def`, 기본 매개변수, `lambda x: x * 2`, 여러 값 반환(튜플)\n- 클래스: `class`, 생성자 `__init__(self)`, 메서드 첫 매개변수는 `self`\n- `print(a, b, sep=\",\", end=\"\")`: sep은 구분자, end는 끝 문자(기본 줄바꿈)\n\n```python\na = [1, 2, 3, 4, 5]\nprint(a[1:4], a[::2], sum(a[-2:])) # [2, 3, 4] [1, 3, 5] 9\n```\n\n### 1-6. 객체지향 특징\n\n| 개념 | 의미 |\n| --- | --- |\n| 캡슐화 | 데이터와 함수를 묶고 외부에 숨김(정보 은닉) |\n| 상속 | 부모의 속성·메서드를 물려받음 |\n| 다형성 | 같은 메시지에 객체마다 다르게 반응(오버로딩·오버라이딩) |\n| 추상화 | 필요한 특징만 간추림 |\n| 메시지 | 객체에게 동작을 요청하는 것 |\n\n구성 요소: 클래스, 객체, 속성(attribute), 메서드, 메시지, 인스턴스.\n\n### 1-7. 웹 프로그래밍 (HTML·JavaScript)\n\n- HTML은 구조를 표시하는 마크업 언어. 주요 태그: `\u003chtml>` `\u003chead>` `\u003ctitle>` `\u003cbody>` `\u003ch1>~\u003ch6>` `\u003cp>` `\u003ca href>` `\u003cimg src alt>` `\u003ctable>\u003ctr>\u003ctd>` `\u003cul>\u003col>\u003cli>` `\u003cform>` `\u003cinput>` `\u003cdiv>` `\u003cspan>` `\u003cbr>`\n- `\u003cinput type>`: text, password, radio, checkbox, submit, button, file, hidden\n- `\u003cform method>`: GET(URL에 데이터 노출, 길이 제한) / POST(본문에 담음)\n- CSS는 스타일(색, 크기, 배치). 선택자: 태그 `p`, 클래스 `.name`, 아이디 `#name`\n- JavaScript는 브라우저에서 실행되는 스크립트 언어. 변수 `var`(함수 스코프), `let`(블록, 재할당 가능), `const`(재할당 불가)\n- JS `==`는 타입 변환 후 비교, `===`는 타입까지 비교 (`\"1\" == 1` true, `\"1\" === 1` false)\n- DOM: `document.getElementById()`, 이벤트 `onclick`, `onload`, `onchange`\n- 출력: `alert()`, `console.log()`, `document.write()`\n\n### 1-8. 예외 처리\n\n- 예외(Exception)는 실행 중 발생하는 오류. 프로그램이 멈추지 않게 처리한다\n- Java: `try { } catch (Exception e) { } finally { }` — finally는 예외 여부와 상관없이 항상 실행. 직접 발생 `throw`, 떠넘기기 `throws`\n- Python: `try / except / else / finally`, 직접 발생 `raise`. else는 예외가 없을 때만 실행\n- Java 주요 예외: `ArithmeticException`(0으로 나눔), `ArrayIndexOutOfBoundsException`, `NullPointerException`, `NumberFormatException`, `ClassCastException`\n- Python 주요 예외: `ZeroDivisionError`, `IndexError`, `KeyError`, `ValueError`, `TypeError`, `NameError`\n- Checked 예외(컴파일 시 처리 강제, IOException 등) vs Unchecked(RuntimeException 계열)\n\n### 1-9. 라이브러리\n\n- 라이브러리는 자주 쓰는 함수·클래스를 모아둔 것. 표준 라이브러리(기본 탑재) vs 외부 라이브러리(별도 설치)\n- C 헤더: `stdio.h`(입출력), `stdlib.h`(malloc, rand, atoi), `string.h`(문자열), `math.h`(수학), `time.h`(시간)\n- Java 패키지: `java.lang`(기본, 자동 import: String, Math, System), `java.util`(컨렉션: ArrayList, HashMap, Scanner), `java.io`(입출력), `java.net`(네트워크)\n- Python 모듈: `math`, `random`, `datetime`, `os`, `sys`, `re`(정규식), 가져오기는 `import`, `from ... import`\n- 프레임워크와 차이: 라이브러리는 개발자가 호출, 프레임워크는 틀이 개발자 코드를 호출(제어의 역전, IoC)\n\n## 2과목 응용SW 기초기술\n\n네트워크(OSI·IP·TCP/UDP), 데이터베이스 기초(모델링·E-R·무결성), 자료구조, UI/UX·CSS가 나온다. 서브넷 계산과 계층별 장비·프로토콜은 확실히 외우자.\n\n### 2-1. 네트워크\n\n**OSI 7계층** (아래부터: 물데네전세표응)\n\n| 계층 | 역할 | 단위 | 장비·프로토콜 |\n| --- | --- | --- | --- |\n| 7 응용 | 사용자 서비스 | 데이터 | HTTP, FTP, SMTP, DNS, Telnet |\n| 6 표현 | 코드 변환, 암호화, 압축 | 데이터 | JPEG, MPEG, ASCII |\n| 5 세션 | 연결 설정·유지·동기화(체크포인트) | 데이터 | NetBIOS, RPC |\n| 4 전송 | 종단 간 신뢰성, 흐름·오류 제어 | 세그먼트 | TCP, UDP |\n| 3 네트워크 | 경로 설정(라우팅), 논리 주소(IP) | 패킷 | 라우터, IP, ICMP, ARP |\n| 2 데이터 링크 | 인접 노드 간 전송, MAC 주소, 오류 검출 | 프레임 | 스위치, 브리지, Ethernet, HDLC |\n| 1 물리 | 비트를 전기 신호로 | 비트 | 리피터, 허브, 케이블 |\n\n**TCP/IP 4계층**: 응용(OSI 5\\~7) → 전송(4) → 인터넷(3) → 네트워크 액세스(1\\~2).\n\n- TCP: 연결형, 신뢰성(순서·재전송 보장), 3-way handshake(SYN → SYN+ACK → ACK)\n- UDP: 비연결형, 빠름, 신뢰성 낮음(스트리밍, DNS 조회)\n- ARP: IP → MAC 변환 / RARP: MAC → IP / ICMP: 오류 메시지(ping)\n- DHCP: IP 자동 할당 / DNS: 도메인 → IP / NAT: 사설 IP ↔ 공인 IP 변환\n- 포트 번호: FTP 20·21, SSH 22, Telnet 23, SMTP 25, DNS 53, HTTP 80, POP3 110, IMAP 143, HTTPS 443\n\n**IP 주소 (IPv4)**: 32비트, 8비트씩 4개를 점(.)으로 구분.\n\n| 클래스 | 첫 옥텋 범위 | 기본 서브넷 마스크 | 용도 |\n| --- | --- | --- | --- |\n| A | 0\\~127 | 255.0.0.0 (/8) | 대규모 |\n| B | 128\\~191 | 255.255.0.0 (/16) | 중규모 |\n| C | 192\\~223 | 255.255.255.0 (/24) | 소규모 |\n| D | 224\\~239 | 없음 | 멀티캐스트 |\n| E | 240\\~255 | 없음 | 연구용 |\n\n- 127.0.0.1 = 루프백(자기 자신)\n- 사설 IP: 10.0.0.0/8, 172.16.0.0\\~172.31.255.255, 192.168.0.0/16\n- 서브넷팅: /26 = 255.255.255.192 → 호스트 비트 6개 → 2⁶ = 64개 중 네트워크·브로드캐스트 주소 2개 빼고 **사용 가능 62개**\n- 예) 192.168.1.70/26 → 네트워크 192.168.1.64, 브로드캐스트 192.168.1.127\n- IPv6: 128비트, 16비트씩 8개를 콜론(:)으로 구분, 16진수 표기. 유니캐스트·멀티캐스트·애니캐스트 (브로드캐스트 없음), 보안(IPsec) 기본\n\n**네트워크 기타**\n\n- 토폴로지: 성형(중앙 허브), 버스형(한 케이블), 링형(원형), 트리형, 망형(모두 연결, n(n-1)/2개 회선)\n- 범위: LAN(근거리) \u003c MAN(도시) \u003c WAN(광역)\n- 전송 방식: 단방향(TV), 반이중(무전기), 전이중(전화)\n- 교환 방식: 회선 교환(전용 경로), 패킷 교환(가상 회선 / 데이터그램)\n- 오류 검출: 패리티, CRC, 해밍 코드(오류 정정까지 가능)\n\n### 2-2. 데이터베이스 기초\n\n- 데이터베이스: 통합·저장·운영·공용 데이터. DBMS 필수 기능은 정의·조작·제어\n- 데이터 모델링 3단계: 개념적(E-R 다이어그램, DBMS와 무관) → 논리적(테이블·키·정규화, 특정 데이터 모델에 맞춤) → 물리적(특정 DBMS의 저장 구조·인덱스·데이터 타입)\n- E-R 다이어그램 기호: 사각형 = 개체, 마름모 = 관계, 타원 = 속성, 밑줄 타원 = 기본키 속성, 이중 타원 = 다중값 속성\n- 관계 유형: 1:1, 1:N, N:M\n- DB 유형: 계층형(트리), 망형(그래프), 관계형(테이블, SQL), 객체지향형, NoSQL(키-값, 문서, 컬럼, 그래프)\n- 무결성: 개체(기본키 NULL·중복 불가), 참조(외래키는 참조 대상에 있거나 NULL), 도메인(허용 범위 안의 값) → 자세한 내용은 3-4\n\n### 2-3. 자료구조 기본\n\n| 구분 | 자료구조 | 특징 |\n| --- | --- | --- |\n| 선형 | 배열 | 같은 타입을 연속 저장, 인덱스로 바로 접근 |\n| 선형 | 연결 리스트 | 노드가 다음 노드 주소(포인터)를 가짐, 삽입·삭제 쉬움 |\n| 선형 | 스택 | 후입선출(LIFO), push·pop. 함수 호출, 되돌리기 |\n| 선형 | 큐 | 선입선출(FIFO), enqueue·dequeue. 작업 대기열 |\n| 선형 | 데크 | 양쪽 끝에서 삽입·삭제 |\n| 비선형 | 트리 | 계층 구조. 루트, 단말(리프), 차수, 깊이 |\n| 비선형 | 그래프 | 정점과 간선. 방향·무방향 |\n\n- 이진 트리 순회: 전위(루트-왼-오), 중위(왼-루트-오), 후위(왼-오-루트)\n- 스택 예) push A, B, C 후 pop → C / 큐 예) A, B, C 넣은 뒤 삭제 → A\n\n### 2-4. UI/UX와 화면 구현\n\n\n- UI 유형: CLI(명령어), GUI(그래픽), NUI(터치·음성 등 자연스러운 동작), OUI(사물 자체가 인터페이스)\n- UI 설계 원칙: 직관성(바로 알 수 있음), 유효성(목적 달성), 학습성(쉽게 배움), 유연성(실수 최소화)\n- 설계 도구: 와이어프레임(레이아웃 뼈대), 목업(실제와 비슷한 정적 화면), 스토리보드(화면 + 설명 + 흐름, 최종 산출물), 프로토타입(동적 견본), 유스케이스\n- UX: 사용자가 느끼는 경험. UI는 수단, UX는 경험 전체\n- UI 테스트: 사용성 테스트, 크로스 브라우징(여러 브라우저에서 동일하게 보이는지), 반응형 확인, 웹 접근성(장애인·고령자)\n- 표준: ISO/IEC 9126 → 25010 (품질 특성: 기능성, 신뢰성, 사용성, 효율성, 유지보수성, 이식성)\n- CSS 적용 방법: 인라인(`style=\"\"`), 내부(`\u003cstyle>`), 외부(`\u003clink rel=\"stylesheet\">`)\n- CSS 우선순위: 인라인 > 아이디(`#id`) > 클래스(`.class`) > 태그\n- 박스 모델: content → padding → border → margin\n\n## 3과목 SQL 활용\n\nSQL 문법 분류(DDL·DML·DCL)와 SELECT 결과 예측이 핵심이다. 정규화, 키, 무결성, 트랜잭션 성질은 용어 그대로 나온다.\n\n### 3-1. 데이터베이스 기초\n\n- 데이터베이스 정의: 통합된(중복 최소화), 저장된(보조기억장치), 운영(업무에 필수), 공용(여러 사용자 공유) 데이터\n- 특징: 실시간 접근, 계속적 변화, 동시 공유, 내용에 의한 참조\n- DBMS 필수 기능: 정의(Definition), 조작(Manipulation), 제어(Control)\n- 장점: 중복 최소화, 일관성·무결성·보안 유지, 데이터 독립성 / 단점: 비용, 백업·회복 복잡\n- 스키마 3단계: 외부(사용자별 관점, 서브 스키마) → 개념(전체 논리 구조, 기관 하나에 하나) → 내부(물리적 저장 구조)\n- 데이터 독립성: 논리적 독립성(개념 변경이 외부에 영향 없음), 물리적 독립성(내부 변경이 개념에 영향 없음)\n- 데이터 사전(시스템 카탈로그): DB 객체 정보를 담은 메타데이터. 사용자는 조회만 가능, 갱신은 DBMS가 자동으로\n- DBA(데이터베이스 관리자): 스키마 정의, 보안·권한, 백업·회복, 성능 관리\n\n### 3-2. 데이터베이스 설계\n\n- 순서: 요구 분석 → 개념적 설계(E-R 다이어그램, DBMS 독립) → 논리적 설계(테이블·정규화, 특정 데이터 모델 종속) → 물리적 설계(저장 구조·인덱스, 특정 DBMS 종속) → 구현\n- E-R 다이어그램 기호: 사각형=개체, 마름모=관계, 타원=속성, 밑줄 타원=기본키 속성, 이중 타원=다중값 속성, 선=연결\n- 관계 유형: 1:1, 1:N, N:M\n- 데이터 모델 종류: 계층형(트리), 망형(그래프), 관계형(테이블), 객체지향형\n- 데이터 모델 구성 3요소: 구조, 연산, 제약조건\n\n### 3-3. 관계형 모델 용어\n\n| 용어 | 뜻 | 테이블 용어 |\n| --- | --- | --- |\n| 릴레이션 | 표 전체 | 테이블 |\n| 튜플 | 한 행 | 행(레코드) |\n| 속성(attribute) | 한 열 | 열(컬럼) |\n| 도메인 | 속성이 가질 수 있는 값의 범위 | 데이터 타입·제약 |\n| 차수(Degree) | 속성의 개수 | 열 개수 |\n| 카디널리티(Cardinality) | 튜플의 개수 | 행 개수 |\n\n- 릴레이션 특징: 튜플 중복 없음, 튜플·속성 순서 없음, 속성값은 원자값(더 나눌 수 없음)\n- 예: 5열 10행 테이블 → 차수 5, 카디널리티 10\n\n### 3-4. 키와 무결성\n\n| 키 | 설명 |\n| --- | --- |\n| 후보키 | 튜플을 유일하게 식별. 유일성 + 최소성 |\n| 기본키(PK) | 후보키 중 선택한 하나. NULL·중복 불가 |\n| 대체키 | 기본키로 선택되지 않은 후보키 |\n| 슈퍼키 | 유일성만 만족(최소성 X) |\n| 외래키(FK) | 다른 테이블의 기본키를 참조하는 속성 |\n\n- 개체 무결성: 기본키는 NULL·중복 불가\n- 참조 무결성: 외래키 값은 참조 테이블의 기본키에 있거나 NULL\n- 도메인 무결성: 속성값은 정의된 도메인 범위 안에서\n- 참조 무결성 옵션: `CASCADE`(함께 삭제·변경), `SET NULL`, `RESTRICT`(참조 중이면 거부)\n\n### 3-5. 정규화와 이상\n\n- 이상(Anomaly): 중복 때문에 생기는 문제. 삽입 이상(불필요한 값도 함께 넣어야 함), 삭제 이상(필요한 값도 같이 지워짐), 갱신 이상(일부만 바뀌어 불일치)\n- 함수적 종속 X → Y: X 값이 정해지면 Y 값이 하나로 정해짐 (학번 → 이름)\n\n| 단계 | 조건 (암기: 도부이결다조) |\n| --- | --- |\n| 1NF | 모든 속성값이 원자값(반복·다중값 제거) |\n| 2NF | 부분 함수적 종속 제거(복합키 일부에만 종속된 속성 분리) |\n| 3NF | 이행적 종속 제거(A→B, B→C일 때 A→C 제거) |\n| BCNF | 모든 결정자가 후보키 |\n| 4NF | 다치 종속 제거 |\n| 5NF | 조인 종속 제거 |\n\n- 반정규화: 성능을 위해 일부러 중복을 허용하는 것(테이블 통합·분할, 중복 속성 추가)\n\n### 3-6. SQL 분류\n\n| 분류 | 명령어 | 용도 |\n| --- | --- | --- |\n| DDL(정의어) | CREATE, ALTER, DROP, TRUNCATE, RENAME | 테이블·뷰·인덱스 구조 정의 |\n| DML(조작어) | SELECT, INSERT, UPDATE, DELETE | 데이터 조회·변경 |\n| DCL(제어어) | GRANT, REVOKE | 권한 부여·회수 |\n| TCL(트랜잭션 제어) | COMMIT, ROLLBACK, SAVEPOINT | 트랜잭션 확정·취소 (DCL에 포함하기도 함) |\n\n**DDL**\n\n```sql\nCREATE TABLE 학생 (\n  학번 CHAR(8) PRIMARY KEY,\n  이름 VARCHAR(20) NOT NULL,\n  학과코드 CHAR(3) REFERENCES 학과(코드),\n  학년 INT CHECK (학년 BETWEEN 1 AND 4)\n);\nALTER TABLE 학생 ADD 전화 VARCHAR(15);\nDROP TABLE 학생 CASCADE;\n```\n\n- 제약조건: `PRIMARY KEY`, `FOREIGN KEY ... REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`\n- `DROP`(구조까지 삭제) vs `TRUNCATE`(구조는 남기고 데이터만 전부 삭제) vs `DELETE`(DML, 조건별 삭제, 롤백 가능)\n- `CASCADE`는 참조하는 것까지 함께, `RESTRICT`는 참조 중이면 거부\n- 뷰(VIEW): 가상 테이블. `CREATE VIEW`로 만들고 ALTER로는 수정 불가(DROP 후 재생성). 보안·논리적 독립성 제공, 삽입·수정에 제약\n- 인덱스: 검색 속도 향상, `CREATE [UNIQUE] INDEX 이름 ON 테이블(열)`. 삽입·수정이 잦으면 오히려 느려짐\n\n**DML**\n\n```sql\nINSERT INTO 학생 (학번, 이름) VALUES ('20260001', '김철수');\nUPDATE 학생 SET 학년 = 2 WHERE 학번 = '20260001';\nDELETE FROM 학생 WHERE 학년 = 4;\n```\n\n- `UPDATE`·`DELETE`에 WHERE가 없으면 **전체 행**에 적용\n- 키워드 짝: INSERT **INTO** \\~ **VALUES** / UPDATE \\~ **SET** / DELETE **FROM**\n\n**SELECT 구조와 실행 순서**\n\n```sql\nSELECT 학과, COUNT(*) AS 인원, AVG(점수)\nFROM 학생\nWHERE 학년 >= 2\nGROUP BY 학과\nHAVING COUNT(*) >= 3\nORDER BY 인원 DESC;\n```\n\n실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.\n\n- `DISTINCT`: 중복 제거 / `*`: 모든 열 / `AS`: 별칭\n- 비교: `=`, `\u003c>`(같지 않음), `BETWEEN a AND b`(양끝 포함), `IN (…)`, `IS NULL`(`= NULL`은 틀린 문법)\n- `LIKE`: `%`는 0글자 이상, `_`는 정확히 1글자. `'김%'`=김으로 시작, `'_민%'`=둘째 글자가 민\n- 집계 함수: `COUNT`, `SUM`, `AVG`, `MAX`, `MIN`. NULL은 계산에서 제외(단 `COUNT(*)`는 NULL 행도 셈)\n- WHERE는 행 조건(집계 함수 못 씀), HAVING은 그룹 조건(집계 함수 사용)\n- `ORDER BY`: 기본 ASC(오름차순), DESC는 내림차순\n- 하위 질의: `WHERE 점수 > (SELECT AVG(점수) FROM 학생)`, `IN`, `EXISTS`, `ANY`, `ALL`\n- 집합 연산: `UNION`(합집합, 중복 제거), `UNION ALL`(중복 포함), `INTERSECT`(교집합), `EXCEPT`/`MINUS`(차집합)\n\n**조인**\n\n```sql\nSELECT s.이름, d.학과명\nFROM 학생 s INNER JOIN 학과 d ON s.학과코드 = d.코드;\n```\n\n- INNER JOIN: 양쪽에 모두 있는 행만\n- LEFT OUTER JOIN: 왼쪽은 전부, 오른쪽은 없으면 NULL (RIGHT는 반대, FULL은 양쪽 전부)\n- CROSS JOIN: 카티션 곱(행 수 = m × n)\n- SELF JOIN: 같은 테이블끼리(직원-관리자)\n- 자연 조인(NATURAL JOIN): 같은 이름의 열로 자동 조인, 중복 열 제거\n\n**DCL**\n\n```sql\nGRANT SELECT, UPDATE ON 학생 TO user1 WITH GRANT OPTION;\nREVOKE UPDATE ON 학생 FROM user1 CASCADE;\n```\n\n- `WITH GRANT OPTION`: 받은 권한을 다른 사용자에게도 나눠줄 수 있음\n- 짝: GRANT \\~ **TO** / REVOKE \\~ **FROM**\n\n### 3-7. 시스템 카탈로그와 집합 연산자\n\n- 시스템 카탈로그(데이터 사전): 테이블·컬럼·인덱스·뷰·사용자·권한 같은 DB 객체 정보를 담은 메타데이터. DBMS가 자동으로 갱신하고 사용자는 조회(SELECT)만 한다\n- 조회 예: Oracle `USER_TABLES`(내 테이블), `USER_TAB_COLUMNS`(컬럼), `USER_INDEXES`, `USER_VIEWS` / MySQL `information_schema.TABLES`, `DESC 테이블명`(구조)\n\n| 집합 연산자 | 결과 |\n| --- | --- |\n| UNION | 합집합, 중복 행은 한 번만 |\n| UNION ALL | 합집합, 중복 포함 |\n| INTERSECT | 교집합 |\n| EXCEPT (Oracle은 MINUS) | 차집합 |\n\n- 두 SELECT의 컬럼 개수와 데이터 타입이 맞아야 한다. ORDER BY는 맨 마지막에 한 번만\n\n### 3-8. 트랜잭션과 회복\n\n- 트랜잭션: 하나의 논리적 작업 단위(계좌 이체 = 출금 + 입금)\n\n| ACID | 의미 |\n| --- | --- |\n| 원자성(Atomicity) | 전부 실행되거나 전혀 안 되거나 (Commit/Rollback) |\n| 일관성(Consistency) | 실행 후에도 DB가 일관된 상태 유지 |\n| 독립성(Isolation) | 실행 중인 트랜잭션에 다른 트랜잭션이 끼어들 수 없음 |\n| 영속성(Durability) | 커밋된 결과는 영구 반영 |\n\n- 상태: 활동 → 부분 완료 → 완료(커밋) / 실패 → 철회(롤백)\n- 회복 기법: 즉시 갱신(Undo + Redo), 지연 갱신(Redo만), 체크포인트, 그림자 페이지(Undo 불필요)\n- Redo = 로그로 다시 실행(커밋된 것), Undo = 취소(커밋 안 된 것)\n- 병행 제어: 로킹(Locking, 로킹 단위가 크면 병행성↓ 오버헤드↓), 2단계 로킹(확장 → 축소), 타임스탬프, 낸관적 기법(검증)\n- 병행 제어 실패 문제: 갱신 분실, 현황 파악 오류, 모순성, 연쇄 복귀\n\n### 3-9. 절차형 SQL\n\n- 프로시저: 일련의 SQL을 저장해 호출, 반환값 없을 수 있음 (`CALL`/`EXECUTE`)\n- 사용자 정의 함수: 반드시 값 1개 반환(`RETURN`)\n- 트리거: INSERT·UPDATE·DELETE 같은 이벤트가 발생하면 자동 실행. 트리거 안에서는 COMMIT/ROLLBACK 불가\n- 커서: 여러 행 결과를 한 행씩 처리(OPEN → FETCH → CLOSE)\n\n## 4과목 정보시스템 기초기술\n\n테스트·디버깅, DevOps·CI/CD, 운영체제와 명령어, 개발환경, 백업·복원, 형상관리가 나온다.\n\n### 4-1. 애플리케이션 테스트와 디버깅\n\n\n- 테스트 원리: 결함 존재 증명(없음은 증명 못 함), 완벽한 테스트 불가능, 결함 집중(파레토 80:20), 살충제 패러독스(같은 테스트 반복하면 결함 못 찾음), 오류-부재의 궁식, 정황 의존성, 조기 테스트\n- 검증(Verification): 제품을 올바르게 만들었나(개발자 관점) / 확인(Validation): 올바른 제품을 만들었나(사용자 관점)\n- 정적 테스트(실행 안 함: 동료 검토, 워크스루, 인스펙션) / 동적 테스트(실행함: 화이트박스, 블랙박스)\n\n| 구분 | 화이트박스 | 블랙박스 |\n| --- | --- | --- |\n| 관점 | 내부 구조·로직 | 기능·명세(입출력) |\n| 기법 | 기초 경로, 제어 구조(조건·루프·데이터 흐름), 커버리지(구문·결정·조건·MC/DC) | 동치 분할, 경계값 분석, 원인-효과 그래프, 오류 예측, 비교 |\n\n- 순환 복잡도(McCabe) V(G) = 간선 수 − 노드 수 + 2 (또는 영역 수 + 1 또는 조건 수 + 1)\n- 테스트 레벨(V-모델): 단위(모듈) → 통합(인터페이스) → 시스템(전체 기능·성능) → 인수(사용자 요구사항)\n- 인수 테스트: 알파(개발자 장소에서 사용자가) / 베타(사용자 환경에서 여러 사용자가)\n- 통합 테스트: 하향식(상위부터, **스텁** 필요) / 상향식(하위부터, **드라이버** 필요) / 빅뱅(한꺼번에)\n- 회귀 테스트: 수정 후 다른 부분에 새 오류가 없는지 다시 확인\n- 테스트 오라클: 기대 결과를 판단하는 기준(참, 샘플링, 휴리스틱, 일관성 검사)\n- 테스트 케이스 구성: 식별자, 테스트 항목, 입력 데이터, 예상 결과, 테스트 환경, 전제 조건\n- 경계값 예: 입력 1\\~100이 유효하면 0, 1, 100, 101을 테스트한다\n- 디버깅: 오류의 원인을 찾아 고치는 과정. 중단점(Breakpoint)으로 실행을 멈추고, 한 줄씩 실행(Step Over/Into)하며 변수 값을 확인(Watch)한다\n- 로그 출력(`print`, `console.log`)으로 실행 흐름과 값을 확인하는 것도 디버깅 방법이다\n\n### 4-2. 애플리케이션 배포 (DevOps·CI/CD)\n\n- DevOps: 개발(Development)과 운영(Operations)을 통합해 협업과 자동화로 빠르고 안정적으로 배포하는 문화·방법\n- CI(지속적 통합): 코드를 공유 저장소에 자주 합치고 그때마다 자동 빌드·테스트\n- CD(지속적 전달·배포): 테스트를 통과한 결과물을 배포 가능한 상태로 유지하거나(전달) 운영 환경까지 자동 배포(배포)\n- 파이프라인: 코드 커밋 → 빌드 → 테스트 → 배포\n- 도구: Jenkins(CI 서버), GitHub Actions, GitLab CI, Docker(컨테이너), Kubernetes(컨테이너 운영)\n\n### 4-3. 운영체제 기초 활용\n\n\n- 운영체제(OS)는 하드웨어와 사용자 사이의 인터페이스. 자원(CPU, 메모리, 입출력, 파일) 관리\n- 성능 평가 기준: 처리 능력(Throughput) ↑, 반환 시간(Turnaround Time) ↓, 사용 가능도(Availability) ↑, 신뢰도(Reliability) ↑\n- 구성: 제어 프로그램(감시, 작업 관리, 데이터 관리) + 처리 프로그램(언어 번역, 서비스, 문제)\n- 커널: OS의 핵심, 항상 메모리에 상주. 셸(Shell): 사용자 명령을 해석하는 명령어 해석기\n\n**운영 방식**\n\n| 방식 | 특징 |\n| --- | --- |\n| 일괄 처리 | 일정량·기간 모아서 한 번에 처리(급여 계산) |\n| 실시간 | 요청 즉시 처리(예약, 은행) |\n| 시분할 | CPU 시간을 쪼개 여러 사용자가 번갈아 사용 |\n| 다중 프로그래밍 | 여러 프로그램을 메모리에 올려 CPU 1개로 번갈아 실행 |\n| 다중 처리 | CPU 여러 개로 동시에 처리 |\n| 분산 처리 | 네트워크로 연결된 여러 컴퓨터가 나눠 처리 |\n\n발달 순서: 일괄 → 실시간 → 다중 프로그래밍·시분할·다중 처리 → 분산 처리.\n\n**프로세스·메모리 기본 개념** (출제기준 '운영체제 개념'에 해당, 계산 문제보다 용어 위주로)\n\n- 프로세스 = 실행 중인 프로그램, 스레드 = 프로세스 안의 실행 단위\n- 프로세스 상태: 생성 → 준비 → 실행 → 대기 → 종료\n- 교착 상태 4조건: 상호 배제, 점유와 대기, 비선점, 환형 대기\n- 가상 기억장치: 페이징(같은 크기), 세그먼테이션(논리 단위). 스래싱은 페이지 교체가 지나치게 잦은 현상\n\n**운영체제 종류**\n\n| 종류 | 특징 |\n| --- | --- |\n| Windows | 마이크로소프트, GUI 중심, PC에서 가장 많이 씀 |\n| Linux | 오픈소스 커널, 서버에서 많이 씀(Ubuntu, CentOS 등) |\n| UNIX | 다중 사용자·다중 작업, 대부분 C로 작성 |\n| macOS / iOS | 애플 운영체제 |\n| Android | 리눅스 커널 기반 모바일 OS |\n\n\n- 구성: 커널(프로세스·메모리·파일 관리), 셸(명령어 해석: sh, bash, csh, ksh), 유틸리티\n- 특징: 다중 사용자·다중 작업, 대부분 C로 작성(이식성 높음), 트리 구조 파일 시스템, 대소문자 구분\n- 디렉터리: `/`(루트), `/bin`(기본 명령어), `/etc`(설정 파일), `/home`(사용자), `/dev`(장치), `/tmp`(임시), `/var`(로그)\n- inode: 파일의 소유자, 크기, 권한, 위치 등 정보를 담은 구조체 (파일 이름은 없음)\n\n| 명령어 | 기능 |\n| --- | --- |\n| `ls` | 목록 보기 (`-l` 자세히, `-a` 숨김 파일) |\n| `cd` / `pwd` | 디렉터리 이동 / 현재 경로 |\n| `mkdir` / `rmdir` | 디렉터리 생성 / 빈 디렉터리 삭제 |\n| `cp` / `mv` / `rm` | 복사 / 이동·이름 변경 / 삭제 (`rm -r` 하위 포함) |\n| `cat` | 파일 내용 출력 |\n| `more` / `less` / `head` / `tail` | 화면 단위 출력 / 앞부분 / 끝부분 |\n| `chmod` | 권한 변경 |\n| `chown` / `chgrp` | 소유자 / 그룹 변경 |\n| `ps` / `kill` | 프로세스 보기 / 종료 |\n| `grep` | 파일에서 문자열 찾기 |\n| `find` | 파일 찾기 |\n| `fork` / `exec` | 자식 프로세스 복제 / 새 프로그램 실행 |\n| `mount` / `umount` | 파일 시스템 연결 / 해제 |\n| `tar` / `gzip` | 묶기 / 압축 |\n| `man` | 도움말 |\n| `who` / `whoami` | 접속자 / 현재 사용자 |\n| `ifconfig` / `ping` | 네트워크 설정 / 연결 확인 |\n\n**권한 (chmod)**: `-rwxr-xr--` = 소유자(rwx=7) 그룹(r-x=5) 기타(r--=4) → `chmod 754 file`. r=4, w=2, x=1. 예) `chmod 644` = rw-r--r--.\n\n**리다이렉션·파이프**: `>` 덮어쓰기, `>>` 이어쓰기, `\u003c` 입력, `|` 앞 명령 결과를 다음 명령 입력으로 (`ls | grep txt`).\n\n**Windows 대응 명령어**: `dir`(=ls), `copy`(=cp), `del`(=rm), `type`(=cat), `cls`(화면 지움), `ipconfig`(=ifconfig), `attrib`(속성 변경).\n\n### 4-4. 개발환경 구축\n\n- 하드웨어 환경: 클라이언트(PC, 모바일) + 서버(웹 서버, WAS, DB 서버, 파일 서버)\n- 웹 서버: 정적 콘텐츠(HTML, 이미지) 처리 — Apache, Nginx, IIS\n- WAS: 동적 콘텐츠·비즈니스 로직 처리 — Tomcat, JBoss, WebLogic, JEUS\n- DB 서버: Oracle, MySQL, MariaDB, MS-SQL, PostgreSQL\n- 소프트웨어 환경: 시스템 SW(OS, DBMS, JVM) + 개발 SW(요구사항 관리, 설계·모델링, 구현, 테스트, 형상관리, 빌드 도구)\n- IDE(통합 개발 환경): 편집·컴파일·디버깅을 한 곳에서 — Eclipse, IntelliJ, Visual Studio, VS Code\n- 빌드 도구: Ant(XML, 규칙 없음), Maven(pom.xml, 의존성 관리), Gradle(Groovy/Kotlin 스크립트, 안드로이드 기본), Jenkins(CI 서버)\n- 미들웨어: OS와 응용 프로그램 사이에서 통신·연결을 담당 — RPC, MOM(메시지 지향), TP-Monitor(트랜잭션 처리), ORB(객체), WAS\n- 가상화·컨테이너: VM(하이퍼바이저 위에 OS 통째로), Docker(OS 커널 공유, 가벼움), Kubernetes(컨테이너 오케스트레이션)\n\n### 4-5. 개발 환경 백업 및 복원\n\n| 백업 종류 | 저장 대상 | 복원에 필요한 것 |\n| --- | --- | --- |\n| 전체 백업 | 모든 데이터 | 전체 백업 1개 |\n| 차등 백업 | 마지막 전체 백업 이후 바뀐 것 전부(누적) | 전체 + 가장 최근 차등 1개 |\n| 증분 백업 | 직전 백업(전체·증분) 이후 바뀐 것만 | 전체 + 그 뒤 모든 증분 |\n\n- 백업 속도·용량: 증분이 가장 빠르고 작다. 복원 속도: 전체 > 차등 > 증분\n- 백업 용량 산정 예: 전체 100GB, 하루 변경 10GB, 일요일 전체 + 6일 증분 → 100 + 10 × 6 = 160GB. 6일 차등이면 10 + 20 + … + 60 = 210GB를 더해 310GB\n- 백업 시스템: 테이프, 디스크(NAS·SAN), 클라우드. 원본과 다른 장소에 보관(원격지 백업)\n- 복원 목표: RTO(복구까지 걸리는 시간), RPO(복구 시점, 데이터 손실 허용 범위)\n\n### 4-6. 소스코드 형상관리\n\n\n- 형상관리(SCM): 개발 과정의 변경 사항을 관리·통제. 절차: 식별 → 통제 → 감사 → 기록(보고)\n- 버전 관리 방식: 공유 폴더(RCS, SCCS), 클라이언트/서버(CVS, SVN), 분산 저장소(Git, Mercurial, Bitkeeper)\n- 용어: 저장소(Repository), 체크아웃(받기), 커밋(올리기), 임포트(최초 등록), 동기화(Update), 브랜치, 병합(Merge), 충돌(Conflict), 베이스라인(기준선)\n- Git 명령어: `init`(생성), `clone`(복제), `add`(스테이징), `commit`(로컬 저장), `push`(원격 업로드), `pull`(원격 가져와 병합), `fetch`(가져오기만), `branch`, `checkout`/`switch`, `merge`, `status`, `log`\n- Git 영역: 작업 디렉터리 → (add) → 스테이징 영역 → (commit) → 로컬 저장소 → (push) → 원격 저장소\n- CI/CD: 지속적 통합(코드를 자주 합치고 자동 빌드·테스트), 지속적 배포(자동으로 운영 환경에 배포)\n- 패키징: 사용자 중심, 모듈화, 다양한 환경 고려. 작업 순서: 기능 식별 → 모듈화 → 빌드 진행 → 사용자 환경 분석 → 패키징 및 변경 개선 → 배포\n- 릴리즈 노트: 버전, 추가·수정 기능, 버그 수정 내용을 사용자에게 알리는 문서 (헤더, 개요, 목적, 이슈 요약, 재현 항목, 수정/개선, 면책 조항)\n- 배포 도구: 빌드 도구(Maven, Gradle), 형상관리(Git), 패키징 도구, CI 도구(Jenkins)\n\n## 시험 직전 암기 체크리스트\n\n시험 전날 이 목록만 다시 보고, 설명 못 하는 항목은 위 본문으로 돌아가자.\n\n- [ ] 연산자 우선순위: 단산시관비논조대순\n- [ ] `a++` vs `++a`, 정수 나눗셈·`%` 부호 (C/Java vs Python)\n- [ ] C 포인터 `*(p+i)` = `p[i]`, 문자열 끝 `\\0`\n- [ ] Java 오버라이딩 → 자식 메서드 실행(동적 바인딩), 부모 생성자 먼저\n- [ ] 접근 제어자 4종 범위, 추상 클래스 vs 인터페이스\n- [ ] Python 슬라이싱·`range` 끝값 미포함\n- [ ] 컴파일러 vs 인터프리터\n- [ ] HTML 태그, CSS 선택자·우선순위, JS `==` vs `===`\n- [ ] OSI 7계층: 물데네전세표응 + 계층별 장비·프로토콜\n- [ ] TCP vs UDP, ARP/ICMP/DHCP/DNS, 주요 포트 번호\n- [ ] IP 클래스 범위, 서브넷 호스트 수 = 2ⁿ − 2\n- [ ] 데이터 모델링 3단계, E-R 기호\n- [ ] 스택(LIFO) vs 큐(FIFO), 트리 용어와 순회\n- [ ] 키 5종, 무결성 3종, 정규화: 도부이결다조\n- [ ] SQL 분류(DDL·DML·DCL·TCL), SELECT 실행 순서, WHERE vs HAVING\n- [ ] UNION vs UNION ALL vs INTERSECT vs EXCEPT, 조인 종류\n- [ ] DROP vs TRUNCATE vs DELETE, ACID\n- [ ] 단위→통합→시스템→인수, 블랙박스 vs 화이트박스, 스텁 vs 드라이버\n- [ ] 구문·결정·조건 커버리지, 디버깅 중단점\n- [ ] DevOps, CI vs CD, Jenkins\n- [ ] 커널 vs 셸, OS 종류, Linux 명령어와 `chmod` 숫자\n- [ ] 웹 서버 vs WAS, 빌드 도구(Maven·Gradle)\n- [ ] 전체·차등·증분 백업과 복원에 필요한 것, 백업 용량 계산\n- [ ] Git 흐름(add → commit → push), 형상관리 절차\n"},
  ps:{name:"프로그래밍기능사 실기",tag:"실기",color:"#7a4fd6",subj:["Python","Java","C","SQL","Linux·경로"],limit:5400,mockN:[3,3,2,5,2],rule:"60점 이상",pass:sc=>sc>=60,Q:[{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"a = [1, 2, 3]\nb = a\nb.append(4)\nprint(len(a))","a":["4"],"e":"b = a는 같은 리스트를 가리킨다. b에 추가하면 a도 길이 4."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"s = \"abcdef\"\nprint(s[::-2])","a":["fdb"],"e":"끝에서부터 2칸씩: f, d, b."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"print([x * x for x in range(5) if x % 2 == 0])","a":["[0, 4, 16]","[0,4,16]"],"e":"0, 2, 4의 제곱 → [0, 4, 16]."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"def f(n):\n    return n if n < 2 else f(n - 1) + f(n - 2)\n\nprint(f(6))","a":["8"],"e":"피보나치: 0, 1, 1, 2, 3, 5, 8 → f(6) = 8."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오. (end=\" \"이므로 값 사이에 공백 하나)","c":"class Node:\n    def __init__(self, key):\n        self.key = key\n        self.left = None\n        self.right = None\n\ndef visit(n):\n    if n:\n        print(n.key, end=\" \")\n        visit(n.left)\n        visit(n.right)\n\nroot = Node(1)\nroot.left = Node(2)\nroot.right = Node(3)\nroot.left.left = Node(4)\nroot.left.right = Node(5)\nvisit(root)","a":["1 2 4 5 3"],"e":"자기 자신을 먼저 출력하고 왼쪽, 오른쪽 순으로 방문하는 전위 순회. 1 → 2 → 4 → 5 → 3. 출력을 왼쪽 방문과 오른쪽 방문 사이에 두면 중위 순회(4 2 5 1 3), 맨 뒤에 두면 후위 순회(4 5 2 3 1)."},{"s":0,"t":"sa","q":"딕셔너리 d의 key만 모아 리스트로 만들려고 한다. 빈칸 ①에 들어갈 메서드 이름을 쓰시오.","c":"d = {\"a\": 1, \"b\": 2}\nprint(list(d.( ① )()))","a":["keys","keys()"],"e":"keys()는 키, values()는 값, items()는 (키, 값) 쌍을 돌려준다."},{"s":0,"t":"sa","q":"다음 Python 프로그램을 실행하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  def total(nums):\n2      s = 0\n3      for n in nums:\n4          s += n\n5  return s\n6\n7  print(total([1, 2, 3]))","a":["5"],"e":"5번 줄 return이 함수 안으로 들여쓰기되지 않아 함수 밖 return이 되어 SyntaxError가 난다."},{"s":0,"t":"sa","q":"다음은 return 줄의 들여쓰기 오류를 고친 프로그램이다. 실행 결과를 쓰시오.","c":"def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s\n\nprint(total([1, 2, 3]))","a":["6"],"e":"1 + 2 + 3 = 6."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"String s = \"Hello\";\nSystem.out.print(s.length() + s.charAt(0));","a":["77"],"e":"int + char는 숫자 덧셈이다. 5 + 'H'(72) = 77. 문자열 연결이 아니다."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"class C {\n    static int cnt = 0;\n    C() { cnt++; }\n}\n// main\nnew C(); new C(); new C();\nSystem.out.print(C.cnt);","a":["3"],"e":"static 변수는 모든 객체가 공유한다. 생성자가 3번 실행돼 3."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int x = 5;\nx += x++ + ++x;\nSystem.out.print(x);","a":["17"],"e":"x += 식 은 x = 5 + (x++ + ++x). x++는 5(이후 x=6), ++x는 7. 5 + 12 = 17."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"try {\n    int a = 10 / 0;\n    System.out.print(\"A\");\n} catch (ArithmeticException e) {\n    System.out.print(\"B\");\n} finally {\n    System.out.print(\"C\");\n}","a":["BC"],"e":"0으로 나눠 예외가 나서 A는 건너뛰고 B, 이어서 finally의 C."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"String a = \"Hi\";\nString b = new String(\"Hi\");\nSystem.out.print((a == b) + \" \" + a.equals(b));","a":["false true"],"e":"new로 만든 문자열은 다른 객체라 ==(참조 비교)는 false, equals(내용 비교)는 true."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"class A {\n    A() { System.out.print(\"1\"); }\n    A(int x) { this(); System.out.print(\"2\"); }\n}\nclass B extends A {\n    B() { super(5); System.out.print(\"3\"); }\n}\n// main\nnew B();","a":["123"],"e":"B() → super(5)로 A(int) 호출 → this()로 A() 호출해 1 → A(int) 나머지 2 → B() 나머지 3."},{"s":1,"t":"sa","q":"인터페이스 Shape을 Circle 클래스가 구현하려고 한다. 빈칸 ①에 들어갈 키워드를 한 단어로 쓰시오.","c":"interface Shape {\n    double area();\n}\n\nclass Circle ( ① ) Shape {\n    double r = 2;\n    public double area() { return 3.14 * r * r; }\n}","a":["implements"],"e":"인터페이스 구현은 implements, 클래스 상속은 extends."},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int x = 7, y = 3;\nprintf(\"%d %d\", x / y, x % y);","a":["2 1"],"e":"정수 나눗셈 7/3 = 2, 나머지 7%3 = 1."},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int a[5] = {5, 3, 8, 1, 4};\nint max = a[0];\nfor (int i = 1; i < 5; i++)\n    if (a[i] > max) max = a[i];\nprintf(\"%d\", max);","a":["8"],"e":"배열을 돌며 더 큰 값으로 바꾼다. 최댓값은 8."},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오. (string.h 포함)","c":"char s[] = \"HELLO\";\nprintf(\"%d %c\", (int)strlen(s), s[1]);","a":["5 E"],"e":"strlen은 널 문자를 빼고 5. s[1]은 두 번째 글자 E."},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int a = 10, *p = &a;\n*p += 5;\nprintf(\"%d\", a);","a":["15"],"e":"p가 a를 가리키므로 *p += 5는 a를 15로 바꾼다."},{"s":3,"t":"sa","q":"[학생] 테이블을 점수가 높은 순으로 정렬하려고 한다. 빈칸에 알맞은 키워드를 쓰시오.","c":"SELECT * FROM 학생 ORDER BY 점수 (    );","a":["DESC"],"e":"내림차순은 DESC, 오름차순은 ASC(기본값)."},{"s":3,"t":"sa","q":"학과별 평균 점수가 80 이상인 학과만 조회하려고 한다. 빈칸에 알맞은 키워드를 쓰시오.","c":"SELECT 학과, AVG(점수) FROM 학생\nGROUP BY 학과\n(    ) AVG(점수) >= 80;","a":["HAVING"],"e":"그룹에 거는 조건은 HAVING."},{"s":3,"t":"sa","q":"user1에게 준 [학생] 테이블의 UPDATE 권한을 회수하려고 한다. 빈칸에 알맞은 명령어를 쓰시오.","c":"(    ) UPDATE ON 학생 FROM user1;","a":["REVOKE"],"e":"권한 회수는 REVOKE ~ FROM, 부여는 GRANT ~ TO."},{"s":3,"t":"sa","q":"[member] 테이블에서 성이 '김'이고 이름 전체가 정확히 세 글자인 사람을 찾으려고 한다. 빈칸 ①에 들어갈 패턴을 쓰시오.","c":"SELECT * FROM member WHERE name LIKE '( ① )';","a":["김__"],"e":"_는 정확히 한 글자, %는 0글자 이상. 김 + 두 글자 = '김__'."},{"s":3,"t":"sa","q":"[score] 테이블의 구조는 남기고 데이터만 모두 삭제하는 SQL을, 키워드 2개와 테이블 이름(score)만 사용해 쓰시오.","a":["TRUNCATE TABLE score","TRUNCATE TABLE score;"],"e":"TRUNCATE TABLE은 구조를 남기고 모든 행을 지운다. DROP TABLE은 구조까지 삭제하고, CASCADE를 붙이면 참조하는 제약 조건까지 함께 삭제한다."},{"s":3,"t":"sa","q":"다음 SQL을 실행한 결과 ans의 값을 쓰시오.<table><tr><th colspan=\"2\">t1</th><th></th><th colspan=\"2\">t2</th></tr><tr><th>c1</th><th>c2</th><th></th><th>c1</th><th>c2</th></tr><tr><td>A</td><td>1</td><td></td><td>A</td><td>4</td></tr><tr><td>B</td><td>2</td><td></td><td>B</td><td>1</td></tr><tr><td>C</td><td>3</td><td></td><td>E</td><td>6</td></tr><tr><td></td><td></td><td></td><td>F</td><td>2</td></tr></table>","c":"SELECT SUM(c2) AS ans\nFROM t2\nWHERE c1 IN (SELECT c1 FROM t1);","a":["5"],"e":"t1의 c1은 A, B, C. t2에서 c1이 그 안에 있는 행은 A(4), B(1) → 4 + 1 = 5. NOT IN이었다면 E(6), F(2) → 8."},{"s":4,"t":"sa","q":"현재 작업 디렉터리의 절대 경로가 /home/kim/project일 때, 상대 경로 \"../docs/a.txt\"의 절대 경로를 쓰시오.","a":["/home/kim/docs/a.txt"],"e":"..은 상위 디렉터리(/home/kim)로 올라간다. 거기서 docs/a.txt → /home/kim/docs/a.txt."},{"s":4,"t":"sa","q":"현재 작업 디렉터리의 절대 경로가 /var/log일 때, 상대 경로 \"./app/../sys\"의 절대 경로를 쓰시오.","a":["/var/log/sys","/var/log/sys/"],"e":".은 현재 디렉터리, app으로 들어갔다가 ..으로 다시 나온 뒤 sys → /var/log/sys."},{"s":4,"t":"sa","q":"Linux에서 파일 file.txt의 권한을 rw-r--r--로 바꾸려고 한다. 빈칸에 알맞은 숫자를 쓰시오.","c":"chmod (    ) file.txt","a":["644"],"e":"rw- = 6, r-- = 4, r-- = 4."},{"s":4,"t":"sa","q":"Linux에서 파일 안에서 특정 문자열이 들어 있는 줄만 찾아 출력하는 명령어를 쓰시오.","a":["grep"],"e":"grep 문자열 파일명. 예) grep error log.txt"},{"s":4,"t":"sa","q":"Linux 터미널에서 환경 변수를 설정해 하위 프로세스에서도 쓸 수 있게 하는 명령어를 쓰시오. (예: ( ) PATH=$PATH:/opt/bin)","a":["export"],"e":"export. 설정된 값을 확인할 때는 echo $PATH."},{"s":3,"t":"sa","q":"Oracle에서 현재 사용자가 소유한 테이블 목록을 조회하려고 한다. 빈칸 ①에 들어갈 데이터 사전 뷰 이름을 쓰시오.","c":"SELECT table_name FROM ( ① );","a":["USER_TABLES"],"e":"USER_TABLES는 내 테이블, ALL_TABLES는 접근 가능한 테이블, DBA_TABLES는 전체 테이블. 컬럼은 USER_TAB_COLUMNS, 인덱스는 USER_INDEXES, 뷰는 USER_VIEWS."},{"s":3,"t":"sa","q":"조회 속도를 높이려고 student 테이블의 name 컬럼에 idx_name을 만들려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"CREATE ( ① ) idx_name ON student(name);","a":["INDEX"],"e":"CREATE INDEX 인덱스명 ON 테이블(컬럼). 중복을 막으려면 CREATE UNIQUE INDEX."},{"s":3,"t":"sa","q":"student 테이블에서 dept가 'CS'인 행만 보여 주는 가상 테이블 v_cs를 만들려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"CREATE ( ① ) v_cs AS\nSELECT * FROM student WHERE dept = 'CS';","a":["VIEW"],"e":"CREATE VIEW 뷰이름 AS SELECT …. 기존 테이블로 새 테이블을 만들 때는 CREATE TABLE 새테이블 AS SELECT …."},{"s":3,"t":"sa","q":"다음 SQL을 실행했을 때 결과 행의 개수를 쓰시오.<table><tr><th>t1.c1</th><th></th><th>t2.c1</th></tr><tr><td>A</td><td></td><td>B</td></tr><tr><td>B</td><td></td><td>C</td></tr><tr><td>C</td><td></td><td>D</td></tr></table>","c":"SELECT c1 FROM t1\nUNION\nSELECT c1 FROM t2;","a":["4"],"e":"UNION은 중복을 없앤 합집합: A, B, C, D → 4행. UNION ALL이면 6행, INTERSECT면 B, C → 2행."},{"s":3,"t":"sa","q":"부서가 없는 사원까지 모든 사원을 출력하려고 한다. 빈칸 ①에 들어갈 키워드를 한 단어로 쓰시오.","c":"SELECT e.name, d.dname\nFROM emp e ( ① ) JOIN dept d\nON e.dept_id = d.id;","a":["LEFT","LEFT OUTER"],"e":"LEFT (OUTER) JOIN은 왼쪽 테이블(emp)의 행을 모두 남기고, 짝이 없으면 오른쪽 컬럼을 NULL로 채운다."},{"s":3,"t":"sa","q":"트랜잭션 도중 실행한 변경을 모두 취소하고 마지막으로 확정한 상태로 되돌리는 명령어를 쓰시오.","a":["ROLLBACK","ROLLBACK;"],"e":"COMMIT은 변경 확정, ROLLBACK은 취소, SAVEPOINT는 중간 저장점(ROLLBACK TO 저장점)."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"class Animal:\n    def sound(self):\n        return \"...\"\n\nclass Dog(Animal):\n    def sound(self):\n        return \"Woof\"\n\nfor a in [Animal(), Dog()]:\n    print(a.sound(), end=\" \")","a":["... Woof","... Woof "],"e":"Dog가 sound를 오버라이딩했으므로 Animal 객체는 ..., Dog 객체는 Woof를 돌려준다."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"def f(x, y=10):\n    return x * y\n\nprint(f(3), f(3, 2))","a":["30 6"],"e":"y를 생략하면 기본값 10 → 30, y = 2를 주면 6."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"nums = [3, 1, 4, 1, 5]\nnums.sort(reverse=True)\nprint(nums[1] + nums[-1])","a":["5"],"e":"내림차순 정렬 [5, 4, 3, 1, 1] → nums[1] = 4, nums[-1] = 1 → 5."},{"s":0,"t":"sa","q":"딕셔너리의 (키, 값) 쌍을 차례로 꺼내 출력하려고 한다. 빈칸 ①에 들어갈 메서드 이름을 쓰시오.","c":"score = {\"kim\": 90, \"lee\": 85}\nfor name, s in score.( ① )():\n    print(name, s)","a":["items","items()"],"e":"items()는 (키, 값) 튜플을 돌려준다. 키만은 keys(), 값만은 values()."},{"s":0,"t":"sa","q":"다음 Python 프로그램을 실행하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  data = [10, 20, 30]\n2  total = 0\n3  for i in range(len(data)):\n4      total += data[i]\n5  print(\"합계: \" + total)","a":["5"],"e":"5번 줄에서 문자열과 정수를 +로 이어 TypeError가 난다. str(total)로 바꾸거나 print(\"합계:\", total)로 고친다."},{"s":0,"t":"sa","q":"다음 Python 코드의 출력 결과를 쓰시오.","c":"try:\n    x = int(\"12a\")\n    print(\"A\")\nexcept ValueError:\n    print(\"B\")\nelse:\n    print(\"C\")\nfinally:\n    print(\"D\")","a":["B D","BD"],"e":"int(\"12a\")에서 ValueError → except의 B, else는 예외가 없을 때만 실행되므로 건너뛰고, finally의 D. 두 줄로 B와 D가 출력된다."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"abstract class Shape {\n    abstract int area();\n    void show() { System.out.print(area()); }\n}\nclass Rect extends Shape {\n    int w = 3, h = 4;\n    int area() { return w * h; }\n}\n// main\nShape s = new Rect();\ns.show();","a":["12"],"e":"show()는 부모에 있지만 area()는 실제 객체인 Rect의 구현이 호출된다(동적 바인딩) → 12."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int[][] m = {{1, 2, 3}, {4, 5, 6}};\nint s = 0;\nfor (int i = 0; i < m.length; i++)\n    s += m[i][m[i].length - 1];\nSystem.out.print(s);","a":["9"],"e":"각 행의 마지막 원소 3과 6을 더한다 → 9. m.length는 행 수 2."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"String s = \"programming\";\nSystem.out.print(s.substring(3, 7) + s.indexOf(\"g\"));","a":["gram3"],"e":"substring(3, 7)은 인덱스 3~6 → \"gram\". indexOf(\"g\")는 처음 나오는 위치 3 → gram3."},{"s":1,"t":"sa","q":"다음 Java 코드에서 부모 클래스 생성자를 호출하려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"class Person {\n    String name;\n    Person(String name) { this.name = name; }\n}\nclass Student extends Person {\n    int id;\n    Student(String name, int id) {\n        ( ① )(name);\n        this.id = id;\n    }\n}","a":["super"],"e":"super(…)는 부모 생성자 호출이며 생성자의 첫 줄에 와야 한다. this(…)는 같은 클래스의 다른 생성자 호출."},{"s":1,"t":"sa","q":"다음 Java 프로그램을 컴파일하면 오류가 발생한다. 오류가 발생하는 줄(Line) 번호를 쓰시오.","c":"1  public class Main {\n2      public static void main(String[] args) {\n3          final int MAX = 10;\n4          int sum = 0;\n5          MAX = 20;\n6          System.out.println(sum + MAX);\n7      }\n8  }","a":["5"],"e":"final 변수는 값을 다시 바꿀 수 없다. 5번 줄에서 컴파일 오류."},{"s":1,"t":"sa","q":"다음 Java 코드의 출력 결과를 쓰시오.","c":"int a = 7;\nString r = (a % 2 == 0) ? \"even\" : \"odd\";\nSystem.out.print(r + (a > 5 ? 1 : 0));","a":["odd1"],"e":"7 % 2 = 1이므로 \"odd\", a > 5는 참이라 1 → odd1."},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int n = 3, r = 0;\nswitch (n) {\n    case 1: r += 1;\n    case 3: r += 3;\n    case 5: r += 5;\n        break;\n    default: r += 100;\n}\nprintf(\"%d\", r);","a":["8"],"e":"case 3부터 실행되고 break가 없어 case 5까지 이어진다(3 + 5 = 8). break에서 멈춰 default는 실행되지 않는다."},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"int i = 0, s = 0;\nwhile (i < 10) {\n    i += 3;\n    if (i == 6) continue;\n    s += i;\n}\nprintf(\"%d %d\", i, s);","a":["12 24"],"e":"i는 3, 6, 9, 12로 바뀐다. 6일 때만 건너뛰므로 s = 3 + 9 + 12 = 24. 마지막 i는 12."},{"s":2,"t":"sa","q":"다음 C 코드의 출력 결과를 쓰시오.","c":"void swap(int *a, int *b) {\n    int t = *a; *a = *b; *b = t;\n}\n// main\nint x = 1, y = 2;\nswap(&x, &y);\nprintf(\"%d %d\", x, y);","a":["2 1"],"e":"주소를 넘겼으므로 함수 안에서 원래 변수 값이 바뀐다(참조에 의한 호출 효과)."},{"s":3,"t":"sa","q":"[member] 테이블에 이름이 '박서준', 나이가 25인 행을 추가하려고 한다. 빈칸 ①, ②에 들어갈 키워드를 차례로 쓰시오. (예: A, B)","c":"INSERT ( ① ) member (name, age)\n( ② ) ('박서준', 25);","a":["INTO, VALUES","INTO,VALUES","INTO VALUES"],"e":"INSERT INTO 테이블 (열 목록) VALUES (값 목록);"},{"s":3,"t":"sa","q":"[member] 테이블에서 나이가 20 미만인 회원의 등급을 'junior'로 바꾸려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"UPDATE member ( ① ) grade = 'junior'\nWHERE age < 20;","a":["SET"],"e":"UPDATE 테이블 SET 열 = 값 WHERE 조건. WHERE가 없으면 모든 행이 바뀐다."},{"s":3,"t":"sa","q":"[member] 테이블에 이메일 열에 같은 값이 두 번 들어가지 않게 하는 제약조건을 추가하려고 한다. 빈칸 ①에 들어갈 키워드를 쓰시오.","c":"ALTER TABLE member ADD CONSTRAINT uq_email ( ① ) (email);","a":["UNIQUE"],"e":"UNIQUE는 중복을 막는다(NULL은 허용). PRIMARY KEY는 UNIQUE + NOT NULL."},{"s":3,"t":"sa","q":"다음 SQL을 실행한 결과 행의 개수를 쓰시오.<table><tr><th colspan=\"2\">emp</th><th></th><th colspan=\"2\">dept</th></tr><tr><th>name</th><th>dept_id</th><th></th><th>id</th><th>dname</th></tr><tr><td>A</td><td>10</td><td></td><td>10</td><td>개발</td></tr><tr><td>B</td><td>20</td><td></td><td>20</td><td>영업</td></tr><tr><td>C</td><td>30</td><td></td><td>40</td><td>인사</td></tr><tr><td>D</td><td>10</td><td></td><td></td><td></td></tr></table>","c":"SELECT e.name, d.dname\nFROM emp e INNER JOIN dept d\nON e.dept_id = d.id;","a":["3"],"e":"dept_id가 dept.id에 있는 사원만: A(개발), B(영업), D(개발) → 3행. C(30)는 짝이 없어 빠진다. LEFT JOIN이었다면 4행."},{"s":4,"t":"sa","q":"Linux에서 하위 디렉터리와 파일까지 모두 포함해 디렉터리 old를 삭제하려고 한다. 빈칸 ①에 들어갈 옵션을 쓰시오.","c":"rm ( ① ) old","a":["-r","-rf","-R"],"e":"rm -r은 하위까지 재귀적으로 삭제한다. -f를 붙이면 확인 없이 강제로 지운다. 빈 디렉터리만 지울 때는 rmdir."}],note:"## 실기 개요\n\n실기 과제명은 '프로그래밍 기초', 1시간 30분, 100점 만점에 60점 이상 합격이다. 2026년 큐넷 공지는 '작업형'이라고 했지만, 2027~2029년 출제기준표의 검정방법은 '필답형'이다. 공단 예시문제도 코드를 처음부터 짜는 문제가 아니라 답을 직접 써 넣는 단답형 11문항이었다.\n\n출제기준 실기 범위는 프로그래밍 언어 활용(구조적·객체지향·스크립트 언어, 오류 식별과 수정), 프로그래밍 언어 응용(언어 특성, 라이브러리), SQL 활용(데이터 사전, 조인·서브쿼리·집합 연산자, DDL, 트랜잭션, 인덱스, 뷰), SQL 작성(조회, 삽입·변경·삭제)이다. 4개 주요항목 중 2개가 SQL이라 SQL 비중이 크다. 구조적 언어(C 계열)도 범위에 들어 있으니 C를 완전히 빼지는 말자.\n\n| 예시문제 유형 | 묻는 것 |\n| --- | --- |\n| 경로 | 작업 폴더 기준 상대 경로 → 절대 경로 |\n| Linux 명령어 | 기능 설명 보고 명령어 고르기(pwd, chmod 등) |\n| Python 실행 결과 | 클래스·재귀(트리 순회) 출력 |\n| Python 빈칸 | 딕셔너리 메서드(items 등) |\n| Python 오류 찾기 | 오류 줄 번호 + 고친 뒤 실행 결과 |\n| Java 빈칸 | 인터페이스 구현 키워드 |\n| Java 실행 결과 | 문자열 ==, 생성자 this()·super() 호출 순서 |\n| SQL | LIKE 와일드카드, 테이블 삭제 쿼리, 서브쿼리 결과 |\n\n## 경로와 Linux\n\n- 절대 경로: `/`부터 시작하는 전체 경로. 상대 경로: 현재 위치 기준\n- `.`은 현재 디렉터리, `..`은 상위 디렉터리, `~`는 홈 디렉터리\n- 풀이: 작업 폴더에서 출발해 `..`마다 한 단계씩 올라가고, 나머지 이름을 차례로 붙인다\n- 예) 작업 폴더 `/a/b/c`, 상대 경로 `../../d` → `/a/d`\n- 자주 나오는 명령어: `pwd`(현재 경로), `cd`(이동), `ls`(목록), `cat`(내용 출력), `cp`(복사), `rm`(삭제), `chmod`(권한 변경), `vi`(편집기), `top`(실시간 프로세스·자원), `echo`(문자열·변수 출력), `export`(환경 변수 설정), `ifconfig`(네트워크 설정)\n\n## 코드 추적 요령\n\n1. 변수마다 칸을 만들고 줄이 바뀔 때마다 값을 적는다.\n2. 반복문은 i 값과 조건 결과를 한 줄씩 표로 적는다. 마지막 1회와 종료 조건을 특히 조심한다.\n3. 출력 형식을 그대로 쓴다. 공백, 줄바꿈, 소수점(`5.0`), 따옴표 유무까지 답이다.\n4. 함수 호출은 호출 스택을 적는다. 재귀는 가장 안쪽부터 값을 채워 올라온다.\n\n**자주 나오는 함정**\n\n- C·Java 정수 나눗셈은 몫만 남는다: `7 / 2 = 3`. Python `/`는 실수(`3.5`), `//`는 내림.\n- `x++`는 쓰고 나서 증가, `++x`는 증가하고 나서 사용.\n- Java `int + char`는 숫자 덧셈(`5 + 'H' = 77`). `\"\" + 5 + 'H'`처럼 문자열이 먼저 오면 연결(`5H`).\n- Java `==`는 참조 비교, `equals()`는 내용 비교.\n- 오버라이딩된 메서드는 실제 객체 기준으로 실행. static 변수는 모든 객체가 공유.\n- 예외가 나면 try의 나머지 줄은 건너뛰고 catch → finally 순서로 실행.\n- Python `b = a`는 같은 리스트를 가리킨다. 복사는 `a[:]`나 `a.copy()`.\n- Python 슬라이싱 끝 인덱스는 포함하지 않는다. `s[::-1]`은 뒤집기.\n- C 포인터 `*p`를 바꾸면 가리키는 변수도 바뀐다.\n- `switch`에 `break`가 없으면 아래 case까지 실행된다.\n\n## C 핵심\n\n- 출력: `printf(\"%d %c %s %f\\n\", 정수, 문자, 문자열, 실수)`, `%.2f` 소수 둘째 자리, `%5d` 5칸\n- 입력: `scanf(\"%d\", &a)` (변수 앞에 &)\n- 배열: `int a[5] = {1, 2, 3};` 나머지는 0. 인덱스 0부터\n- 문자열: `char s[] = \"abc\";` 끝에 `'\\0'`. `strlen`, `strcpy`, `strcmp`, `strcat`\n- 포인터: `int *p = &a;` `*p`는 값, `p + 1`은 다음 원소\n- 구조체: `s.x`, 포인터는 `p->x`\n- 함수: 값에 의한 호출이 기본. 원본을 바꾸려면 포인터 전달\n\n## Java 핵심\n\n- 출력: `System.out.print()`, `println()`은 줄바꿈 포함, `printf()`\n- 배열: `int[] a = new int[5];` 길이는 `a.length`, 문자열 길이는 `s.length()`\n- 향상된 for: `for (int v : arr)`\n- 클래스: 생성자, `this`, `super`, 상속 `extends`, 인터페이스 `implements`\n- 생성 순서: 부모 생성자 → 자식 생성자\n- 오버로딩(같은 이름, 다른 매개변수) / 오버라이딩(부모 메서드 재정의)\n- 문자열: `charAt(i)`, `substring(a, b)`(b 미포함), `indexOf`, `toUpperCase`, `split`\n- 예외: `try / catch / finally`, `throw`, `throws`\n\n## Python 핵심\n\n- 입출력: `input()`은 문자열. 숫자는 `int(input())`, 여러 개는 `map(int, input().split())`\n- 출력: `print(a, b, sep=\",\", end=\"\")`, f-string `f\"{a} + {b}\"`\n- 리스트: `append`, `insert`, `pop`, `remove`, `sort`, `len`, 슬라이싱\n- 딕셔너리: `d[k] = v`, `d.get(k)`, `keys()`, `values()`, `items()`\n- 집합: `|` 합집합, `&` 교집합, `-` 차집합\n- 컴프리헨션: `[x * 2 for x in range(5) if x > 1]`\n- 함수: `def`, 기본값, `return`, `lambda`\n- 클래스: `__init__(self)`, 상속 `class B(A):`\n\n## SQL 핵심\n\n| 분류 | 명령어 | 짝 키워드 |\n| --- | --- | --- |\n| DDL | CREATE, ALTER, DROP, TRUNCATE | ALTER TABLE ~ ADD |\n| DML | SELECT, INSERT, UPDATE, DELETE | INSERT INTO ~ VALUES, UPDATE ~ SET, DELETE FROM |\n| DCL | GRANT, REVOKE | GRANT ~ TO, REVOKE ~ FROM |\n| TCL | COMMIT, ROLLBACK, SAVEPOINT | |\n\n- SELECT 실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY\n- 정렬: `ORDER BY 열 ASC`(기본) / `DESC`\n- 그룹 조건은 HAVING, 행 조건은 WHERE\n- `LIKE '김%'` 김으로 시작, `'_a%'` 둘째 글자 a\n- `BETWEEN 1 AND 10`은 양 끝 포함, `IN (1, 2)`, `IS NULL`\n- 집계: `COUNT`, `SUM`, `AVG`, `MAX`, `MIN` (NULL 제외, `COUNT(*)`만 포함)\n- 조인: `A JOIN B ON A.키 = B.키`, LEFT/RIGHT/FULL OUTER JOIN\n- 집합 연산: `UNION`(중복 제거), `UNION ALL`(중복 포함), `INTERSECT`, `EXCEPT`/`MINUS`\n- 서브쿼리: `WHERE c1 IN (SELECT …)`, `NOT IN`, `EXISTS`. 안쪽 결과를 먼저 적고 대조\n- 데이터 사전(Oracle): `USER_TABLES`, `USER_TAB_COLUMNS`, `USER_CONSTRAINTS`, `USER_INDEXES`, `USER_VIEWS`\n- 인덱스: `CREATE [UNIQUE] INDEX 이름 ON 테이블(컬럼);`, 삭제 `DROP INDEX 이름;`\n- 뷰: `CREATE VIEW 이름 AS SELECT …;`, 기존 테이블로 새 테이블 `CREATE TABLE 새이름 AS SELECT …;`\n- 제약조건: `PRIMARY KEY`, `FOREIGN KEY … REFERENCES`, `UNIQUE`, `NOT NULL`, `CHECK`, `DEFAULT`\n- 수정: `ALTER TABLE 테이블 ADD 컬럼 타입;`, `MODIFY`, `DROP COLUMN`\n- 트랜잭션: `COMMIT`(확정), `ROLLBACK`(취소), `SAVEPOINT 이름` / `ROLLBACK TO 이름`\n\n## Linux 명령어 정리\n\n| 명령어 | 기능 |\n| --- | --- |\n| `ls -l` | 목록 자세히 |\n| `cd` / `pwd` | 이동 / 현재 위치 |\n| `mkdir` / `rmdir` / `rm -r` | 디렉터리 생성 / 빈 디렉터리 삭제 / 하위 포함 삭제 |\n| `cp` / `mv` | 복사 / 이동·이름 변경 |\n| `cat` / `head` / `tail` | 내용 출력 / 앞부분 / 뒷부분 |\n| `chmod` / `chown` | 권한 변경 / 소유자 변경 |\n| `ps` / `kill` | 프로세스 보기 / 종료 |\n| `grep` / `find` | 문자열 찾기 / 파일 찾기 |\n| `wc -l` | 줄 수 세기 |\n\n- 권한 숫자: r = 4, w = 2, x = 1. `rwxr-x---` = 750, `rw-r--r--` = 644\n- `>` 덮어쓰기, `>>` 이어쓰기, `|` 파이프 (`ps | grep java`)\n\n## 오류 찾기·빈칸 문제 요령\n\n1. 오류 찾기는 문법부터 본다: 들여쓰기, 콜론(`:`), 괄호 짝, 따옴표, `return`·`break`가 함수나 반복문 밖에 있는지.\n2. 오류 줄 번호를 물으면 원인이 되는 줄을 쓴다. 고친 뒤 실행 결과를 물으면 고친 코드로 끝까지 추적한다.\n3. 빈칸 키워드는 짝으로 외운다: `implements`(인터페이스 구현), `extends`(상속), `super`/`this`(생성자 호출), `items()`·`keys()`·`values()`(딕셔너리).\n4. SQL 서브쿼리는 안쪽 결과를 먼저 목록으로 적고, 바깥 조건(IN, NOT IN)을 하나씩 대조한다.\n5. 테이블 삭제: 구조까지 `DROP TABLE 이름`, 참조 제약까지 함께 `DROP TABLE 이름 CASCADE`, 데이터만 `TRUNCATE TABLE 이름`.\n6. 답은 출력 그대로 쓴다. 구분자(`/`, 공백), 따옴표, 대소문자까지 확인한다.\n\n## 트리 순회 (Python 예시 유형)\n\n| 순회 | 순서 | 출력 위치 |\n| --- | --- | --- |\n| 전위 | 루트 → 왼쪽 → 오른쪽 | 재귀 호출 전 |\n| 중위 | 왼쪽 → 루트 → 오른쪽 | 왼쪽 호출과 오른쪽 호출 사이 |\n| 후위 | 왼쪽 → 오른쪽 → 루트 | 재귀 호출 후 |\n\n- 출력문이 어디에 있는지 보고 순회 종류를 먼저 정한 뒤, 트리를 그림으로 그려 순서대로 적는다.\n"},
