      Q:[{"s":0,"q":"다음 중 정성적 데이터에 해당하는 것은?","o":["월별 매출액","측정한 기온","설문조사의 주관식 응답","학생의 키"],"a":2,"e":"정성적 데이터는 언어·문자처럼 형태와 형식이 정해지지 않은 데이터다. 나머지는 수치로 표현되는 정량적 데이터."},{"s":0,"q":"암묵지와 형식지의 상호작용에서, 개인의 암묵지를 언어나 문서 같은 형식지로 바꾸는 과정은?","o":["공통화","표출화","연결화","내면화"],"a":1,"e":"공통화(암묵지 공유) → 표출화(암묵지 → 형식지) → 연결화(형식지 결합) → 내면화(형식지 → 암묵지)."},{"s":0,"q":"‘A마트 연필 100원, B마트 연필 200원’이라는 사실에서 ‘상대적으로 저렴한 A마트에서 연필을 사야겠다’고 판단했다. DIKW 피라미드에서 이 판단은?","o":["데이터","정보","지식","지혜"],"a":2,"e":"가격 자체는 데이터, ‘A마트가 더 싸다’는 정보, 이를 바탕으로 한 행동 판단은 지식. ‘A마트의 다른 상품도 쌀 것’처럼 창의적으로 넓히면 지혜."},{"s":0,"q":"데이터베이스의 일반적인 특징이 아닌 것은?","o":["통합된 데이터","저장된 데이터","공용 데이터","독점 데이터"],"a":3,"e":"데이터베이스는 통합된·저장된·공용·변화되는 데이터의 특징을 가진다."},{"s":0,"q":"빅데이터의 특징인 3V에 해당하지 않는 것은?","o":["Volume","Variety","Velocity","Visualization"],"a":3,"e":"3V는 규모(Volume), 다양성(Variety), 속도(Velocity). 4V일 때는 가치(Value)를 더한다."},{"s":0,"q":"빅데이터가 만들어 낸 본질적인 변화로 옳지 않은 것은?","o":["사전 처리에서 사후 처리로","표본 조사에서 전수 조사로","양보다 질을 중시","인과관계에서 상관관계로"],"a":2,"e":"빅데이터 시대에는 질보다 양을 중시하는 방향으로 바뀌었다."},{"s":0,"q":"빅데이터의 위기 요인 중 ‘데이터 오용’에 대한 통제 방안은?","o":["동의에서 책임으로","결과 기반 책임 원칙 고수","알고리즈미스트","개인정보 비식별화"],"a":2,"e":"데이터 오용 → 알고리즘 접근 허용과 알고리즈미스트. 사생활 침해 → 동의에서 책임으로. 책임 원칙 훼손 → 결과 기반 책임 원칙."},{"s":0,"q":"데이터 사이언티스트의 역량 중 소프트 스킬이 아닌 것은?","o":["통찰력 있는 분석","설득력 있는 전달","다분야 간 협력","분석 기술의 숙련도"],"a":3,"e":"분석 기술 숙련도와 빅데이터 이론 지식은 하드 스킬이다."},{"s":0,"q":"주민등록번호 뒷자리를 ‘*******’로 바꿔 보이지 않게 하는 비식별화 기법은?","o":["가명처리","총계처리","데이터 범주화","데이터 마스킹"],"a":3,"e":"데이터 마스킹은 개인 식별 정보 일부를 공백·별표 등으로 가린다. 범주화는 값을 구간으로 묶는 것(35세 → 30대)."},{"s":0,"q":"원재료 조달부터 생산, 고객 배송까지 공급망 전체의 흐름을 관리하는 기업 정보 시스템은?","o":["ERP","CRM","SCM","BI"],"a":2,"e":"SCM(공급망 관리). ERP는 전사적 자원 관리, CRM은 고객 관계 관리, BI는 비즈니스 인텔리전스."},{"s":1,"q":"분석 대상(What)은 알지만 분석 방법(How)을 모를 때의 분석 주제 유형은?","o":["최적화","솔루션","통찰","발견"],"a":1,"e":"대상·방법 모두 앎 = 최적화, 대상만 앎 = 솔루션, 방법만 앎 = 통찰, 둘 다 모름 = 발견."},{"s":1,"q":"하향식 접근 방식의 분석 과제 발굴 순서로 옳은 것은?","o":["문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토","문제 정의 → 문제 탐색 → 타당성 검토 → 해결 방안 탐색","문제 탐색 → 해결 방안 탐색 → 문제 정의 → 타당성 검토","타당성 검토 → 문제 탐색 → 문제 정의 → 해결 방안 탐색"],"a":0,"e":"하향식: 문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토."},{"s":1,"q":"상향식 접근 방식에 대한 설명으로 옳지 않은 것은?","o":["데이터 자체를 들여다보며 인사이트를 찾는다","비지도 학습 방법을 주로 활용한다","문제가 명확하게 정의되어 있을 때 사용한다","프로토타이핑 방식을 활용할 수 있다"],"a":2,"e":"문제가 명확할 때는 하향식 접근을 쓴다. 상향식은 문제 정의가 어려울 때 데이터에서 출발한다."},{"s":1,"q":"KDD 분석 방법론의 절차로 옳은 것은?","o":["데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 해석·평가","전처리 → 데이터셋 선택 → 변환 → 데이터 마이닝 → 해석·평가","데이터셋 선택 → 변환 → 전처리 → 데이터 마이닝 → 해석·평가","업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가"],"a":0,"e":"KDD: 선택 → 전처리 → 변환 → 마이닝 → 해석·평가. ④는 CRISP-DM."},{"s":1,"q":"CRISP-DM 방법론의 단계가 아닌 것은?","o":["업무 이해","데이터 준비","평가","데이터 변환"],"a":3,"e":"CRISP-DM: 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개. ‘데이터 변환’은 KDD 단계."},{"s":1,"q":"빅데이터 분석 방법론 5단계 중 가장 먼저 수행하는 단계는?","o":["데이터 준비","분석 기획","데이터 분석","시스템 구현"],"a":1,"e":"분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개."},{"s":1,"q":"분석 과제 우선순위를 정하는 사분면(시급성 × 난이도)에서 ‘현재 시급하고 난이도가 쉬운’ 과제가 속하는 사분면은?","o":["1사분면","2사분면","3사분면","4사분면"],"a":2,"e":"3사분면이 가장 먼저 수행할 과제다. 시급성 기준이면 3 → 4 → 2, 난이도 기준이면 3 → 1 → 2 순서."},{"s":1,"q":"분석 마스터 플랜에서 ‘우선순위’를 정할 때 고려하는 요소가 아닌 것은?","o":["전략적 중요도","비즈니스 성과·ROI","실행 용이성","기술 적용 수준"],"a":3,"e":"기술 적용 수준은 우선순위가 아니라 ‘적용 범위·방식’을 정할 때 고려한다(업무 내재화, 분석 데이터, 기술 적용 수준)."},{"s":1,"q":"분석 성숙도 모델의 단계를 순서대로 나열한 것은?","o":["도입 → 활용 → 확산 → 최적화","활용 → 도입 → 확산 → 최적화","도입 → 확산 → 활용 → 최적화","도입 → 활용 → 최적화 → 확산"],"a":0,"e":"도입 → 활용 → 확산 → 최적화."},{"s":1,"q":"데이터 거버넌스의 구성 요소가 아닌 것은?","o":["원칙","조직","프로세스","알고리즘"],"a":3,"e":"데이터 거버넌스 구성 요소는 원칙(Principle), 조직(Organization), 프로세스(Process)."},{"s":2,"q":"결측값이 하나라도 있는 레코드를 삭제하고, 값이 모두 있는 자료만으로 분석하는 결측값 처리 방법은?","o":["평균 대치법","단순 확률 대치법","다중 대치법","완전 분석법"],"a":3,"e":"완전 분석법은 간단하지만 자료가 줄어 효율성이 떨어진다. 평균 대치법은 평균으로 채우고, 다중 대치법은 대치 → 분석 → 결합의 3단계를 거친다."},{"s":2,"q":"R의 reshape 패키지에서 데이터를 식별자(id), variable, value 형태의 긴 형식으로 바꾸는 함수는?","o":["cast","melt","merge","apply"],"a":1,"e":"melt로 녹인 뒤 cast로 원하는 모양(요약 테이블)으로 다시 만든다. 데이터 마트 구성에 쓰는 대표 함수."},{"s":2,"q":"R에서 결측값(missing value)을 나타내는 것은?","o":["NULL","NaN","NA","Inf"],"a":2,"e":"결측값은 NA. NaN은 0/0 같은 계산 불가, NULL은 값이 없는 객체, Inf는 무한대."},{"s":2,"q":"R에서 데이터프레임의 행 개수와 열 개수를 함께 알려 주는 함수는?","o":["length()","dim()","str()","nrow()"],"a":1,"e":"dim()은 (행, 열)을 반환한다. nrow()는 행 수만, str()은 구조를 보여 준다."},{"s":2,"q":"섭씨온도처럼 간격은 의미가 있지만 절대 0점이 없는 척도는?","o":["명목척도","서열척도","등간척도","비율척도"],"a":2,"e":"등간척도는 더하기·빼기는 되지만 비율 비교(2배 덥다)는 안 된다. 키·무게처럼 절대 0이 있으면 비율척도."},{"s":2,"q":"모집단을 서로 겹치지 않는 여러 계층으로 나누고, 각 계층에서 무작위로 표본을 뽑는 방법은?","o":["단순 무작위 추출","계통 추출","집락 추출","층화 추출"],"a":3,"e":"층화 추출. 집락 추출은 집단(집락)을 뽑아 그 안을 전부 조사한다."},{"s":2,"q":"이상치(극단값)의 영향을 가장 적게 받는 대푯값은?","o":["산술평균","중앙값","범위","표준편차"],"a":1,"e":"중앙값은 순서상 가운데 값이라 극단값에 덜 민감하다."},{"s":2,"q":"제1종 오류에 대한 설명으로 옳은 것은?","o":["귀무가설이 참인데 귀무가설을 기각하는 오류","귀무가설이 거짓인데 귀무가설을 채택하는 오류","대립가설이 참인데 대립가설을 채택하는 오류","표본 크기가 작아서 생기는 오류"],"a":0,"e":"제1종 오류(α): 참인 귀무가설을 기각. 제2종 오류(β): 거짓인 귀무가설을 채택."},{"s":2,"q":"유의수준 0.05에서 검정한 결과 p-value가 0.01이었다. 올바른 판단은?","o":["귀무가설을 채택한다","귀무가설을 기각한다","대립가설을 기각한다","판단할 수 없다"],"a":1,"e":"p-value < 유의수준이면 귀무가설을 기각한다."},{"s":2,"q":"두 변수가 모두 서열척도일 때 사용하는 상관계수는?","o":["피어슨 상관계수","스피어만 상관계수","결정계수","공분산"],"a":1,"e":"스피어만은 순위 기반(서열척도, 비선형 단조 관계). 피어슨은 등간·비율척도의 선형 관계."},{"s":2,"q":"회귀모형의 결정계수(R²)가 0.8이라는 의미로 옳은 것은?","o":["독립변수와 종속변수의 상관계수가 0.8이다","종속변수 변동의 80%를 회귀모형이 설명한다","예측 정확도가 80%이다","회귀계수가 0.8이다"],"a":1,"e":"결정계수는 전체 변동 중 모형이 설명하는 비율(0~1). 단순회귀에서 상관계수의 제곱과 같다."},{"s":2,"q":"회귀분석에서 독립변수 간 다중공선성을 진단하는 지표는?","o":["VIF","AIC","p-value","MSE"],"a":0,"e":"VIF(분산팽창요인)가 보통 10을 넘으면 다중공선성이 심하다고 본다."},{"s":2,"q":"모든 독립변수를 넣은 모형에서 시작해 중요도가 낮은 변수를 하나씩 제거하는 변수 선택 방법은?","o":["전진 선택법","후진 제거법","단계적 선택법","라쏘 회귀"],"a":1,"e":"후진 제거법. 전진 선택법은 빈 모형에서 하나씩 추가, 단계적은 추가와 제거를 함께."},{"s":2,"q":"평균이 일정하지 않은 비정상 시계열을 정상 시계열로 바꾸는 방법은?","o":["차분","로그 변환","이동 평균","정규화"],"a":0,"e":"평균이 일정하지 않으면 차분, 분산이 일정하지 않으면 변환(로그 등)을 한다."},{"s":2,"q":"ARIMA(p, d, q) 모형에서 d가 의미하는 것은?","o":["자기회귀 차수","차분 횟수","이동평균 차수","계절 주기"],"a":1,"e":"p는 AR 차수, d는 차분 횟수, q는 MA 차수."},{"s":2,"q":"주성분분석(PCA)에 대한 설명으로 옳지 않은 것은?","o":["변수의 차원을 줄이는 데 쓴다","주성분끼리는 서로 상관관계가 없다","첫 번째 주성분이 분산을 가장 많이 설명한다","종속변수를 예측하는 지도학습 기법이다"],"a":3,"e":"PCA는 종속변수 없이 변수들의 구조를 요약하는 비지도 기법이다."},{"s":2,"q":"세 개 이상 집단의 평균 차이를 검정하는 방법은?","o":["독립표본 t-검정","대응표본 t-검정","분산분석(ANOVA)","카이제곱 검정"],"a":2,"e":"두 집단은 t-검정, 세 집단 이상은 분산분석(F-검정)."},{"s":2,"q":"두 범주형 변수가 서로 독립인지 검정하는 방법은?","o":["카이제곱 검정","t-검정","회귀분석","Shapiro-Wilk 검정"],"a":0,"e":"교차표로 정리한 뒤 카이제곱 독립성 검정을 한다. Shapiro-Wilk는 정규성 검정."},{"s":2,"q":"다음 중 지도학습 기법이 아닌 것은?","o":["의사결정나무","로지스틱 회귀","인공신경망","K-평균 군집"],"a":3,"e":"K-평균 군집은 정답(레이블) 없이 묶는 비지도학습이다."},{"s":2,"q":"로지스틱 회귀분석에 대한 설명으로 옳은 것은?","o":["종속변수가 연속형일 때 사용한다","종속변수가 범주형(예: 0/1)일 때 사용한다","독립변수는 반드시 범주형이어야 한다","출력값이 -∞~∞ 범위이다"],"a":1,"e":"로지스틱 회귀는 시그모이드 함수로 0~1 확률을 출력해 범주를 분류한다."},{"s":2,"q":"분류나무(목표변수가 범주형)의 분리 기준이 아닌 것은?","o":["지니 지수","엔트로피 지수","카이제곱 통계량의 p-value","분산 감소량"],"a":3,"e":"분산 감소량과 F 통계량은 회귀나무(목표변수가 연속형)의 분리 기준이다."},{"s":2,"q":"약한 학습기를 순차적으로 학습시키면서 이전에 잘못 분류한 데이터에 더 큰 가중치를 주는 앙상블 기법은?","o":["배깅","부스팅","랜덤 포레스트","보팅"],"a":1,"e":"부스팅(AdaBoost, GBM 등). 배깅과 랜덤 포레스트는 부트스트랩 표본으로 병렬 학습한다."},{"s":2,"q":"혼동행렬에서 TP = 40, FP = 10, FN = 20, TN = 30일 때 정밀도(Precision)는?","o":["0.67","0.7","0.75","0.8"],"a":3,"e":"정밀도 = TP / (TP + FP) = 40 / 50 = 0.8. 재현율은 40/60 ≈ 0.67, 정확도는 70/100 = 0.7."},{"s":2,"q":"ROC 곡선에 대한 설명으로 옳은 것은?","o":["x축은 민감도, y축은 특이도이다","AUC가 1에 가까울수록 좋은 모형이다","AUC가 0.5이면 완벽한 모형이다","회귀모형 평가에 주로 쓴다"],"a":1,"e":"x축은 1 − 특이도(FPR), y축은 민감도(TPR). AUC 0.5는 무작위 수준이다."},{"s":2,"q":"과대적합(Overfitting)을 줄이는 방법이 아닌 것은?","o":["가지치기","교차 검증","정규화(규제)","모델의 복잡도를 높이기"],"a":3,"e":"복잡도를 높이면 과대적합이 더 심해진다. 학습 데이터를 늘리거나 드롭아웃을 쓰는 것도 방법이다."},{"s":2,"q":"계층적 군집에서 군집을 합칠 때 군집 내 오차제곱합의 증가량이 최소가 되도록 하는 연결법은?","o":["최단 연결법","최장 연결법","평균 연결법","와드 연결법"],"a":3,"e":"와드 연결법. 최단은 가장 가까운 점 사이 거리, 최장은 가장 먼 점 사이 거리를 기준으로 한다."},{"s":2,"q":"K-평균 군집에 대한 설명으로 옳지 않은 것은?","o":["군집 수 K를 미리 정해야 한다","초기 중심값에 따라 결과가 달라질 수 있다","이상치에 강건하다","거리 기반으로 군집을 나눈다"],"a":2,"e":"K-평균은 평균을 중심으로 쓰기 때문에 이상치에 민감하다. 이를 보완한 것이 K-medoids."},{"s":2,"q":"전체 거래 100건 중 A 포함 40건, B 포함 50건, A와 B 동시 포함 20건이다. 연관규칙 A → B의 향상도(Lift)는?","o":["0.5","1","1.25","2"],"a":1,"e":"신뢰도 = 20/40 = 0.5, P(B) = 50/100 = 0.5, 향상도 = 0.5 / 0.5 = 1. 향상도 1이면 A와 B는 서로 독립."},{"s":2,"q":"인공신경망에서 여러 범주 중 하나로 분류하는 출력층에 주로 쓰는 활성화 함수는?","o":["계단 함수","ReLU","소프트맥스","부호 함수"],"a":2,"e":"소프트맥스는 출력값을 합이 1인 확률로 바꿔 다중 분류에 쓴다."},{"s":2,"q":"변수 간의 상관관계(공분산)를 고려해 계산하는 거리는?","o":["유클리드 거리","맨해튼 거리","마할라노비스 거리","민코프스키 거리"],"a":2,"e":"마할라노비스 거리는 공분산 행렬을 반영해 변수의 척도와 상관을 보정한다."},{"s":0,"q":"데이터의 유형 중 정형 데이터에 대한 설명으로 옳은 것은?","o":["형태가 정해지지 않은 텍스트, 영상 데이터","메타데이터를 포함한 XML, JSON 데이터","고정된 필드(스키마)에 저장되어 행과 열로 표현되는 데이터","센서에서 실시간으로 쌓이는 음성 데이터"],"a":2,"e":"정형 데이터는 RDB 테이블처럼 고정된 스키마를 가진다. XML·JSON·HTML은 반정형, 텍스트·이미지·영상은 비정형."},{"s":0,"q":"다음 중 반정형 데이터에 해당하는 것은?","o":["JSON 문서","관계형 데이터베이스의 테이블","동영상 파일","녹음 파일"],"a":0,"e":"반정형 데이터는 스키마(구조) 정보를 데이터 안에 함께 담는다: XML, JSON, HTML, 로그 파일 등."},{"s":0,"q":"개인이 학습과 경험으로 체득했지만 겉으로 드러나지 않는 지식은?","o":["데이터","정보","형식지","암묵지"],"a":3,"e":"암묵지는 개인에게 체화되어 공유가 어렵다. 형식지는 문서·매뉴얼처럼 형상화된 지식."},{"s":0,"q":"데이터 웨어하우스의 특징이 아닌 것은?","o":["주제 지향적","통합적","휘발적","시계열적"],"a":2,"e":"데이터 웨어하우스는 주제 지향, 통합, 시계열, 비휘발(한 번 적재되면 잘 바뀌지 않음)의 특징을 가진다."},{"s":0,"q":"여러 차원에서 데이터를 다각도로 분석하는 대화형 분석 기술은?","o":["SCM","OLTP","ERP","OLAP"],"a":3,"e":"OLAP(온라인 분석 처리)은 다차원 분석, OLTP(온라인 거래 처리)는 실시간 거래를 빠르게 처리한다."},{"s":0,"q":"고객 정보를 통합해 마케팅, 영업, 고객 서비스에 활용하는 기업 정보 시스템은?","o":["SCM","ERP","KMS","CRM"],"a":3,"e":"CRM(고객 관계 관리). KMS는 지식 관리 시스템."},{"s":0,"q":"빅데이터 출현의 배경으로 거리가 먼 것은?","o":["저장 장치 가격 하락","클라우드 컴퓨팅 확산","스마트폰과 SNS 보급","표본 조사의 중요성 증가"],"a":3,"e":"빅데이터 시대에는 표본 조사보다 전수 조사가 가능해졌다. 저장 비용 하락, 클라우드, 모바일·SNS가 출현 배경이다."},{"s":0,"q":"빅데이터 가치 산정이 어려운 이유가 아닌 것은?","o":["데이터 활용 방식이 다양해졌다","분석 기술이 빠르게 발전한다","데이터 저장 비용이 크게 올랐다","새로운 가치가 창출된다"],"a":2,"e":"가치 산정이 어려운 이유는 활용 방식의 다양화, 새로운 가치 창출, 분석 기술 발전. 저장 비용은 오히려 크게 떨어졌다."},{"s":0,"q":"빅데이터의 위기 요인 중 ‘사생활 침해’에 대한 통제 방안은?","o":["결과 기반 책임 원칙 고수","알고리즈미스트","동의에서 책임으로","데이터 독점 허용"],"a":2,"e":"개인 동의에만 의존하지 않고 데이터를 사용하는 쪽이 책임지게 한다(동의에서 책임으로)."},{"s":0,"q":"‘예측 알고리즘으로 범죄 가능성이 높다고 판단된 사람을 미리 처벌하는 것’과 관련된 빅데이터 위기 요인은?","o":["데이터 유출","책임 원칙 훼손","데이터 오용","사생활 침해"],"a":1,"e":"책임 원칙 훼손: 일어나지 않은 일에 대한 예측으로 처벌할 수 있다. 통제 방안은 결과 기반 책임 원칙 고수."},{"s":0,"q":"알고리즘의 부당한 결과로 피해를 본 사람을 구제하기 위해 알고리즘을 해석하는 전문 인력은?","o":["알고리즈미스트","데이터 엔지니어","DBA","데이터 아키텍트"],"a":0,"e":"알고리즈미스트는 데이터 오용에 대한 통제 방안으로 제시된 전문 인력이다."},{"s":0,"q":"데이터 사이언스에 대한 설명으로 옳지 않은 것은?","o":["분석에 그치지 않고 효과적인 구현과 전달까지 포함한다","비즈니스 성과를 내는 데 초점을 둔다","통계학과 달리 정형 데이터만 분석한다","정형뿐 아니라 비정형 데이터도 다룬다"],"a":2,"e":"통계학이 주로 정형 데이터를 다루는 것과 달리, 데이터 사이언스는 정형·반정형·비정형 데이터를 모두 다룬다."},{"s":0,"q":"전략 인사이트 도출을 위해 데이터 사이언티스트에게 필요한 ‘인문학적 사고’가 강조되는 이유로 거리가 먼 것은?","o":["단순 세계화에서 복잡한 세계화로의 변화","생산에서 시장 창조로의 변화","제품 생산에서 서비스로의 변화","하드웨어 가격 상승"],"a":3,"e":"인문학이 강조된 외부 환경 변화는 복잡한 세계화, 서비스로의 비즈니스 중심 이동, 시장 창조로의 경제·산업 논리 변화다."},{"s":0,"q":"비식별화 기법 중 ‘35세 → 30대’, ‘키 172cm → 170~175cm’처럼 값을 구간이나 범주로 바꾸는 것은?","o":["총계처리","데이터 마스킹","가명처리","데이터 범주화"],"a":3,"e":"데이터 범주화는 단일 식별 값을 구간 값으로 바꾼다. 총계처리는 합계·평균 같은 통계값으로 바꾼다."},{"s":0,"q":"비식별화 기법 중 ‘홍길동 → 임꺽정’처럼 개인 식별이 가능한 값을 다른 값으로 대체하는 것은?","o":["총계처리","데이터 삭제","가명처리","데이터 범주화"],"a":2,"e":"가명처리(휴리스틱 가명화, 암호화, 교환 방법 등)."},{"s":1,"q":"분석 기획 시 고려해야 할 사항이 아닌 것은?","o":["분석 결과의 화려한 시각화 디자인","가용한 데이터","적절한 유스케이스 탐색","분석 수행 시 발생 가능한 장애 요소"],"a":0,"e":"분석 기획의 고려 사항은 가용 데이터(데이터 확보 가능성), 적절한 유스케이스, 장애 요소에 대한 사전 계획이다."},{"s":1,"q":"분석 대상(What)과 분석 방법(How)을 모두 모를 때의 분석 주제 유형은?","o":["발견","솔루션","최적화","통찰"],"a":0,"e":"둘 다 모름 = 발견(Discovery). 대상은 모르고 방법만 알면 통찰(Insight)."},{"s":1,"q":"분석 대상(What)은 모르지만 분석 방법(How)을 알고 있을 때의 분석 주제 유형은?","o":["솔루션","통찰","발견","최적화"],"a":1,"e":"방법만 앎 = 통찰(Insight). 대상만 앎 = 솔루션."},{"s":1,"q":"하향식 접근 방식에서 ‘문제 탐색’ 단계에 활용하는 도구로, 업무·제품·고객·규제와 감사·지원 인프라 영역으로 문제를 찾는 것은?","o":["프로토타이핑","디자인 사고","비즈니스 모델 캔버스","분석 유스케이스 정의서"],"a":2,"e":"비즈니스 모델 캔버스의 5가지 영역(업무, 제품, 고객, 규제와 감사, 지원 인프라)으로 문제를 빠짐없이 탐색한다."},{"s":1,"q":"하향식 접근 방식에서 비즈니스 문제를 데이터 분석 문제로 바꾸는 단계는?","o":["타당성 검토","문제 탐색","해결 방안 탐색","문제 정의"],"a":3,"e":"문제 정의 단계에서 식별된 비즈니스 문제를 데이터 문제로 변환한다."},{"s":1,"q":"하향식 접근 방식의 타당성 검토 단계에서 검토하는 항목이 아닌 것은?","o":["기술적 타당성","데이터 타당성","경제적 타당성","디자인 타당성"],"a":3,"e":"타당성 검토는 경제적 타당성, 데이터 및 기술적 타당성을 따진다."},{"s":1,"q":"상향식 접근 방식에 대한 설명으로 옳은 것은?","o":["지도 학습만 사용한다","분석 대상과 방법이 모두 정해져 있을 때 쓴다","문제를 먼저 명확히 정의하고 해결 방안을 찾는다","데이터를 그대로 들여다보며 인사이트를 찾는 발산적 사고를 쓴다"],"a":3,"e":"상향식은 데이터에서 출발해 비지도 학습, 디자인 사고(발산), 프로토타이핑으로 문제를 찾는다."},{"s":1,"q":"프로토타이핑 접근법이 필요한 이유로 거리가 먼 것은?","o":["문제에 대한 인식 수준이 낮을 때","데이터 사용 목적이 가변적일 때","필요한 데이터가 존재하는지 불확실할 때","요구사항이 처음부터 완벽하게 정해져 있을 때"],"a":3,"e":"프로토타이핑은 요구사항이 불명확하거나 데이터 존재·목적이 불확실할 때 빠르게 시도하며 다듬는 방법이다."},{"s":1,"q":"분석 과제 관리를 위해 고려해야 할 5가지 주요 영역이 아닌 것은?","o":["분석 복잡도","분석가의 연봉","데이터 복잡도","데이터 크기"],"a":1,"e":"5가지 영역: 데이터 크기(Size), 데이터 복잡도(Complexity), 속도(Speed), 분석 복잡도, 정확도와 정밀도."},{"s":1,"q":"분석 모델의 정확도(Accuracy)와 정밀도(Precision)에 대한 설명으로 옳은 것은?","o":["정밀도는 모델과 실제 값의 차이가 적은 정도를 뜻한다","정확도는 반복했을 때 결과가 얼마나 일관된지를 뜻한다","정확도는 활용 측면, 정밀도는 안정성 측면에서 중요하며 둘은 트레이드오프 관계일 수 있다","둘은 항상 함께 높아진다"],"a":2,"e":"정확도는 실제 값과의 차이(활용 측면), 정밀도는 반복 시 편차의 일관성(안정성 측면)이며 서로 트레이드오프일 때가 많다."},{"s":1,"q":"빅데이터 분석 방법론의 계층적 프로세스 3단계로 옳은 것은?","o":["목표 – 전략 – 실행","단계(Phase) – 태스크(Task) – 스텝(Step)","계획 – 실행 – 평가","단계 – 프로세스 – 산출물"],"a":1,"e":"방법론은 단계(Phase), 태스크(Task), 스텝(Step)의 3계층으로 구성된다. 각 단계는 기준선(Baseline)으로 관리된다."},{"s":1,"q":"빅데이터 분석 방법론의 ‘분석 기획’ 단계에서 하는 일이 아닌 것은?","o":["비즈니스 이해 및 범위 설정","모델 성능 평가 및 모니터링","프로젝트 정의 및 수행 계획 수립","프로젝트 위험 계획 수립"],"a":1,"e":"모델 평가와 모니터링은 ‘평가 및 전개’ 단계. 분석 기획은 범위 설정, 프로젝트 정의, 위험 계획."},{"s":1,"q":"분석 마스터 플랜 수립 시 ‘적용 범위와 방식’을 정할 때 고려하는 요소가 아닌 것은?","o":["전략적 중요도","기술 적용 수준","분석 데이터 적용 수준","업무 내재화 적용 수준"],"a":0,"e":"전략적 중요도는 ‘우선순위’를 정할 때 고려한다."},{"s":1,"q":"분석 조직 구조 중 별도의 전담 분석 조직 없이 각 현업 부서에서 직접 분석을 수행하는 형태는?","o":["집중형","기능 중심형","매트릭스형","분산형"],"a":1,"e":"기능 중심형은 각 부서가 직접 분석한다. 집중형은 전담 조직이 모든 분석을 맡고, 분산형은 전담 인력을 현업 부서에 배치한다."},{"s":1,"q":"분석 준비도(Readiness)를 진단하는 6가지 영역이 아닌 것은?","o":["분석 업무 파악","분석 결과 판매 수익","분석 기법","인력 및 조직"],"a":1,"e":"6가지 영역: 분석 업무 파악, 인력 및 조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라."},{"s":1,"q":"분석 수준 진단에서 준비도는 높지만 성숙도가 낮은 기업 유형은?","o":["도입형","준비형","정착형","확산형"],"a":0,"e":"도입형은 준비도는 높고 성숙도는 낮다. 정착형은 준비도 낮고 성숙도 높음, 확산형은 둘 다 높음, 준비형은 둘 다 낮음."},{"s":1,"q":"데이터 거버넌스 체계의 구성 요소 중 데이터 표준화 단계에서 하는 일이 아닌 것은?","o":["분석 모델 배포","메타데이터 구축","데이터 표준 용어 설정","명명 규칙 수립"],"a":0,"e":"데이터 표준화는 표준 용어 설정, 명명 규칙, 메타데이터 구축, 데이터 사전 구축을 한다."},{"s":2,"q":"R에서 다음 코드의 실행 결과는?","c":"x <- c(2, 4, 6, 8)\nmean(x)","o":["20","5","6","4"],"a":1,"e":"(2 + 4 + 6 + 8) / 4 = 5."},{"s":2,"q":"R에서 1부터 10까지 2씩 증가하는 수열을 만드는 코드는?","o":["rep(1, 10, 2)","seq(1, 10, by = 2)","range(1, 10, 2)","c(1:10, 2)"],"a":1,"e":"seq(1, 10, by = 2) → 1 3 5 7 9. rep는 반복, range는 최솟값과 최댓값을 돌려준다."},{"s":2,"q":"R에서 rep(c(1, 2), times = 3)의 결과는?","o":["3 6","1 2 3","1 1 1 2 2 2","1 2 1 2 1 2"],"a":3,"e":"times는 벡터 전체를 반복한다. each = 3이면 1 1 1 2 2 2."},{"s":2,"q":"R에서 서로 다른 자료형의 객체를 함께 담을 수 있는 자료 구조는?","o":["행렬","벡터","배열","리스트"],"a":3,"e":"리스트는 서로 다른 형태·타입의 원소를 담을 수 있다. 벡터·행렬·배열은 한 가지 타입만."},{"s":2,"q":"R에서 결측값을 제외하고 평균을 구하는 코드는?","o":["mean(x, NA = FALSE)","mean(x, na.rm = TRUE)","mean(na.omit = x)","avg(x)"],"a":1,"e":"na.rm = TRUE로 NA를 빼고 계산한다. NA가 있으면 기본적으로 결과도 NA."},{"s":2,"q":"결측값 처리 방법 중 결측값을 여러 번 대치해 여러 개의 완전한 자료를 만들고, 분석한 뒤 결과를 결합하는 방법은?","o":["완전 분석법","단순 확률 대치법","평균 대치법","다중 대치법"],"a":3,"e":"다중 대치법은 대치 → 분석 → 결합의 3단계를 거친다."},{"s":2,"q":"이상값 판단 기준 중 ESD(Extreme Studentized Deviation) 방법의 기준은?","o":["평균 ± 1 표준편차 밖","평균 ± 2 표준편차 밖","중앙값 ± 1.5 IQR 밖","평균 ± 3 표준편차 밖"],"a":3,"e":"ESD는 평균으로부터 3 표준편차 밖의 값을 이상값으로 본다."},{"s":2,"q":"표본조사에서 모집단을 여러 집단으로 나눈 뒤 일부 집단을 무작위로 뽑고, 뽑힌 집단은 전부 조사하는 방법은?","o":["층화 추출","단순 무작위 추출","집락(군집) 추출","계통 추출"],"a":2,"e":"집락 추출은 집단 단위로 뽑는다. 층화 추출은 모든 계층에서 각각 표본을 뽑는다."},{"s":2,"q":"모집단에 번호를 매기고 일정한 간격(k번째마다)으로 표본을 뽑는 방법은?","o":["계통 추출","집락 추출","층화 추출","편의 추출"],"a":0,"e":"계통 추출은 첫 번째만 무작위로 고르고 이후 일정 간격으로 뽑는다."},{"s":2,"q":"학점(A, B, C, D)처럼 순서는 있지만 간격이 같다고 할 수 없는 척도는?","o":["서열척도","비율척도","등간척도","명목척도"],"a":0,"e":"서열척도는 순서만 의미가 있다. 성별·혈액형은 명목, 온도는 등간, 키·무게는 비율척도."},{"s":2,"q":"분포가 오른쪽으로 긴 꼬리를 가질 때(양의 왜도) 대푯값의 일반적인 크기 순서는?","o":["평균 > 중앙값 > 최빈값","중앙값 > 평균 > 최빈값","최빈값 > 중앙값 > 평균","평균 = 중앙값 = 최빈값"],"a":0,"e":"오른쪽 꼬리(양의 왜도)는 큰 값들이 평균을 끌어올려 평균 > 중앙값 > 최빈값. 대칭이면 셋이 같다."},{"s":2,"q":"중심극한정리에 대한 설명으로 옳은 것은?","o":["표본의 분산은 항상 0이 된다","모집단은 반드시 정규분포여야 한다","표본 크기가 작을수록 정규분포에 가깝다","표본 크기가 커지면 표본평균의 분포가 정규분포에 가까워진다"],"a":3,"e":"모집단 분포와 관계없이 표본 크기가 충분히 크면(보통 30 이상) 표본평균은 정규분포를 따른다."},{"s":2,"q":"검정력(Power)에 대한 설명으로 옳은 것은?","o":["대립가설이 참일 때 귀무가설을 기각할 확률(1 − β)","p-value와 같은 값","제1종 오류를 범할 확률","귀무가설이 참일 때 채택할 확률"],"a":0,"e":"검정력 = 1 − β. 거짓인 귀무가설을 올바르게 기각할 확률."},{"s":2,"q":"같은 대상에게 다이어트 전과 후의 체중을 측정해 평균 차이를 검정하는 방법은?","o":["대응표본 t-검정","카이제곱 검정","일원분산분석","독립표본 t-검정"],"a":0,"e":"같은 대상의 전후 비교는 대응(쌍체)표본 t-검정. 서로 다른 두 집단 비교는 독립표본 t-검정."},{"s":2,"q":"모집단의 분포를 가정하지 않고, 순위나 부호를 이용해 검정하는 방법을 무엇이라 하는가?","o":["분산분석","모수 검정","비모수 검정","회귀분석"],"a":2,"e":"비모수 검정: 부호 검정, 윌콕슨 순위합 검정, 만-위트니 U 검정, 크루스칼-왈리스 검정 등."},{"s":2,"q":"자료가 정규분포를 따르는지 확인하는 검정 방법은?","o":["Durbin-Watson 검정","Shapiro-Wilk 검정","카이제곱 독립성 검정","F 검정"],"a":1,"e":"Shapiro-Wilk(또는 Kolmogorov-Smirnov), Q-Q plot으로 정규성을 확인한다. Durbin-Watson은 잔차의 자기상관 검정."},{"s":2,"q":"회귀분석의 기본 가정이 아닌 것은?","o":["다중공선성","선형성","독립성","등분산성"],"a":0,"e":"가정은 선형성, 독립성, 등분산성, 비상관성, 정상성(정규성). 다중공선성은 피해야 할 문제다."},{"s":2,"q":"회귀분석에서 잔차들 사이에 자기상관이 있는지 검정하는 통계량은?","o":["Durbin-Watson","AIC","R²","VIF"],"a":0,"e":"Durbin-Watson 통계량이 2에 가까우면 자기상관이 없다고 본다."},{"s":2,"q":"AIC와 BIC에 대한 설명으로 옳은 것은?","o":["결정계수와 같은 값이다","값이 작을수록 좋은 모형이며 변수가 많아질수록 벌점을 준다","값이 클수록 좋은 모형이다","분류 모형에서만 쓴다"],"a":1,"e":"AIC·BIC는 작을수록 좋다. BIC는 변수 수에 더 큰 벌점을 준다."},{"s":2,"q":"라쏘(Lasso) 회귀에 대한 설명으로 옳은 것은?","o":["일부 회귀계수를 정확히 0으로 만들어 변수 선택 효과가 있다","항상 모든 변수를 남긴다","L2 규제를 사용한다","다중공선성을 키운다"],"a":0,"e":"라쏘는 L1 규제로 일부 계수를 0으로 만든다. 릿지는 L2 규제로 계수를 0에 가깝게 줄이지만 0으로 만들지는 않는다."},{"s":2,"q":"시계열의 구성 요소가 아닌 것은?","o":["계절 요인","표본 요인","순환 요인","추세 요인"],"a":1,"e":"시계열 분해 요인: 추세, 계절, 순환, 불규칙 요인."},{"s":2,"q":"자기 자신의 과거 값으로 현재 값을 설명하는 시계열 모형은?","o":["회귀나무","AR 모형","MA 모형","로지스틱 회귀"],"a":1,"e":"AR(자기회귀)은 과거 관측값, MA(이동평균)는 과거 오차항으로 현재를 설명한다."},{"s":2,"q":"주성분분석에서 주성분 개수를 정할 때 쓰는 방법이 아닌 것은?","o":["고윳값이 1 이상인 성분","스크리 플롯에서 기울기가 완만해지는 지점","누적 기여율이 일정 수준(예: 80%) 이상이 되는 지점","p-value가 0.05 이하인 성분"],"a":3,"e":"주성분 개수는 누적 기여율, 스크리 플롯의 꺾이는 지점, 고윳값 기준으로 정한다."},{"s":2,"q":"여러 개체 간의 거리(비유사성)를 저차원 공간에 점으로 배치해 관계를 시각화하는 다변량 기법은?","o":["연관분석","판별분석","다차원 척도법(MDS)","회귀분석"],"a":2,"e":"MDS의 적합도는 스트레스 값으로 판단하며 0에 가까울수록 좋다."},{"s":2,"q":"데이터를 훈련용과 평가용으로 나눌 때, 데이터를 K개로 나눠 K번 반복 학습·평가하는 방법은?","o":["부트스트랩","홀드아웃","층화 추출","K-fold 교차 검증"],"a":3,"e":"K-fold는 K개 중 하나를 검증용, 나머지를 훈련용으로 K번 돌려 평균 성능을 본다."},{"s":2,"q":"부트스트랩(Bootstrap)에 대한 설명으로 옳은 것은?","o":["복원 추출로 원래 크기의 표본을 여러 번 만든다","데이터를 K개로 똑같이 나눈다","시계열 데이터에만 쓴다","비복원 추출로 표본을 만든다"],"a":0,"e":"부트스트랩은 복원 추출이라 한 번도 뽑히지 않는 데이터(약 36.8%)가 생기고, 이를 검증용(OOB)으로 쓸 수 있다."},{"s":2,"q":"의사결정나무에서 과대적합을 막기 위해 불필요한 가지를 잘라 내는 것은?","o":["앙상블","가지치기","정지 규칙","분할"],"a":1,"e":"가지치기(Pruning)로 복잡도를 줄인다. 정지 규칙은 나무가 더 자라지 않게 미리 멈추는 기준."},{"s":2,"q":"의사결정나무의 장점이 아닌 것은?","o":["변수의 선형성·정규성 가정이 필요 없다","결과를 해석하기 쉽다","분류 경계 근처에서 항상 매우 안정적이다","연속형·범주형 변수를 모두 다룬다"],"a":2,"e":"의사결정나무는 분류 경계 근처에서 오차가 크고, 데이터가 조금만 바뀌어도 구조가 달라지는 불안정성이 단점이다."},{"s":2,"q":"랜덤 포레스트에 대한 설명으로 옳은 것은?","o":["배깅에 더해 각 분할에서 변수를 무작위로 일부만 골라 여러 나무를 만든다","의사결정나무 하나만 깊게 학습한다","오분류 데이터에 가중치를 주며 순차 학습한다","비지도 학습 기법이다"],"a":0,"e":"랜덤 포레스트는 부트스트랩 표본과 무작위 변수 선택으로 다양한 나무를 만들어 투표(평균)한다."},{"s":2,"q":"SVM(서포트 벡터 머신)에 대한 설명으로 옳은 것은?","o":["두 클래스 사이의 마진을 최대화하는 초평면을 찾는다","항상 선형 분리만 가능하다","마진을 최소화하는 경계를 찾는다","군집 분석 기법이다"],"a":0,"e":"SVM은 마진 최대화가 목표이며, 커널 기법으로 비선형 분리도 한다."},{"s":2,"q":"K-최근접 이웃(KNN)에 대한 설명으로 옳지 않은 것은?","o":["거리 계산이 필요하다","학습 단계에서 복잡한 모델 파라미터를 추정한다","새 데이터와 가까운 K개의 이웃을 보고 분류한다","K 값에 따라 결과가 달라진다"],"a":1,"e":"KNN은 별도의 학습 과정 없이 데이터를 저장해 두는 게으른 학습(lazy learning)이다."},{"s":2,"q":"인공신경망에서 출력값과 실제값의 오차를 출력층에서 입력층 방향으로 전달해 가중치를 조정하는 알고리즘은?","o":["역전파","순전파","드롭아웃","배치 정규화"],"a":0,"e":"역전파(Backpropagation)는 경사하강법으로 가중치를 갱신한다."},{"s":2,"q":"인공신경망의 은닉층이 깊어질 때 앞쪽 층의 기울기가 0에 가까워져 학습이 잘 안 되는 문제는?","o":["다중공선성","차원의 저주","과소적합","기울기 소실"],"a":3,"e":"기울기 소실(Vanishing Gradient)은 시그모이드 같은 활성화 함수에서 심하며, ReLU 등으로 완화한다."},{"s":2,"q":"이익 도표(Gain Chart)와 향상도 곡선(Lift Curve)은 무엇을 평가하는 데 쓰는가?","o":["분류 모형의 성능","군집의 개수","연관규칙의 지지도","시계열의 정상성"],"a":0,"e":"예측 확률이 높은 순서로 나눈 구간별로 실제 반응이 얼마나 잘 잡히는지 보며 분류 모형을 평가한다."},{"s":2,"q":"군집 분석 결과를 평가하는 지표로, 1에 가까울수록 군집이 잘 나뉜 것을 뜻하는 것은?","o":["실루엣 계수","VIF","지지도","결정계수"],"a":0,"e":"실루엣 계수는 같은 군집 안의 응집도와 다른 군집과의 분리도를 함께 본다(−1 ~ 1)."},{"s":2,"q":"계층적 군집에서 두 군집 사이의 거리를 각 군집에서 가장 가까운 두 점 사이 거리로 정의하는 방법은?","o":["와드 연결법","평균 연결법","최단 연결법","최장 연결법"],"a":2,"e":"최단 연결법(single linkage). 최장 연결법은 가장 먼 두 점 사이 거리."},{"s":2,"q":"자기조직화지도(SOM)에 대한 설명으로 옳은 것은?","o":["연관규칙을 찾는 알고리즘이다","시계열 예측 모형이다","지도학습 분류 기법이다","고차원 데이터를 저차원(주로 2차원) 격자에 표현하는 비지도 신경망이다"],"a":3,"e":"SOM은 경쟁 학습으로 비슷한 데이터를 가까운 뉴런에 배치하는 비지도 군집·시각화 기법이다."},{"s":2,"q":"혼합 분포 군집에서 모수를 추정하는 데 쓰는 알고리즘은?","o":["역전파","EM 알고리즘","Apriori","K-means++"],"a":1,"e":"EM 알고리즘은 E 단계(소속 확률 계산)와 M 단계(모수 갱신)를 반복한다."},{"s":2,"q":"Apriori 알고리즘에 대한 설명으로 옳은 것은?","o":["최소 지지도 이상인 빈발 항목집합만 확장해 연관규칙을 찾는다","항목을 트리 구조로 압축해 데이터를 한 번만 읽는다","군집 수를 미리 정해야 한다","연속형 변수만 다룬다"],"a":0,"e":"Apriori는 빈발하지 않은 항목집합의 상위 집합도 빈발하지 않다는 원리를 쓴다. 트리로 압축하는 것은 FP-Growth."},{"s":2,"q":"연관규칙의 향상도가 1보다 작을 때의 의미는?","o":["두 품목이 서로 독립이다","두 품목이 양의 관계다","두 품목이 음의 관계(함께 사지 않는 경향)다","규칙을 계산할 수 없다"],"a":2,"e":"향상도 = 1이면 독립, 1보다 크면 양의 관계, 1보다 작으면 음의 관계."},{"s":2,"q":"과소적합(Underfitting)에 대한 설명으로 옳은 것은?","o":["학습 데이터에는 잘 맞지만 새 데이터에서 성능이 떨어진다","모델이 너무 단순해 학습 데이터에서도 성능이 낮다","학습 데이터를 늘리면 반드시 생긴다","정규화를 하면 항상 해결된다"],"a":1,"e":"과소적합은 모델이 너무 단순해서 생긴다. ①은 과대적합의 설명."}].map(q=>({...q,t:"mc"})),note:"## 시험 개요\n\nADsP(데이터분석 준전문가)는 한국데이터산업진흥원이 시행하는 국가공인 민간자격이다. 실기 없이 필기만 있고, 객관식 50문항을 90분 동안 푼다. 총점 60점 이상이면서 과목별로 40% 이상 맞혀야 한다(과락). 이 앱의 모의고사는 문항당 2점으로 계산한다.\n\n| 과목 | 문항 | 과락 기준 |\n| --- | --- | --- |\n| 1. 데이터 이해 | 10 | 4문항 미만 |\n| 2. 데이터 분석 기획 | 10 | 4문항 미만 |\n| 3. 데이터 분석 | 30 | 12문항 미만 |\n\n배점과 과락 기준은 회차별 공고(dataq.or.kr)로 꼭 확인하자.\n\n## 1과목 데이터 이해\n\n### 데이터와 정보\n\n- 정량적 데이터: 수치·기호(정형). 정성적 데이터: 언어·문자(비정형)\n- 암묵지(체화된 지식) ↔ 형식지(문서화된 지식)\n- 지식 창조(SECI): 공통화(암묵→암묵) → 표출화(암묵→형식) → 연결화(형식→형식) → 내면화(형식→암묵)\n- DIKW: 데이터(사실) → 정보(의미·관계) → 지식(정보를 구조화해 판단) → 지혜(창의적 아이디어)\n\n### 데이터베이스\n\n- 특징: 통합된, 저장된, 공용, 변화되는 데이터\n- 일반적 특징: 정보 축적·전달, 이용, 기술 발전, 경제·산업적 측면\n- 기업 시스템: ERP(전사적 자원), CRM(고객 관계), SCM(공급망), KMS(지식 관리), BI(의사결정 지원), OLTP(실시간 거래 처리), OLAP(다차원 분석)\n- 데이터 웨어하우스 특징: 주제 지향, 통합, 시계열, 비휘발\n\n### 빅데이터\n\n- 3V: Volume(규모), Variety(다양성), Velocity(속도). 4V에 Value(가치) 추가\n- 본질적 변화: 사전 처리 → 사후 처리, 표본 조사 → 전수 조사, 질 → 양, 인과관계 → 상관관계\n- 빅데이터 가치 산정이 어려운 이유: 데이터 활용 방식 다양, 새로운 가치 창출, 분석 기술 발전\n- 활용 기본 테크닉: 연관 규칙, 유형 분석(분류), 유전 알고리즘, 기계 학습, 회귀 분석, 감정 분석, 소셜 네트워크 분석\n\n| 위기 요인 | 통제 방안 |\n| --- | --- |\n| 사생활 침해 | 동의에서 책임으로 |\n| 책임 원칙 훼손 | 결과 기반 책임 원칙 고수 |\n| 데이터 오용 | 알고리즘 접근 허용, 알고리즈미스트 |\n\n- 빅데이터 비즈니스 모델: 데이터 활용으로 투명성 제고, 고객 세분화, 의사결정 지원·대체, 새로운 비즈니스 모델·제품·서비스 창출\n- 미래의 빅데이터: 모든 것의 데이터화(사물인터넷, 웨어러블), 분석 기술의 진화(인공지능, 딥러닝), 인력(데이터 사이언티스트, 알고리즈미스트)\n\n### 데이터 사이언스\n\n- 데이터 사이언티스트 하드 스킬: 빅데이터 이론 지식, 분석 기술 숙련\n- 소프트 스킬: 통찰력 있는 분석(창의적 사고, 호기심), 설득력 있는 전달(스토리텔링, 시각화), 다분야 간 협력\n- 비식별화 기법: 가명처리(이름 → 임의값), 총계처리(합계·평균만), 데이터 삭제, 데이터 범주화(35세 → 30대), 데이터 마스킹(일부 가림)\n\n## 2과목 데이터 분석 기획\n\n### 분석 기획\n\n| 분석 주제 유형 | 분석 대상(What) | 분석 방법(How) |\n| --- | --- | --- |\n| 최적화 | 앎 | 앎 |\n| 솔루션 | 앎 | 모름 |\n| 통찰 | 모름 | 앎 |\n| 발견 | 모름 | 모름 |\n\n- 분석 기획 시 고려사항: 가용 데이터, 적절한 유스케이스, 장애 요소\n- 하향식 접근: 문제 탐색 → 문제 정의 → 해결 방안 탐색 → 타당성 검토(경제적·데이터·기술적)\n- 상향식 접근: 데이터에서 출발, 비지도 학습, 디자인 사고(발산), 프로토타이핑\n- 문제 탐색 도구: 비즈니스 모델 캔버스(업무·제품·고객·규제와 감사·지원 인프라), 분석 기회 발굴 범위 확장(거시·경쟁자·시장 니즈·역량)\n\n### 분석 방법론\n\n- KDD: 데이터셋 선택 → 전처리 → 변환 → 데이터 마이닝 → 해석·평가\n- CRISP-DM: 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개 (단계 사이 피드백 가능)\n- 빅데이터 분석 방법론: 분석 기획 → 데이터 준비 → 데이터 분석 → 시스템 구현 → 평가 및 전개 (단계-태스크-스텝 3계층)\n- 방법론 모델: 폭포수(순차), 프로토타입(빠른 시제품), 나선형(반복 + 위험 분석)\n\n### 분석 과제 관리와 마스터 플랜\n\n- 분석 과제 관리 5영역: 데이터 크기, 데이터 복잡도, 속도, 분석 복잡도, 정확도·정밀도\n- ROI 관점 4V: 투자 비용(Volume, Variety, Velocity) + 비즈니스 효과(Value)\n- 우선순위 사분면(시급성 × 난이도): 3사분면(현재 시급, 쉬움)이 최우선. 시급성 기준 3 → 4 → 2, 난이도 기준 3 → 1 → 2\n- 마스터 플랜 우선순위 고려: 전략적 중요도, 비즈니스 성과·ROI, 실행 용이성\n- 적용 범위·방식 고려: 업무 내재화 적용 수준, 분석 데이터 적용 수준, 기술 적용 수준\n\n### 분석 거버넌스\n\n- 구성 요소: 조직, 프로세스, 시스템, 데이터, 분석 관련 교육·마인드 육성\n- 분석 성숙도: 도입 → 활용 → 확산 → 최적화\n- 분석 준비도 6영역: 분석 업무, 분석 인력·조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라\n- 분석 조직 구조: 집중형(전담 조직), 기능 중심형(각 부서), 분산형(전담 인력을 부서에 배치)\n- 데이터 거버넌스 구성 요소: 원칙, 조직, 프로세스. 체계: 데이터 표준화 → 데이터 관리 체계 → 데이터 저장소 관리 → 표준화 활동\n\n## 3과목 데이터 분석\n\n### R 기초\n\n- 대입 `\u003c-`, 벡터 `c(1, 2, 3)`, 인덱스는 1부터, 음수 인덱스는 제외(`x[-1]`)\n- 결측값 `NA`, 계산 불가 `NaN`, 빈 객체 `NULL`. `is.na()`, `na.rm = TRUE`\n- 자료 구조: 벡터, 행렬(`matrix`), 배열, 리스트, 데이터프레임(`data.frame`)\n- 함수: `dim()`, `nrow()`, `ncol()`, `str()`, `summary()`, `head()`, `seq()`, `rep()`, `apply()`\n\n### 데이터 마트, 결측값, 이상값\n\n- 데이터 마트: 데이터 웨어하우스에서 특정 부서·목적에 맞게 뽑아낸 작은 저장소. 분석용 요약 변수(기간별 구매 금액 등)와 파생 변수(근무 시간대 구매 여부 등)를 만든다\n- R 패키지: `reshape`(`melt`로 녹이고 `cast`로 재구성), `sqldf`(R에서 SQL 사용), `plyr`(`ddply` 등 split-apply-combine), `data.table`(빠른 데이터프레임)\n- 결측값 처리: 완전 분석법(결측 행 삭제), 평균 대치법, 단순 확률 대치법(Hot-deck, 비슷한 다른 관측값으로), 다중 대치법(대치 → 분석 → 결합)\n- R 함수: `is.na()`, `complete.cases()`, `na.omit()`, `mean(x, na.rm = TRUE)`\n- 이상값 판단: ESD(평균 ± 3 표준편차 밖), 상자 그림(Q1 − 1.5×IQR, Q3 + 1.5×IQR 밖). 이상값이라고 무조건 지우지 않고 원인과 분석 목적을 보고 판단한다\n\n### 통계 기초\n\n- 척도: 명목(성별), 서열(학점), 등간(섭씨온도, 0이 절대값 아님), 비율(키, 무게)\n- 표본 추출: 단순 무작위, 계통(일정 간격), 집락(집단 단위 선택), 층화(계층별 무작위)\n- 대푯값: 평균(이상치에 민감), 중앙값(덜 민감), 최빈값\n- 산포도: 분산, 표준편차, 범위, 사분위수 범위(IQR = Q3 − Q1)\n- 이상치 기준(상자 그림): Q1 − 1.5×IQR 미만 또는 Q3 + 1.5×IQR 초과\n\n### 가설 검정\n\n- 귀무가설(H0, 차이 없음) vs 대립가설(H1, 차이 있음)\n- 제1종 오류(α): 참인 H0를 기각 / 제2종 오류(β): 거짓인 H0를 채택. 검정력 = 1 − β\n- p-value \u003c 유의수준(보통 0.05) → H0 기각\n- 모수 검정: t-검정(두 집단 평균), 분산분석(세 집단 이상), 카이제곱(범주형 독립성)\n- 비모수 검정: 부호 검정, 윌콕슨 순위합, 만-위트니, 크루스칼-왈리스\n- 정규성 검정: Shapiro-Wilk, Q-Q plot\n\n### 상관과 회귀\n\n- 상관계수 범위 −1 ~ 1. 피어슨(선형, 등간·비율), 스피어만(순위, 서열)\n- 회귀 가정: 선형성, 독립성, 등분산성, 정규성\n- 결정계수 R²: 종속변수 변동 중 모형이 설명하는 비율(0~1)\n- 수정 결정계수: 변수 수가 늘어나는 것을 보정\n- 다중공선성: 독립변수끼리 강한 상관. VIF > 10이면 의심\n- 변수 선택: 전진 선택, 후진 제거, 단계적 선택. 평가 지표 AIC, BIC(작을수록 좋음)\n- 규제: 릿지(L2, 계수 축소), 라쏘(L1, 일부 계수를 0으로 → 변수 선택)\n\n### 시계열과 차원 축소\n\n- 정상성: 평균·분산이 일정하고 공분산이 시차에만 의존\n- 평균이 변하면 차분, 분산이 변하면 변환(로그)\n- AR(자기회귀), MA(이동평균), ARIMA(p, d, q): d는 차분 횟수\n- 분해 요인: 추세, 계절, 순환, 불규칙\n- 주성분분석(PCA): 상관 없는 주성분으로 차원 축소. 스크리 플롯·누적 기여율 80% 이상으로 개수 결정\n- 다차원 척도법(MDS): 개체 사이 거리(유사성)를 저차원 공간에 점으로 나타낸다. 적합도는 스트레스 값(0에 가까울수록 좋음)\n- 다변량 분석 정리: 다중회귀, 주성분분석, 다차원 척도법, 요인분석, 판별분석\n\n### 정형 데이터 마이닝\n\n- 지도학습: 의사결정나무, 회귀, 로지스틱 회귀, 인공신경망, SVM, KNN, 앙상블\n- 비지도학습: 군집(K-평균, 계층적, SOM), 연관 분석, PCA\n- 데이터 분할: 훈련 / 검증 / 테스트. 홀드아웃, K-fold 교차 검증, 부트스트랩\n- 로지스틱 회귀: 시그모이드로 0~1 확률 출력, 오즈비 해석\n- 의사결정나무: 분류나무(지니 지수, 엔트로피, 카이제곱 p-value), 회귀나무(분산 감소량, F 통계량). 과대적합은 가지치기로\n- 앙상블: 배깅(부트스트랩 병렬), 부스팅(오분류 가중, 순차), 랜덤 포레스트(배깅 + 변수 무작위 선택)\n- 인공신경망 활성화 함수: 시그모이드, tanh, ReLU, 소프트맥스(다중 분류 출력)\n\n### 모형 평가\n\n| 지표 | 식 |\n| --- | --- |\n| 정확도 | (TP + TN) / 전체 |\n| 정밀도 | TP / (TP + FP) |\n| 재현율(민감도) | TP / (TP + FN) |\n| 특이도 | TN / (TN + FP) |\n| F1 점수 | 2 × 정밀도 × 재현율 / (정밀도 + 재현율) |\n\n- ROC 곡선: x축 FPR(1 − 특이도), y축 TPR(민감도). AUC가 1에 가까울수록 좋고 0.5는 무작위 수준\n- 이익 도표(Gain chart), 향상도 곡선(Lift chart)도 분류 모형 평가에 쓴다\n\n### 군집 분석\n\n- 거리: 유클리드, 맨해튼, 민코프스키, 마할라노비스(공분산 반영), 범주형은 자카드\n- 계층적 군집 연결법: 최단(single), 최장(complete), 평균, 중심, 와드(오차제곱합 증가 최소)\n- K-평균: K를 미리 지정, 초기 중심에 민감, 이상치에 민감. 보완: K-medoids\n- 군집 평가: 실루엣 계수(1에 가까울수록 좋음)\n- 혼합 분포 군집: EM 알고리즘. SOM: 고차원 → 2차원 지도\n\n### 연관 분석\n\n- 지지도 = A와 B 동시 포함 / 전체\n- 신뢰도 = A와 B 동시 포함 / A 포함 = P(B | A)\n- 향상도 = 신뢰도 / P(B). 1이면 독립, 1보다 크면 양의 관계, 1보다 작으면 음의 관계\n- Apriori 알고리즘: 최소 지지도 이상인 빈발 항목만 확장. FP-Growth는 트리로 더 빠르게\n"}
};

  const pick=(o,f)=>{const r={};if(o&&typeof o==="object")for(const k in o)if(QID[k]&&f(o[k]))r[k]=o[k];return r};
  const p={...PREF0,...(d.pref&&typeof d.pref==="object"?d.pref:{})};if(!GROUP[p.g])p.g="prog";if(!["pf","ps"].includes(p.lv))p.lv="pf";if(![0.9,1,1.15,1.3].includes(+p.fs))p.fs=1;p.avoid=p.avoid!==false;

    seen:pick(d.seen,x=>typeof x==="number"),flag:pick(d.flag,x=>x===true),pref:p};
}

/* ========== 마크다운 ========== */
function inline(s){
  return s.split(/(`[^`]+`)/).map(p=>p.length>1&&p.startsWith("`")&&p.endsWith("`")?`<code>${esc(p.slice(1,-1))}</code>`:
    esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')).join("");
}
function md(src){
  const L=src.split("\n"),out=[];let i=0;
  const cells=r=>{const s=r.trim().replace(/^\|/,"").replace(/\|$/,"");const o=[];let c="",bt=false;for(const ch of s){if(ch==="`")bt=!bt;if(ch==="|"&&!bt){o.push(c.trim());c=""}else c+=ch}o.push(c.trim());return o};
  while(i<L.length){
    const l=L[i];
    if(l.startsWith("```")){const b=[];i++;while(i<L.length&&!L[i].startsWith("```"))b.push(L[i++]);i++;out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`);continue}
    if(/^### /.test(l)){out.push(`<h3>${inline(l.slice(4))}</h3>`);i++;continue}
    if(/^## /.test(l)){out.push(`<h2>${inline(l.slice(3))}</h2>`);i++;continue}
    if(l.startsWith("|")){const rows=[];while(i<L.length&&L[i].startsWith("|"))rows.push(L[i++]);const h=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push(`<div class="tw"><table><tr>${h.map(c=>`<th>${inline(c)}</th>`).join("")}</tr>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);continue}
    if(/^- /.test(l)){const it=[];while(i<L.length&&/^- /.test(L[i]))it.push(L[i++].slice(2));out.push(`<ul>${it.map(t=>t.startsWith("[ ] ")?`<li class="ck">☐ ${inline(t.slice(4))}</li>`:`<li>${inline(t)}</li>`).join("")}</ul>`);continue}
    if(/^\d+\. /.test(l)){const it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push(L[i++].replace(/^\d+\. /,""));out.push(`<ol>${it.map(t=>`<li>${inline(t)}</li>`).join("")}</ol>`);continue}
    if(l.trim()){const p=[];while(i<L.length&&L[i].trim()&&!/^(#|\||- |\d+\. |```)/.test(L[i]))p.push(L[i++]);out.push(`<p>${inline(p.join(" "))}</p>`);continue}
    i++;
  }
  return out.join("");
}

function reviewCard(q,v,ok){

  const body=q.t==="mc"?answerBox(q,v,true,i=>i===q.a?"o":i===v?"x":""):`<div class="ex" style="background:var(--bg)"><b>내 답</b> <code>${esc(v||"(빈칸)")}</code></div>`;
  return `<article class="card"><div class="subj"><span class="tag ${st}">${lab}</span>${tagEx(q.ex)} ${esc(EX[q.ex].subj[q.s])}<span style="flex:1"></span>${flagBtn(q)}</div>
  <div class="qt">${qhtml(q)}</div>${body}${explain(q)}</article>`;
}

/* ========== 연습 · 오답 재풀이 · 무한 문제 ========== */
let pr=null;
function practice(key){
  const m=key.match(/^(prac|retry|gen)-(pf|ps|ad)(?:-(\d|all))?$/);if(!m)return quiz();
  const [,mode,k,sub]=m,e=EX[k];
  if(!pr||pr.key!==key){
    let qs=[];
    if(mode==="retry")qs=wrongIds(k).map(id=>({...getQ(id),_retry:true}));
    else if(mode==="prac")qs=pickIds(sub==="all"?e.Q:e.Q.filter(q=>q.s===+sub-1),sub==="all"?20:15);
    pr={key,mode,k,qs,i:0,pick:{},right:0,done:0,saved:false};
  }
  if(mode==="gen"&&pr.i>=pr.qs.length){const g=RNG.pick(e.gen),q=g.f(RNG);delete q.run;pr.qs.push({...q,id:"g-"+k+"-"+Date.now().toString(36)+Math.floor(Math.random()*1e4),ex:k,s:g.s,gen:true,gname:g.name})}
  const title=mode==="retry"?"오답 다시 풀기":mode==="gen"?"무한 문제":sub==="all"?"전체 섞어 풀기":e.subj[+sub-1];
  setTabs("quiz",false);
  if(!pr.qs.length){setTabs("quiz");app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)}</h1></div><p class="empty">풀 문제가 없어요.</p>`;bindBack("quiz");return}
  if(pr.i>=pr.qs.length||pr.end){
    const n=pr.done,sc=n?Math.round(pr.right/n*100):0;
    if(!pr.saved&&n){pr.saved=true;pushHist({t:Date.now(),ex:k,mode,label:title,score:sc,right:pr.right,total:n,pass:sc>=60});save()}
    setTabs("quiz");
    app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)}</h1></div><div class="card" style="text-align:center"><div class="big ${sc>=60?"pass":"fail"}">${sc}</div><p>${n}문항 중 ${pr.right}문항 정답</p>
    <p class="note">${mode==="retry"?`맞힌 문제는 오답노트에서 뺐어요. 남은 오답 ${wrongIds(k).length}개.`:"틀린 문제는 오답노트에 추가됐어요."}</p></div>
    ${foot(`<button data-h="quiz">문제 목록</button><button class="pri" id="ag">${mode==="prac"?"새 문제로 계속":"다시 풀기"}</button>`)}`;
    bindBack("quiz");bindGo();$("ag").onclick=()=>{pr=null;practice(key)};return;
  }
  const q=pr.qs[pr.i],m2=pr.pick[pr.i],done=m2!==undefined,w=data.wrong[q.id],ok=done&&isRight(q,m2.v);
  const total=mode==="gen"?`${pr.right}/${pr.done} 정답`:`${pr.i+1}/${pr.qs.length}`;
  app.innerHTML=`<div class="hd">${back()}<h1>${esc(title)} · ${total}</h1>${mode==="gen"?'<button id="end">끝내기</button>':""}</div>${mode==="gen"?"":`<div class="prog"><i style="width:${pr.i/pr.qs.length*100}%"></i></div>`}
  <div class="card"><div class="subj">${tagEx(k)} ${esc(e.subj[q.s])}${q.gen?` · <span class="gtag">${esc(q.gname||"생성 문제")}</span>`:""}${w?` · <span class="fail">${w.n}회 틀림</span>`:""}<span style="flex:1"></span>${flagBtn(q)}</div>
  <div class="qt">${qhtml(q)}</div>
  ${q.t==="mc"?answerBox(q,done?m2.v:-1,done,done?(i=>i===q.a?"o":i===m2.v?"x":""):null):answerBox(q,done?m2.v:"",done)}
  ${done?`<div class="ex"><b class="${ok?"pass":"fail"}">${ok?"정답이에요":"오답이에요"}</b>${q.t==="sa"?` · 내 답 <code>${esc(m2.v||"(빈칸)")}</code>`:""}<br><b>${model(q)}</b><br>${esc(q.e)}</div>`:""}</div>
  ${foot(done?`<button class="pri" id="nx">${mode==="gen"||pr.i+1<pr.qs.length?"다음 문제 ›":"결과 보기"}</button>`
    :(q.t==="mc"?`<button id="sk">건너뛰기</button>`:`<button id="sk">건너뛰기</button><button class="pri" id="ck">채점하기</button>`))}`;
  bindBack("quiz");bindFlag(()=>practice(key));
  const mark=v=>{pr.pick[pr.i]={v};const r=isRight(q,v);pr.done++;if(r){pr.right++;solved(q,true)}else addWrong([q]);seen(q);save();practice(key)};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>mark(+b.dataset.o));
  if($("ck"))$("ck").onclick=()=>mark($("ans").value);
  const a=$("ans");if(a&&!done)a.onkeydown=ev=>{if(ev.key==="Enter")$("ck").click()};
  if($("nx"))$("nx").onclick=()=>{pr.i++;practice(key);scrollTo(0,0)};
  if($("sk"))$("sk").onclick=()=>mark(q.t==="mc"?-1:"");
  if($("end"))$("end").onclick=()=>{pr.end=true;practice(key)};
}

/* ========== 개념 탭 ========== */
let qn="";
const hl=t=>{const s=esc(t),kq=esc(qn.trim());if(!kq)return s;const i=s.toLowerCase().indexOf(kq.toLowerCase());return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+kq.length)+"</mark>"+s.slice(i+kq.length)};
function concepts(){
  const k=curEx(),e=EX[k],term=qn.trim().toLowerCase();setTabs("concepts");
  const hits=term?e.notes.flatMap((n,ni)=>n.body.split("\n").filter(l=>!l.startsWith("#")&&l.toLowerCase().includes(term)).slice(0,6).map(l=>({ni,l}))):[];
  app.innerHTML=topBar(true)+`<div class="pad"><input class="search" id="qs" type="search" placeholder="${esc(e.tag)} 요약노트에서 검색" value="${esc(qn)}" autocomplete="off"></div>
  ${term?`<div class="list">${hits.length?hits.slice(0,40).map(h=>`<button class="item" data-h="note-${k}-${h.ni}"><span class="t"><small>${esc(e.notes[h.ni].title)}</small><b>${hl(h.l.replace(/^[-|\d. ]+|\|/g," ").replace(/[`*]/g,"").trim())}</b></span><span class="ar">›</span></button>`).join(""):'<p class="empty">찾는 내용이 없어요.</p>'}</div>`:
  `<div class="list">${e.notes.map((n,i)=>`<button class="item" data-h="note-${k}-${i}"><span class="ic" style="background:${e.color}">${i+1}</span><span class="t"><b>${esc(n.title)}</b><small>${n.subs.length?esc(n.subs.map(s=>s.replace(/^\d-\d\. /,"")).slice(0,4).join(" · "))+(n.subs.length>4?" 외":""):"핵심 정리"}</small></span><span class="ar">›</span></button>`).join("")}</div>`}`;
  bindTop(()=>{qn="";concepts()});
  const qs=$("qs");qs.oninput=()=>{qn=qs.value;const p=qs.selectionStart;concepts();const n=$("qs");n.focus();n.setSelectionRange(p,p)};
  bindGo();
}
function note(k,i){
  const ns=EX[k].notes,n=ns[i];if(!n)return concepts();setTabs("concepts");
  app.innerHTML=`<div class="hd">${back()}<h1>${esc(n.title)}</h1></div><div class="card md"><div class="subj">${tagEx(k)} ${esc(EX[k].name)}</div>${md(n.body)}</div>
  <div class="pad" style="display:flex;gap:8px">${i>0?`<button data-h="note-${k}-${i-1}" style="flex:1">‹ 이전</button>`:""}${i<ns.length-1?`<button data-h="note-${k}-${i+1}" class="pri" style="flex:1">다음 ›</button>`:""}</div>`;
  bindBack("concepts");bindGo();
}

/* ========== 오답노트 ========== */
let ws=-1,wk="";
function wrong(k){
  if(k!==wk){wk=k;ws=-1}setTabs("quiz");const e=EX[k];
  const all=wrongIds(k),ids=all.filter(i=>ws<0||getQ(i).s===ws);
  app.innerHTML=`<div class="hd">${back()}<h1>${esc(e.tag)} 오답노트 · ${all.length}</h1>${all.length?`<button data-h="retry-${k}">다시 풀기</button>`:""}</div>
  <div class="chips"><button data-s="-1" class="${ws<0?"on":""}">전체</button>${e.subj.map((t,s)=>`<button data-s="${s}" class="${ws===s?"on":""}">${esc(t)} (${all.filter(i=>getQ(i).s===s).length})</button>`).join("")}</div>
  ${ids.length?ids.map(i=>{const q=getQ(i),w=data.wrong[i];return `<article class="card"><div class="subj"><span class="tag">${w.n}회 틀림</span>${esc(e.subj[q.s])}${q.gen?` · <span class="gtag">${esc(q.gname||"생성 문제")}</span>`:""} · ${ago(w.t)}</div>
  <div class="qt">${qhtml(q)}</div>${q.t==="mc"?`<div class="opts">${q.o.map((o,j)=>`<div class="opt"><span class="n">${N[j]}</span><span>${esc(o)}</span></div>`).join("")}</div>`:""}
  <details><summary>정답과 해설 보기</summary>${explain(q)}</details>
  <div class="btns"><button data-rm="${esc(i)}">다 외웠어요 (빼기)</button></div></article>`}).join(""):`<p class="empty">${all.length?"이 과목엔 오답이 없어요.":"아직 오답이 없어요. 문제를 풀면 틀린 문제가 여기에 모여요."}</p>`}`;
  bindBack("quiz");bindGo();
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ws=+b.dataset.s;wrong(k)});
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const id=b.dataset.rm;delete data.wrong[id];delete data.gq[id];save();wrong(k)});
}

/* ========== 설정 ========== */
function setup(){
  setTabs("setup");const p=data.pref,fl=Object.keys(data.flag);
  app.innerHTML=`<div class="hd"><h1>설정</h1></div>
  <div class="sec">화면</div><div class="list"><div class="item"><span class="t"><b>문제·노트 글자 크기</b></span></div>
   <div class="chips" style="padding:0 16px 14px">${[[0.9,"작게"],[1,"보통"],[1.15,"크게"],[1.3,"아주 크게"]].map(([v,t])=>`<button data-fs="${v}" class="${+p.fs===v?"on":""}">${t}</button>`).join("")}</div></div>
  <div class="sec">문제</div><div class="list">
   <label class="item"><span class="t"><b>안 푼 문제 먼저 내기</b><small>연습과 모의고사에서 오래전에 풀었거나 안 푼 문제를 먼저 골라요</small></span><input type="checkbox" class="sw" id="av"${p.avoid?" checked":""}></label></div>
  <div class="sec">문제 오류 신고 (${fl.length})</div><div class="list">${fl.length?fl.map(id=>{const q=QID[id];return `<div class="item"><span class="t"><small>${tagEx(q.ex)} ${esc(EX[q.ex].subj[q.s])} · ${esc(id)}</small><b>${esc(q.q.replace(/<table[\s\S]*$/,"").slice(0,60))}</b></span><button class="mini" data-unflag="${esc(id)}">취소</button></div>`}).join("")+
   `<div class="pad"><p class="note" style="margin-top:0">신고한 문제는 연습과 모의고사에서 빠져요. 아래 버튼으로 복사해서 Claude에게 보내 주면 고쳐 드릴게요.</p><button id="cp" class="pri" style="width:100%">신고 목록 복사</button></div>`:'<p class="note pad" style="margin:0">문제를 풀다가 이상한 문제가 있으면 문제 옆 ‘문제 오류 신고’를 누르세요.</p>'}</div>
  <div class="sec">데이터</div><div class="list"><div class="item"><span class="t"><b>저장 위치</b><small>기록·오답·설정은 ${WHERE}에 저장돼요</small></span></div>
   <button class="item" id="rs"><span class="t"><b class="fail">기록과 오답 모두 지우기</b><small>되돌릴 수 없어요</small></span></button></div>
  <div class="sec">정보</div><div class="list"><div class="item"><span class="t"><b>문제 은행</b><small>필기 ${EX.pf.Q.length} · 실기 ${EX.ps.Q.length} · ADsP ${EX.ad.Q.length}문항 + 무한 문제 ${KEYS.reduce((a,k)=>a+EX[k].gen.length,0)}유형</small></span></div>
   <div class="item"><span class="t"><small>모든 문제는 직접 만든 연습 문제이며 실제 기출이 아니에요. 출제 범위는 큐넷 프로그래밍기능사 출제기준(2027~2029)과 데이터자격검정 ADsP 안내를 따랐어요.</small></span></div></div>`;
  app.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{p.fs=+b.dataset.fs;applyFs();save();setup()});
  $("av").onchange=ev=>{p.avoid=ev.target.checked;save()};
  app.querySelectorAll("[data-unflag]").forEach(b=>b.onclick=()=>{delete data.flag[b.dataset.unflag];save();setup()});
  if($("cp"))$("cp").onclick=async()=>{const txt=fl.map(id=>{const q=QID[id];return `[${id}] ${q.q.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,120)}`}).join("\n");
    try{await navigator.clipboard.writeText(txt);$("cp").textContent="복사했어요"}catch(e){modal(`<h2>신고 목록</h2><p class="note">아래 내용을 길게 눌러 복사하세요.</p><pre style="white-space:pre-wrap">${esc(txt)}</pre><div class="btns"><button id="cx">닫기</button></div>`);$("cx").onclick=close}};
  $("rs").onclick=()=>{modal(`<h2>모두 지울까요?</h2><p>모의고사 기록, 오답노트, 푼 문제 기록, 신고 목록이 모두 지워져요. 되돌릴 수 없어요.</p><div class="btns"><button id="cx">취소</button><button class="pri" id="ok" style="background:var(--hot);border-color:var(--hot)">모두 지우기</button></div>`);
    $("cx").onclick=close;$("ok").onclick=()=>{data={v:4,wrong:{},hist:[],seen:{},flag:{},gq:{},pref:{...data.pref}};save();close();setup()}};
}

/* ========== 라우팅 ========== */
function route(){
  close();applyFs();const h=location.hash.slice(1);let m;
  if((m=h.match(/^exam-(pf|ps|ad)$/))){setGroupFor(m[1]);examView(m[1])}
  else if((m=h.match(/^(?:prac|retry|gen)-(pf|ps|ad)/))){setGroupFor(m[1]);practice(h)}
  else if((m=h.match(/^note-(pf|ps|ad)-(\d+)$/))){setGroupFor(m[1]);note(m[1],+m[2])}
  else if((m=h.match(/^wrong-(pf|ps|ad)$/))){setGroupFor(m[1]);wrong(m[1])}
  else if(h==="concepts")concepts();
  else if(h==="setup")setup();
  else quiz();
  if(h!=="concepts"||!qn)scrollTo(0,0);
}
function setGroupFor(k){if(k==="ad")data.pref.g="adsp";else{data.pref.g="prog";data.pref.lv=k}}
addEventListener("hashchange",()=>{if(pr&&location.hash.slice(1)!==pr.key)pr=null;route()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&ov.classList.contains("show"))return close();
  const m=location.hash.match(/^#exam-(pf|ps|ad)$/);if(!m)return;const k=m[1],x=exams[k];
  if(!x||x.done||/INPUT|TEXTAREA/.test(e.target.tagName)||ov.classList.contains("show"))return;
  const q=x.qs[x.cur];
  if(q.t==="mc"&&/^[1-4]$/.test(e.key)){const i=+e.key-1;x.ans[x.cur]=x.ans[x.cur]===i?-1:i;examView(k)}
  else if(e.key==="ArrowRight"&&x.cur<x.qs.length-1){x.cur++;examView(k)}else if(e.key==="ArrowLeft"&&x.cur>0){x.cur--;examView(k)}
});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
route();
}

</script>
</body>
